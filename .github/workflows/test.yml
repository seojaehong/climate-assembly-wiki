          clone_for_post_apply_negative verify_a6_extra_capture_trigger
          docker exec "$container" psql -U postgres -d verify_a6_extra_capture_trigger -v ON_ERROR_STOP=1 -c \
            "create function climate_vote.zzz_mutate_after_audit() returns trigger language plpgsql as \$\$ begin new.title := new.title || ' [tampered]'; return new; end \$\$; create trigger zzz_mutate_after_audit before update on climate_vote.assembly for each row execute function climate_vote.zzz_mutate_after_audit();" >/dev/null
          assert_post_apply_rejected verify_a6_extra_capture_trigger \
            'capture trigger contract is unsafe' a6-extra-capture-trigger.log

          clone_for_post_apply_negative verify_a6_bad_org_index
          docker exec "$container" psql -U postgres -d verify_a6_bad_org_index -v ON_ERROR_STOP=1 -c \
            "drop index climate_vote.platform_audit_event_org_page_idx; create index platform_audit_event_org_page_idx on climate_vote.platform_audit_event(org_id, id);" >/dev/null
          assert_post_apply_rejected verify_a6_bad_org_index \
            'index or constraint contract is unsafe' a6-bad-org-index.log

          clone_for_post_apply_negative verify_a6_bad_actor_index
          docker exec "$container" psql -U postgres -d verify_a6_bad_actor_index -v ON_ERROR_STOP=1 -c \
            "drop index climate_vote.platform_audit_event_actor_idx; create index platform_audit_event_actor_idx on climate_vote.platform_audit_event(org_id, actor_user_id, id desc) where actor_user_id is null;" >/dev/null
          assert_post_apply_rejected verify_a6_bad_actor_index \
            'index or constraint contract is unsafe' a6-bad-actor-index.log

          clone_for_post_apply_negative verify_a6_bad_constraint
          docker exec "$container" psql -U postgres -d verify_a6_bad_constraint -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.platform_audit_event drop constraint platform_audit_event_operation_check; alter table climate_vote.platform_audit_event add constraint platform_audit_fake_check check (true);" >/dev/null
          assert_post_apply_rejected verify_a6_bad_constraint \
            'index or constraint contract is unsafe' a6-bad-constraint.log

          clone_for_post_apply_negative verify_a6_bad_provenance_default
          docker exec "$container" psql -U postgres -d verify_a6_bad_provenance_default -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.platform_audit_event alter column transaction_id set default 0;" >/dev/null
          assert_post_apply_rejected verify_a6_bad_provenance_default \
            'column contract is unsafe' a6-bad-provenance-default.log

          clone_for_post_apply_negative verify_a6_bad_column_acl
          docker exec "$container" psql -U postgres -d verify_a6_bad_column_acl -v ON_ERROR_STOP=1 -c \
            "grant select(actor_role, operation) on climate_vote.platform_audit_event to authenticated;" >/dev/null
          assert_post_apply_rejected verify_a6_bad_column_acl \
            'table privilege contract is unsafe' a6-bad-column-acl.log

          clone_for_post_apply_negative verify_a6_rogue_audit_reader
          docker exec "$container" psql -U postgres -d verify_a6_rogue_audit_reader -v ON_ERROR_STOP=1 -c \
            "create role a6_rogue_audit_reader login; grant usage on schema climate_vote to a6_rogue_audit_reader; grant select on climate_vote.platform_audit_event to a6_rogue_audit_reader; create policy a6_rogue_audit_read on climate_vote.platform_audit_event for select to a6_rogue_audit_reader using (true);" >/dev/null
          assert_post_apply_rejected verify_a6_rogue_audit_reader \
            'table privilege contract is unsafe' a6-rogue-audit-reader.log

          clone_for_post_apply_negative verify_a6_missing_schema_usage
          docker exec "$container" psql -U postgres -d verify_a6_missing_schema_usage -v ON_ERROR_STOP=1 -c \
            "revoke usage on schema climate_vote from authenticated;" >/dev/null
          assert_post_apply_rejected verify_a6_missing_schema_usage \
