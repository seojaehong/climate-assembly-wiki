      - 'src/islands/canvas/**'
      - 'src/islands/mod/**'
      - 'src/lib/**'
      - 'src/lib/deliberation.ts'
      - 'src/lib/mod-console.ts'
      - 'src/lib/workshop-*.ts'
      - 'src/lib/supabase.ts'
      - 'src/pages/mod.astro'
      - 'src/pages/hq.astro'
      - 'src/pages/v.astro'
      - 'src/pages/b.astro'
      - 'scripts/verify-field-rehearsal.mjs'
      - 'scripts/verify-0912-hq-rehearsal.mjs'
      - 'scripts/verify-0912-readiness.mjs'
      - 'scripts/verify-0912-release-report.mjs'
      - 'scripts/verify-0912-postgres.sh'
      - 'scripts/0912-*.mjs'
      - 'scripts/prepare-0912-*.mjs'
      - 'scripts/verify-workshop-access-contract.mjs'
      - 'scripts/seed-0829-*.mjs'
      - 'scripts/rotate-join-code.mjs'
      - 'scripts/session-rosters*.mjs'
      - 'src/pages/**/moderator/canvas.astro'
      - 'src/pages/**/moderator/live.astro'
      - 'src/pages/**/moderator/ontology-review.astro'
      - 'src/pages/**/moderator/insights/groups.astro'
      - 'src/pages/**/moderator/insights/heatmap.astro'
      - 'src/styles/**'
      - 'supabase/**'
  pull_request:
    paths:
      - 'automation/**'
      - 'docs/platform/**'
      - 'docs/operations/0912-13-runbook.md'
      - 'docs/operations/0912-evidence-trust-policy.json'
      - 'evaluation/0912*.json'
      - 'evaluation/platform-a2-activation-bundle.json'
      - 'evaluation/platform-a4-migration-bundle.json'
      - 'public/workshop-graph/**'
      - 'public/v/**'
      - '.github/workflows/test.yml'
      - '.gitattributes'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'src/components/ModeratorPlatformNav.tsx'
      - 'src/components/ModeratorPlatformNav.test.ts'
      - 'src/islands/CanvasBoard.tsx'
      - 'src/islands/CanvasBoard.test.ts'
      - 'src/islands/OntologyReviewConsole.tsx'
      - 'src/islands/OntologyReviewConsole.test.ts'
      - 'src/islands/platform/PlatformShell.tsx'
      - 'src/islands/platform/PlatformShell.test.ts'
      - 'src/islands/platform/**'
      - 'src/islands/ballot/**'
      - 'src/islands/platform/access/**'
      - 'src/islands/platform/design/**'
      - 'src/islands/result/**'
      - 'src/islands/canvas/**'
      - 'src/islands/mod/**'
      - 'src/lib/**'
      - 'src/lib/deliberation.ts'
      - 'src/lib/mod-console.ts'
      - 'src/lib/workshop-*.ts'
      - 'src/lib/supabase.ts'
      - 'src/pages/mod.astro'
      - 'src/pages/hq.astro'
      - 'src/pages/v.astro'
      - 'src/pages/b.astro'
      - 'scripts/verify-field-rehearsal.mjs'
      - 'scripts/verify-0912-hq-rehearsal.mjs'
      - 'scripts/verify-0912-readiness.mjs'
      - 'scripts/verify-0912-release-report.mjs'
      - 'scripts/verify-0912-postgres.sh'
      - 'scripts/0912-*.mjs'
      - 'scripts/prepare-0912-*.mjs'
      - 'scripts/verify-workshop-access-contract.mjs'
      - 'scripts/seed-0829-*.mjs'
      - 'scripts/rotate-join-code.mjs'
      - 'scripts/session-rosters*.mjs'
      - 'src/pages/**/moderator/canvas.astro'
      - 'src/pages/**/moderator/live.astro'
      - 'src/pages/**/moderator/ontology-review.astro'
      - 'src/pages/**/moderator/insights/groups.astro'
      - 'src/pages/**/moderator/insights/heatmap.astro'
      - 'src/styles/**'
      - 'supabase/**'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: automation } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            automation/package-lock.json
      - name: Install root runtime
        run: npm ci
        working-directory: .
      - name: Run strict Astro and TypeScript checks
        run: npm run check
        working-directory: .
      - name: Run complete root Vitest suite
        run: npm exec vitest -- run
        working-directory: .
      - run: npm ci
      - name: Verify 9/12 workshop access static contract
        working-directory: .
        run: node scripts/verify-workshop-access-contract.mjs
      - name: Verify 9/12 readiness traceability
        working-directory: .
        run: node scripts/verify-0912-readiness.mjs --output .artifacts/0912-13-traceability-report.json
      - name: Upload 9/12 traceability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0912-13-traceability
          path: .artifacts/0912-13-traceability-report.json
          if-no-files-found: error
      - name: Verify P1C organization selection semantics
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container="p1c-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD=verify \
            -e POSTGRES_DB=verify \
            postgres:16 >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; create role service_role nologin; create publication supabase_realtime; alter database verify set search_path=public,extensions,climate_vote;"
          docker cp supabase/migrations/. "${container}:/tmp/"
          docker cp supabase/verify/00_prelude.sql "${container}:/tmp/00_prelude.sql"
          docker cp supabase/verify/driver_pass1.sql "${container}:/tmp/driver_pass1.sql"
          docker cp supabase/verify/org_selection_test.sql "${container}:/tmp/org_selection_test.sql"
          docker cp supabase/verify/org_selection_post_apply.sql "${container}:/tmp/org_selection_post_apply.sql"
          docker cp supabase/verify/activation_preflight_post_apply.sql "${container}:/tmp/activation_preflight_post_apply.sql"
          docker cp supabase/verify/activation_preflight_post_remove.sql "${container}:/tmp/activation_preflight_post_remove.sql"
          docker cp supabase/rollbacks/platform_p1c_org_selection_BEFORE.sql "${container}:/tmp/platform_p1c_org_selection_BEFORE.sql"
          docker cp supabase/rollbacks/platform_p1c_org_selection_activation_BEFORE.sql "${container}:/tmp/platform_p1c_org_selection_activation_BEFORE.sql"
          docker cp supabase/rollbacks/platform_p1c_activation_preflight_BEFORE.sql "${container}:/tmp/platform_p1c_activation_preflight_BEFORE.sql"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v verify_function_bodies=on -f /tmp/driver_pass1.sql
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v expect_staff_grants=off -f /tmp/org_selection_post_apply.sql

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_activation_preflight.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/activation_preflight_post_apply.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter function climate_vote.platform_activation_preflight() volatile;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/activation_preflight_post_apply.sql \
            >"$RUNNER_TEMP/activation-preflight-unsafe-volatility.log" 2>&1; then
            echo "Unsafe activation preflight volatility unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "function contract is unsafe" "$RUNNER_TEMP/activation-preflight-unsafe-volatility.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_activation_preflight.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "grant execute on function climate_vote.platform_activation_preflight() to authenticated;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/activation_preflight_post_apply.sql \
            >"$RUNNER_TEMP/activation-preflight-unsafe-privilege.log" 2>&1; then
            echo "Unsafe activation preflight privilege unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "execution privileges are unsafe" "$RUNNER_TEMP/activation-preflight-unsafe-privilege.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_activation_preflight.sql >/dev/null

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.org_context alter column expires_at set default (now() + interval '30 days');"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v expect_staff_grants=off -f /tmp/org_selection_post_apply.sql \
            >"$RUNNER_TEMP/p1c-unsafe-ttl.log" 2>&1; then
            echo "Unsafe organization context lifetime unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "org_context column contract is unsafe" "$RUNNER_TEMP/p1c-unsafe-ttl.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.org_context alter column expires_at set default (now() + interval '12 hours');"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter policy assembly_tenant_read on climate_vote.assembly using (true);"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v expect_staff_grants=off -f /tmp/org_selection_post_apply.sql \
            >"$RUNNER_TEMP/p1c-unsafe-policy.log" 2>&1; then
            echo "Unsafe organization policy unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "tenant policy definition is unsafe" "$RUNNER_TEMP/p1c-unsafe-policy.log"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_org_selection.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter function climate_vote.org_of_uid() security invoker;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v expect_staff_grants=off -f /tmp/org_selection_post_apply.sql \
            >"$RUNNER_TEMP/p1c-unsafe-function.log" 2>&1; then
            echo "Unsafe organization function unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "function execution contract is unsafe" "$RUNNER_TEMP/p1c-unsafe-function.log"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_org_selection.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/org_selection_test.sql
      - name: Verify A4 design provisioning draft semantics
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container="a4-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD=verify \
            -e POSTGRES_DB=verify \
            postgres:16 >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; create role authenticator login; create role service_role nologin; create publication supabase_realtime; alter database verify set search_path=public,extensions,climate_vote;"
          docker cp supabase/migrations/. "${container}:/tmp/"
          docker cp supabase/verify/00_prelude.sql "${container}:/tmp/00_prelude.sql"
          docker cp supabase/verify/driver_pass1.sql "${container}:/tmp/driver_pass1.sql"
          docker cp supabase/verify/design_provisioning_preflight.sql "${container}:/tmp/design_provisioning_preflight.sql"
          docker cp supabase/verify/design_provisioning_preflight_legacy_fixture.sql "${container}:/tmp/design_provisioning_preflight_legacy_fixture.sql"
          docker cp supabase/verify/design_provisioning_preflight_mapping_fixture.sql "${container}:/tmp/design_provisioning_preflight_mapping_fixture.sql"
          docker cp supabase/verify/design_provisioning_post_apply.sql "${container}:/tmp/design_provisioning_post_apply.sql"
          docker cp supabase/verify/design_provisioning_test.sql "${container}:/tmp/design_provisioning_test.sql"
          docker cp supabase/verify/design_provisioning_rollback_cleanup_fixture.sql "${container}:/tmp/design_provisioning_rollback_cleanup_fixture.sql"
          docker cp supabase/rollbacks/platform_p3_design_provisioning_BEFORE.sql "${container}:/tmp/platform_p3_design_provisioning_BEFORE.sql"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v verify_function_bodies=on -f /tmp/driver_pass1.sql >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_preflight_legacy_fixture.sql \
            >"$RUNNER_TEMP/a4-unguarded-fixture.log" 2>&1; then
            echo "Unguarded A4 fixture unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q "throwaway fixture flag is required" "$RUNNER_TEMP/a4-unguarded-fixture.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v a4_throwaway_fixture=on -f /tmp/design_provisioning_preflight_legacy_fixture.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1b_backfill.sql >/dev/null
          pre_migration_report="$(docker exec "$container" psql -U postgres -d verify \
            -v ON_ERROR_STOP=1 -Atq -f /tmp/design_provisioning_preflight.sql)"
          grep -q '"status": "migration_ready"' <<<"$pre_migration_report"
          grep -q '"readyForAdditiveMigration": true' <<<"$pre_migration_report"
          grep -q '"readyForActivation": false' <<<"$pre_migration_report"
          grep -q '"teamOrdinalPresent": false' <<<"$pre_migration_report"
          grep -q '"teamOrdinalNullCount": 1' <<<"$pre_migration_report"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p3_design_provisioning.sql >/dev/null
          pre_mapping_report="$(docker exec "$container" psql -U postgres -d verify \
            -v ON_ERROR_STOP=1 -Atq -f /tmp/design_provisioning_preflight.sql)"
          grep -q '"status": "migration_ready"' <<<"$pre_mapping_report"
          grep -q '"teamOrdinalPresent": true' <<<"$pre_mapping_report"
          grep -q '"teamOrdinalNullCount": 1' <<<"$pre_mapping_report"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v a4_throwaway_fixture=on -f /tmp/design_provisioning_preflight_mapping_fixture.sql >/dev/null
          activation_report="$(docker exec "$container" psql -U postgres -d verify \
            -v ON_ERROR_STOP=1 -Atq -f /tmp/design_provisioning_preflight.sql)"
          grep -q '"status": "activation_ready"' <<<"$activation_report"
          grep -q '"readyForActivation": true' <<<"$activation_report"
          grep -q '"requiresApprovedBackfill": false' <<<"$activation_report"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -c "begin; create or replace function climate_vote.platform_sha256_hex(p_value text) returns text language sql immutable strict set search_path = pg_catalog, extensions as 'select repeat(''0'', 64)';" \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-altered-checksum-helper.log" 2>&1; then
            echo "Altered A4 checksum helper unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "checksum helper contract is unsafe" \
            "$RUNNER_TEMP/a4-altered-checksum-helper.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter function climate_vote.design_provision(jsonb,bytea) set session_replication_role = replica;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-unsafe-function-config.log" 2>&1; then
            echo "Altered A4 function configuration unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "RPC contract is unsafe" "$RUNNER_TEMP/a4-unsafe-function-config.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter function climate_vote.design_provision(jsonb,bytea) reset session_replication_role;"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -c "begin; create role a4_untrusted_owner login; grant usage, create on schema climate_vote to a4_untrusted_owner; alter function climate_vote.design_provision(jsonb,bytea,jsonb) owner to a4_untrusted_owner;" \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-untrusted-function-owner.log" 2>&1; then
            echo "Untrusted A4 function owner unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "owner contract is unsafe" \
            "$RUNNER_TEMP/a4-untrusted-function-owner.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -c "begin; create role a4_untrusted_owner login; grant usage, create on schema climate_vote to a4_untrusted_owner; alter table climate_vote.design_provisioning_operation owner to a4_untrusted_owner; alter function climate_vote.platform_json_canonical(jsonb) owner to a4_untrusted_owner; alter function climate_vote.platform_sha256_hex(text) owner to a4_untrusted_owner; alter function climate_vote.platform_design_join_code() owner to a4_untrusted_owner; alter function climate_vote.platform_design_authorization_revision() owner to a4_untrusted_owner; alter function climate_vote.design_provision(jsonb,bytea) owner to a4_untrusted_owner; alter function climate_vote.design_provision(jsonb,bytea,jsonb) owner to a4_untrusted_owner; alter function climate_vote.design_provisioning_status(jsonb) owner to a4_untrusted_owner; alter function climate_vote.design_provisioning_status(jsonb,jsonb) owner to a4_untrusted_owner;" \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-untrusted-unified-owner.log" 2>&1; then
            echo "Untrusted A4 unified owner unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "owner contract is unsafe" \
            "$RUNNER_TEMP/a4-untrusted-unified-owner.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create table climate_vote.a4_constraint_shadow_fixture(capacity integer); alter table climate_vote.team drop constraint platform_team_capacity_positive; alter table climate_vote.a4_constraint_shadow_fixture add constraint platform_team_capacity_positive check (capacity > 0);" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-shadow-constraint.log" 2>&1; then
            echo "Shadow A4 constraint unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "constraint contract is unsafe" "$RUNNER_TEMP/a4-shadow-constraint.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "drop table climate_vote.a4_constraint_shadow_fixture; alter table climate_vote.team add constraint platform_team_capacity_positive check (capacity > 0);" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.team drop constraint platform_team_capacity_positive; alter table climate_vote.team add constraint platform_team_capacity_positive check (capacity >= 0);" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-wrong-constraint-definition.log" 2>&1; then
            echo "Wrong A4 constraint definition unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "constraint contract is unsafe" \
            "$RUNNER_TEMP/a4-wrong-constraint-definition.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.team drop constraint platform_team_capacity_positive; alter table climate_vote.team add constraint platform_team_capacity_positive check (capacity > 0);" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.team alter column ordinal type bigint;" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-wrong-column-type.log" 2>&1; then
            echo "Wrong A4 column type unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "column contract is unsafe" "$RUNNER_TEMP/a4-wrong-column-type.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.team alter column ordinal type integer;" >/dev/null
