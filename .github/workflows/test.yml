name: test
on:
  workflow_dispatch:
  push:
    paths:
      - 'automation/**'
      - 'docs/platform/**'
      - 'docs/operations/0912-13-runbook.md'
      - 'evaluation/0912*.json'
      - 'evaluation/platform-a2-activation-bundle.json'
      - 'evaluation/platform-a4-migration-bundle.json'
      - 'public/workshop-graph/**'
      - 'public/v/**'
      - '.github/workflows/test.yml'
      - '.gitattributes'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'src/components/ModeratorPlatformNav.tsx'
      - 'src/components/ModeratorPlatformNav.test.ts'
      - 'src/islands/CanvasBoard.tsx'
      - 'src/islands/CanvasBoard.test.ts'
      - 'src/islands/OntologyReviewConsole.tsx'
      - 'src/islands/OntologyReviewConsole.test.ts'
      - 'src/islands/platform/PlatformShell.tsx'
      - 'src/islands/platform/PlatformShell.test.ts'
      - 'src/islands/platform/**'
      - 'src/islands/ballot/**'
      - 'src/islands/platform/access/**'
      - 'src/islands/platform/design/**'
      - 'src/islands/result/**'
      - 'src/islands/canvas/**'
      - 'src/islands/mod/**'
      - 'src/lib/**'
      - 'src/lib/deliberation.ts'
      - 'src/lib/mod-console.ts'
      - 'src/lib/workshop-*.ts'
      - 'src/lib/supabase.ts'
      - 'src/pages/mod.astro'
      - 'src/pages/hq.astro'
      - 'src/pages/v.astro'
      - 'src/pages/b.astro'
      - 'scripts/verify-field-rehearsal.mjs'
      - 'scripts/verify-0912-hq-rehearsal.mjs'
      - 'scripts/verify-0912-readiness.mjs'
      - 'scripts/verify-0912-release-report.mjs'
      - 'scripts/verify-0912-postgres.sh'
      - 'scripts/verify-workshop-access-contract.mjs'
      - 'scripts/seed-0829-*.mjs'
      - 'scripts/rotate-join-code.mjs'
      - 'scripts/session-rosters*.mjs'
      - 'src/pages/**/moderator/canvas.astro'
      - 'src/pages/**/moderator/live.astro'
      - 'src/pages/**/moderator/ontology-review.astro'
      - 'src/pages/**/moderator/insights/groups.astro'
      - 'src/pages/**/moderator/insights/heatmap.astro'
      - 'src/styles/**'
      - 'supabase/**'
  pull_request:
    paths:
      - 'automation/**'
      - 'docs/platform/**'
      - 'docs/operations/0912-13-runbook.md'
      - 'evaluation/0912*.json'
      - 'evaluation/platform-a2-activation-bundle.json'
      - 'evaluation/platform-a4-migration-bundle.json'
      - 'public/workshop-graph/**'
      - 'public/v/**'
      - '.github/workflows/test.yml'
      - '.gitattributes'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'src/components/ModeratorPlatformNav.tsx'
      - 'src/components/ModeratorPlatformNav.test.ts'
      - 'src/islands/CanvasBoard.tsx'
      - 'src/islands/CanvasBoard.test.ts'
      - 'src/islands/OntologyReviewConsole.tsx'
      - 'src/islands/OntologyReviewConsole.test.ts'
      - 'src/islands/platform/PlatformShell.tsx'
      - 'src/islands/platform/PlatformShell.test.ts'
      - 'src/islands/platform/**'
      - 'src/islands/ballot/**'
      - 'src/islands/platform/access/**'
      - 'src/islands/platform/design/**'
      - 'src/islands/result/**'
      - 'src/islands/canvas/**'
      - 'src/islands/mod/**'
      - 'src/lib/**'
      - 'src/lib/deliberation.ts'
      - 'src/lib/mod-console.ts'
      - 'src/lib/workshop-*.ts'
      - 'src/lib/supabase.ts'
      - 'src/pages/mod.astro'
      - 'src/pages/hq.astro'
      - 'src/pages/v.astro'
      - 'src/pages/b.astro'
      - 'scripts/verify-field-rehearsal.mjs'
      - 'scripts/verify-0912-hq-rehearsal.mjs'
      - 'scripts/verify-0912-readiness.mjs'
      - 'scripts/verify-0912-release-report.mjs'
      - 'scripts/verify-0912-postgres.sh'
      - 'scripts/verify-workshop-access-contract.mjs'
      - 'scripts/seed-0829-*.mjs'
      - 'scripts/rotate-join-code.mjs'
      - 'scripts/session-rosters*.mjs'
      - 'src/pages/**/moderator/canvas.astro'
      - 'src/pages/**/moderator/live.astro'
      - 'src/pages/**/moderator/ontology-review.astro'
      - 'src/pages/**/moderator/insights/groups.astro'
      - 'src/pages/**/moderator/insights/heatmap.astro'
      - 'src/styles/**'
      - 'supabase/**'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: automation } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            automation/package-lock.json
      - name: Install root runtime
        run: npm ci
        working-directory: .
      - name: Run strict Astro and TypeScript checks
        run: npm run check
        working-directory: .
      - name: Run complete root Vitest suite
        run: npm exec vitest -- run
        working-directory: .
      - run: npm ci
      - name: Verify 9/12 workshop access static contract
        working-directory: .
        run: node scripts/verify-workshop-access-contract.mjs
      - name: Verify 9/12 readiness traceability
        working-directory: .
        run: node scripts/verify-0912-readiness.mjs --output .artifacts/0912-13-traceability-report.json
      - name: Upload 9/12 traceability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0912-13-traceability
          path: .artifacts/0912-13-traceability-report.json
          if-no-files-found: error
      - name: Verify P1C organization selection semantics
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container="p1c-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD=verify \
            -e POSTGRES_DB=verify \
            postgres:16 >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; create role service_role nologin; create publication supabase_realtime; alter database verify set search_path=public,extensions,climate_vote;"
          docker cp supabase/migrations/. "${container}:/tmp/"
          docker cp supabase/verify/00_prelude.sql "${container}:/tmp/00_prelude.sql"
          docker cp supabase/verify/driver_pass1.sql "${container}:/tmp/driver_pass1.sql"
          docker cp supabase/verify/org_selection_test.sql "${container}:/tmp/org_selection_test.sql"
          docker cp supabase/verify/org_selection_post_apply.sql "${container}:/tmp/org_selection_post_apply.sql"
          docker cp supabase/verify/activation_preflight_post_apply.sql "${container}:/tmp/activation_preflight_post_apply.sql"
          docker cp supabase/verify/activation_preflight_post_remove.sql "${container}:/tmp/activation_preflight_post_remove.sql"
          docker cp supabase/rollbacks/platform_p1c_org_selection_BEFORE.sql "${container}:/tmp/platform_p1c_org_selection_BEFORE.sql"
          docker cp supabase/rollbacks/platform_p1c_org_selection_activation_BEFORE.sql "${container}:/tmp/platform_p1c_org_selection_activation_BEFORE.sql"
          docker cp supabase/rollbacks/platform_p1c_activation_preflight_BEFORE.sql "${container}:/tmp/platform_p1c_activation_preflight_BEFORE.sql"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v verify_function_bodies=on -f /tmp/driver_pass1.sql
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v expect_staff_grants=off -f /tmp/org_selection_post_apply.sql

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_activation_preflight.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/activation_preflight_post_apply.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter function climate_vote.platform_activation_preflight() volatile;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/activation_preflight_post_apply.sql \
            >"$RUNNER_TEMP/activation-preflight-unsafe-volatility.log" 2>&1; then
            echo "Unsafe activation preflight volatility unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "function contract is unsafe" "$RUNNER_TEMP/activation-preflight-unsafe-volatility.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_activation_preflight.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "grant execute on function climate_vote.platform_activation_preflight() to authenticated;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/activation_preflight_post_apply.sql \
            >"$RUNNER_TEMP/activation-preflight-unsafe-privilege.log" 2>&1; then
            echo "Unsafe activation preflight privilege unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "execution privileges are unsafe" "$RUNNER_TEMP/activation-preflight-unsafe-privilege.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_activation_preflight.sql >/dev/null

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.org_context alter column expires_at set default (now() + interval '30 days');"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v expect_staff_grants=off -f /tmp/org_selection_post_apply.sql \
            >"$RUNNER_TEMP/p1c-unsafe-ttl.log" 2>&1; then
            echo "Unsafe organization context lifetime unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "org_context column contract is unsafe" "$RUNNER_TEMP/p1c-unsafe-ttl.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.org_context alter column expires_at set default (now() + interval '12 hours');"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter policy assembly_tenant_read on climate_vote.assembly using (true);"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v expect_staff_grants=off -f /tmp/org_selection_post_apply.sql \
            >"$RUNNER_TEMP/p1c-unsafe-policy.log" 2>&1; then
            echo "Unsafe organization policy unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "tenant policy definition is unsafe" "$RUNNER_TEMP/p1c-unsafe-policy.log"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_org_selection.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter function climate_vote.org_of_uid() security invoker;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v expect_staff_grants=off -f /tmp/org_selection_post_apply.sql \
            >"$RUNNER_TEMP/p1c-unsafe-function.log" 2>&1; then
            echo "Unsafe organization function unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "function execution contract is unsafe" "$RUNNER_TEMP/p1c-unsafe-function.log"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_org_selection.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/org_selection_test.sql
      - name: Verify A4 design provisioning draft semantics
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container="a4-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD=verify \
            -e POSTGRES_DB=verify \
            postgres:16 >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; create role authenticator login; create role service_role nologin; create publication supabase_realtime; alter database verify set search_path=public,extensions,climate_vote;"
          docker cp supabase/migrations/. "${container}:/tmp/"
          docker cp supabase/verify/00_prelude.sql "${container}:/tmp/00_prelude.sql"
          docker cp supabase/verify/driver_pass1.sql "${container}:/tmp/driver_pass1.sql"
          docker cp supabase/verify/design_provisioning_preflight.sql "${container}:/tmp/design_provisioning_preflight.sql"
          docker cp supabase/verify/design_provisioning_preflight_legacy_fixture.sql "${container}:/tmp/design_provisioning_preflight_legacy_fixture.sql"
          docker cp supabase/verify/design_provisioning_preflight_mapping_fixture.sql "${container}:/tmp/design_provisioning_preflight_mapping_fixture.sql"
          docker cp supabase/verify/design_provisioning_post_apply.sql "${container}:/tmp/design_provisioning_post_apply.sql"
          docker cp supabase/verify/design_provisioning_test.sql "${container}:/tmp/design_provisioning_test.sql"
          docker cp supabase/verify/design_provisioning_rollback_cleanup_fixture.sql "${container}:/tmp/design_provisioning_rollback_cleanup_fixture.sql"
          docker cp supabase/rollbacks/platform_p3_design_provisioning_BEFORE.sql "${container}:/tmp/platform_p3_design_provisioning_BEFORE.sql"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v verify_function_bodies=on -f /tmp/driver_pass1.sql >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_preflight_legacy_fixture.sql \
            >"$RUNNER_TEMP/a4-unguarded-fixture.log" 2>&1; then
            echo "Unguarded A4 fixture unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q "throwaway fixture flag is required" "$RUNNER_TEMP/a4-unguarded-fixture.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v a4_throwaway_fixture=on -f /tmp/design_provisioning_preflight_legacy_fixture.sql >/dev/null
          pre_migration_report="$(docker exec "$container" psql -U postgres -d verify \
            -v ON_ERROR_STOP=1 -Atq -f /tmp/design_provisioning_preflight.sql)"
          grep -q '"status": "migration_ready"' <<<"$pre_migration_report"
          grep -q '"readyForAdditiveMigration": true' <<<"$pre_migration_report"
          grep -q '"readyForActivation": false' <<<"$pre_migration_report"
          grep -q '"teamOrdinalPresent": false' <<<"$pre_migration_report"
          grep -q '"teamOrdinalNullCount": 1' <<<"$pre_migration_report"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p3_design_provisioning.sql >/dev/null
          pre_mapping_report="$(docker exec "$container" psql -U postgres -d verify \
            -v ON_ERROR_STOP=1 -Atq -f /tmp/design_provisioning_preflight.sql)"
          grep -q '"status": "migration_ready"' <<<"$pre_mapping_report"
          grep -q '"teamOrdinalPresent": true' <<<"$pre_mapping_report"
          grep -q '"teamOrdinalNullCount": 1' <<<"$pre_mapping_report"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v a4_throwaway_fixture=on -f /tmp/design_provisioning_preflight_mapping_fixture.sql >/dev/null
          activation_report="$(docker exec "$container" psql -U postgres -d verify \
            -v ON_ERROR_STOP=1 -Atq -f /tmp/design_provisioning_preflight.sql)"
          grep -q '"status": "activation_ready"' <<<"$activation_report"
          grep -q '"readyForActivation": true' <<<"$activation_report"
          grep -q '"requiresApprovedBackfill": false' <<<"$activation_report"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -c "begin; create or replace function climate_vote.platform_sha256_hex(p_value text) returns text language sql immutable strict set search_path = pg_catalog, extensions as 'select repeat(''0'', 64)';" \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-altered-checksum-helper.log" 2>&1; then
            echo "Altered A4 checksum helper unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "checksum helper contract is unsafe" \
            "$RUNNER_TEMP/a4-altered-checksum-helper.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter function climate_vote.design_provision(jsonb,bytea) set session_replication_role = replica;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-unsafe-function-config.log" 2>&1; then
            echo "Altered A4 function configuration unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "RPC contract is unsafe" "$RUNNER_TEMP/a4-unsafe-function-config.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter function climate_vote.design_provision(jsonb,bytea) reset session_replication_role;"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -c "begin; create role a4_untrusted_owner login; grant usage, create on schema climate_vote to a4_untrusted_owner; alter function climate_vote.design_provision(jsonb,bytea,jsonb) owner to a4_untrusted_owner;" \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-untrusted-function-owner.log" 2>&1; then
            echo "Untrusted A4 function owner unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "owner contract is unsafe" \
            "$RUNNER_TEMP/a4-untrusted-function-owner.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -c "begin; create role a4_untrusted_owner login; grant usage, create on schema climate_vote to a4_untrusted_owner; alter table climate_vote.design_provisioning_operation owner to a4_untrusted_owner; alter function climate_vote.platform_json_canonical(jsonb) owner to a4_untrusted_owner; alter function climate_vote.platform_sha256_hex(text) owner to a4_untrusted_owner; alter function climate_vote.platform_design_join_code() owner to a4_untrusted_owner; alter function climate_vote.platform_design_authorization_revision() owner to a4_untrusted_owner; alter function climate_vote.design_provision(jsonb,bytea) owner to a4_untrusted_owner; alter function climate_vote.design_provision(jsonb,bytea,jsonb) owner to a4_untrusted_owner; alter function climate_vote.design_provisioning_status(jsonb) owner to a4_untrusted_owner; alter function climate_vote.design_provisioning_status(jsonb,jsonb) owner to a4_untrusted_owner;" \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-untrusted-unified-owner.log" 2>&1; then
            echo "Untrusted A4 unified owner unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "owner contract is unsafe" \
            "$RUNNER_TEMP/a4-untrusted-unified-owner.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create table climate_vote.a4_constraint_shadow_fixture(capacity integer); alter table climate_vote.team drop constraint platform_team_capacity_positive; alter table climate_vote.a4_constraint_shadow_fixture add constraint platform_team_capacity_positive check (capacity > 0);" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-shadow-constraint.log" 2>&1; then
            echo "Shadow A4 constraint unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "constraint contract is unsafe" "$RUNNER_TEMP/a4-shadow-constraint.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "drop table climate_vote.a4_constraint_shadow_fixture; alter table climate_vote.team add constraint platform_team_capacity_positive check (capacity > 0);" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.team drop constraint platform_team_capacity_positive; alter table climate_vote.team add constraint platform_team_capacity_positive check (capacity >= 0);" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-wrong-constraint-definition.log" 2>&1; then
            echo "Wrong A4 constraint definition unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "constraint contract is unsafe" \
            "$RUNNER_TEMP/a4-wrong-constraint-definition.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.team drop constraint platform_team_capacity_positive; alter table climate_vote.team add constraint platform_team_capacity_positive check (capacity > 0);" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.team alter column ordinal type bigint;" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-wrong-column-type.log" 2>&1; then
            echo "Wrong A4 column type unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "column contract is unsafe" "$RUNNER_TEMP/a4-wrong-column-type.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.team alter column ordinal type integer;" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.session drop constraint session_assembly_id_fkey;" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-missing-foreign-key.log" 2>&1; then
            echo "Missing A4 foreign key unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "foreign key contract is unsafe" "$RUNNER_TEMP/a4-missing-foreign-key.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.session add constraint session_assembly_id_fkey foreign key (assembly_id) references climate_vote.assembly(id);" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_test.sql

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "grant execute on function climate_vote.design_provision(jsonb,bytea) to authenticated;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-unsafe-grant.log" 2>&1; then
            echo "Unsafe A4 authenticated grant unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "dormant privilege contract is unsafe" "$RUNNER_TEMP/a4-unsafe-grant.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "revoke execute on function climate_vote.design_provision(jsonb,bytea) from authenticated;"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "grant execute on function climate_vote.design_provisioning_status(jsonb) to authenticated;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-unsafe-reconciliation-grant.log" 2>&1; then
            echo "Unsafe A4 reconciliation grant unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "dormant privilege contract is unsafe" "$RUNNER_TEMP/a4-unsafe-reconciliation-grant.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "revoke execute on function climate_vote.design_provisioning_status(jsonb) from authenticated;"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "grant execute on function climate_vote.design_provision(jsonb,bytea,jsonb), climate_vote.design_provisioning_status(jsonb,jsonb), climate_vote.platform_design_authorization_revision() to authenticated;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-unsafe-fenced-grant.log" 2>&1; then
            echo "Unsafe A4 fenced grant unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "dormant privilege contract is unsafe" "$RUNNER_TEMP/a4-unsafe-fenced-grant.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "revoke execute on function climate_vote.design_provision(jsonb,bytea,jsonb), climate_vote.design_provisioning_status(jsonb,jsonb), climate_vote.platform_design_authorization_revision() from authenticated;"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "grant execute on function climate_vote.design_provision(jsonb,bytea,jsonb) to authenticator;"
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql \
            >"$RUNNER_TEMP/a4-unsafe-authenticator-function-grant.log" 2>&1; then
            echo "Unsafe A4 authenticator function grant unexpectedly passed verification" >&2
            exit 1
          fi
          grep -q "dormant privilege contract is unsafe" \
            "$RUNNER_TEMP/a4-unsafe-authenticator-function-grant.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "revoke execute on function climate_vote.design_provision(jsonb,bytea,jsonb) from authenticator;"

          for schema_role in public anon authenticated authenticator service_role; do
            docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
              "grant create on schema climate_vote to ${schema_role};"
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
              -f /tmp/design_provisioning_post_apply.sql \
              >"$RUNNER_TEMP/a4-unsafe-schema-create-${schema_role}.log" 2>&1; then
              echo "Unsafe A4 schema CREATE grant unexpectedly passed verification: ${schema_role}" >&2
              exit 1
            fi
            grep -q "dormant privilege contract is unsafe" \
              "$RUNNER_TEMP/a4-unsafe-schema-create-${schema_role}.log"
            docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
              "revoke create on schema climate_vote from ${schema_role};"
          done

          for helper_signature in \
            "climate_vote.platform_json_canonical(jsonb)" \
            "climate_vote.platform_sha256_hex(text)" \
            "climate_vote.platform_design_join_code()"; do
            helper_name="${helper_signature#*.}"
            helper_name="${helper_name%%(*}"
            docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
              "grant execute on function ${helper_signature} to authenticated;"
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
              -f /tmp/design_provisioning_post_apply.sql \
              >"$RUNNER_TEMP/a4-unsafe-${helper_name}-grant.log" 2>&1; then
              echo "Unsafe A4 internal helper grant unexpectedly passed verification: ${helper_name}" >&2
              exit 1
            fi
            grep -q "dormant privilege contract is unsafe" \
              "$RUNNER_TEMP/a4-unsafe-${helper_name}-grant.log"
            docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
              "revoke execute on function ${helper_signature} from authenticated;"
          done

          for ledger_role in public anon authenticated authenticator service_role; do
            for ledger_privilege in \
              SELECT INSERT UPDATE DELETE TRUNCATE REFERENCES TRIGGER; do
              ledger_privilege_name="${ledger_privilege,,}"
              docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
                "grant ${ledger_privilege} on table climate_vote.design_provisioning_operation to ${ledger_role};"
              if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
                -f /tmp/design_provisioning_post_apply.sql \
                >"$RUNNER_TEMP/a4-unsafe-ledger-${ledger_role}-${ledger_privilege_name}-grant.log" 2>&1; then
                echo "Unsafe A4 ledger table grant unexpectedly passed verification: ${ledger_role} ${ledger_privilege}" >&2
                exit 1
              fi
              grep -q "dormant privilege contract is unsafe" \
                "$RUNNER_TEMP/a4-unsafe-ledger-${ledger_role}-${ledger_privilege_name}-grant.log"
              docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
                "revoke ${ledger_privilege} on table climate_vote.design_provisioning_operation from ${ledger_role};"
            done
          done

          for ledger_role in public anon authenticated authenticator service_role; do
            for ledger_column_privilege in SELECT INSERT UPDATE REFERENCES; do
              ledger_column_privilege_name="${ledger_column_privilege,,}"
              docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
                "grant ${ledger_column_privilege} (operation_id) on table climate_vote.design_provisioning_operation to ${ledger_role};"
              if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
                -f /tmp/design_provisioning_post_apply.sql \
                >"$RUNNER_TEMP/a4-unsafe-ledger-column-${ledger_role}-${ledger_column_privilege_name}-grant.log" 2>&1; then
                echo "Unsafe A4 ledger column grant unexpectedly passed verification: ${ledger_role} ${ledger_column_privilege}" >&2
                exit 1
              fi
              grep -q "dormant privilege contract is unsafe" \
                "$RUNNER_TEMP/a4-unsafe-ledger-column-${ledger_role}-${ledger_column_privilege_name}-grant.log"
              docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
                "revoke ${ledger_column_privilege} (operation_id) on table climate_vote.design_provisioning_operation from ${ledger_role};"
            done
          done

          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p3_design_provisioning_BEFORE.sql \
            >"$RUNNER_TEMP/a4-populated-rollback.log" 2>&1; then
            echo "Populated A4 rollback unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q "design_provisioning_rollback_requires_data_plan" "$RUNNER_TEMP/a4-populated-rollback.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/design_provisioning_post_apply.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v a4_throwaway_fixture=on -f /tmp/design_provisioning_rollback_cleanup_fixture.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p3_design_provisioning_BEFORE.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin if to_regprocedure('climate_vote.design_provision(jsonb,bytea)') is not null or to_regprocedure('climate_vote.design_provision(jsonb,bytea,jsonb)') is not null or to_regprocedure('climate_vote.design_provisioning_status(jsonb)') is not null or to_regprocedure('climate_vote.design_provisioning_status(jsonb,jsonb)') is not null or to_regprocedure('climate_vote.platform_design_authorization_revision()') is not null or to_regclass('climate_vote.design_provisioning_operation') is not null or exists (select 1 from information_schema.columns where table_schema='climate_vote' and table_name='team' and column_name='ordinal') then raise exception 'A4 rollback verification failed'; end if; end \$\$;"
      - name: Verify A6 append-only platform audit semantics
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container="a6-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD=verify \
            -e POSTGRES_DB=verify \
            postgres:16 >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; create role authenticator login; create role service_role nologin; create publication supabase_realtime; alter database verify set search_path=public,extensions,climate_vote;"
          docker cp supabase/migrations/. "${container}:/tmp/"
          docker cp supabase/verify/00_prelude.sql "${container}:/tmp/00_prelude.sql"
          docker cp supabase/verify/driver_pass1.sql "${container}:/tmp/driver_pass1.sql"
          docker cp supabase/verify/platform_audit_test.sql "${container}:/tmp/platform_audit_test.sql"
          docker cp supabase/rollbacks/platform_p4_audit_log_BEFORE.sql "${container}:/tmp/platform_p4_audit_log_BEFORE.sql"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v verify_function_bodies=on -f /tmp/driver_pass1.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p3_design_provisioning.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p4_audit_log.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_audit_test.sql

          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p4_audit_log_BEFORE.sql \
            >"$RUNNER_TEMP/a6-populated-rollback.log" 2>&1; then
            echo "Populated A6 rollback unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q "platform_audit_rollback_requires_retention_plan" "$RUNNER_TEMP/a6-populated-rollback.log"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "drop trigger platform_audit_event_immutable on climate_vote.platform_audit_event; drop trigger platform_audit_event_no_truncate on climate_vote.platform_audit_event; truncate climate_vote.platform_audit_event;" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p4_audit_log_BEFORE.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin if to_regclass('climate_vote.platform_audit_event') is not null or to_regprocedure('climate_vote.platform_audit_list(bigint,integer)') is not null or exists (select 1 from pg_trigger where tgname = 'platform_audit_capture' and not tgisinternal) then raise exception 'A6 rollback verification failed'; end if; end \$\$;"
      - name: Rehearse signed snapshot restore in isolated PostgreSQL
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container="snapshot-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          audit_key="test-only-snapshot-restore-audit-key-2026"
          archive_path="$RUNNER_TEMP/snapshot-restore-archive.json"
          sql_path="$RUNNER_TEMP/snapshot-restore.sql"
          report_path="$RUNNER_TEMP/snapshot-restore-report.log"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          SNAPSHOT_AUDIT_HMAC_KEY="$audit_key" \
            node automation/tests/fixtures/create-snapshot-restore-archive.mjs "$archive_path"
          SNAPSHOT_AUDIT_HMAC_KEY="$audit_key" SNAPSHOT_RESTORE_DATABASE=verify \
            node automation/snapshot-db.mjs --prepare-restore-rehearsal "$archive_path" "$sql_path"

          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD=verify \
            -e POSTGRES_DB=verify \
            postgres:16 >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; create role service_role nologin; create publication supabase_realtime; alter database verify set search_path=public,extensions,climate_vote;"
          docker cp supabase/migrations/. "${container}:/tmp/"
          docker cp supabase/verify/00_prelude.sql "${container}:/tmp/00_prelude.sql"
          docker cp supabase/verify/driver_pass1.sql "${container}:/tmp/driver_pass1.sql"
          docker cp "$sql_path" "${container}:/tmp/snapshot-restore.sql"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v verify_function_bodies=on -f /tmp/driver_pass1.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.submission_item disable trigger submission_item_lock_guard;" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -Atq -f /tmp/snapshot-restore.sql \
            >"$RUNNER_TEMP/snapshot-restore-disabled-trigger.log" 2>&1; then
            echo "Snapshot restore unexpectedly accepted a disabled business trigger" >&2
            exit 1
          fi
          grep -q 'requires the enabled submission item lock guard' \
            "$RUNNER_TEMP/snapshot-restore-disabled-trigger.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.submission_item enable trigger submission_item_lock_guard;" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create function climate_vote.snapshot_restore_drift_fixture() returns trigger language plpgsql as 'begin new.title := chr(100) || chr(114) || chr(105) || chr(102) || chr(116); return new; end'; create trigger snapshot_restore_drift_fixture before insert on climate_vote.ballot for each row execute function climate_vote.snapshot_restore_drift_fixture();" >/dev/null
          if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -Atq -f /tmp/snapshot-restore.sql \
            >"$RUNNER_TEMP/snapshot-restore-row-drift.log" 2>&1; then
            echo "Snapshot restore unexpectedly accepted a drifted archive row" >&2
            exit 1
          fi
          grep -q 'snapshot restore row mismatch: ballot' \
            "$RUNNER_TEMP/snapshot-restore-row-drift.log"
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "drop trigger snapshot_restore_drift_fixture on climate_vote.ballot; drop function climate_vote.snapshot_restore_drift_fixture();" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -Atq -f /tmp/snapshot-restore.sql | tee "$report_path"
          grep -q '"status": "restore_rehearsal_passed"' "$report_path"
          grep -q '"databaseRestoreExecuted": true' "$report_path"
          grep -q '"businessTriggerRestored": true' "$report_path"
          grep -q '"archiveRowsVerified": true' "$report_path"
          remaining_rows="$(docker exec "$container" psql -U postgres -d verify -Atq -c \
            "select (select count(*) from climate_vote.submission) + (select count(*) from climate_vote.submission_item) + (select count(*) from climate_vote.issue) + (select count(*) from climate_vote.issue_link) + (select count(*) from climate_vote.result_page) + (select count(*) from climate_vote.ballot) + (select count(*) from climate_vote.ballot_item) + (select count(*) from climate_vote.ballot_response);")"
          test "$remaining_rows" = "0"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('automation/package-lock.json', 'package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify cold Canvas browser runtime
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          log_path="$RUNNER_TEMP/canvas-dev.log"
          npm run dev -- --force --host 127.0.0.1 --port 4328 >"$log_path" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              cat "$log_path"
            fi
            kill "$server_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 120); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4328/@vite/client >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_path"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$log_path"
            exit 1
          fi
          node automation/verify-canvas-browser.mjs --base-url http://127.0.0.1:4328

  verify-0912-field-rehearsal:
    name: Verify 9/12 field flow with synthetic browser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            automation/package-lock.json
      - name: Install root runtime
        run: npm ci
      - name: Install browser audit runtime
        run: npm ci
        working-directory: automation
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('automation/package-lock.json', 'package-lock.json') }}
      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium
        working-directory: automation
      - name: Build production site with Node 20
        run: npm exec -- astro build
      - name: Run synthetic 9/12 field rehearsal against preview
        shell: bash
        run: |
          set -euo pipefail
          preview_log="$RUNNER_TEMP/0912-preview.log"
          rehearsal_log="$RUNNER_TEMP/0912-field-rehearsal.log"
          hq_rehearsal_log="$RUNNER_TEMP/0912-hq-rehearsal.log"
          report_path="$RUNNER_TEMP/0912-13-field-rehearsal.json"
          hq_report_path="$RUNNER_TEMP/0912-13-hq-rehearsal.json"
          npm exec -- astro preview --host 127.0.0.1 --port 4331 >"$preview_log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat "$preview_log"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 120); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4331/mod >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$preview_log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$preview_log"
            exit 1
          fi
          node scripts/verify-field-rehearsal.mjs \
            --base http://127.0.0.1:4331 \
            --report "$report_path" \
            2>&1 | tee "$rehearsal_log"
          node scripts/verify-0912-hq-rehearsal.mjs \
            --base http://127.0.0.1:4331 \
            --report "$hq_report_path" \
            2>&1 | tee "$hq_rehearsal_log"
      - name: Upload 9/12 field and HQ rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0912-field-hq-rehearsal
          path: |
            ${{ runner.temp }}/0912-preview.log
            ${{ runner.temp }}/0912-field-rehearsal.log
            ${{ runner.temp }}/0912-hq-rehearsal.log
            ${{ runner.temp }}/0912-13-field-rehearsal.json
            ${{ runner.temp }}/0912-13-hq-rehearsal.json
            .tmp-verify/rehearsal-*.png
          if-no-files-found: error

  verify-0912-event-access:
    name: Verify 9/12 access and cutover ordering in disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run P1a, P2a, P3 and P4 ordered access rehearsals
        shell: bash
        run: |
          set -euo pipefail
          P1A_CONTAINER_NAME="p1a-0912-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            P1A_REPORT_PATH="$RUNNER_TEMP/0912-p1a-postgres-report.json" \
            bash scripts/verify-0912-postgres.sh \
            2>&1 | tee "$RUNNER_TEMP/0912-p1a-postgres.log"
      - name: Upload 9/12 PostgreSQL verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0912-p1a-p2a-postgres-verification
          path: |
            ${{ runner.temp }}/0912-p1a-postgres.log
            ${{ runner.temp }}/0912-p1a-postgres-report.json
          if-no-files-found: error
