      - name: Verify A6 append-only platform audit semantics
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          container="a6-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD=verify \
            -e POSTGRES_DB=verify \
            postgres:16 >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -tAc "select 1" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; create role authenticator login; create role service_role nologin; create publication supabase_realtime; alter database verify set search_path=public,extensions,climate_vote;"
          docker cp supabase/migrations/. "${container}:/tmp/"
          docker cp supabase/verify/00_prelude.sql "${container}:/tmp/00_prelude.sql"
          docker cp supabase/verify/driver_pass1.sql "${container}:/tmp/driver_pass1.sql"
          docker cp supabase/verify/platform_audit_post_apply.sql "${container}:/tmp/platform_audit_post_apply.sql"
          docker cp supabase/verify/platform_audit_test.sql "${container}:/tmp/platform_audit_test.sql"
          docker cp supabase/rollbacks/platform_p4_audit_log_BEFORE.sql "${container}:/tmp/platform_p4_audit_log_BEFORE.sql"

          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -v verify_function_bodies=on -f /tmp/driver_pass1.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p1c_org_selection_activation.sql >/dev/null
          # This focused A6 fixture predates P1a. Install only the legacy audit
          # history surface needed to exercise the read-only P4 snapshot output;
          # the full ordered P1a/P2a/P3/P4 chain runs in verify-0912-postgres.sh.
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 -c \
            "create table climate_vote.workshop_audit_event (id bigint generated always as identity primary key, payload jsonb not null); insert into climate_vote.attendance_audit_log(action, actor_scope, actor_label, before_value) values ('a6_history_fixture', 'import', 'ci', '{\"b\":2,\"a\":1}'::jsonb); insert into climate_vote.workshop_audit_event(payload) values ('{\"z\":3,\"a\":1}'::jsonb);" >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p3_design_provisioning.sql >/dev/null
          docker exec "$container" psql -U postgres -d verify -v ON_ERROR_STOP=1 \
            -f /tmp/platform_p4_audit_log.sql >/dev/null

          post_apply_report="$(docker exec "$container" psql -U postgres -d verify \
            -v ON_ERROR_STOP=1 -Atq -f /tmp/platform_audit_post_apply.sql)"
          POST_APPLY_REPORT="$post_apply_report" node --input-type=module <<'NODE'
          const lines = (process.env.POST_APPLY_REPORT ?? '')
            .split(/\r?\n/u)
            .filter((line) => line.length > 0);
          const marker = '=== P4 AUDIT POST-APPLY VERIFICATION PASSED ===';
          const jsonLines = lines.filter((line) => line.startsWith('{') && line.endsWith('}'));
          if (lines.length !== 2 || lines[1] !== marker || jsonLines.length !== 1) {
            throw new Error('P4 post-apply emitted an unexpected stdout contract');
          }
          const report = JSON.parse(jsonLines[0]);
          const expectedKeys = [
            'attendanceHistory', 'captureTriggerCount', 'databaseMutationExecuted',
            'historySnapshotAlgorithm', 'historyStableDuringVerification', 'kind',
            'schemaVersion', 'status', 'workshopHistory',
          ];
          if (JSON.stringify(Object.keys(report).sort()) !== JSON.stringify(expectedKeys)) {
            throw new Error('P4 post-apply emitted an unexpected result schema');
          }
          const sha256Pattern = /^[0-9a-f]{64}$/u;
          if (report.schemaVersion !== 1
            || report.kind !== 'platform_audit_post_apply'
            || report.status !== 'verified'
            || report.databaseMutationExecuted !== false
            || report.captureTriggerCount !== 15
            || report.historyStableDuringVerification !== true
            || report.historySnapshotAlgorithm !== 'sha256-canonical-jsonb-v1'
            || report.attendanceHistory?.rowCount !== 1
            || !sha256Pattern.test(report.attendanceHistory?.canonicalJsonbSha256 ?? '')
            || report.workshopHistory?.rowCount !== 1
            || !sha256Pattern.test(report.workshopHistory?.canonicalJsonbSha256 ?? '')) {
            throw new Error('P4 post-apply result values are unsafe');
          }
          NODE

          clone_for_post_apply_negative() {
            docker exec "$container" createdb -U postgres --template=verify "$1"
          }
          assert_post_apply_rejected() {
            local database="$1"
            local expected_message="$2"
            local log_path="$RUNNER_TEMP/$3"
            if docker exec "$container" psql -U postgres -d "$database" \
              -v ON_ERROR_STOP=1 -f /tmp/platform_audit_post_apply.sql \
              >"$log_path" 2>&1; then
              echo "P4 post-apply unexpectedly accepted unsafe contract in $database" >&2
              exit 1
            fi
            grep -q "$expected_message" "$log_path"
          }

          clone_for_post_apply_negative verify_a6_bad_immutable
          docker exec "$container" psql -U postgres -d verify_a6_bad_immutable -v ON_ERROR_STOP=1 -c \
            "drop trigger platform_audit_event_immutable on climate_vote.platform_audit_event; create trigger platform_audit_event_immutable before update on climate_vote.platform_audit_event for each row execute function climate_vote.platform_audit_reject_change();" >/dev/null
          assert_post_apply_rejected verify_a6_bad_immutable \
            'append-only trigger contract is unsafe' a6-bad-immutable.log

          clone_for_post_apply_negative verify_a6_bad_truncate
          docker exec "$container" psql -U postgres -d verify_a6_bad_truncate -v ON_ERROR_STOP=1 -c \
            "drop trigger platform_audit_event_no_truncate on climate_vote.platform_audit_event; create trigger platform_audit_event_no_truncate before insert on climate_vote.platform_audit_event for each row execute function climate_vote.platform_audit_reject_change();" >/dev/null
          assert_post_apply_rejected verify_a6_bad_truncate \
            'append-only trigger contract is unsafe' a6-bad-truncate.log

          clone_for_post_apply_negative verify_a6_bad_capture
          docker exec "$container" psql -U postgres -d verify_a6_bad_capture -v ON_ERROR_STOP=1 -c \
            "drop trigger platform_audit_capture on climate_vote.assembly; create trigger platform_audit_capture before insert on climate_vote.assembly for each row execute function climate_vote.platform_audit_row_change();" >/dev/null
          assert_post_apply_rejected verify_a6_bad_capture \
            'capture trigger contract is unsafe' a6-bad-capture.log

          clone_for_post_apply_negative verify_a6_unlogged_audit
          docker exec "$container" psql -U postgres -d verify_a6_unlogged_audit -v ON_ERROR_STOP=1 -c \
            "alter table climate_vote.platform_audit_event set unlogged;" >/dev/null
          assert_post_apply_rejected verify_a6_unlogged_audit \
