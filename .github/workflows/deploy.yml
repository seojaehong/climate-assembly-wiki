name: Deploy to Cloudflare Pages (Backup / Manual)

# This workflow is a BACKUP path. Primary deployment is via the Cloudflare
# Pages dashboard GitHub integration (see DEPLOY.md).
#
# It is intentionally manual-only (workflow_dispatch). If the required
# secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) are not registered,
# the deploy step will fail safely without affecting production.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=climate-assembly-wiki --branch=main
