name: Platform accessibility audit

on:
  push:
    paths:
      - 'src/islands/platform/**'
      - 'src/islands/result/**'
      - 'src/components/**'
      - 'src/lib/**'
      - 'src/pages/platform/**'
      - 'src/pages/r/**'
      - 'src/styles/**'
      - 'automation/platform-accessibility-audit.mjs'
      - 'automation/tests/platform-accessibility-audit.test.mjs'
      - 'automation/platform-accessibility-manual-evidence.mjs'
      - 'automation/tests/platform-accessibility-manual-evidence.test.mjs'
      - 'evaluation/platform-accessibility-manual-evaluation.json'
      - 'automation/package*.json'
      - '.github/workflows/platform-accessibility.yml'
  pull_request:
    paths:
      - 'src/islands/platform/**'
      - 'src/islands/result/**'
      - 'src/components/**'
      - 'src/lib/**'
      - 'src/pages/platform/**'
      - 'src/pages/r/**'
      - 'src/styles/**'
      - 'automation/platform-accessibility-audit.mjs'
      - 'automation/tests/platform-accessibility-audit.test.mjs'
      - 'automation/platform-accessibility-manual-evidence.mjs'
      - 'automation/tests/platform-accessibility-manual-evidence.test.mjs'
      - 'evaluation/platform-accessibility-manual-evaluation.json'
      - 'automation/package*.json'
      - '.github/workflows/platform-accessibility.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - name: Install site dependencies
        run: npm install --no-package-lock
      - name: Install audit dependencies
        working-directory: automation
        run: npm ci
      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium
      - name: Validate tracked manual evaluation evidence
        working-directory: automation
        run: npm run audit:platform-accessibility-manual -- --verify ../evaluation/platform-accessibility-manual-evaluation.json --expected-base-url https://climate-assembly.org --repo-root ..
      - name: Build static site
        run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/platform-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/platform/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/platform-preview.log
          exit 1
      - name: Audit WCAG 2.2 AA subset, skip links, and responsive overflow
        working-directory: automation
        env:
          PLATFORM_A11Y_BASE_URL: http://127.0.0.1:4321
          PLATFORM_A11Y_REPORT: ../.artifacts/platform-accessibility-audit.json
        run: |
          rm -f ../.artifacts/platform-accessibility-audit.json
          npm run audit:platform-accessibility
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-accessibility-audit
          path: .artifacts/platform-accessibility-audit.json
          if-no-files-found: error
