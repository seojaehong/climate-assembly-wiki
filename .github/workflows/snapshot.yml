name: snapshot
on:
  schedule:
    # Run every five minutes during each workshop window; the CLI enforces the exact date and end minute.
    - cron: '*/5 0-9 4 7 *'
    - cron: '*/5 0-9 29 8 *'
    - cron: '*/5 0-12 12 9 *'
    - cron: '*/5 0-9 13 9 *'
    - cron: '*/5 0-9 17 10 *'
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Snapshot DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          PLATFORM_SNAPSHOT_ENABLED: ${{ vars.PLATFORM_SNAPSHOT_ENABLED || 'false' }}
          SNAPSHOT_AUDIT_HMAC_KEY: ${{ secrets.SNAPSHOT_AUDIT_HMAC_KEY }}
          SNAPSHOT_AUDIT_KEY_ID: ${{ vars.SNAPSHOT_AUDIT_KEY_ID }}
        run: node snapshot-db.mjs > snapshot.out.json
      - name: Upload to Drive
        env:
          DRIVE_SA_JSON: ${{ secrets.DRIVE_SA_JSON }}
          DRIVE_PARENT_ID: ${{ secrets.DRIVE_PARENT_ID }}
        run: |
          node -e "
          const o = JSON.parse(require('fs').readFileSync('snapshot.out.json'));
          if (o.skipped) { console.log('skipped:', o.skipped); process.exit(0); }
          const { execSync } = require('child_process');
          execSync('node upload-to-drive.mjs ' + process.env.DRIVE_PARENT_ID + ' ' + o.workshop + ' snapshots ' + o.outPath, { stdio: 'inherit' });
          "
      - name: Discord alert on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\"⚠️ snapshot failed run=${{ github.run_id }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}
