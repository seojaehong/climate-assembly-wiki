<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🔴 LIVE — 숙의 온톨로지 (모더 전용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/_ontology-chrome/chrome.css">
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
<script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<style>
  .og-pill.og-live{background:#3a1f1f;color:#ff9c9c;border-color:#5c2e2e}
  .og-pill.og-live::before{content:"●";color:#ff6b6b;margin-right:5px;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .og-poll-ctl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#9aa7b8;margin-left:10px}
  .og-poll-ctl select{background:#222c3a;border:1px solid #2c3848;color:#e8edf4;border-radius:5px;padding:3px 8px;font-size:11px}
  .og-poll-status{font-size:11px;color:#9aa7b8;margin-left:8px}
  .og-poll-status.fresh{color:#51cf66}
</style>
</head>
<body>
<div id="og-app">
  <div class="og-controls">
    <input id="og-search" type="search" placeholder="라벨 검색…" autocomplete="off">
    <span class="og-lbl">종류</span>
    <div class="og-filters" id="og-kind-filters"></div>
    <span class="og-spacer"></span>
    <div class="og-poll-ctl">
      <span>🔄 갱신</span>
      <select id="og-poll-interval">
        <option value="0">수동</option>
        <option value="15" selected>15초</option>
        <option value="30">30초</option>
        <option value="60">1분</option>
        <option value="180">3분</option>
      </select>
      <button class="og-btn" id="og-poll-now">즉시</button>
      <span class="og-poll-status" id="og-poll-status">—</span>
    </div>
    <button class="og-icon-btn" id="og-settings-btn" title="설정">⚙</button>
  </div>
  <div class="og-body">
    <div class="og-canvas">
      <div id="cy" style="width:100%;height:100%"></div>
      <div class="og-zoomctl">
        <button id="og-zin">＋</button>
        <button id="og-zout">−</button>
        <button id="og-zfit">⊡</button>
      </div>
      <div class="og-quick" id="og-quick"></div>
    </div>
    <aside class="og-side collapsed" id="og-side">
      <div class="og-s-empty">노드를 클릭하면 상세가 표시됩니다.</div>
    </aside>
  </div>
  <div class="og-footer">
    <div class="og-leg" id="og-legend"></div>
    <span class="og-spacer"></span>
    <span style="font-size:11px;color:#ff9c9c">🔴 LIVE — 모더 전용 미검증 초안 · 시민 비노출 · 청크 단위 provenance</span>
  </div>
</div>

<script type="module">
import { OntologyChrome } from '/_ontology-chrome/chrome.js';

let cy, ALL_NODES = [], ALL_EDGES = [], curFilter = { kind:new Set(Object.keys(OntologyChrome.KIND_DEFAULT)) };
let pollTimer = null;
let lastFetchAt = 0;
const POLL_URL = 'data.json';

async function loadData() {
  try {
    const r = await fetch(POLL_URL + '?_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const payload = await r.json();
    const { elements, meta } = payload;
    const newNodes = elements.nodes;
    const newEdges = elements.edges;
    // 증분: 기존 id set과 비교, 새로운 것만 cy.add
    const existingNodeIds = new Set(cy ? cy.nodes().map(n => n.id()) : []);
    const existingEdgeIds = new Set(cy ? cy.edges().map(e => e.id()) : []);
    const newNodeCount = newNodes.filter(n => !existingNodeIds.has(n.data.id)).length;
    const newEdgeCount = newEdges.filter(e => !existingEdgeIds.has(e.data.id)).length;

    ALL_NODES = newNodes;
    ALL_EDGES = newEdges;

    if (!cy) {
      // 첫 init
      try { if (typeof cytoscapeFcose !== 'undefined') cytoscape.use(cytoscapeFcose); } catch (e) {}
      cy = cytoscape({
        container: document.getElementById('cy'),
        elements: { nodes: ALL_NODES, edges: ALL_EDGES },
        wheelSensitivity: 0.25, minZoom: 0.08, maxZoom: 3,
        style: buildStyle(OntologyChrome.getPalette()),
        layout: { name:'fcose', quality:'default', animate:false, randomize:true,
          nodeRepulsion:9000, idealEdgeLength:130, edgeElasticity:0.45,
          gravity:0.25, numIter:2500, packComponents:true, nodeSeparation:90 },
      });
      bindCyEvents();
      buildKindChips();
      buildLegend();
      setTimeout(() => cy.fit(null, 40), 300);
    } else {
      // 증분 add
      cy.batch(() => {
        newNodes.forEach(n => { if (!existingNodeIds.has(n.data.id)) cy.add(n); });
        newEdges.forEach(e => { if (!existingEdgeIds.has(e.data.id)) cy.add(e); });
      });
      if (newNodeCount + newEdgeCount > 0) {
        cy.layout({ name:'fcose', quality:'default', animate:false, randomize:false, numIter:600 }).run();
      }
    }

    lastFetchAt = Date.now();
    const stat = document.getElementById('og-poll-status');
    stat.textContent = `갱신 ${new Date().toLocaleTimeString('ko')} · +${newNodeCount}n +${newEdgeCount}e`;
    stat.className = 'og-poll-status fresh';
    setTimeout(() => stat.classList.remove('fresh'), 1500);
    document.getElementById('og-stat').textContent = `노드 ${ALL_NODES.length} · 엣지 ${ALL_EDGES.length}`;
  } catch (e) {
    document.getElementById('og-poll-status').textContent = '에러: ' + e.message;
  }
}

function bindCyEvents() {
  cy.on('tap', 'node', (evt) => OntologyChrome.showQuick(document.getElementById('og-quick'), document.getElementById('og-side'), evt.target.data()));
  cy.on('tap', (evt) => {
    if (evt.target === cy) {
      OntologyChrome.hideQuick(document.getElementById('og-quick'));
      document.getElementById('og-side').classList.add('collapsed');
    }
  });
  document.getElementById('og-zin').onclick = () => cy.zoom({ level: cy.zoom() * 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
  document.getElementById('og-zout').onclick = () => cy.zoom({ level: cy.zoom() / 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
  document.getElementById('og-zfit').onclick = () => cy.fit(null, 30);
  document.getElementById('og-search').oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    cy.batch(() => {
      cy.nodes().forEach(n => {
        const match = !q || (n.data('label') || '').toLowerCase().includes(q) || (n.data('text') || '').toLowerCase().includes(q);
        if (match) n.removeClass('dim'); else n.addClass('dim');
      });
    });
  };
  document.getElementById('og-settings-btn').onclick = () => {
    OntologyChrome.openSettings(({ palette, lang }) => {
      cy.style(buildStyle(palette)).update();
      buildLegend();
      document.querySelectorAll('#og-kind-filters .og-chip').forEach(c => {
        const k = c.dataset.kind;
        c.querySelector('.og-dot').style.background = palette[k];
        c.lastChild.textContent = lang === 'ko' ? (OntologyChrome.KIND_KO[k] || k) : k;
      });
    });
  };
}

function buildKindChips() {
  const present = {};
  cy.nodes().forEach(n => present[n.data('kind')] = true);
  const palette = OntologyChrome.getPalette();
  const kf = document.getElementById('og-kind-filters');
  kf.innerHTML = '';
  Object.keys(OntologyChrome.KIND_DEFAULT).forEach(k => {
    if (!present[k]) { curFilter.kind.delete(k); return; }
    const c = document.createElement('span');
    c.className = 'og-chip'; c.dataset.kind = k;
    c.innerHTML = `<span class="og-dot" style="background:${palette[k]}"></span>${OntologyChrome.KIND_KO[k] || k}`;
    c.onclick = () => {
      c.classList.toggle('off');
      if (curFilter.kind.has(k)) curFilter.kind.delete(k); else curFilter.kind.add(k);
      applyFilter();
    };
    kf.appendChild(c);
  });
}

function buildStyle(palette) {
  return [
    { selector:'node', style:{
        'background-color': n => palette[n.data('kind')] || '#888',
        'label':'data(label)', 'color':'#eef3f9', 'font-size':'12px',
        'font-family':"'Noto Sans KR','Malgun Gothic',sans-serif", 'font-weight':500,
        'text-wrap':'wrap','text-max-width':'140px','text-valign':'bottom','text-margin-y':4,
        'text-outline-color':'#11151c','text-outline-width':2.5,
        'width': n => 22 + Math.min(n.data('deg')||0,8)*4,
        'height': n => 22 + Math.min(n.data('deg')||0,8)*4,
        'border-width':2,'border-color':'#0d1118','shape':'ellipse',
    }},
    { selector:'edge', style:{
        'width':1.6, 'line-color':'#54637a', 'target-arrow-color':'#54637a',
        'target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':1,
        'label':'data(relKo)','font-size':'10px','color':'#aeb9c8',
        'font-family':"'Noto Sans KR','Malgun Gothic',sans-serif",
        'text-rotation':'autorotate','text-background-color':'#11151c',
        'text-background-opacity':0.85,'text-background-padding':2,
    }},
    { selector:'edge[?opposes]', style:{
        'line-color':'#ff6b6b','target-arrow-color':'#ff6b6b','width':2.6 }},
    { selector:'.dim', style:{ 'opacity':0.10 }},
    { selector:'.hidden', style:{ 'display':'none' }}
  ];
}

function buildLegend() {
  const lang = OntologyChrome.getLang();
  const palette = OntologyChrome.getPalette();
  const el = document.getElementById('og-legend');
  const present = {};
  cy && cy.nodes().forEach(n => present[n.data('kind')] = true);
  el.innerHTML = Object.keys(OntologyChrome.KIND_DEFAULT).filter(k => present[k]).map(k =>
    `<span class="og-item"><span class="og-sw" style="background:${palette[k]}"></span>${lang === 'ko' ? (OntologyChrome.KIND_KO[k] || k) : k}</span>`
  ).join('') + `<span class="og-item"><span class="og-ln"></span>관계</span><span class="og-item"><span class="og-ln og-opp"></span>반대·우려</span>`;
}

function applyFilter() {
  if (!cy) return;
  cy.batch(() => {
    cy.nodes().forEach(n => {
      const k = n.data('kind');
      if (curFilter.kind.has(k)) n.removeClass('hidden'); else n.addClass('hidden');
    });
    cy.edges().forEach(e => {
      if (e.source().hasClass('hidden') || e.target().hasClass('hidden')) e.addClass('hidden');
      else e.removeClass('hidden');
    });
  });
}

function setupPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const sec = parseInt(document.getElementById('og-poll-interval').value, 10) || 0;
  if (sec > 0) pollTimer = setInterval(loadData, sec * 1000);
}

// init (live:true → 빨강 LIVE pill + pulse 자동)
OntologyChrome.init({
  activeId: 'live',
  title: '🔴 LIVE — 숙의 온톨로지',
  meta: '로딩 중…',
  advisory: '🔴 LIVE 미검증 초안 — 모더레이터 상황인식용. 주기적 재추출본 · 시민 비노출 · 청크 단위 provenance(uid 역추적).',
  live: true,
});

loadData();
document.getElementById('og-poll-interval').onchange = setupPolling;
document.getElementById('og-poll-now').onclick = loadData;
setupPolling();
</script>
</body>
</html>
