<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>0628 소감·질문 포스트잇 보드</title>
<style>
  :root{
    --bg:#f7f2e7;
    --ink:#1f1a14;
    --muted:#766d62;
    --line:#e7d6ad;
    --note:#fef3c7;
    --note-green:#d1fae5;
    --accent:#d97706;
    --green:#059669;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;background:rgba(255,251,235,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
  h1{margin:0;font-size:24px;line-height:1.25}
  .meta{color:var(--muted);font-size:13px;font-weight:800}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,button{height:34px;border:1px solid var(--line);border-radius:6px;background:#fffaf0;color:var(--ink);font-weight:900;padding:0 10px;font:inherit;font-size:13px}
  button.active{background:#111827;color:#fff;border-color:#111827}
  main{padding:16px;display:grid;gap:14px}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:calc(100vh - 94px)}
  .lane{display:grid;grid-template-columns:260px 1fr;border:2px solid var(--lane-color);border-radius:14px;background:rgba(255,255,255,.44);overflow:hidden}
  .lane-head{padding:28px 26px;border-right:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.35)}
  .lane-head .eyebrow{font-size:13px;color:var(--lane-color);font-weight:900;letter-spacing:.08em}
  .lane-head h2{margin:8px 0 10px;font-size:42px;line-height:1}
  .lane-head .count{font-size:70px;font-weight:900;color:var(--lane-color);line-height:1}
  .notes{padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-content:start;gap:16px}
  .note{position:relative;min-height:154px;background:var(--note-bg);border-radius:4px;box-shadow:2px 4px 12px rgba(0,0,0,.16);padding:18px 18px 44px;border-left:6px solid var(--lane-color);transform:rotate(var(--rot));word-break:keep-all;overflow-wrap:break-word}
  .note:nth-child(3n+1){--rot:-.45deg}
  .note:nth-child(3n+2){--rot:.35deg}
  .note:nth-child(3n){--rot:-.1deg}
  .note .text{font-size:20px;font-weight:900;line-height:1.42}
  .chips{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;min-height:23px;padding:0 8px;border-radius:4px;background:rgba(0,0,0,.08);font-size:12px;font-weight:900;color:#57534e}
  .chip.group{background:#111827;color:#fff}
  .group-board{display:none;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .group-card{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.55);padding:14px}
  .group-card h2{margin:0 0 12px;font-size:22px}
  .group-card .note{min-height:136px;margin-bottom:12px;transform:none}
  .empty{padding:28px;color:var(--muted);font-weight:900}
  body.group-mode .board{display:none}
  body.group-mode .group-board{display:grid}
  @media (max-width:980px){
    header{display:block}
    .controls{margin-top:12px}
    .board{grid-template-columns:1fr}
    .lane{grid-template-columns:1fr}
    .lane-head{border-right:0;border-bottom:1px solid rgba(0,0,0,.12)}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="meta">0628 참여단 테스트 · Google Sheet 더미 응답</div>
    <h1>소감과 질문 포스트잇 보드</h1>
  </div>
  <div class="controls">
    <button id="view-lanes" class="active">소감/질문</button>
    <button id="view-groups">조별 보기</button>
    <select id="group-filter" title="조 필터">
      <option value="">전체 조</option>
    </select>
  </div>
</header>
<main>
  <section class="board" id="board"></section>
  <section class="group-board" id="group-board"></section>
</main>
<script>
const DATA_URL = '/workshop-graph-0628-test/data/participant-open-questions.json';
const state = { responses: [], group: '' };
const labels = {
  impression: { title: '소감', eyebrow: 'IMPRESSION', color: '#d97706', note: '#fef3c7' },
  question: { title: '질문', eyebrow: 'QUESTION', color: '#059669', note: '#d1fae5' },
};

function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function load(){
  const data = await fetch(DATA_URL + '?_=' + Date.now()).then(r => r.json());
  state.responses = data.elements.nodes
    .map(n => n.data)
    .filter(n => n.id && n.id.startsWith('resp_') && n.meta && (n.meta.question_key === 'impression' || n.meta.question_key === 'question'))
    .map(n => ({
      id:n.id,
      group:n.meta.group || n.session || '참여단',
      kind:n.meta.question_key,
      text:n.text || n.label,
      label:n.label,
    }));
  buildFilter();
  render();
}

function visibleResponses(){
  return state.group ? state.responses.filter(r => r.group === state.group) : state.responses;
}

function buildFilter(){
  const sel = document.getElementById('group-filter');
  const groups = [...new Set(state.responses.map(r => r.group).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));
  sel.innerHTML = '<option value="">전체 조</option>' + groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  sel.onchange = () => { state.group = sel.value; render(); };
}

function noteHtml(r){
  const cfg = labels[r.kind];
  return `<article class="note" style="--lane-color:${cfg.color};--note-bg:${cfg.note}">
    <div class="text">${esc(r.text)}</div>
    <div class="chips">
      <span class="chip group">${esc(r.group)}</span>
      <span class="chip">${esc(cfg.title)}</span>
    </div>
  </article>`;
}

function renderLanes(){
  const items = visibleResponses();
  document.getElementById('board').innerHTML = ['impression','question'].map(kind => {
    const cfg = labels[kind];
    const rows = items.filter(r => r.kind === kind);
    return `<section class="lane" style="--lane-color:${cfg.color}">
      <div class="lane-head">
        <div class="eyebrow">${cfg.eyebrow}</div>
        <h2>${cfg.title}</h2>
        <div class="count">${rows.length}</div>
      </div>
      <div class="notes">${rows.length ? rows.map(noteHtml).join('') : '<div class="empty">표시할 카드가 없습니다.</div>'}</div>
    </section>`;
  }).join('');
}

function renderGroups(){
  const groups = [...new Set(visibleResponses().map(r => r.group))]
    .sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));
  document.getElementById('group-board').innerHTML = groups.map(group => {
    const rows = visibleResponses().filter(r => r.group === group);
    return `<section class="group-card">
      <h2>${esc(group)}</h2>
      ${rows.map(noteHtml).join('')}
    </section>`;
  }).join('');
}

function render(){
  renderLanes();
  renderGroups();
}

document.getElementById('view-lanes').onclick = () => {
  document.body.classList.remove('group-mode');
  document.getElementById('view-lanes').classList.add('active');
  document.getElementById('view-groups').classList.remove('active');
};
document.getElementById('view-groups').onclick = () => {
  document.body.classList.add('group-mode');
  document.getElementById('view-groups').classList.add('active');
  document.getElementById('view-lanes').classList.remove('active');
};

load().catch(err => {
  document.getElementById('board').innerHTML = `<div class="empty">데이터를 불러오지 못했습니다: ${esc(err.message)}</div>`;
});
</script>
</body>
</html>
