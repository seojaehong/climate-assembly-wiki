<div id="net"></div><script>var nodes=new vis.DataSet([{"id": "A_t21__Claim_000", "label": "기후시민회의의 주체와 역할", "title": "[A_t21] [Claim] 회의의 모든 주체는 우리 시민들이고, 교수님이나 스태프는 우리를 서포트하기 위한 것이다. 처음부터 끝까지 과정을 함께 보면서 우리가 무슨 얘기를 하는지 파악하여 내년에는 더 효율적으로 진행하거나 다양한 반응을 이끌어낼 것이라고 생각한다. 우리가 첫 1기인 만큼 좌충우돌하는 모습을 보이면서 다양한 목소리를 내면 피드백이 있을 것이다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Concern_000", "label": "탄소 제로 정책의 현실적 어려움", "title": "[A_t21] [Concern] 탄소 관련해서 100%까지 원한다면 모든 산업 기반 시설이 무너질 수 있다고 생각한다. 먹는 것부터 전반적인 시스템이 탄소 제로라면 거의 옛날 수준으로 돌아가는 막연한 생각이다. 이런 막연한 것들이 풀리는 요소가 되었으면 좋겠다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_000", "label": "탄소 제로와 인권 문제", "title": "[A_t21] [Issue] 우리가 쓰고 있는 모든 제품, 플라스틱을 안 쓸 수는 없는데, 어떻게 안 쓰면서 갈 수 있는 방향이 얼마나 딥하게 다가갈 수 있는지 고민해봤다. 모든 정책의 중심은 사람이다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Evidence_000", "label": "종이 빨대 정책의 문제점", "title": "[A_t21] [Evidence] 몇 년 전 모든 빨대를 종이로 바꾸자는 정책이 있었는데, 솔직히 불편해서 욕을 많이 했다. 홍보가 안 된 면도 있고, 정부가 그냥 하자고 하면 며칠 내로 시행되었다. 올해 7월부터 전면 금지된다고 하는데, 왜 이렇게 불편하게 할까 불만이 많았다. 맛도 없었다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Concern_001", "label": "정책 변화로 인한 산업 피해", "title": "[A_t21] [Concern] 플라스틱 빨대를 공급하는 업체는 하루아침에 큰 거래처를 잃었을 때 어떻게 살아갈까, 뭘 먹고 살까 신경을 많이 쓰게 됐다. 이런 것들이 어떻게 진행될지 궁금하다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Claim_001", "label": "시민 참여의 역할: 사각지대 발굴", "title": "[A_t21] [Claim] 일반 시민들은 정부나 전문가들이 생각하는 것 이외의 사각지대, 즉 산업 전반적인 것은 모르지만, 그런 부분들에 대한 좋은 제안들을 원하는 것 같다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Claim_002", "label": "기후시민회의의 중요성", "title": "[A_t21] [Claim] 처음에 특정 환경단체인가 해서 반대 집회를 열려나 했는데, 국무총리도 오시고 정부 대통령 직속 단체이다 보니 큰 틀로 봤을 때 정말 많은 것을 준비해왔고 전 세계 최초이다. 좋은 단체이고, 우리가 의기투합해서 잘 정리하면 많이 기대가 된다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_001", "label": "기후시민회의에 대한 전문가 소감", "title": "[A_t21] [Issue] 세계 최초로 시행되고 있는 기후시민회의에 대해 뒤에 계시는 교수진, 연구원진은 어떻게 느끼고 있는지, 그분들의 소감을 듣고 싶다. 우리 것을 떠나서 그분들이 볼 때 어떻게 생각하고 참여했는지 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Evidence_001", "label": "기후시민회의의 선진성", "title": "[A_t21] [Evidence] 저개발 국가들은 먹고 살기 바빠 상상도 못하고, 북한, 중국 같은 나라들이 시급한데, 우리나라가 세계 최초로 이렇게 한다는 것은 선진 대열에 끼어드는 것이다. 예산도 뒷받침되니 대단한 일이다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_002", "label": "탄소 감축과 경제 활동의 갈등 해소 방안", "title": "[A_t21] [Issue] 탄소는 줄여야 하고 산업과 경제는 돌아가야 하는데, 일명 먹고사는 문제, 일자리, 진지한 고민과 대책이 필요하다. 전환 과정에서 발생할 수 있는 갈등들을 어떻게 사회적으로 해소할 수 있는지 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Proposal_000", "label": "노후 경유차 전기차 개조 지원 확대", "title": "[A_t21] [Proposal] 노후 경유차를 전기차로 개조시켜주는 업체가 있는데, 전기차 신차만 지원할 것이 아니라 노후차를 전기차로 개조하는 지원을 확대하는 방안이 있으면 좋겠다. 새로운 차를 만드는 것보다 껍데기는 그대로 하되 엔진 모터나 배터리만 이식하면 전기차가 될 수 있게끔 하는 지원 사업의 가능성이 있는지 여부를 물어보고 싶다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Evidence_002", "label": "노후 경유차 개조 업체의 성장 한계", "title": "[A_t21] [Evidence] 노후 경유차를 전기차로 개조하는 업체에 비상장 주주로 들어가 있는데, 업체들이 성장의 한계성을 계속 느끼고 있는 것 같다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_003", "label": "기후 저감 기술 기업 지원책", "title": "[A_t21] [Issue] 기후 저감을 위한 기술을 가진 기업들에 대해서는 어떤 지원책이 있을 수 있는지 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Proposal_001", "label": "국내 태양광 산업 육성 및 수출 지원", "title": "[A_t21] [Proposal] 태양광 패널 의무 사항이 있는데, 윈윈할 수 있는 정책이 필요하다. 국내 태양광 업체가 많아지고 경쟁력을 갖추도록 육성하면 일자리는 그대로 가면서 수출까지 할 수 있다. 우리나라에서만 소비되는 것이 아니라 전 세계적으로 수출할 수 있도록 지원하면 국가적으로도 경제가 돌아간다. 태양광 패널도 우리나라에 맞는 것을 육성해서 수출까지 기술을 발전시키면 전 세계적으로 표준이 될 수 있다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Concern_002", "label": "국민의 불편 감수 의지 부족", "title": "[A_t21] [Concern] 우리가 사소한 불편도 감수하지 못하면서 이런 정책을 내는 것이 실효성이 있을까 하는 의문이 많다. 지금 덥다고 에어컨을 다 켜고 26도도 못 맞추는데, 정부가 권고한 사소한 것도 못 맞추는 국민들이 이 불편함을 감수할 수 있는 시민의식이나 의지를 어떻게 기를 것인가? 국민이 싫어서 안 하면 끝이다. 제일 중요한 것은 국민들이 이것을 감수할 만한 의지를 어떻게 양성할 것인가이다. 그게 안 되면 모든 의제 토론은 탁상공론이 될 수밖에 없다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_004", "label": "국민 의식 개선 및 수용성 제고 방안", "title": "[A_t21] [Issue] 국민들의 의식 개선에 대한 부분과 수용성을 어떻게 높일 것인지에 대한 방안이 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_005", "label": "기후시민회의 운영 규정 변경 가능성", "title": "[A_t21] [Issue] 이번 1회 개최를 통해 전문가들도 느끼고 깨닫는 게 많을 것이다. 이렇게 해보니 이게 더 좋더라, 또는 별로일 줄 알았는데 괜찮네 하는 좋은 점과 개선해야 할 점들이 보일 것 같다. 운영 규정을 만들고 있지만, 규정이 한번 픽스되면 고치기 어렵다. 1회인 만큼 열어놓고 전문가들도 같이 보면서 규정 변화에 대한 가능성은 없을지 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_006", "label": "기후시민회의 참여 확대 및 재정 확보 방안", "title": "[A_t21] [Issue] 기후시민회의가 시행착오가 없을 수는 없겠지만, 향후에 더 널리 홍보하여 정치 성향, 나이, 지역 불문하고 모든 사람이 참여할 수 있도록 유도할 수 있는 방안이 마련되는지 궁금하다. 많은 사람이 참여하게 되면 정부 예산만으로는 한계가 있을 수 있으니, 향후 후원금 등을 활성화할 계획이 있는지 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_007", "label": "기후위기 적응 및 탄소 흡수 정책의 실효성", "title": "[A_t21] [Issue] 기후위기 적응에 대한 리스크 관리, 탄소 흡수 분야에 대해 이미 시작되었는데, 피해를 최소화하고 보건증을 높이기 위한 공고안들이 얼마나 홍보되고 생활에 실천할 수 있는 효능감이 있을지 의문이다. 또 다른 방법들을 신중하게 토론하고 결과를 이룰 수 있도록 노력해야 할 것 같다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_008", "label": "기후위기대응위원회 안건과 시민참여단 연계 여", "title": "[A_t21] [Issue] 기후위기대응위원회에서 6월 30일까지 안건을 받고 있는데, 그게 시민참여단에서 다룰 안건과 연결되어 있는 것인지, 아니면 이벤트성인지 궁금하다. 홈페이지 포스터도 저희 쓰는 포스터와 비슷해서 연결되어 있는 것 같다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Evidence_003", "label": "기후위기대응위원회 안건 제출 경험", "title": "[A_t21] [Evidence] 기후위기대응위원회에 의제를 하나 올렸다. 여기 오기 전에 6월 30일까지 받는다고 해서 올렸다. 책자가 나와 있더라. 그게 여기 반영된 것이다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_009", "label": "폐기물 처리 및 재활용 개선 방안", "title": "[A_t21] [Issue] 지역마다 폐기물 처리세가 다르겠지만, 지방 같은 경우는 열심히 분리수거해도 다 매립해 버린다. 이 부분은 개선을 많이 해야 할 것 같다. 민생 기업들이 재활용 사업, 심지어 재활용해서 제품을 만드는 것을 지원 확대하는 방안이 필요하다. 쓰레기 배출 매립 처리 문제에 대한 향후 계획이 없는가?", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Condition_000", "label": "지자체별 폐기물 처리 조례 및 재정 자립도 ", "title": "[A_t21] [Condition] 쓰레기 배출 매립 처리 문제는 지자체별로 조례가 있다. 시의회, 구의회, 도의회처럼. 우리나라는 재정 자립도가 행정구역마다 다르다. 공무원 급여를 못 줄 정도의 상황도 발생했을 때가 있다. 전국이 똑같다고 생각하면 안 된다. 쓰레기 매립도 전국이 다 매립이 아니라 각 지자체별로 조례가 있어서 매립지가 없으면 어떻게 할지 문제가 된다.", "color": "#f08c00", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_010", "label": "노후 경유차의 전기차 전환 방안", "title": "[A_t21] [Issue] 노후 경유차의 전기차로의 전환이 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Issue_011", "label": "국내 태양광 기술력 활용 및 수출 방안", "title": "[A_t21] [Issue] 태양광 패널에 대해 국내 기술력이 열효율이 엄청 좋다고 하는데, 실제로 중국산 제품을 많이 쓰고 있다. 재생에너지 전환 시 일자리 고민도 많으므로, 태양광 기술력을 활용하여 수출까지 할 수 있는 방안이 좋다고 생각한다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Concern_003", "label": "태양광 산업의 가격 경쟁력 문제", "title": "[A_t21] [Concern] 국내 태양광 기술력이 좋지만 중국산 제품을 많이 쓰는 이유는 가격 경쟁 때문이다. 무조건 입찰을 저가 방식으로 하면 중국산에 밀릴 수밖에 없다. 그렇게 되면 우리나라 산업이 다 주저앉는다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Proposal_002", "label": "국내 기업 보호를 위한 입찰 제도 개선", "title": "[A_t21] [Proposal] 미래 먹거리에 대해서는 최저 입찰제가 아니라 국내 기업에 가산점을 주든지 하는 제도가 필요하다. 그렇지 않으면 다 밀릴 수밖에 없다. 우리나라 업체가 점점 줄어들면 수출도 못 한다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Evidence_004", "label": "중국 정부의 보조금 정책", "title": "[A_t21] [Evidence] 중국도 보조금을 엄청 주고 있다. 전기차도 마찬가지다. 우리나라는 당연히 쓰고 공정 경쟁이 안 된다. 지금 전기차 버스 배터리는 거의 90% 중국산이다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Evidence_005", "label": "중국산 건축 자재의 품질 문제", "title": "[A_t21] [Evidence] 건축 자재부터 놀이시설, 공원시설까지 중국산이 많다. 최저 입찰제 때문에 그렇다. 중국계가 무조건 나쁜 것은 아니지만, 철근 같은 경우 좀 소프트하고 물컹하다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Concern_004", "label": "시장 경제 원칙에 따른 개선의 어려움", "title": "[A_t21] [Concern] 중국 자재 경쟁력 문제는 하루아침에 개선될 일이 아니다. 정부에서 나서서 될 일도 아니다. 시장 경제 원칙에 따라가야 하기 때문에 쉽게 개선될 일이 아니다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Proposal_003", "label": "산업 구조 개편을 위한 평가 및 지원 시스템", "title": "[A_t21] [Proposal] 태양광 패널의 경우 최저가 입찰이 아닌 정량/정상 평가를 통해 국내 기업에 가산점을 주고 지원을 해주는 시스템으로 바꾸면 사회 구조 자체가 개편될 것이다. 장려하고 공부도 하고 인센티브도 주어 전반적인 산업 구조가 개편되었으면 한다. 경유차나 패널 문제를 하나의 질문으로 묶어 제한적인 질문보다는 확산된 질문을 하는 것이 좋겠다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Concern_005", "label": "국내 기업 역차별 문제", "title": "[A_t21] [Concern] 대통령이 시민들과 간담회할 때 여성 기업인이 외국 기업, 특히 중국 기업과 똑같은 경쟁 상태에 놓아달라고 했다. 국내 기업이라고 해서 더 봐달라고 하지 않고, 단지 중국 기업과 똑같이만 경쟁할 수 있게 해달라고 했다. 지금 우리나라 경쟁은 국내 기업을 우대하기는커녕 밑에 놓는 시스템이다. 이런 시스템에서 정책이 반응할까 의심스럽다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Concern_006", "label": "기업 담합으로 인한 저효능 성과", "title": "[A_t21] [Concern] 기업인들이 담합하여 ABC가 합쳐서 가격을 두세 개로 해서 최저가를 만들지만, 내용을 들여다보면 똑같은 것이다. 가격만 달리할 뿐이다. 그러다 보니 결과치가 굉장히 저효능으로 성과가 나지 않는다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t21__Claim_003", "label": "품질 우선 및 국내 산업 지원의 필요성", "title": "[A_t21] [Claim] 몇 년 뒤에 어떻게 바뀔지 모르겠지만, 아직은 중국산 차를 안 타려고 하고, 전기차도 중국산 배터리보다 한국산 배터리를 찾아 구입한다. 가격뿐만 아니라 품질이 더 좋아야 한다. 제품은 당연히 품질이 최고여야 한다. 국민들에게 품질의 중요성을 인식시켜주는 것도 중요하다. 쌀처럼 농민들을 생각해서 정부에서 지원해주는 것처럼, 가격 경쟁이 안 된다면 정부에서 지원해줄 수 있는 방안이 있으면 좋겠다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_000", "label": "기후동행카드 시행", "title": "[A_t22] [Issue] 서울시에서 지금 하고 있는 기후공예카드라고 보는데 그게 지금 시행될...", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_000", "label": "기후동행카드 사용 경험", "title": "[A_t22] [Evidence] 저도 지금 사용한 지 2년 전에 사용하고 지금 사용을 안 하고 있어서 기억은 안 나는데 그게 6만 원의 대중교통을 무제한으로 사용할 수 있다고 그렇게 한 걸로 알고 있어요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_000", "label": "기후동행카드 혜택 조정 및 따릉이 연계", "title": "[A_t22] [Proposal] 그걸 이제 금액적인 부분이나 좀 더 이제 시민들이 이제 사용을 했을 때 이제 메리트를 느낄 수 있는 부분을 조정을 한다든지 아니면은 이제 지금 그 따릉이라고 해가지고 자전거를 이제 타고 이제 이동을 할 수 있는 스타일 있잖아요. 그런 부분에 대해서 그거를 이제 같이 이제 사용을 할 수 있게 예 그거를 뭐 얼마 이상의 다른 일을 지원을 해준다 뭐 이런식으로 해가지고 좀 더 이제 뭐 도심 쪽에 이제 뭐 출퇴근하는 사람들이 그 카드를 사용함으로써 교통체증을 조금이라도 줄이고 그거에 대한 그 메리트를 느끼면서 대중교통을 좀 더 원활하게 이용할 수 있는 그런 방안을 좀 한번 위주로 내보겠습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_001", "label": "시민 탄소 감축 생활화 지원", "title": "[A_t22] [Issue] 적임단계에서 시민들이 실제 탄소 감축을 생활하기 위해서 피해 지원들을 어떻게 그러면 정부에서 할 것인지에 대한 기안을 좀 해주셨고요.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_001", "label": "세종시 E-PASS 사례", "title": "[A_t22] [Evidence] 세종시 같은 경우는 그 일환이에요. 대중교통을 유도하기 위해서 E-PASS라고 해서 2만 원만 내면 5만 원까지 탈 수 있어요. 그리고 따르릉 자전거까지 포함해서 그러다 보니까 너도나도 지금 시의 예산이 부족할 정도로 그래서 그 이응패스의 정신명칭이 그래서 세종시에서 무료로 해주고 15%를 중앙에 지원 받고 그래서 지자체에서 100% 부담이 아니에요 중앙을 끌어들여서 이렇게 하면 2만원 내면 다 생각해도 5만원어치를 타니까 서로 차 안 끌고 그거 타려고 자전거도 그냥 타고 그 제도하고 이런 저도 대중교통 이용하면 저희가 카드 사용하잖아요. 그러면 찍히잖아요. 카드 회사나 연결을 해가지고 몇 프로 거기에 대한 보상이 바로바로 찍혀요. 바로 있었다면 0.1%다 하면 보상이 바로 가요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_000", "label": "한정된 예산의 효율적 사용", "title": "[A_t22] [Concern] 다만 저희가 한정된 예산이 있기 때문에 어떻게 지혜롭게 쓰느냐가 문제인 것 같아요", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_002", "label": "기후동행카드 고유가 피해 할인 경험", "title": "[A_t22] [Evidence] 예를 들어서 저도 기후동행 카드를 이용하는데 이번에 고유가 피해 그걸로 해서 한시적으로 그 확대해서 할인을 받더라구요 그래서 제가 13만원을 냈는데 10만원을 돌려받았어요. 저는 이게 너무 죄송한 마음이 들 정도로 내가 이걸까지 받을 정도로 내가 특정하게 그렇게 기를 많이 쓰는 입장도 아니고 난 똑같이 버스만 타고 다니는 사람인데", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_000", "label": "부적절한 할인 확대", "title": "[A_t22] [Claim] 오히려 부적절하게 할인을 높이는 것보다 많은 사람들이 이 사업에 참여할 수 있도록 적정하게 할인을 잡고 정말 필요한 사람들에게는 학대폭을 늘리지만 저처럼 크게 체감하지 않는 사람에게는 이렇게까지 할인할 필요가 없거든요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_001", "label": "할인 분배 재조정 및 따릉이 확장", "title": "[A_t22] [Proposal] 이걸 똑 떼어서 저기 따른이 같은데 더 확장할 수 있고 그래서 이 할인 분배 이런 것도 한번 손을 보면 어떨까라는 생각이 들었습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_002", "label": "지원 정교화 필요성", "title": "[A_t22] [Issue] 지원할 때 좀 정교화하는 과정도 필요한가요?", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_001", "label": "공공시설 에너지 낭비", "title": "[A_t22] [Concern] 저희 도시에서는 앉으면 버스 정류장에 따뜻하게 그게 되고 또 위에는 시원하거나 따뜻하게 되거든요. 근데 이게 문제점이 뭐냐면요. 이미 충분히 따뜻한데, 아직 충분히 따뜻한데도 뜨끈하다든지 충분히 우리가 일상생활할 때 에어컨이나 이런 게 필요 없는데도 30리터가 막 나온다든지 또는 지금 이미 쌀쌀한데 에어컨이 팡팡 나온다든지 이렇게 자원을 무분별하게 쓰는 것들이 있어요. 아무래도 공공기관 같은 데서는 자기 것이 아니니까 그럴 수도 있겠거든요.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_002", "label": "공공시설 에너지 관리 시스템 도입", "title": "[A_t22] [Proposal] 이런 관리가 되면 이렇게 진짜 필요한데 확대해서 지원이 가능하지 않을까 싶어요. 자동 시스템을 해가지고 AI 시스템을 한 다음에 해서 또 운동을 하게끔 하시면 그러면 얼마나 좋을 것인가. 그런 시스템까지.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_003", "label": "일본 압전 보도블럭 사례", "title": "[A_t22] [Evidence] 일본에서 걸어다니면 에너지가 발생하는 게 있더라고요. 그게 이제 바닥에서요. 압전 보도블럭이라고 하는데 이게 유용한 건 많은데 그렇게까지 에너지가 많이 나오진 않나 봐요. 그래서 일본에서도 다 깔려있는 게 아니라 유동인구가 많은 지역 이런 데다 많이 깐다고 하더라고요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_002", "label": "압전 보도블럭 교체 비용", "title": "[A_t22] [Concern] 이게 너무 많이 밟으면 아무래도 자주 갈아줘야 되니까 그런 비용이 발생하는데", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_001", "label": "한국의 불필요한 보도블럭 교체", "title": "[A_t22] [Claim] 저희 나라로서 가만히 생각해보니까 저희는 멀쩡한데도 맨날 보도 다시 하고 다시 하잖아요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_003", "label": "압전 보도블럭 및 태양열 보도블럭 도입", "title": "[A_t22] [Proposal] 그러면 원래 그렇게 멀쩡한 것을 할 바에는 차라리 이 압전보도를 하고 그걸로 활용하는게 좀 더 가격면에서나 우리가 계속 써야 되는 것이 좋지 않을까 싶고요. 또 찾아보니까 태양열 관련된 보도블럭도 있나봐요. 그러면 태양열 에너지까지 얻을 수 있는 보도블럭이라서 이거 실제로 우리나라에서도 하는 데가 있나봐요. 그래서 보도블록 그냥 무의미하게 갈 필요보다는 실제로 에너지를 낼 수 있는 보도블록을 유동인구 많은 지역에는 깔면 어떨까 우리가 도시들이 많아졌잖아요. 친 도시들이. 그래서 이걸 제안하고 싶습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_004", "label": "캔/공병 수거 보상 시스템 도입", "title": "[A_t22] [Proposal] 캔 수거통이 있으면 캔을 넣으면 50원이라든지 그게 나오게 하면 이라는 생각을 한번 해봤고요. 그 다음에 공병수거통도 왜냐하면 이제 저희가 공병을 수거해서 거기까지 갖다 주는 게 만만치 않아요. 그런 것들을 만약에 공병수거통에 따로 있어서", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_003", "label": "규제에 대한 시민 반발", "title": "[A_t22] [Concern] 솔직히 우리가 규제한다 한다 하면 반발이 생길 수가 있어요. 우리는 이제 관심이 많으니까 그렇지만 일반 그냥 먹고 사기 힘든 사람들은 이게 귀찮은 거예요.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Value_000", "label": "자율적 참여를 위한 동기 부여", "title": "[A_t22] [Value] 규제라는 것 보다는 어차피 인간은 동기부여가 가장 중요하잖아요. 그럼 이제 규제 보완보다는 자율적인 참여를 원하기 위해서 일단은 보상이 필요합니다. 그래서 그렇게 그런 방안이 있고 당장 이익 실현이죠. 개인적인.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_002", "label": "보상 시스템 도입 시 시민 참여 증대", "title": "[A_t22] [Claim] 그래서 그런 의제를 만들어 놓으면 투기분들이 진짜 광범위한 이런 어마어마한 의견이 쏟아질 것 같아요. 그래서 이렇게 광범위한 의제를 던져놨어요. 그러면 어떻게든 자율적으로 참여할 수 있을까. 우리 국민들이 시민들이 그렇게 질문을 던지는 게 어떤가 싶어서 다 연결되어 있는 공통적인 질문인 것 같아요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_005", "label": "재활용품 수거 마일리지 시스템 도입", "title": "[A_t22] [Proposal] 음식물 쓰레기 버리면 카드나 비밀번호 하면 그 다음에 이제 분리비에 나오잖아요. 음식물 쓰레기 얼마 비용이 있으시잖아요. 그것처럼 이렇게 캔, 플라스틱 이렇게 다 넣으면 시스템이 되어 있다면 몇 동 몇 호 하면 그게 마일 시티처럼 쌓여가지고 그것도 이제 하다 보면 실제 가서 교환하는 게 힘들잖아요. 이게 보상이..왜냐하면 저희는 대형마트에서 저희 맨 처음에 돈을 넣고 카트를 뺐잖아요. 자기 이익과 관련된 건 안 할 수가 없어요. 그 다음에 정착되니까 이제 그게 없었잖아요. 그렇듯이 좀 초기에 만약에 돈을 써야 된다면 이렇게 한 게 아니라 개인적으로 이익이 되는 방향들을 저희가 고민하면 참여가 팍팍 될 것 같아요.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Value_001", "label": "개인 동기 부여의 중요성", "title": "[A_t22] [Value] 개인 동기부여가 제일 중요합니다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_004", "label": "플라스틱 수거 마일리지 지급 사례", "title": "[A_t22] [Evidence] 저희 직원이 있어요. 플라스틱 라벨지만 제거해서 넣으면 안에서 막 사면서 마일리지 쌓이는거죠. 캔도 그럴 수 있고 음식물 쓰레기도 생각해보면 되게 많아요. 수거하면 어떻게 다 미용실을 가져도 되죠? 에어컨만 해요. 조금 더 많이 안 쌓여져요. 마일리지를 어떻게 카드 내세요? 저도 몇 개 안 물어봐서 모르겠는데 일단 쌓이고 있더라고요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_003", "label": "시민의 자발적 참여 방안 모색", "title": "[A_t22] [Issue] 광범위한 주제로 어떻게 인간이 자율적으로 개개인이 이렇게 자발적 참여할 수 있는 방안이 뭘까 이렇게 질문을 던져보는 거죠.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_006", "label": "수자원 이용량 줄이기 캠페인", "title": "[A_t22] [Proposal] 수자원 가로열고 물 가로닫고 이용량 줄이기 줄이기 이제 제 이야기를 들어보면 깜짝 놀랄 거에요. 요 취지는 뭐냐면 어제도 교수가 얘기했듯이 한전의 전기 생산량 지금 엄청난 적자에요. 또 우리집에 수돗물 저 생산 단가 수자원공사에서 생산 단가에 엄청 못 미쳐요 지금. 그러다 보니까 지금 물을 물 쓰듯이 한다 이렇게 하는데 우리나라가 수자원 부족 국가로 지금 분류되어 있어요. 세계적으로 수자원 부족 국가입니다. 그래서 한 20여 년 전부터 한 20여 개의 우리나라의 다목적 댐을 입지 선정까지 해놨었는데 하나도 건설을 못하고 있어요. 왜? 환경단체가 우리나라 상당히 셉니다. 환경단체에게 밀려서 댐 건설을 20년 전부터 추가로 해야 되는 걸 못하고 있어요. 하물며 지금 이제 세계적으로 원유만 지금 최고로 하는데 물 분쟁이 지금 시작됐어요 왜? 지금 북한에서도 임진강 우리나라로 건너오듯이 타국가에도 강한 나라 여러 나라가 거쳐가요 물 분쟁 서로 차지하려고 물도 자원이에요 엄청난 자원 그래서 앞으로도 우리나라도 이제는 정유만이 문제가 아니라 물도 이제는 부담이 갈 정도로 사먹을라. 수돗물 이게 분명히 도래가 돼요. 우선 지금 보면 세차 같은 거 할 때 지하수 갖고 해야 되는데 수돗물이에요. 세차할 때 그게 정수 단가가 어마어마하게 들어가는 거예요. 먹어야 되게끔 만들어 놓은 걸 세차하고 있어요. 또 하나 농업용수 관정을 파서 강음에 써야 되는데 수돗물 정수처리해서 돈을 엄청 처리 드린 것을 농사에다 주고 있어요 왜? 물값 싸니까 그래요. 그러면 어제 얘기한 전기하고 물을 정부에서 왜 못 올리냐. 우리 경제에 미치는 양이 너무 커요. 전기세하고 키로와트당 물 1톤당 얼마 올리면 물가 상승률이 동반. 왜냐하면 우리 먹고 생활하는 거 전기 물 없이 할 수 있는 게 없잖아요. 그래서 생산 단가가 어마어마하게 올라가요. 그래서 정부에서 적재한 거 수자원 공사 환전에 적재한 걸 알면서도 국영기업체니까 그렇게 할 수 있는 거죠. 그걸 지금 절제하고 억제하고 있는데 이거를 아주 우리는 전 국민한테 이거는 진짜 주제로 하고 싶다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_003", "label": "댐 건설의 필요성", "title": "[A_t22] [Claim] 땜이라는 건 우리도 상식적으로 가물피해, 홍수피해에 도움이 된다는 걸 알고 있고요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_007", "label": "댐 건설 추진", "title": "[A_t22] [Proposal] 때로 그거를 저희가 얘기하는 건 어떨까요?", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Value_002", "label": "손실을 감수하는 이득 추구", "title": "[A_t22] [Value] 우리가 100원을 얻으려면 30원은 잃어도 돼요. 왜 어떤 게 더 커요? 70원이 더 크죠? 그런데 우리가 뭐를 가져오려면 손도 끄떡 안 하고 어떻게 가져와요? 운반비도 들고 예를 들면 사람이고 수집도 하고 이렇게 하듯이", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_004", "label": "환경단체의 댐 건설 반대", "title": "[A_t22] [Concern] 환경단체가 우리나라가 세계적으로 유명해요. 환경단체가 아주 입김이 그게 뭐냐면 산림 훼손하고 또 자연 파괴 마을이 몇 개 없어지고 해야 땜이 생겨요.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_005", "label": "댐의 종류 및 목적", "title": "[A_t22] [Evidence] 농촌공사 댐이 있고 다목적댐이 있어요. 농촌공사 댐은 단일 목적댐이 농업에만 100% 쓰는 거고 두 개 이상의 목적을 가진 건 수자원공사. 다 마늘 따 해가지고 농업용수, 공업용수, 생활용수, 발전. 그렇죠? 이제 여러분들은 처음 들어볼 거예요. 전문용어로. 그래서 많은 단, 두 개 이상이 목적을 갖지요. 다 목적되네요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_004", "label": "환경단체의 영향력으로 인한 댐 건설 지연", "title": "[A_t22] [Claim] 수자원공사에 보면 20년 전부터 그렇게 입안 계획이 돼 있는데 환경단체가 정부의 권위 그런 것도 세종에 보면 환경부 앞에 막사져놓고 맹기고 하고 있는데 넘었어요 환경단체가 그러다 보니까 거기 밀려서 정부도 그런 상황인데", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_008", "label": "시민단체 주도로 댐 건설 추진", "title": "[A_t22] [Proposal] 저희는 시민단이고 시민의 대표에서 모였으니까 그래서 그걸 밀면 좋죠 나름 우리가 힘이 있으니까 그거를 안건으로 한번 하면 어떨까요?", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_009", "label": "친환경 배달 용기 사용 및 수거 시스템 도입", "title": "[A_t22] [Proposal] 친환경 세달을 혹시 하나 배달시키고 가는데 연기에 있잖아요. 사실 배달이 끝나잖아요. 그러면 소비자는 그걸 플라스틱, 쓰레기로 나락을 부르시고 이 과정에서 배달만이 아니라 다이오 용기를 사용하고 수거를 한다면 배달앱이 아니라 수거앱을 한다거나 일자리 창출을 했잖아요. 역발상으로도 생각해봤거든요.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_004", "label": "기존 제도 개선 및 보완 방향", "title": "[A_t22] [Issue] 기존 제도의 개선 보안 방향에 대해서 좀 말씀하시면서 그중에서 대중교통에 대한 이야기를 좀 나눠주셨습니다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_005", "label": "기존 시설의 친환경적 전환", "title": "[A_t22] [Issue] 앞선 고도블록 활용해서 기존 시설들을 어떻게 친환경적으로 만들 것인지에 대한 부분도 같이 말씀해주셨고요.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_006", "label": "대중교통 확대 방안", "title": "[A_t22] [Issue] 대중교통이라든지 이런 부분들에 있어서 어떻게 같이 확대해 갈 것인지", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_007", "label": "자율적 참여 방안 부여", "title": "[A_t22] [Issue] 이 부분들에 있어서는 자율적인 참여 방안세를 부여할 수 있는 것들이 있으면 좋겠다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_008", "label": "수자원 이용량 줄이기", "title": "[A_t22] [Issue] 수자원, 물 이용량 줄이기라든지", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_009", "label": "친환경 배달원 정착", "title": "[A_t22] [Issue] 친환경 배달원 정착이라든지", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_005", "label": "플라스틱 수입 문제", "title": "[A_t22] [Claim] 이 플라스틱은 지금 우리가 만들어낸게 아니라 중국에서 수입을 하더라구요 지난번에 그거 재활용봉 못사고 그랬잖아요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_010", "label": "폐지 활용 압축 종이 생산", "title": "[A_t22] [Proposal] 우리나라가 지금 버려지는 종이가 참 많습니다. 뭐 포장지 케익박스 이런것들도 모아서 앞쪽 종이를 만들어서 활용할 수 있고", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_011", "label": "텀블러 사용 페이백 제도 활성화", "title": "[A_t22] [Proposal] 우리가 텀블러를 쓰고 있잖아요. 텀블러를 가져가면 저는 페이백을 해줄 줄 알았어요. 페이백을 안 해도 페이백하는 제도를 활성화시키고", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_012", "label": "야간 택배 이용 시 페이백/할인 제공", "title": "[A_t22] [Proposal] 야간에 택배를 시켰을 때 아주 바쁜 러시아월 시간을 피해서 시키면 오픈 PC를 해줬거나 페이백을 해줬거나 그래서 매연도 줄이고 보행할 자정도 그래서 연료 절약 처음에서 좋은 것 같습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_005", "label": "토론 의제의 구체성 문제", "title": "[A_t22] [Concern] 지금 이게 제 생각에는 저희가 하는 게 약간 구호성 같거든요. 저희가 이런 얘기를 했을 때 수기분들이 토론을 해야 되잖아요 근데 이게 조금 너무 디테일하다 느낌이 드는데 그러면 이렇게 됐으면 수기분들이 토론을 어떻게 너무 디테일하다 느낌을 받았어요 찬반 예 아니오 성이잖아요", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Condition_000", "label": "구체적인 의견을 그룹핑하여 의제화", "title": "[A_t22] [Condition] 그런 부분들이 만들어지면 그런 것들을 모아서 그럼 이 분야에 대해서 우리가 어떻게 의제로 낼 수 있을지에 대해서 그룹핑화하고 거기에 대해서 표제화하는 것들도 여러분께서 하실 거예요.", "color": "#f08c00", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_013", "label": "탄소 절감 정책 실천 방안 향상법 토론", "title": "[A_t22] [Proposal] 이분 의견이랑 여러분 의견을 그냥 하면 통틀어서 탄소 절감 정책을 실천할 수 있는 방안 향상법을 의제해서 토론하면 이런 얘기도 나오고 저런 얘기도 나오지 않을까 생각하고요.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_014", "label": "원자력 에너지 활용 및 국민 불안감 해소 방", "title": "[A_t22] [Proposal] 또 하나는 사실 저도 원자력에 관심이 많아요. 탄소 제로인 원자력 에너지 적극적 활용을 위한 안정성 향상 그리고 과장된 국민 불안감 해소 방안 이거에 대해서도 토론해 봤으면 좋겠어요.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_006", "label": "원자력 사고 확률과 인식의 괴리", "title": "[A_t22] [Evidence] 전 세계적으로 세 번 원자력 사고가 큰 게 있었어요. 치명적인 거. 비행기 사고가 많아요. 교통사고가 많아요. 1년에 죽는 숫자가. 당연히 맞죠. 그런데 우리는 비행기 사고에 대한 공포를 더 가르치고 있거든요. 전쟁이 나는 확률보다도 원자력 사고가 적어요. 그럼에도 불구하고 마치 원자력을 쓰면 다 죽을 것처럼 지금 국민 인식을 그렇게 만들어놨잖아요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_006", "label": "원자력에 대한 국민 인식 개선 필요", "title": "[A_t22] [Claim] 이거를 좀 원래대로 돌릴 수 있는 해소방안 이런 걸 의논하면 탄소제로인 원자력을 잘 사용할 수 있는데 좀 더 우리가 불편한 마음이 줄어들지 않을까 그런 생각을 했습니다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_010", "label": "탄소 절감 실천 방안 (개인적 차원)", "title": "[A_t22] [Issue] 산소 절감은 실천할 수 있는 방안들에 대해서는 개인적 차원으로 같이 넣도록 할게요.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_006", "label": "재활용품 분리수거의 어려움", "title": "[A_t22] [Concern] 저희가 안 쓰는 신발이나 옷 이런 거 너무 많잖아요. 근데 폐기물 거기, 재활용 거기 박스 넣기 가기도 귀찮고 막 그러기도 하고요.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_015", "label": "리사이클링 공공앱 도입", "title": "[A_t22] [Proposal] 요즘 리사이클링 하는 업체들이 있어요. 그래서 이렇게 집에서 어플로 이렇게 신청하면 오거든요. 근데 그걸 아직도 모르는 사람들이 너무 많고 공공배달앱이라는 게 생기는 요즘 실정인데 공공배달앱을 쓰면 또 이렇게 플라스틱이 많이 나오고 그런데 이거는 좋은 취지의 리사이클링을 하는 건데 오히려 공공앱공공앱이 생긴다면 이런게 나와서 사람들이 리사이클링을 좀 더 적극적으로 할 수 있도록 하면 어떨까 라는 생각을 해봤습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_007", "label": "경기도 공공배달앱 사례", "title": "[A_t22] [Evidence] 제가 알기로는 경기도에서 공공배달앱이 있어요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_011", "label": "축산 동물 복지 개선", "title": "[A_t22] [Issue] 문제는 축산이에요. 축산. 폭우나 홍수나 홍수 같은 말이니까 그리고 막 폭염 그리고 폭설 이런 거 올 때 지난 저희 동네에 그게 무너져가지고 닭장이 무너져서 닭이 몰살을 당하고 또 더울 때는 더워서 다 죽어요. 그러니까 우리 식탁에 올라올 때 생명들이 물론 우리는 그걸 먹기 위해서 기른다고 하지만 그러면 또 이렇게 사람들 말해 너는 먹지마 이렇게 그런 말도 안되는 식으로 나오는 사람하고는 제가 상대도 하기 싫은데 어차피 먹더라도 그들의 최소한의 동물적 본능을 발휘할 수 있는 환경에서 키울 수 있는 입법을 저는 만들어야 된다고 생각해요.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_008", "label": "동물복지계란 소비 경험", "title": "[A_t22] [Evidence] 저는 동물복지계란만 먹거든요. 그럼 또 이렇게 말하는 사람이 있어 너는 돈 있으니까 동물복지계란 먹지. 우린 가난해서 못 먹어. 이렇게 비아냥거리거든요. 저는 적게 먹어요. 돈이 많아서 동물복지계란을 먹는 게 아니라", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_007", "label": "열악한 사육 환경의 문제점", "title": "[A_t22] [Claim] A4 안장 용지에 닭을 키우고 그 닭을 잡아먹으면 행복할까요? 그런 생각조차 못하는 사람이라면 나는 그의 인격이 의심스러워요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_016", "label": "축산 동물 사육 환경 개선 법안 마련", "title": "[A_t22] [Proposal] 동물을 키우더라도 예를 들어 일정 규모가 있으면 연말 이상 못 키우게 채소 단위 면적도 좀 정하고 폭염, 그 다음에 겨울에 혹한 이런 것들도 대비할 수 있는 최소한의 장치를 마련해서", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_009", "label": "수입 소고기 소비 경험", "title": "[A_t22] [Evidence] 저는 그래서 수입고기만 소고기도 수입고기로 줄여 먹어요. 90% 왜 우리나라처럼 열악한 게 키운 것보다 외국이라고 다 잘 키우는 건 아니지만 차라리 내 눈에 안 보이는 데서 그네들을 먹고 싶은 거예요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_008", "label": "인간 중심적 사고 비판", "title": "[A_t22] [Claim] 우리가 이제 세계 경제 6위인데 언제까지 인간에 매달려가지고 우리만 잘 먹고 잘 사는 걸 연구하지 않는지 모르겠어요. 세계 경제 규모를 떠나서 좀 성숙한 인격으로 살았으면 좋겠어요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Value_003", "label": "동물 복지 고려의 필요성", "title": "[A_t22] [Value] 감축에만 신경 쓰는 게 아니라 그 안에서 인간만이 아니라 그럼 동물들은 어떻게 할 건가에 대한 측면들도 우리가 고려함이 필요하다는 부분들을 같이 말씀해주셨고요.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_012", "label": "지자체별 쓰레기 매립 및 분리수거 문제", "title": "[A_t22] [Issue] 쓰레기 매립이나 물리수거 같은 게 쉽지 않다고 했잖아요. 지자체별로 자취를 줬으니까.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_017", "label": "지자체별 이익공유제 도입", "title": "[A_t22] [Proposal] 차라리 거기서 나온 얘기인데 지자체별로 이익공유제를 해서 어떤 환경 같은 예산적 편성이 돼 있다면 시적으로 부가 잘 사는 지자체가 없을 때는 약간 그걸 좀 이렇게 할 수 있는 비율적으로 그런 것이면 낙후된 지자체도 매립이나 분리수거에 대해서 다른 체제를 갖춰주지 않을까 생각을 하게 됐습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_009", "label": "지자체 이익공유제 시 환경 개선 용이", "title": "[A_t22] [Claim] 돈을 밀어줬을 때는 좀 더 환경이 더 하기 쉽겠죠.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_007", "label": "소각장 건설의 어려움", "title": "[A_t22] [Concern] 저희 지자체도 각 특정 지자체별로 새로운 시스템의 소각장이 있어요. 그런데 그게 들어오기가 굉장히 힘들더라고요. 반대파도 많고 양날에 검이 들어요. 그게 들어오면 좀 더 최신 시스템으로 쓰레기를 처리할 수 있고 탄수 배출도 최대한 헤팔필터 써서 한다는데 그게 양날에 검이 들어요. 그래서 다들 계속 매립만 하고 있는데 지역별로 그런 부분은 좀 더 보완이 돼야 될 것 같습니다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_010", "label": "지역 인센티브를 통한 혐오시설 수용", "title": "[A_t22] [Claim] 그것도 어느 정도 지자체 주민들이 베네핏이 있다면 조금 설수성이 있을 것 같기도 해요. 아까도 지자체별로 모든 게 조례가 다르다고 했잖아요. 그런데 쓰레기 관련된 소각장이 됐든 뭐가 됐든 혐오시설로 분류돼요. 그러면 그 지역 주민들을 이해해서 어떻게 해서라도 그걸 관찰해야 되는데 그 지역민들도 100원을 얻기 위해서는 30원은 손실을 볼 줄 알아야 되는 개념이 도입되어야 되는데 그래서 그 지자체별로 그거를 지금 우리 원자력도 그렇잖아요. 어디 울진이 하려고 하다가 못하고 왔다 하듯이 지역에 인센티브를 줘서 정부에서, 그건 정부 자원이죠. 그렇게 하듯이 제가 볼 때는 지역 이기주의 또는 혐오시설 쓰레기 관련해서는 엄청 많거든요. 관련되는 게. 그래서 그게 열병합발전소 이런 것 등등 그래서 자기 동네에는 그런 것이 못 들어오게 하려고", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_013", "label": "감축 분야 의제 (에너지 전환, 교통 이동,", "title": "[A_t22] [Issue] 감축 분야에서 에너지 전환에 대한 것, 그리고 교통 이동에 대한 부분들, 그리고 소비, 그리고 자원순환에 대한 부분들, 자원순환 말씀해 주셨죠? 그리고 정의로운 전환, 이런 데에 대한 부분들이 있고요. 추가적으로 산업이나 탈탄소 기술에 대해서도 의견들이 나왔습니다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_014", "label": "적응 분야 의제 (폭염 한파 대응, 에너지 ", "title": "[A_t22] [Issue] 적응 분야에 있어서는 폭염 환파 대응 그리고 에너지 정의 아까 말씀해 주셨던 것 같이 들어갈 수 있을 것 같고 거기에 대한 부분들이 있고 그리고 생태계 생물 다양성 고존에 대한 부분들 그리고 건강 영양과 보건 교육 여기에 대해서 의견들이 좀 많이 나온 부분들이 있습니다", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_011", "label": "생물 다양성의 중요성", "title": "[A_t22] [Claim] 우리가 어떤 정책을 할 때는 연결되어 있는 큰 그림을 봐야 하거든요. 예를 들면 동물복지 되게 중요한데 생물다양성이라는 게 더 큰 기념이 중요해요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_010", "label": "길고양이로 인한 생물 다양성 문제", "title": "[A_t22] [Evidence] 고양이를 우리가 고양이 밥을 주잖아요. 고양이가 많아지면 얘는 산으로 들러가 가지고 야생의 동물들을 다 죽여요. 작은 새알을 먹고 그러면 걔네들이 다 멸종되고 고양이만 더 많아지거든요. 생물다양성의 문제가 생기는 거예요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_018", "label": "포장재 감축 의제", "title": "[A_t22] [Proposal] 배달을 한다 그러면 배달에서 포장제 문제가 이런 문제가 많잖아요. 탄소도 줄여야 되잖아요. 그러면 우리가 더 구체적으로 하기보다는 예를 들면 식음료라던지 배달이라던지 이럴 때에 포장제를 많이 쓰게 되는데 이 포장제를 어떻게 강축할 것인가. 왜냐하면 종이가 다 좋은 것도 아니거든요. 포장재를 어떻게 간축할 것인가에 대한 의제를 던져주시면 거기에 대해서 더 많은 게 나올 수 있는 거고", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_019", "label": "배달 탄소 감량 방안 의제", "title": "[A_t22] [Proposal] 배달 자체에서의 탄소를 감량시킬 수 있는 방법에 대한 걸 한다면 사실은 오토바이가 다 정의로 쓰거든요. 그런 거를 전기로 바꿀 수도 있는 거고 야간에만 더 많이 쓰면 지금 어린아이들이, 젊은 친구들이 지금 신장투성률이 당뇨 환자가 무난하게 제일 증가하고 있는 추세거든요. 그러니까 너무 디테일한 거로 가기보다는 조금 본질을 확인해주세요.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_020", "label": "음식물 쓰레기 줄이기 및 저탄소 식단 꾸리기", "title": "[A_t22] [Proposal] 갑축 분양의 하나로 음식물입니다. 주제가. 음식물을 두 가지로 분류를 하면 첫 번째 음식물 쓰배기 줄이기. 이거에 대해서 실천 방안으로 집안에서 식단 계획 짤때 탄음식 이런 거를 저감하는 방안 등등이 있겠고요. 두 번째는 저탄소 식단 꾸리기. 그렇게 해서 이제 예를 들어서 기름 발생 이런 것보다는 채식비중 늘리기 예를 들면 이런 걸로 인해서 감축분야의 음식물을 하자고 하죠.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_021", "label": "적응 분야 및 일회용품 관련 공모전 개최", "title": "[A_t22] [Proposal] 저희가 대형이 지금 되게 없거든요. 저급 분야가 되게 없거든요. 근데 이게 저는 되게 중요하다고 생각해서 저희가 지금 만들 수 있는 것도 한계적이고 포괄적으로 봤을 때 공모전을 준비했던 거고 일회용품이 좀 화두가 되고 있으니까 그 부분 또한 공모전을 하는 게 좋겠다는 생각이 들어요.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_012", "label": "공모전은 '어떻게 할까'에 대한 답", "title": "[A_t22] [Claim] 선생님이 하신 말씀에 어떻게 하자 그 내용은 없습니다. 어떻게 할까 이거 이거 그래서 이렇게 하자가 공모전인 것 같아요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_011", "label": "종이컵 미세플라스틱 문제", "title": "[A_t22] [Evidence] 어제 오는데 제가 이제 플라스틱을 물을 먹었는데 어떤 얘기예요. 물을 더 드실 거여서 물을 주시는데 그게 종이더라고요. 거기 있는 미세프레스틱. 대한민국이 점점 더 아쉬울 때 제 느낌이었습니다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_022", "label": "공모전 질문을 숙의 질문으로 활용", "title": "[A_t22] [Proposal] 공모전에서 뭘 공모하고 싶은지 그게 나중에 수기에서 다룰 질문이 되면 되지 않을까요? 적응 분야 쪽, 더 발굴하자는 의미에서 적응 분야랑 일회용품 저는 먼저 생각해야 할 것 같아요.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_015", "label": "기후위기 대응 재정 확보 방안", "title": "[A_t22] [Issue] 시민의 선택이 취약한 분인데 재정인 것을 어떻게 끌어올 것인가 또 토론의 주제가 됐습니다. 재정은? 국가적으로 할 재정이 있거든요. 기업에서도 약간 체제 변환 요구로 어떻게 자율적으로 참여할 수 있겠느냐 시민들도 재정에 대해서 어떻게 캠페인을 벌여서 이 관련 재정 어찌 됐건 이걸 하나 버리더라도 베네피스 올라오는 것 같다 4 그 재정은 끌어올 수 있는 방안에 대해서 물론 한거죠 도움이 되요 4 4 또 또 이거 있으시면 더 듣도록 하겠습니다 그냥 지금은 막 던진다고 생각하시면 되요 네 지금 발전 단계니까 저요. 지금 기후시민회의에서는. 기후시민회의 말고 이제 그 한 단계 정도. 정책을 추진할 때. 돈은 더 많이 필요할 것 같은데. 민간적인 시기 어떻게 돈을 끌어올 수 있는 방안이 있나요? 캠페인 좋은 생각이나.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Evidence_012", "label": "안산 대중교통 페이백 제도", "title": "[A_t22] [Evidence] 저희 그 안산에서는 어떻게 하냐면. 그 세입익 제도가 잘 되어 있어요. 안산에. 그리고 통장에다가 농협인, 농협업, 농구를 통장에다가 버스를 타고 오면 페이백 100%예요.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_008", "label": "특수단체 재정 귀속 문제", "title": "[A_t22] [Concern] 만약에 특수단체가 돈을 받아버리면 그쪽이 또 귀속 세력이 되어버릴 수가 있어서 정부 돈으로만 움직여야 될 것 같다는 생각이 들고", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_023", "label": "불참자 일당 모아 추경 활용", "title": "[A_t22] [Proposal] 저희 내부에서도 200명인데 안 나오신 분들이 계시잖아요. 안 나오신 분들에 대한 일당을 모아서 추경을 할 수 있는 부분이 있는 것 같습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Issue_016", "label": "산불 및 산림 관리 방안", "title": "[A_t22] [Issue] 저분 분야 쪽에서 저희가 많이 부족한 것 같은 경우는 산불이나 이런 게 좀 많아졌잖아요. 예전에 기온이 올라가고 그러면서 그런 쪽을 좀 한번 던져보고 싶어요. 산불이나 산림 관리를 물론 개인 시민들이 할 수 있는 건 없겠지만 어떤 정보 차원에서 그걸 어떻게 관리해서 방지를 할지 기후 변화에 따라 다른 그런 것들도 산불이나 자연재해에 대한 문제를 같이 달았으면 좋겠다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Concern_009", "label": "환경 교육 전문가 부족", "title": "[A_t22] [Concern] 현장에서는 사실 환경변비 선택과목 같은 경우는 전국적으로 환경교사가 너무 좋지 않다고 생각합니다. 그리고 또 환경교육을 선택했을 때 비전문가, 전문 교과 선생님들이 담당을 하고 계셨는데", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Claim_013", "label": "청소년 환경 교육의 필요성", "title": "[A_t22] [Claim] 앞으로 가장 우리 세대 사람들은 환경에 대한 심각성을 실천하고 있는데 청소년 아이들은 인식부터 교육이 필요하잖아요.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t22__Proposal_024", "label": "기후위기 대응 청소년 시민 육성 방안", "title": "[A_t22] [Proposal] 기후위기 대응하는 시민, 청소년 시민 육성 방안", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "A_t23__Claim_00 shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_001", "label": "어릴 때 교육의 중요성", "title": "[B_t1] [Value] 어릴 때 배운 것은 오래 기억되므로 기후위기 교육은 어릴 때부터 이루어져야 한다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Issue_008", "label": "원전 활용 및 대안 정책", "title": "[B_t1] [Issue] 국내에서 원전을 활용한 전기 생산 및 친환경 대응 방안, 그리고 원전을 더 이상 짓지 않을 경우 다른 대안이 있는지 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_004", "label": "태양광 설치의 환경 문제", "title": "[B_t1] [Concern] 태양광 설치를 위해 나무를 베고 산에 설치하는 것은 나무가 탄소 흡수에 더 좋은 역할을 한다는 점에서 문제가 있다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_003", "label": "원전의 안전성 평가 및 홍보 부족", "title": "[B_t1] [Claim] 원자력의 안전성 평가 및 홍보가 제대로 이루어지지 않고 있으며, 화력이나 수력 발전의 이산화탄소 배출 문제는 간과되고 원자력 사고만 부각된다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Evidence_002", "label": "엔지니어 출신 경험", "title": "[B_t1] [Evidence] 엔지니어 출신으로 현대건설 플랜트 쪽에서 원자력 근무 경험이 있다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_005", "label": "태양광 폐기물 문제", "title": "[B_t1] [Concern] 태양광 발전으로 인한 폐기물 문제가 심각하며 이에 대한 논의가 부족하다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_002", "label": "미래 세대 부담 경감", "title": "[B_t1] [Value] 원전 폐기물 방폐장 문제, 과잉 생산 및 소비로 인한 미래 세대의 부담을 줄여야 한다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Proposal_005", "label": "미래 세대와의 논의 확대", "title": "[B_t1] [Proposal] 기후 문제뿐만 아니라 미래 세대가 가질 수 있는 몫에 대한 논의를 충분히 하여 기성세대와 젊은 세대의 다양한 의견을 들어봐야 한다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_003", "label": "시민의 실천적 역할 강조", "title": "[B_t1] [Value] 기후 문제 해결을 위해 시민 개개인의 실천이 중요하며, 작은 것부터 모범이 되어 실천하는 논의가 필요하다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Issue_009", "label": "태양광 패널 기술 개발 현황", "title": "[B_t1] [Issue] 태양광 패널의 효율성을 높이고 크기를 줄이는 기술 개발이 이루어지고 있는지 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_004", "label": "한국의 반도체 기술력", "title": "[B_t1] [Claim] 우리나라 반도체 기술력은 고밀도 첨단 제품을 만들어 세계적으로 많이 팔리고 있다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Issue_010", "label": "산업 생태계 발전 확대 및 가능성", "title": "[B_t1] [Issue] 노후 경유차 및 내연기관차, 전기차 개조 산업의 국내 성장 미비와 태양광 제품 경쟁으로 인한 국내 기업의 어려움 속에서 국내 산업 생태계 발전 확대 및 수출 확대를 위한 방안과 가능성이 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Issue_011", "label": "기후시민회의에 대한 전문가 소감", "title": "[B_t1] [Issue] 세계 최초로 진행되는 기후시민회의에 대해 전문가들이 보고 느끼는 소감이 어떤지 듣고 싶다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_006", "label": "시민 불편 감수 의지 부족", "title": "[B_t1] [Concern] 아무리 좋은 정책도 국민들이 불편해서 못하겠다고 하면 소용없다. 시민들이 겪게 될 불편함을 감수할 의지를 어떻게 키울 것인지가 중요하다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Issue_012", "label": "지자체별 폐기물 처리 방식 개선 방안", "title": "[B_t1] [Issue] 지자체별로 폐기물 처리 방식이 달라 분리수거를 아예 안 하거나, 해도 매립하거나, 돈 주고 버리는 등 차이가 있는데 이를 개선할 방안이 궁금하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Issue_013", "label": "원전 정책 방향 및 전문가 의견", "title": "[B_t1] [Issue] 우리나라의 원전 정책 방향과 원전에 대한 전문가들의 생각이 궁금하다. 특히 원전의 장단점과 안전성에 대한 우려를 해소할 방안이 필요하다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_005", "label": "한국의 원전 기술력", "title": "[B_t1] [Claim] 우리나라는 원전 기술이 세계 최고 수준이며 수출까지 하고 있다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Proposal_006", "label": "환경 유해 제품 표시 의무화 (재강조)", "title": "[B_t1] [Proposal] 친환경 제품 인증처럼 환경에 반하는 제품에 대해 담배처럼 환경 유해성을 표시하여 구매를 줄일 수 있는지 궁금하다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Evidence_003", "label": "술 생산에 필요한 물의 양", "title": "[B_t1] [Evidence] 맥주를 버리면 몇 억 배의 물이 필요하고, 소주는 20배의 물이 필요하다고 들었다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_006", "label": "노후 경유차 친환경차 전환 지원", "title": "[B_t1] [Claim] 노후 경유차를 친환경차로 바꾸는 DPF(매연저감장치) 관련 기술은 한국이 전 세계적으로 최고 수준이었으며, 남미, 중국 등 많은 나라가 배워갔다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_007", "label": "한국의 배터리 및 태양광 패널 기술력", "title": "[B_t1] [Claim] 우리나라는 배터리 최강국 중 하나이며, 태양광 패널도 최강국이다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Condition_000", "label": "친환경 산업 R&D 및 정책 제안의 중요성", "title": "[B_t1] [Condition] 친환경 산업 관련 R&D는 활발히 진행 중이며, 더 많은 지원 방안을 정책 제안하면 정부가 고려할 수 있다.", "color": "#f08c00", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_008", "label": "폐기물 관리의 지자체 역할 및 국가 개입", "title": "[B_t1] [Claim] 폐기물 관리는 지자체의 고유 업무이지만, 국가가 폐기물관리법 및 재활용법을 통해 지자체에 강제할 수 있는 권한이 있다. 국민 불편 해소를 위해 국가가 지침, 훈령, 시행령 등을 조정할 수 있다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_009", "label": "정부의 원전 정책 방향", "title": "[B_t1] [Claim] 정부 정책은 2050년까지 원전 20%와 재생에너지 80%로 전력을 공급할 계획이다. 원전은 탄소 배출이 거의 없어 탄소중립에 기여하며, 한국의 원전 기술은 세계 최강이다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_007", "label": "원전의 안전성 논란", "title": "[B_t1] [Concern] 원전은 탄소 배출이 없지만, 쓰리 마일, 체르노빌, 후쿠시마 세 가지 사건으로 인해 안전성 논란이 강하게 제기되고 있다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_010", "label": "환경 유해 제품 표시 제도 현황", "title": "[B_t1] [Claim] 법적으로 최소 기준에 미달하는 제품은 규제하고 있으며, 탄소 성적 표지 제도를 통해 제품별 탄소 배출량을 표시하고 있다. 그린워싱 단속도 이루어지고 있다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Condition_001", "label": "환경 유해 제품 표시 제도 강화 가능성", "title": "[B_t1] [Condition] 환경 유해 제품 표시 제도를 강화해달라는 건의가 있으면 정부는 법에 담을 수 있는 수단을 가지고 있다.", "color": "#f08c00", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_011", "label": "코로나19 시기 온실가스 감소 원인", "title": "[B_t1] [Claim] 코로나19 시기 온실가스가 크게 줄어든 것은 재택근무와 산업 활동 중단 때문이었다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Proposal_007", "label": "스코프3 공시 제도 강화", "title": "[B_t1] [Proposal] 기업의 스코프3(직원 출퇴근, 협력사 배달 등 간접 온실가스 배출) 공시 제도를 강화하여 재택근무를 법적으로 강요할 수는 없지만 압박을 가할 수 있다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_012", "label": "온실가스 배출 측정 단위 (스코프1, 2, ", "title": "[B_t1] [Claim] 온실가스 측정에는 스코프1(직접 생산 활동), 스코프2(간접적인 전기/열 생산), 스코프3(직원 출퇴근, 협력사 배달 등 기타 간접 배출) 단위가 있다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_013", "label": "온실가스 배출원 및 친환경 제품 구별의 어려", "title": "[B_t1] [Claim] 온실가스는 주로 전기 생산, 철강, 석유화학, 시멘트 등 대규모 원자재 산업에서 발생하며, 소비자가 직접 사용하는 제품에 '반환경' 라벨을 붙이기는 어렵다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Proposal_008", "label": "기업의 탄소 배출 폭로 활동 강화", "title": "[B_t1] [Proposal] 탄소를 많이 배출하는 기업 활동에 대한 CDP(탄소 폭로 프로젝트)와 같은 폭로 작업을 많이 할 필요가 있다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_004", "label": "시민의 국가 설계 참여 중요성", "title": "[B_t1] [Value] 개인 소비자의 실천도 중요하지만, 시민은 국가 설계에 관련된 의견을 제시하여 헌법 개정, 국회 상설 활동 등 큰 변화를 이끌어내야 한다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_005", "label": "정책 재원 고려의 중요성", "title": "[B_t1] [Value] 모든 정책은 재원을 필요로 하며, 세금, 보조금, 기업 규제 등은 국가 경제에 영향을 미치고 국민의 주머니에서 나오는 것이므로 이를 감안하여 제안해야 한다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_008", "label": "원전의 안보적 취약성", "title": "[B_t1] [Concern] 원전은 단일 발전원으로서 안보적으로 취약하며, 전쟁 시 블랙아웃을 초래할 수 있고, 환태평양 조산대에 위치한 한국은 지진 등 자연재해 위험도 고려해야 한다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_014", "label": "태양광 산업 보호 정책의 필요성", "title": "[B_t1] [Claim] 태양광 산업 보호를 위한 정책이 어느 정도 들어가 있지만, 보조금 지원은 사업성이 부족하다는 의미이므로 국민적 합의가 필요하다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_015", "label": "폐기물 처리 비용의 보조금 성격", "title": "[B_t1] [Claim] 폐기물 처리 비용은 재활용업자들의 사업성 부족을 보조하기 위해 국민이 내는 것이다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_009", "label": "재택근무 법적 강제의 기업 부담", "title": "[B_t1] [Concern] 재택근무를 법적으로 강제하는 것은 기업에 상당한 부담을 줄 수 있으며, 일자리 문제와도 연관될 수 있다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_016", "label": "환경교육 관련 법률 및 계획", "title": "[B_t1] [Claim] 환경교육 활성화 및 지원에 관한 법률이 있으며, 국가환경교육계획이 5년 단위로 수립되어 추진 중이다. 학교 환경교육은 초중고 전 학년에 걸쳐 의무화되고 있다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_017", "label": "전기차 보급 현황 및 충전 인프라 개선", "title": "[B_t1] [Claim] 한국은 전기차 100만 대를 달성했으며, 신차 등록 대수도 10만 대를 넘어섰다. 전기차 충전기도 51만 대가 구축되었고, 정부는 충전기 관리 강화 및 정보 제공 등 제도 개선을 추진 중이다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_018", "label": "기후시민회의의 세계 최초 역할", "title": "[B_t1] [Claim] 한국의 기후시민회의는 법률에 기반한 제도화된 기구이며, 기획참여단이 정부와 시민을 이어주는 교량 역할을 하고, 정부를 압박하는 협상 단계까지 담당하게 될 세계 최초의 사례이다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_010", "label": "전문가 의견의 편향성", "title": "[B_t1] [Concern] 전문가들은 자신의 이익에 유리한 쪽으로 대답하는 경향이 있으므로, 전문가의 의견을 맹신해서는 안 된다. 가치 판단은 시민의 몫이다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_019", "label": "기술의 사회적 통제 필요성", "title": "[B_t1] [Claim] 전문가들에게 기술 개발을 전적으로 맡기면 기술적으로 가능한 모든 것을 하려 할 수 있으므로, 시민들이 기술의 사회적 통제, 즉 민주적 통제를 해야 한다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Evidence_004", "label": "관악 기후시민의회 경험", "title": "[B_t1] [Evidence] 관악 기후시민의회를 한 달간 운영해본 경험이 있으며, 대학원생이 시민의회 논문 주제로 참여하고 있다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_020", "label": "기후시민회의의 의제 그룹핑 필요성", "title": "[B_t1] [Claim] 기후시민회의는 구체적인 질문들을 그룹핑하여 의제를 정하고, 예시적인 질문을 넣어 수기참여단이 아이디어를 낼 수 있도록 길라잡이 역할을 해야 한다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_021", "label": "프랑스의 원전 정책 변화", "title": "[B_t1] [Claim] 프랑스는 원래 원전 폐지를 추진했으나, 2022년 에너지 안보 위기 이후 마크롱 대통령이 원전을 다시 핵심 정책으로 삼아 현재 60% 이상을 원전으로 충당하고 있다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_022", "label": "원전의 브릿지 에너지 역할", "title": "[B_t1] [Claim] 원전은 화석연료에서 재생에너지로 전환하는 과정에서 LNG와 함께 브릿지 에너지 역할을 할 수밖에 없다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_011", "label": "중국의 탄소 배출 및 재생에너지 시장 독점", "title": "[B_t1] [Concern] 중국은 계속 석탄을 사용하며 탄소를 많이 배출하고 있고, 태양광, 풍력 등 재생에너지 시장의 90% 이상을 독점하고 있어 한국의 에너지 안보에 위협이 된다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_006", "label": "불편함 없는 친환경 제도 설계", "title": "[B_t1] [Value] 시민들이 불편함을 감수하지 않고도 친환경 생활을 할 수 있도록 버스 전용차선처럼 편리한 제도 설계가 필요하다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_023", "label": "보행 친화 도시의 중요성", "title": "[B_t1] [Claim] 서울을 비롯한 전 세계 도시들이 보행 친화 도시로 전환하는 것이 중요하며, 이는 온도 저감, 대중교통 활성화 등 다양한 기후 문제 해결에 기여한다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_007", "label": "시민 의지 향상의 중요성", "title": "[B_t1] [Value] 시민들이 불편함을 감수하고 기후 행동에 참여하려는 의지를 향상시키는 것이 모든 정책의 전반적인 성공에 연결된다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_008", "label": "지속가능한 세상의 의미", "title": "[B_t1] [Value] 지속가능한 세상은 현재의 풍요를 미래 세대도 함께 누릴 수 있도록 하는 것이다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Proposal_009", "label": "기후 교육 확대", "title": "[B_t1] [Proposal] 시민들의 기후 의식을 높이기 위해 바닥부터 어른들까지 기후 교육을 확산시켜야 한다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Concern_012", "label": "환경 교육 제도의 현장 적용 미흡", "title": "[B_t1] [Concern] 환경 교육 제도는 마련되어 있지만, 학교 현장에서는 자습 시간으로 대체되는 등 실제 적용이 미흡하다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Proposal_010", "label": "불필요한 플라스틱 및 포장재 감축 시스템 개", "title": "[B_t1] [Proposal] 생활 속에서 불필요한 플라스틱 제품, 일회용품, 포장재 등을 감축할 수 있도록 시스템을 개선해야 한다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Evidence_005", "label": "배달 앱 일회용품 기본 설정 변경 사례", "title": "[B_t1] [Evidence] 배달 앱에서 일회용 숟가락/젓가락을 기본 제공에서 선택 사항으로 변경한 후 사용량이 크게 줄었다.", "color": "#868e96", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Value_009", "label": "라이프스타일 변화의 중요성", "title": "[B_t1] [Value] 정부 정책만으로는 한계가 있으며, 국민의 라이프스타일이 바뀌어야 세상이 바뀌고 정책과 법도 바뀐다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t1__Claim_024", "label": "지구 자원 소비 현황", "title": "[B_t1] [Claim] 현재 라이프스타일을 유지하려면 지구가 1.7개 필요하며, 대한민국 사람처럼 전 세계인이 살면 지구가 3.3개 필요하다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t2__Claim_000", "label": "국가 제안 비전 필요", "title": "[B_t2] [Claim] 국가에 제안할 수 있는 큰 비전이 있는 어젠다가 필요하다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t2__Concern_000", "label": "생활 위주 의견의 한계", "title": "[B_t2] [Concern] 생활 위주의 의견들은 누구나 알고 있는 내용이다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t2__Value_000", "label": "시민회의의 중요성", "title": "[B_t2] [Value] 시민회의가 중간 단계에서 연결하는 브릿지 단계로서 중요하다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t2__Proposal_000", "label": "기획참여단 운영 개선", "title": "[B_t2] [Proposal] 내년에 기획참여단을 20년 운영한다면, 4개의 조별로 생활기구 쪽은 공부하고 토론하여 실제 도움이 되는 제안을 할 수 있도록 해야 한다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t2__Issue_000", "label": "시민참여단 정책 수립 질문", "title": "[B_t2] [Issue] 시민참여단에서 구체적인 정책을 만들기 위해 어떤 질문을 던져줘야 하는지 고민해야 한다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t2__Claim_001", "label": "탄소중립 개념 부족", "title": "[B_t2] [Claim] 일반 가정에서 탄소중립에 대한 개념이 별로 없다.", shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t3__Value_004", "label": "브랜드 초기 설정의 중요성", "title": "[B_t3] [Value] 브랜드를 만들 때 처음에 제대로 만들어야 하며, 나중에 바꾸려면 막대한 비용과 시간이 소요된다.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t3__Claim_014", "label": "기존 캐릭터 선정 과정", "title": "[B_t3] [Claim] 기존 캐릭터는 청년세대가 모여 만드는 과정을 거쳤고, 다수의 지지를 받아 선정된 것이다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "B_t3__Proposal_015", "label": "기획 참여자에게 굿즈 선물", "title": "[B_t3] [Proposal] 다음 회의 때 기획 참여자들에게 굿즈를 하나씩 선물로 준비하자.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "발표__Claim_000", "label": "결정도의 높음", "title": "[발표] [Claim] 그래서 결정도가 높습니다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "발표__Proposal_000", "label": "분과 구성 찬성", "title": "[발표] [Proposal] 그래도 분과를 나눈다면 집에서 여기 오신 분들은 다 관심 있는 분들이니까 그 부분을 인터넷에 검색도 해보고 자기 나름대로 유튜브도 볼 거라고 생각합니다. 그래서 분가를 나눴으면 좋겠다는 의견", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "발표__Proposal_001", "label": "활동 청소년 선발", "title": "[발표] [Proposal] 무작위 청소년을 뽑기보다는 활동을 하는 청소년이나 혹은 그런 서클이라든가 이런 데 좀 더 관심 있는 청소년을 뽑는 것이 도움이 되지 않을까라는 의견이 있었습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "발표__Proposal_002", "label": "의제 선정 기준 '직접' 단어 삭제", "title": "[발표] [Proposal] 이 직접이라는 단어를 철저하게 얻었으면 좋겠다는 의견이 있었습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "발표__Value_000", "label": "K-민주주의의 새로운 콘텐츠", "title": "[발표] [Value] 우리 소위 요새 K-민주주의 얘기를 하는 건 아십니까? K-민주주의의 진짜 콘텐츠가 생겼다. 그동안 K-민주주의 그러면은 촛불을 들고 그 다음에 요번에 응원봉을 들고 그것도 중요한 곳에 우리가 이쪽에 반대, 저항을 하기 위해서 모였었는데 그러한 촛불과 응원봉 사이에 선거와 선거 사이에 진짜 한국 시민들이 모여서 머리를 맞대고 민주주의를 혁신적으로 위해서는 우리가 식량의 자급자족이 필요하다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_009", "label": "국토가 좁은 나라에 스마트 팩토리 적합", "title": "[환경4조] [Proposal] 우리같이 국토가 좁은 나라에서는 스마트 팩토리가 좋겠다. 시골은 이미 노인들이 많아서 안되니까 시골 같은 곳에다가 공장화를 하는 거지.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_010", "label": "새로운 품종 개발 및 재배지역 재배치 (적응", "title": "[환경4조] [Proposal] 어차피 더워지는 건 어떻게 할 수 없는 문제니까 새로운 품종 예를 들어 애플망고를 한국에서 키워서 먹자는 거죠. 신품종을 개발하자. 사과가 지금 옛날에는 대구에서 많이 났는데 올라가거든요. 총선같이 추운데로. 그런 것처럼 새로운 지역으로 가고 새로운 품종을 개발하고 재배지역을 재배치하는 것으로 대응하자.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_006", "label": "기온 상승은 자연 현상이며 과장된 위기론", "title": "[환경4조] [Claim] 카스테오텐 교수님이 이렇게 말했어요. 이렇게 기온이 올라가는 게 하나의 인간의 재앙이 아니다. 하나의 자연현상 중에 하나고 여기가 기온이 높아지면 밀림이 많이 형성돼서 산소가 많이 나온다. 그러니까 이것은 어떤 세력들의 과장된 위기의 신조사입니다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Concern_003", "label": "에너지 바우처의 불공정성 및 비리", "title": "[환경4조] [Concern] 저는 개인적으로 바우처 반대하는 사람이에요. 공정하게 공급되지도 않고 여기에 비리도 있기 때문에 찬성은 안 하는데 쓸 게 없어서 썼고.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_007", "label": "스마트팜 실현 시 개인 소비 패턴 변화", "title": "[환경4조] [Claim] 이 의제들이 실현되면 개인에서는 소비 패턴이 좀 달라지지 않을까.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_008", "label": "스마트팜 실현 시 지역사회 마을 공동체 조성", "title": "[환경4조] [Claim] 이 의제들이 실현되면 지역사회 주준에서는 마을 공동체로 스마트팡 같은 걸 하나 조성할 수 있지 않을까.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_011", "label": "스마트팜 경비 세제 지원", "title": "[환경4조] [Proposal] 국가에서는 이런 스마트팜에 들어가는 경비가 상상을 초월해요. 이걸 세제나 지원해주면 어떨까.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_012", "label": "해외 스마트 팩토리 건설 및 농산물 수입", "title": "[환경4조] [Proposal] 국세 수준에서는 우리가 지금 현대차가 미국 공장에서 지어서 들어오는 것처럼 우리보다 소득 수준이 낮고 생산 인력이 많은 국가에 우리가 직접 가서 마트 팩토리를 건설하고 관리하고 그래서 거기서 농산물을 가져오는 그런 방법도 있지 않을까.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Issue_016", "label": "지향성과 정의로운 전환 (일자리 문제)", "title": "[환경4조] [Issue] 저희는 지향성과 정의로운 전환인데 이거는 일자리에요. 일자리입니다. 어떻게 힘든 점이 있는지 그런 것들을 저쪽에서 말했습니다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Concern_004", "label": "사무실 밖 노동자들의 어려움", "title": "[환경4조] [Concern] 사무실에서 일하는 사람들하고 밖에서 일하는 사람들이 대부분 힘들어합니다. 다시 일하는 것들 때문에 여러가지 그런 힘든 점들이 많다.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_013", "label": "취약계층 지원 확대", "title": "[환경4조] [Proposal] 취약계층을 위해서 많은 정부에서 특히 많은 지원을 해줘야 한다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_009", "label": "감축보다 적응이 취약계층에 더 적합", "title": "[환경4조] [Claim] 감축보다 적응이 더 그런 인들을 위해서 더 좋은 것 같다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_014", "label": "건설 현장 일용직 노동자 안전 교육 강화", "title": "[환경4조] [Proposal] 건설 현장 가면 일용직 노동자 분들 있잖아요. 그분들이 교육을, 일에 대한, 일을 하기 시작하기 전에 교육을 좀 많이 받았으면 좋겠다. 안전성 같은 걸 모르고 안전교육 모르고 다치는 사람들도 많으니까 일을 하기 전에 미리 미리 이미 하고 계시겠지만 아침에 교육을 해주셨으면 좋겠다. 그분들을 위해서 그러면 다치지 않을 수도 있지 않을까.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Concern_005", "label": "건설 현장 안전 교육의 과도한 시간 소요", "title": "[환경4조] [Concern] 일교구 안전교육을 이수하지 않으면 현장에 투입하지 않아요. 아예 그렇게 하고 있어요. 남편이 사업하기 때문에 너무 잘 알아요. 너무 까다롭게 교육하다가 시간이 너무 많이 걸려요. 그런 단점이 있어요.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_015", "label": "직장인 친환경 인센티브", "title": "[환경4조] [Proposal] 직장인분들 친환경 인센티브 이런 활동하면서 인센티브.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_016", "label": "환경보험원 등 국가 공개 및 상품권 지급", "title": "[환경4조] [Proposal] 환경보험원 등에 관심이 있어서 이런 것들을 국가에서 많이 공개하고 그러다 보니 우리에게 상품권을 얼마나 주시냐고 생각하고.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_010", "label": "세플라소비 유지 방법 부족", "title": "[환경4조] [Claim] 세플라소비가 유지될 수 있는 방법이 없지 않을까.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Issue_017", "label": "소비, 플라스틱, 과잉소비로 인한 생태계 파", "title": "[환경4조] [Issue] 현재 나타나고 있는 문제는 소비나 플라스틱이나 연기, 과잉소비 등의 생태계 파괴가 많이 되어 있다.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_017", "label": "탄소중립교육 및 기후교육 의무화 및 실천 확", "title": "[환경4조] [Proposal] 교육부분에서는 플라스틱 종립교육이 기후고기, 기후고기 기초고기에 따라 이런 부분을 공허화하면 좀 더 좋습니다. 이 공허화도 학생뿐만 아니라 학생분들과 같이 실천할 수 있다는 점이 중요하니까요.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_018", "label": "공공행사 다회용기 제공 및 의무화 (감축)", "title": "[환경4조] [Proposal] 감점 부분에 다회용기, 일회용기, 불이기 하면서 두 개 같은 부분은 고용원이 의미상인 결론에 다회용기를 제공하고 의무화하는 것입니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_019", "label": "기후위기 참여 및 실천 확대 (적응)", "title": "[환경4조] [Proposal] 적은 관점 부분에서는 지금 현재 실생활에 도움을 주고 하고 있긴 하지만 조금 부족하기 때문에 참여와 관한 실천학원에 합의할 수 있는 좀 더 유화하면 좋지 않을까 하는 부분이 많았습니다.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_011", "label": "교육을 통한 미래 세대 의식 형성", "title": "[환경4조] [Claim] 교육 부분에서는 당연히 아이들이 미래 핵심 세대다. 아이들의 습관이나 가치관이 커지고 있는 시기이기 때문에 조심히 의식의 형성에 의지해야 되지 않을까.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_012", "label": "교육을 통한 지역사회 효과 확산", "title": "[환경4조] [Claim] 지역사회에서도 이런 과정이나 지역사회에서 효과가 확산될 것이다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_013", "label": "교육을 통한 국가 수준 수익 발전", "title": "[환경4조] [Claim] 국가 수준에서도 수익 발전을 도와주고.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Claim_014", "label": "교육을 통한 국제 수준 시민 교육 연계", "title": "[환경4조] [Claim] 국제 수준에서도 새 시민교육을 연계할 수 있다.", "color": "#1c7ed6", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Issue_018", "label": "대중교통 이용 활성화의 어려움", "title": "[환경4조] [Issue] 대중교통을 이용하게 하려면 어떻게 해야 될 것인가. 그게 제일 큰 문제인 것 같아요. 어떤 불편함을 감수해야 하고. 저도 서울에서 지하철 한번 타면 한성 이런 것도 되게 어렵고. 그 다음에 또 계속하지 않는 거, 또 혈전이 없던 사람들이 많으면 되게 그게 감시가 안 되더라고요. 지방사로서.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_020", "label": "교통 문제 해결을 위한 자가격오 (실시간 정", "title": "[환경4조] [Proposal] 교통문제에 해결됐어서 자가격오를 좀 해야 된다 해서 계속해서. 계속해서 어떤 실시간 정보, 혈전이 되게 잘 되어 있다고 해서. 세계적으로 이렇게 하는 데가 없다고 해서 많이 놀라게 된 거예요. 그런 것들.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_021", "label": "자전거-지하철 연계 및 공용 자전거 활성화", "title": "[환경4조] [Proposal] 자전거를 타고 지하철 가면 연계가 되어야 되잖아요. 공용으로 자전거가 좋고 나쁘고 퇴비로 잘 탈 수 있게끔.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Proposal_022", "label": "친환경 수송차/버스 지원 및 전기차 접근성/", "title": "[환경4조] [Proposal] 환경을 생각하고 기후를 생각한다면 수송차나 친환경, 버스나 이런 것들을 많이 지원을 해서 자방용도 전기차나 이런 것들을 전기차도 접근성이 좋아야 되잖아요. 비용도 많이 지원을 해줘야 될 것 같아요. 그래야지만 이게 원시과학을 줄이는 첫 번째이지 않을까.", "color": "#2f9e44", "shape": "box", "font": {"color": "#fff", "size": 15, "face": " ] [Value] 생활화가 굉장히 중요한 게 생활화하는 사람을 칭찬을 해줘야 되는데.", "color": "#0c8599", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Concern_008", "label": "정책의 탁상공론화 및 실천 부재", "title": "[환경4조] [Concern] 돈 엄청난데 저기 불도 안 끄면서 뭘 이거 맨날 이런 걸 한단 말이에요. 실천하지 않으면서 탁상공론만 하는 거예요. 탁상공론 앉아가지고 뭐 그럴듯한 것만 자꾸 만들어낼 게 아니라 실천하고 난 다음에 지시하고 난 다음에 그 지시가 이루어졌는지 확인하지 않는 정책은 다 헛거예요. 그냥 빚 좋은 괴산고.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Concern_009", "label": "정치인들의 표심 얻기 위한 정책", "title": "[환경4조] [Concern] 정치인들이 자기들 그 수단의 표를 얻기 위해서 하는 거지 국민을 위해서 하는 게 뭐가 있어요.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Concern_010", "label": "학교 내 에너지 절약 교육의 실효성 부족", "title": "[환경4조] [Concern] 손주 학교 사물함에 볼일이 있어서 갔어요. 그런데 이제 선생님들이 회의를 가시더라고. 그런데 있잖아요. 우리 손주가 2학년인데 층에 다 불이 켜져 있고 따로 한 선생님만 교실에 불 끄고 가셨죠. 그때 내가 복도 전기를 안 끄고 선생님이 그렇게 개념 없이 생활하는데 애들이 뭘 보고 배우고 있어요. 집에 오세요. 내 자식도 마찬가지야. 안 끄고 다녀요. 그런데 그래 무슨 일 교육 안 돼요. 선생님들이 안 하는데요.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Concern_011", "label": "칭찬 및 보상 부족으로 인한 동기 저하", "title": "[환경4조] [Concern] 환경지킴이 해가지고 아이들한테 에너지 지킴이 해결을 하고 있는데 그 아이들한테도 많이 보상을 많이 줘야 돼요. 칭찬도 못해요. 그런데 칭찬은 마찬가지예요. 칭찬하면 옆에 아이가 상대적 박탈감을 느낀다고 칭찬도 안 하고 운동회도 항상 있잖아. 진팀이긴 팀 없이 똑같고 상도 안 줘요. 나는 우리 딸들이 학교 다닐 때 맨날 상 받아와서 이면제로 쓸 만큼 상이 많았는데 학교 2학년 때 상이 없더라고요. 상대적 박탈감 때문에 상도 안 줘요.", "color": "#9c36b5", "shape": "box", "font": {"color": "#fff", "size": 15, "face": "Malgun Gothic"}}, {"id": "환경4조__Issue_021", "label": "청소년들의 미래에 대한 비관적 시각 (기후 ", "title": "[환경4조] [Issue] 미래에 대해서 비관적이고 희망이 없다고 생각하는 거 아닐까요? 아이들이 우리가 뭘 할 수 있겠어? 라는 그런 우려감 같은 거. 기후 우울증이란 말이 되게 소름돌려요. 현재 기후변화에 대해서 우리가 영향을 미칠 수 있는 게 아무것도 없고 그것과 관련해서 우리가 뭔가 목소리로 될 수도 없고 왜냐하면 의견에서 배제돼 있으니까요. 우리가 영향을 받는 사람들인데 아무것도 할 수 없다는 것과 관련된 것 같아요.", "color": "#e8590c", "shape": "box", "font": {"color": "#fff", "size": 15, "     var caption = document.querySelector('#h b');
    if (caption) caption.textContent = '숙의 온톨로지 — 6/13-14 워크숍 (표시: ' + visible + '/' + all.length + ')';
  }
  function bind(cls, key){
    var btns = document.querySelectorAll(cls);
    btns.forEach(function(b){
      b.addEventListener('click', function(){
        btns.forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        F[key] = b.dataset[key];
        apply();
      });
    });
  }
  bind('.f-day', 'day');
  bind('.f-jo', 'jo');
  bind('.f-sess', 'sess');
})();
</script></body></html>
