<script type="module">
import { OntologyChrome } from '/_ontology-chrome/chrome.js';

const PREFIX_META = {
  'A_t21':{day:'6/14',jo:'A'},'A_t22':{day:'6/14',jo:'A'},'A_t23':{day:'6/14',jo:'A'},
  'B_t1':{day:'6/13',jo:'B'},'B_t2':{day:'6/14',jo:'B'},'B_t3':{day:'6/14',jo:'B'},
  'OA_t1':{day:'6/13',jo:'A'},'OB_t1':{day:'6/13',jo:'B'},'OZ_t1':{day:'6/13',jo:'통합'},
  'DA_t2':{day:'6/14',jo:'A'},'DB_t2':{day:'6/14',jo:'B'},'DZ_t2':{day:'6/14',jo:'통합'},
};

let cy, graph3d, ALL_NODES = [], ALL_EDGES = [], curFilter = { kind:new Set(Object.keys(OntologyChrome.KIND_DEFAULT)) };
let isoShown = false;
let sources = null, curSource = null, curView = '2d', pollTimer = null;
let currentMetaAssets = null;
let agendaSurface = null, agendaSurfacePromise = null;
let gyeonggiAgendaSurface = null, gyeonggiAgendaSurfacePromise = null;
let supabaseAgendaSurface = null, supabaseAgendaSurfacePromise = null;
let physicsOn = localStorage.getItem('og-physics') === '1', colaLayout = null;
let presentMode = false;  // 발표(대형스크린) 모드 — 공유 가능 뷰 상태라 URL 파라미터
let fixedNodeId = null, hoverNodeId = null, graph3dData = null, quickHover = false, hoverHideTimer = null;
// A-3 묶기(클러스터): 'none' | 'issue' | 'session'. 공유 가능 뷰 상태라 URL 파라미터(?group=).
// 무손실 원칙 — 그룹은 합성 부모 노드로만 표현하고 실제 노드/엣지는 절대 삭제하지 않는다.
let groupMode = 'none', ecApi = null;

const ROLE_TEXT = {
  Issue: '논의가 모이는 쟁점입니다. 서로 다른 주장·근거·우려가 이 지점으로 연결됩니다.',
  Claim: '타당성 검토가 필요한 주장입니다. 무엇이 이를 뒷받침하거나 반박하는지 함께 봅니다.',
  Proposal: '정책 대안입니다. 실행 조건, 우려, 근거가 함께 붙을 때 권고안 후보가 됩니다.',
  Concern: '반대·우려·소수의견입니다. 다수 의견에 흡수하지 않고 별도로 보존합니다.',
  Condition: '합의나 실행을 위해 필요한 조건입니다. 예산, 법개정, 단계 시행 등이 여기에 해당합니다.',
  Value: '정당성·가치 판단입니다. 형평성, 세대정의, 수용성 같은 판단 기준을 드러냅니다.',
  Evidence: '진리 주장에 해당하는 근거입니다. 자료, 경험, 사례, 관찰이 주장을 지탱합니다.',
  Group: '영향집단입니다. 특정 정책이 누구에게 영향을 주는지 보여줍니다.',
  Clause: '규정·조항입니다. 제도 문장의 근거 단위입니다.',
  Decision: '의결·결정입니다. 숙의 이후의 판단 결과를 나타냅니다.',
};
const REL_COLOR = {
  opposes: '#ff6b6b',
  hasConcern: '#ff922b',
  requiresCondition: '#ffd43b',
  hasEvidence: '#adb5bd',
  supports: '#56c2e4',
  modifies: '#b197fc',
  raisesIssue: '#63e6be',
  isAbout: '#74c0fc',
  impacts: '#f783ac',
};
const REL_KO = {
  supports: '지지',
  opposes: '반대',
  hasConcern: '우려',
  requiresCondition: '조건',
  hasEvidence: '근거',
  modifies: '수정',
  raisesIssue: '쟁점제기',
  isAbout: '관련',
  impacts: '영향',
};
const AGENDA_HINTS = [
  { terms:['원전','원자력','재생에너지','태양광','풍력','전력믹스'], ids:[1,13,3] },
  { terms:['전기요금','요금','에너지복지','전환비용'], ids:[2,14] },
  { terms:['전력망','송전','수도권','데이터센터','전력수요'], ids:[3,11,13] },
  { terms:['내연기관','경유차','전기차','무공해차','자동차'], ids:[4] },
  { terms:['기후정의','불평등','취약계층','폭염','복합위기'], ids:[5,15,14] },
  { terms:['생활실천','규제','소비','인센티브'], ids:[6] },
  { terms:['개발도상국','국제지원','기후재원'], ids:[7,12] },
  { terms:['ESG','RE100','기후공시','공시'], ids:[8] },
  { terms:['이행점검','모니터링','권고안','점검'], ids:[9] },
  { terms:['지자체','지역계획','상향식','중앙정부'], ids:[10] },
  { terms:['AI','인공지능','데이터센터'], ids:[11] },
  { terms:['기후배당','탄소세','기후대응기금'], ids:[14] },
];
const AGENDA_STOP_TERMS = new Set(['정부','정책','방안','논의','기후','탄소','중립','확대','지원','필요','대응','사회','지역','시민','회의','계획','구축','활용','도입','관련','문제']);

const params = new URLSearchParams(location.search);

(async function init() {
  sources = await fetch('sources.json').then(r => r.json());
  curSource = params.get('source') || sources.default;
  curView = params.get('view') || '2d';
  presentMode = params.get('mode') === 'present';
  groupMode = ['issue','session'].includes(params.get('group')) ? params.get('group') : 'none';
  buildSourceDropdown();
  OntologyChrome.init({ activeId: 'workshop', title: '숙의 온톨로지', meta: '로딩 중…' });
  bindGlobalEvents();
  if (curView === '3d') applyView('3d');
  loadAgendaSurface();
  loadGyeonggiAgendaSurface();
  loadSupabaseAgendaSurface();
  loadSource(curSource);
})();

function buildSourceDropdown() {
  const sel = document.getElementById('og-source');
  const byCat = {};
  for (const s of sources.sources) (byCat[s.category] = byCat[s.category] || []).push(s);
  sel.innerHTML = '';
  for (const cat of Object.keys(sources.categories)) {
    const list = byCat[cat] || [];
    if (!list.length) continue;
    const og = document.createElement('optgroup');
    og.label = sources.categories[cat];
    for (const s of list) {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      if (s.id === curSource) o.selected = true;
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
  sel.onchange = () => {
    curSource = sel.value;
    updateUrl();
    loadSource(curSource);
  };
}

function updateUrl() {
  const p = new URLSearchParams();
  p.set('source', curSource);
  if (curView !== '2d') p.set('view', curView);
  if (presentMode) p.set('mode', 'present');
  if (groupMode !== 'none') p.set('group', groupMode);
  history.replaceState(null, '', '?' + p.toString());
}

async function loadSource(srcId) {
  const meta = sources.sources.find(s => s.id === srcId);
  if (!meta) return;
  // view 지원 여부
  const supportsView = meta.supportsView || ['2d'];
  document.getElementById('og-view-3d').disabled = !supportsView.includes('3d');
  if (curView === '3d' && !supportsView.includes('3d')) applyView('2d');

  // polling UI: live category만
  const isLive = meta.category === 'live';
  document.getElementById('og-poll-ui').style.display = isLive ? '' : 'none';

  const payload = await fetch(meta.data + '?_=' + Date.now()).then(r => r.json());
  const { elements, meta: mt } = payload;
  const maxDeg = Math.max(0, ...elements.nodes.map(n => Number(n.data?.deg || 0)));
  ALL_NODES = elements.nodes.map(n => {
    const deg = Number(n.data?.deg || 0);
    const isOverviewLabel = n.data?.kind === 'Issue' || deg >= Math.max(4, Math.min(8, maxDeg - 1));
    return {
      ...n,
      data: {
        ...n.data,
        deg,
        is_public: n.data?.is_public !== false,
        isOverviewLabel,
      },
      classes: [n.classes, n.data?.is_public === false ? 'non-public' : ''].filter(Boolean).join(' '),
    };
  });
  ALL_EDGES = elements.edges;

  // A-6: 기존 자산(합의·DQI)이 데이터에 있으면 읽기전용으로만 노출 (없으면 무표시 — 방어적)
  const _extra = [];
  if (Array.isArray(mt.recommendations) && mt.recommendations.length) _extra.push(`합의·권고 ${mt.recommendations.length}건`);
  if (mt.quality) _extra.push('DQI 지표');
  OntologyChrome.updateMeta(`노드 ${mt.counts.nodes || ALL_NODES.length} · 엣지 ${mt.counts.edges || ALL_EDGES.length}${_extra.length ? ' · ' + _extra.join(' · ') : ''}`);
  OntologyChrome.updateAdvisory(mt.advisory_notice || (isLive ? '🔴 LIVE 미검증 초안 · 시민 비노출' : ''));
  updateAssetsButton(mt);

  // 헤더 pill 색 동기화 (LIVE면 빨강)
  const pill = document.querySelector('.og-pill');
  if (pill) {
    pill.classList.toggle('og-live', !!mt.live);
    pill.textContent = mt.live ? 'LIVE' : 'advisory · uid 역추적';
  }

  if (curView === '2d') renderCy();
  else render3d();
  renderHubRail();
  renderOverviewSurface(meta, mt);

  if (isLive) setupPolling(meta);
  else { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
}

function fmtTime(sec) {
  if (sec == null || Number.isNaN(Number(sec))) return '—';
  const n = Math.max(0, Math.round(Number(sec)));
  const m = Math.floor(n / 60);
  const s = n % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function fmtSpan(span) {
  if (!span || (span.start == null && span.end == null)) return '시간 미상';
  return `${fmtTime(span.start)}~${fmtTime(span.end)}`;
}

function qualityLabel(q) {
  if (!q) return '';
  const label = q.validity_label || q.label || 'quality';
  if (label === 'official-5indicators') return 'DQI 공식 5지표';
  if (label === 'exploratory-text-metric') return 'DQI 탐색적 지표';
  return `DQI ${label}`;
}

function renderSourceAssets(mt) {
  const recs = Array.isArray(mt.recommendations) ? mt.recommendations : [];
  const quality = mt.quality || null;
  const side = document.getElementById('og-side');
  if (!side || (!recs.length && !quality)) {
    if (side && !side.querySelector('.og-s-label')) side.classList.add('collapsed');
    return;

}

function normalizeAgendaIds(value) {
  const values = Array.isArray(value) ? value : (value == null ? [] : [value]);
  return values
    .flatMap(item => String(item).split(/[,\s]+/))
    .map(item => Number(String(item).replace(/^agenda[-_]?/i, '')))
    .filter(Number.isFinite);
}

function agendaTokens(value) {
  return [...new Set(String(value || '')
    .toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .split(/\s+/)
    .map(token => token.trim())
    .filter(token => token.length >= 2 && !/^\d+$/.test(token)))];
}

function addAgendaCandidate(map, agenda, rank, reason) {
  if (!agenda) return;
  const key = String(agenda.id);
  const prev = map.get(key);
  if (!prev || rank > prev.rank) map.set(key, { ...agenda, rank, match_reason: reason });
}

function findRelatedAgendas(node) {
  if (!node || (!agendaSurface?.agendas?.length && !gyeonggiAgendaSurface?.records?.length && !supabaseAgendaSurface?.records?.length)) return [];
  const candidates = new Map();
  const explicitIds = [
    ...normalizeAgendaIds(node.agenda_ids),
    ...normalizeAgendaIds(node.agenda_id),
    ...normalizeAgendaIds(node.related_agendas),
    ...normalizeAgendaIds(node.related_agenda_ids),
  ];
  for (const id of explicitIds) addAgendaCandidate(candidates, agendaSurface?.byId?.[String(id)], 100, '직접 연결');

  const haystack = `${node.label || ''} ${node.text || ''}`.toLowerCase();
  const nodeTerms = new Set(agendaTokens(haystack));
  for (const hint of AGENDA_HINTS) {
    if (hint.terms.some(term => haystack.includes(term.toLowerCase()))) {
      for (const id of hint.ids) addAgendaCandidate(candidates, agendaSurface?.byId?.[String(id)], 92, '핵심어 연결');
    }
  }
  if (agendaSurface?.agendas?.length && haystack.trim()) {
    for (const agenda of agendaSurface.agendas) {
      let rank = 0;
      const title = String(agenda.title || '').toLowerCase();
      const domain = String(agenda.domain || '').toLowerCase();
      const category = String(agenda.big_category || '').toLowerCase();
      const labelLower = String(node.label || '').toLowerCase().trim();
      if (title && (haystack.includes(title) || (labelLower.length >= 2 && title.includes(labelLower)))) rank += 40;
      if (domain && haystack.includes(domain)) rank += 12;
      if (category && haystack.includes(category)) rank += 4;
      const keywords = Array.isArray(agenda.keywords) ? agenda.keywords : [];
      for (const keyword of keywords) {
        const term = String(keyword).toLowerCase();
        if (term.length >= 2 && !AGENDA_STOP_TERMS.has(term) && nodeTerms.has(term)) rank += 3;
      }
      if (rank >= 15) addAgendaCandidate(candidates, agenda, rank, '제목·키워드 유사');
    }
  }

  if (gyeonggiAgendaSurface?.records?.length && haystack.trim()) {
    for (const record of gyeonggiAgendaSurface.records) {
      let rank = 0;
      const title = String(record.title || '').toLowerCase();
      const group = String(record.working_group || '').toLowerCase();
      const labelLower = String(node.label || '').toLowerCase().trim();
      if (title && (haystack.includes(title) || (labelLower.length >= 2 && title.includes(labelLower)))) rank += 80;
      if (group && haystack.includes(group)) rank += 16;
      const keywords = Array.isArray(record.keywords) ? record.keywords : [];
      for (const keyword of keywords) {
        const term = String(keyword).toLowerCase();
        if (term.length >= 2 && !AGENDA_STOP_TERMS.has(term) && nodeTerms.has(term)) rank += 5;
      }
      if (rank >= 18) {
        addAgendaCandidate(candidates, {
          ...record,
          big_category: record.status_label || '경기도 OCR',
          domain: record.working_group || '',
          summary: record.original_excerpt || record.summary || record.title,
          match_reason: '경기도 OCR 유사',
        }, rank + 8, '경기도 OCR 유사');
      }
    }
  }

  if (supabaseAgendaSurface?.records?.length && haystack.trim()) {
    for (const record of supabaseAgendaSurface.records) {
      let rank = 0;
      const title = String(record.title || '').toLowerCase();
      const category = String(record.category || record.working_group || '').toLowerCase();
      const sourceKind = String(record.source_kind || '').toLowerCase();
      const labelLower = String(node.label || '').toLowerCase().trim();
      if (title && (haystack.includes(title) || (labelLower.length >= 2 && title.includes(labelLower)))) rank += 70;
      if (category && haystack.includes(category)) rank += 10;
      if (sourceKind && haystack.includes(sourceKind)) rank += 6;
      const keywords = Array.isArray(record.keywords) ? record.keywords : [];
      for (const keyword of keywords) {
        const term = String(keyword).toLowerCase();
        if (term.length >= 2 && !AGENDA_STOP_TERMS.has(term) && nodeTerms.has(term)) rank += 4;
      }
      if (rank >= 18) {
        addAgendaCandidate(candidates, {
          ...record,
          big_category: record.status_label || 'Supabase 공개 코퍼스',
          domain: record.category || record.source_kind || '',
          summary: record.summary || record.title,
          match_reason: 'Supabase 코퍼스 유사',
        }, rank + 6, 'Supabase 코퍼스 유사');
      }
    }
  }

  const seedAgendas = [...candidates.values()].sort((a, b) => b.rank - a.rank).slice(0, 3);
  for (const agenda of seedAgendas) {
    for (const id of normalizeAgendaIds(agenda.related_agendas).slice(0, 3)) {
      addAgendaCandidate(candidates, agendaSurface?.byId?.[String(id)], Math.min(agenda.rank - 10, 70), '연관 의제');
    }
    for (const id of normalizeAgendaIds(agenda.similar_agendas).slice(0, 3)) {
      addAgendaCandidate(candidates, agendaSurface?.byId?.[String(id)], Math.min(agenda.rank - 14, 60), '의제 네트워크 유사');
    }
  }

  return [...candidates.values()]
    .filter(agenda => agenda.id != null)
    .sort((a, b) => b.rank - a.rank || String(a.id).localeCompare(String(b.id), 'ko'))
    .slice(0, 5);
}

function findNodeData(nodeId) {
  return ALL_NODES.find(n => n.data.id === nodeId)?.data || null;
}

function buildNodeContext(nodeId) {
  const node = findNodeData(nodeId);
  if (!node) return null;
  const incoming = [];
  const outgoing = [];
  const neighborIds = new Set([nodeId]);
  const counts = { support: 0, oppose: 0, condition: 0, evidence: 0, other: 0 };
  for (const e of ALL_EDGES) {
    const d = e.data || {};
    const touches = d.source === nodeId || d.target === nodeId;
    if (!touches) continue;
    const item = {
      id: d.id,
      source: d.source,
      target: d.target,
      rel: d.rel,
      relKo: d.relKo || relLabel(d.rel),
      sourceNode: findNodeData(d.source),
      targetNode: findNodeData(d.target),
    };
    if (d.source === nodeId) {
      item.otherNode = item.targetNode;
      outgoing.push(item);
      neighborIds.add(d.target);
    } else {
      item.otherNode = item.sourceNode;
      incoming.push(item);
      neighborIds.add(d.source);
    }
    if (d.rel === 'supports') counts.support++;
    else if (d.rel === 'opposes' || d.rel === 'hasConcern' || d.opposes) counts.oppose++;
    else if (d.rel === 'requiresCondition') counts.condition++;
    else if (d.rel === 'hasEvidence') counts.evidence++;
    else counts.other++;
  }
  const related = [...incoming, ...outgoing];
  const sourceIds = [...new Set([...(node.cited || []), ...(node.cited_uids || [])])];
  const agendas = findRelatedAgendas(node);
  return {
    node,
    incoming,
    outgoing,
    related,
    neighborIds,
    counts,
    sourceIds,
    agendas,
    role: ROLE_TEXT[node.kind] || '숙의 구조 안에서 연결 관계로 의미가 결정되는 노드입니다.',
  };
}

function relationChips(ctx) {
  const chips = [
    ['지지', ctx.counts.support],
    ['반대·우려', ctx.counts.oppose],
    ['조건', ctx.counts.condition],
    ['근거', ctx.counts.evidence],
  ];
  return chips.map(([label, count]) => `<span class="og-surface-chip"><b>${count}</b>${label}</span>`).join('');
}

function topHubNodes(limit = 8) {
  return [...ALL_NODES]
    .map(n => n.data)
    .filter(n => !n.isGroup && (n.kind === 'Issue' || Number(n.deg || 0) > 0))
    .sort((a, b) => {
      const kindWeight = (b.kind === 'Issue' ? 2 : 0) - (a.kind === 'Issue' ? 2 : 0);
      return kindWeight || Number(b.deg || 0) - Number(a.deg || 0) || String(a.label).localeCompare(String(b.label), 'ko');
    })
    .slice(0, limit);
}

function selectNodeById(nodeId, fixed = true) {
  const ctx = buildNodeContext(nodeId);
  if (!ctx) return;
  fixedNodeId = fixed ? nodeId : null;
  renderNodeSurface(ctx, fixed ? 'fixed' : 'hover');
  applyFocus(nodeId, fixed);
  document.getElementById('og-quick').classList.remove('show');
  if (cy && curView === '2d') {
    const n = cy.getElementById(nodeId);
    if (n && n.length) {
      try { cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.72) }, { duration: 420 }); } catch {}
    }
  }
  if (graph3d && graph3dData && curView === '3d') {
    const n = graph3dData.nodes.find(x => x.id === nodeId);
    if (n) {
      const dist = 88;
      const len = Math.hypot(n.x || 0, n.y || 0, n.z || 0) || 1;
      const ratio = 1 + dist / len;
      try {
        graph3d.cameraPosition(
          { x: (n.x || 0) * ratio, y: (n.y || 0) * ratio, z: (n.z || 0) * ratio },
          n,
          850
        );
      } catch {}
    }
  }
}

        </div>
        <details class="og-s-details" ${ctx.node.text ? '' : 'open'}>
          <summary>실제 대화 전사 원문</summary>
          <div class="og-s-text">${escapeHtml(ctx.node.text || '원문 전사 없음')}</div>
        </details>
        <div class="og-s-sec">
          <h4>출처 uid</h4>
          ${ctx.sourceIds.length ? ctx.sourceIds.map(c => `<div class="og-s-cite">${escapeHtml(c)}</div>`).join('') : '<div class="og-s-cite">출처 uid 없음 · 현재 노드 원문 텍스트 기반</div>'}
        </div>
        ${renderRelationList('들어오는 관계', ctx.incoming)}
        ${renderRelationList('나가는 관계', ctx.outgoing)}
        ${renderAgendaWikiCards(ctx.agendas)}
      </div>`;
    side.classList.remove('collapsed');
    side.querySelector('[data-side-close]').onclick = () => {
      fixedNodeId = null;
      side.classList.add('collapsed');
      clearFocus();
    };
    return;
  }
  const quick = document.getElementById('og-quick');
  quick.innerHTML = `
    <div class="og-surface-card">
      <div class="og-surface-top">
        <span class="og-s-badge" style="background:${color}">${escapeHtml(kindLabel)}</span>
        <span class="og-surface-small">${escapeHtml(ctx.node.session || '')}</span>
      </div>
      <b>${escapeHtml(ctx.node.label || '')}</b>
      <p>${escapeHtml(shortText(ctx.node.text || '', 120))}</p>
      <div class="og-surface-chips">${relationChips(ctx)}</div>
      ${renderAgendaPreview(ctx.agendas)}
      <a class="og-more" data-more>상세 고정 →</a>
    </div>`;
  quick.classList.add('show');
  quick.querySelector('[data-more]').onclick = () => {
    fixedNodeId = ctx.node.id;
    renderNodeSurface(ctx, 'fixed');
    applyFocus(ctx.node.id, true);
    quick.classList.remove('show');
    positionHoverCard(null);
  };
}

function positionHoverCard(anchor) {
  const quick = document.getElementById('og-quick');
  if (!quick || !anchor) {
    quick?.classList.remove('floating');
    if (quick) {
      quick.style.left = '';
      quick.style.top = '';
    }
    return;
  }
  const canvas = document.querySelector('.og-canvas');
  if (!canvas) return;
  quick.classList.add('floating');
  const margin = 14;
  const offset = 18;
  const width = quick.offsetWidth || 340;
  const height = quick.offsetHeight || 160;
  const canvasRect = canvas.getBoundingClientRect();
  let left = anchor.x + offset;
  let top = anchor.y + offset;
  if (left + width + margin > canvasRect.width) left = anchor.x - width - offset;
  if (top + height + margin > canvasRect.height) top = anchor.y - height - offset;
  left = Math.max(margin, Math.min(left, canvasRect.width - width - margin));
  top = Math.max(margin, Math.min(top, canvasRect.height - height - margin));
  quick.style.left = `${Math.round(left)}px`;
  quick.style.top = `${Math.round(top)}px`;
}

function showHoverSurface(ctx, anchor = null) {
  if (hoverHideTimer) clearTimeout(hoverHideTimer);
  renderNodeSurface(ctx, 'hover');
  positionHoverCard(anchor);
}

function hideHoverSurface() {
  if (fixedNodeId || quickHover) return;
  const quick = document.getElementById('og-quick');
  quick?.classList.remove('show');
  positionHoverCard(null);
  clearFocus();
}

function applyFocus(nodeId, pinned = false) {
  const ctx = buildNodeContext(nodeId);
  if (!ctx) return;
  const edgeIds = new Set(ctx.related.map(e => e.id));
  if (cy && curView === '2d') {
    cy.batch(() => {
      cy.elements().removeClass('focus-main focus-neighbor focus-edge focus-dim');
      cy.nodes().forEach(n => {
        if (n.data('isGroup')) return;
        if (n.id() === nodeId) n.addClass('focus-main');
        else if (ctx.neighborIds.has(n.id())) n.addClass('focus-neighbor');
        else n.addClass('focus-dim');
      });
      cy.edges().forEach(e => {
        if (edgeIds.has(e.id())) e.addClass('focus-edge');
        else e.addClass('focus-dim');
      });
    });
  }
  if (graph3d && graph3dData && curView === '3d') {
    graph3dData.nodes.forEach(n => {
      n._focus = n.id === nodeId ? 'main' : ctx.neighborIds.has(n.id) ? 'neighbor' : 'dim';
      n._pinned = pinned && n.id === nodeId;
    });
    graph3dData.links.forEach(l => {
      const id = l.id || `${l.source?.id || l.source}-${l.target?.id || l.target}-${l.rel}`;
      l._focus = edgeIds.has(id) ? 'edge' : 'dim';
    });
    try {
      graph3d.nodeColor(n => n._focus === 'dim' ? 'rgba(94,105,122,0.28)' : n.color)
        .nodeOpacity(0.96)
        .linkColor(l => l._focus === 'edge' ? (l.color || '#8bd3ff') : 'rgba(80,91,108,0.18)')
        .linkOpacity(l => l._focus === 'edge' ? 0.82 : 0.16)
        .linkWidth(l => l._focus === 'edge' ? (l.rel === 'opposes' ? 2.8 : 1.8) : 0.7)
        .refresh();
    } catch {}
  }
}

function clearFocus() {
  hoverNodeId = null;
  if (cy) cy.elements().removeClass('focus-main focus-neighbor focus-edge focus-dim');
  if (graph3d && graph3dData) {
    graph3dData.nodes.forEach(n => { n._focus = null; n._pinned = false; });
    graph3dData.links.forEach(l => { l._focus = null; });
    try {
      graph3d.nodeColor(n => n.color)
        .linkColor(l => l.color || 'rgba(148,163,184,.52)')
        .linkOpacity(0.42)
        .linkWidth(l => l.rel === 'opposes' ? 2.2 : l.rel === 'requiresCondition' ? 1.8 : 1.1)
        .refresh();
    } catch {}
  }
}

function renderCy() {
  if (graph3d) try { graph3d._destructor && graph3d._destructor(); } catch {}
  graph3d = null;
  graph3dData = null;
  document.getElementById('cy3d').style.display = 'none';
  document.getElementById('cy').style.display = '';
  if (cy) try { cy.destroy(); } catch {}
  ecApi = null;
  try { if (typeof cytoscapeFcose !== 'undefined') cytoscape.use(cytoscapeFcose); } catch {}
  try { if (typeof cytoscapeExpandCollapse !== 'undefined') cytoscape.use(cytoscapeExpandCollapse); } catch {}
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: { nodes: ALL_NODES, edges: ALL_EDGES },
    wheelSensitivity: 0.25, minZoom: 0.08, maxZoom: 3,
    style: buildCyStyle(OntologyChrome.getPalette()),
    layout: { name:'fcose', quality:'default', animate:false, randomize:true,
      nodeRepulsion:9000, idealEdgeLength:130, edgeElasticity:0.45,
      gravity:0.25, numIter:2500, packComponents:true, nodeSeparation:90 },
  });
  applyIsolated();
  buildKindChips();
  buildLegend();
  bindCyEvents();
  updateGroupBtns();
  cy.ready(() => setTimeout(() => {
    cy.fit(null, 40);
    if (groupMode !== 'none') applyGrouping(groupMode);  // URL ?group= 진입 시 즉시 묶기
    else if (physicsOn) applyPhysics();
  }, 300));
}

// 살아있는 드래그: cytoscape-cola 연속 물리엔진 (노드를 끌면 이웃 출렁)
function applyPhysics() {
  stopPhysics();
  if (!cy || !physicsOn) return;
  try { if (typeof cytoscapeCola !== 'undefined') cytoscape.use(cytoscapeCola); } catch {}
  try {
    colaLayout = cy.layout({ name:'cola', infinite:true, fit:false, animate:true,
      nodeSpacing: 6, edgeLength: 110, randomize:false, handleDisconnected:true,
      centerGraph:false });
    colaLayout.run();
  } catch (e) { colaLayout = null; }
}
function stopPhysics() {
  if (colaLayout) { try { colaLayout.stop(); } catch {} colaLayout = null; }
}
function togglePhysics() {
  physicsOn = !physicsOn;
  localStorage.setItem('og-physics', physicsOn ? '1' : '0');
  updatePhysicsBtn();
  if (physicsOn) applyPhysics(); else stopPhysics();
}
function updatePhysicsBtn() {
  const b = document.getElementById('og-physics');
  if (!b) return;
  b.textContent = physicsOn ? '⚛ 물리 ON' : '⚛ 물리 OFF';
  b.classList.toggle('on', physicsOn);
  b.setAttribute('aria-pressed', String(physicsOn));
}

// 발표 모드: 대형스크린·청중용 큰 글씨. 데이터 불변 — 스타일만(무손실).
function togglePresent() {
  presentMode = !presentMode;
  updatePresentBtn();
  updateUrl();
  if (cy) cy.style(buildCyStyle(OntologyChrome.getPalette())).update();
}
function updatePresentBtn() {
  const b = document.getElementById('og-present');
  if (!b) return;
  b.textContent = presentMode ? '🖥 발표 ON' : '🖥 발표';
  b.classList.toggle('on', presentMode);
  b.setAttribute('aria-pressed', String(presentMode));
}

// ─── A-3 완전성 보존 묶기(클러스터) ───────────────────────────────
// 무손실: 실제 노드/엣지는 절대 삭제하지 않는다. 합성 부모 노드(__grp_*)를 추가하고
// node.move({parent})로 실제 노드를 둥지에 넣을 뿐이다. 없음으로 돌아갈 때는
// 반드시 자식을 먼저 부모에서 빼낸 뒤(child.move({parent:null})) 합성 부모를 제거한다.
// (Cytoscape는 부모를 remove하면 자식까지 함께 삭제하므로 순서가 핵심)

// 그룹 키 산정 — 중립적 구조 기준만 사용(중요도 판단 금지)
function groupKeyOf(node, issueByNode) {
  if (groupMode === 'session') {
    const s = node.data('session');
    return s ? { key: 'sess__' + s, label: s } : { key: 'sess__기타', label: '기타/미분류' };
  }
  // issue 모드: raisesIssue 엣지로 연결된 Issue 아래에 둔다.
  //   규칙 — 자기 자신이 Issue면 자기 자신 그룹. 그 외엔 raisesIssue로 처음 연결된 Issue(node→Issue 또는 Issue→node).
  //   여러 Issue 연결 시 첫 번째만 사용. Issue 링크 없으면 '기타/미분류'.
  if (node.data('kind') === 'Issue') return { key: 'iss__' + node.id(), label: node.data('label') || node.id() };
  const iss = issueByNode[node.id()];
  if (iss) return { key: 'iss__' + iss.id, label: iss.label };
  return { key: 'iss__기타', label: '기타/미분류' };
}

// raisesIssue 엣지를 훑어 node.id → {연결된 첫 Issue} 매핑을 만든다(무손실 조회용, 그래프 변경 없음)
function buildIssueByNode() {
  const issueByNode = {};
  const kindOf = {}; const labelOf = {};
  ALL_NODES.forEach(n => { kindOf[n.data.id] = n.data.kind; labelOf[n.data.id] = n.data.label; });
  ALL_EDGES.forEach(e => {
    if (e.data.rel !== 'raisesIssue') return;
    const s = e.data.source, t = e.data.target;
    // Issue 쪽을 찾고, 반대편(비-Issue)을 그 Issue에 매핑(이미 있으면 첫 번째 유지)
    let issueId = null, otherId = null;
    if (kindOf[t] === 'Issue') { issueId = t; otherId = s; }
    else if (kindOf[s] === 'Issue') { issueId = s; otherId = t; }
    if (issueId && otherId && !issueByNode[otherId]) {
      issueByNode[otherId] = { id: issueId, label: labelOf[issueId] || issueId };
    }
  });
  return issueByNode;
}

function destroyEC() {
  if (ecApi) { try { ecApi.expandAll(); } catch {} ecApi = null; }
}

// 모든 자식을 부모에서 빼낸 뒤 합성 부모만 제거(실제 노드 손실 0 보장)
function clearGrouping() {
  if (!cy) return;
  destroyEC();
  cy.batch(() => {
    cy.nodes('[?isGroup]').forEach(p => {
      p.children().forEach(c => c.move({ parent: null }));
    });
    cy.remove(cy.nodes('[?isGroup]'));
  });
}

function applyGrouping(mode) {
  if (!cy) return;
  // 기존 그룹 해제(자식 보존) 후 재구성
  clearGrouping();
  if (mode === 'none') {
    // 무리 해제 → 정상 레이아웃 + 물리 복원(localStorage 선호 유지)
    runFcose(() => { if (physicsOn) applyPhysics(); });
    return;
  }
  // 묶기 모드에서는 물리 비활성(cola+compound 취약 — de-risk). 실행만 멈추고
  // physicsOn(=사용자 선호)은 보존 → 없음 복귀 시 자동 복원.
  stopPhysics();
  const issueByNode = mode === 'issue' ? buildIssueByNode() : null;
  cy.batch(() => {
    const seen = {};
    cy.nodes().forEach(n => {
      if (n.data('isGroup')) return;
      const { key, label } = groupKeyOf(n, issueByNode);
      const pid = '__grp_' + key;
      if (!seen[pid]) {
        seen[pid] = true;
        cy.add({ group: 'nodes', data: { id: pid, isGroup: true, label, is_public: true } });
      }
      n.move({ parent: pid });
    });
  });
  runFcose(() => registerEC());
}

function runFcose(done) {
  try {
    const lay = cy.layout({ name:'fcose', quality:'default', animate:false, randomize:true,
      nodeRepulsion:9000, idealEdgeLength:130, edgeElasticity:0.45,
      gravity:0.25, numIter:2500, packComponents:true, nodeSeparation:90 });
    lay.one('layoutstop', () => { cy.fit(null, 40); done && done(); });
    lay.run();
  } catch (e) { cy.fit(null, 40); done && done(); }
}

// expand-collapse: 그룹 부모 클릭 → 접기/펼치기(자식은 숨김 토글일 뿐 그래프에 잔존 → 무손실)
function registerEC() {
  if (!cy || typeof cy.expandCollapse !== 'function') return;
  try {
    ecApi = cy.expandCollapse({
      layoutBy: null, fisheye: false, animate: false, undoable: false,
      cueEnabled: true, expandCollapseCueSize: 14,
    });
  } catch (e) { ecApi = null; }
}

function setGroupMode(mode) {
  if (mode === groupMode) return;
  groupMode = mode;
  updateGroupBtns();
  updateUrl();
  applyGrouping(mode);
}

function updateGroupBtns() {
  document.querySelectorAll('#og-group-tog button').forEach(b => {
    b.classList.toggle('active', b.dataset.group === groupMode);
  });
  // 묶기 중에는 물리 버튼 비활성(cola+compound 취약)
  const pb = document.getElementById('og-physics');
  if (pb) {
    const grouped = groupMode !== 'none';
    pb.disabled = grouped;
    pb.style.opacity = grouped ? '0.4' : '';
    pb.style.pointerEvents = grouped ? 'none' : '';
    // 묶기 중 물리 실행만 멈춘다. physicsOn(저장된 선호)은 보존 → 버튼 표기·복원 일관.
    if (grouped) stopPhysics();
  }
}

function render3d() {
  stopPhysics();
  if (cy) try { cy.destroy(); } catch {}
  cy = null;
  document.getElementById('cy').style.display = 'none';
  document.getElementById('cy3d').style.display = '';
  // 노드/엣지를 3d-force-graph 포맷으로
  const palette = OntologyChrome.getPalette();
  graph3dData = {
    nodes: ALL_NODES.map((n, i) => ({
      id: n.data.id, label: n.data.label, kind: n.data.kind, text: n.data.text,
      kindKo: n.data.kindKo, cited: n.data.cited, session: n.data.session,
      cited_uids: n.data.cited_uids, synthesized: n.data.synthesized, deg: n.data.deg || 0,
      seed: i,
      color: palette[n.data.kind] || '#888',
    })),
    links: ALL_EDGES.map(e => ({
      id: e.data.id,
      source: e.data.source,
      target: e.data.target,
      label: e.data.relKo || relLabel(e.data.rel),
      rel: e.data.rel,
      color: REL_COLOR[e.data.rel] || 'rgba(148,163,184,.52)',
    }))
  };
  if (graph3d) try { graph3d._destructor && graph3d._destructor(); } catch {}
  graph3d = ForceGraph3D()(document.getElementById('cy3d'))
    .backgroundColor('#080c13')
    .nodeId('id')
    .nodeLabel(n => `${n.kindKo || n.kind} · ${n.label}`)
    .nodeColor(n => n._focus === 'dim' ? 'rgba(94,105,122,0.28)' : n.color)
    .nodeVal(n => 3.2 + Math.min(12, (n.deg || 0)) * 0.42)
    .nodeRelSize(4.1)
    .nodeResolution(14)
    .nodeOpacity(0.96)
    .linkLabel(l => `${l.label || relLabel(l.rel)}`)
    .linkColor(l => l._focus === 'edge' ? (l.color || '#8bd3ff') : (l.color || 'rgba(148,163,184,.52)'))
    .linkOpacity(0.42)
    .linkWidth(l => l.rel === 'opposes' ? 2.2 : l.rel === 'requiresCondition' ? 1.8 : 1.1)
    .linkDirectionalArrowLength(l => l.rel === 'opposes' ? 5 : 3.6)
    .linkDirectionalArrowRelPos(1)
    .linkDirectionalArrowColor(l => l.color || '#56C2E4')
    .linkDirectionalParticles(l => ['opposes','requiresCondition','hasEvidence'].includes(l.rel) ? 2 : (l.rel === 'supports' ? 1 : 0))
    .linkDirectionalParticleWidth(l => l.rel === 'opposes' ? 2.4 : 1.25)
    .linkDirectionalParticleColor(l => l.color || '#56C2E4')
    .onNodeHover(n => {
      document.getElementById('cy3d').style.cursor = n ? 'pointer' : 'default';
      if (fixedNodeId) return;
      if (!n) {
        document.getElementById('og-quick').classList.remove('show');
        positionHoverCard(null);
        clearFocus();
        return;
      }
      hoverNodeId = n.id;
      const ctx = buildNodeContext(n.id);
      if (!ctx) return;
      showHoverSurface(ctx, null);
      applyFocus(n.id);
    })
    .onNodeClick(n => {
      fixedNodeId = n.id;
      const ctx = buildNodeContext(n.id);
      if (!ctx) return;
      renderNodeSurface(ctx, 'fixed');
      applyFocus(n.id, true);
      document.getElementById('og-quick').classList.remove('show');
      positionHoverCard(null);
      const dist = 88;
      const len = Math.hypot(n.x || 0, n.y || 0, n.z || 0) || 1;
      const ratio = 1 + dist / len;
      graph3d.cameraPosition(
        { x: (n.x || 0) * ratio, y: (n.y || 0) * ratio, z: (n.z || 0) * ratio },
        n,
        850
      );
    })
    .onBackgroundClick(() => {
      fixedNodeId = null;
      document.getElementById('og-quick').classList.remove('show');
      positionHoverCard(null);
      document.getElementById('og-side').classList.add('collapsed');
      clearFocus();
    })
    .graphData(graph3dData);
  graph3d.d3Force('charge').strength(-145);
  graph3d.d3Force('link').distance(l => l.rel === 'hasEvidence' ? 34 : l.rel === 'opposes' ? 72 : 54);
  graph3d.d3Force('center').strength(0.34);
  graph3d.d3Force('ontology-radial', alpha => {
    for (const n of graph3dData.nodes) {
      const deg = Math.min(12, n.deg || 0);
      const target = n.deg ? 58 + (12 - deg) * 9 : 205;
      const angle = (n.seed * 2.399963229728653) % (Math.PI * 2);
      const zBand = ((n.seed % 9) - 4) * 10;
      n.vx += (Math.cos(angle) * target - (n.x || 0)) * 0.0055 * alpha;
      n.vy += (Math.sin(angle) * target - (n.y || 0)) * 0.0055 * alpha;
      n.vz += (zBand - (n.z || 0)) * 0.0045 * alpha;
    }
  });
  setTimeout(() => {
    try { graph3d.cameraPosition({ x: 0, y: -70, z: 560 }, { x: 0, y: 0, z: 0 }, 800); } catch {}
  }, 250);
}

function applyView(view) {
  curView = view;
  document.body.classList.toggle('view-3d', view === '3d');
  document.getElementById('og-view-2d').classList.toggle('active', view === '2d');
  document.getElementById('og-view-3d').classList.toggle('active', view === '3d');
  updateUrl();
  if (ALL_NODES.length) { if (view === '2d') renderCy(); else render3d(); }
}

function buildCyStyle(palette) {
  return [
    { selector:'node', style:{
        'background-color': n => palette[n.data('kind')] || '#888',
        'label':'data(label)', 'color':'#eef3f9', 'font-size': presentMode ? '26px' : '12px',
        'min-zoomed-font-size': 7,  /* 시맨틱 줌: 줌아웃 시 라벨 자동 숨김(노드는 점으로 유지·무손실) */
        'font-family':"'Noto Sans KR','Malgun Gothic',sans-serif", 'font-weight': presentMode ? 700 : 500,
        'text-wrap':'wrap','text-max-width': presentMode ? '220px' : '140px','text-valign':'bottom','text-margin-y':4,
        'text-outline-color':'#11151c','text-outline-width': presentMode ? 4 : 2.5,
        'width': n => (presentMode?34:22) + Math.min(n.data('deg')||0,8)*(presentMode?6:4),
        'height': n => (presentMode?34:22) + Math.min(n.data('deg')||0,8)*(presentMode?6:4),
        'border-width':2,'border-color':'#0d1118','shape':'ellipse','opacity':0.98,
    }},
    { selector:'node[?isOverviewLabel]', style:{
        'min-zoomed-font-size':0,
        'font-size': presentMode ? '28px' : '13px',
        'font-weight':800,
        'text-background-color':'#0b111a',
        'text-background-opacity':0.82,
        'text-background-padding':3,
        'text-outline-width':3,
        'z-index':20,
    }},
    { selector:'node[kind="Clause"]', style:{ 'shape':'round-rectangle','border-color':'#e9ecef','border-width':3 }},
    { selector:'node[kind="Decision"]', style:{ 'shape':'star','border-color':'#ffa94d','border-width':3 }},
    { selector:'node[?synthesized]', style:{ 'shape':'round-diamond','border-style':'dashed','border-color':'#ff8787' }},
    { selector:'edge', style:{
        'width':1.8, 'line-color':'#6b7890', 'target-arrow-color':'#6b7890',
        'target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':1,
        'label':'data(relKo)','font-size': presentMode ? '18px' : '10px','min-zoomed-font-size': 9,'color':'#d3dbe8',
        'font-family':"'Noto Sans KR','Malgun Gothic',sans-serif",
        'text-rotation':'autorotate','text-background-color':'#11151c',
        'text-background-opacity':0.85,'text-background-padding':2,'opacity':0.82,
    }},
    { selector:'edge[?opposes]', style:{
        'line-color':'#ff6b6b','target-arrow-color':'#ff6b6b','width':2.6 }},
    // A-3 묶기 합성 부모(컨테이너) — 라벨 달린 둥근 사각, 반투명 배경, 자식이 안에 들도록 패딩
    { selector:'node[?isGroup]', style:{
        'shape':'round-rectangle','background-color':'#12b886','background-opacity':0.10,
        'border-width':2,'border-color':'#12b886','border-opacity':0.8,
        'label':'data(label)','color':'#63e6be','text-valign':'top','text-halign':'center',
        'text-margin-y':-4,'font-weight':700,'font-size': presentMode ? '30px' : '15px',
        'min-zoomed-font-size': presentMode ? 3 : 6,'text-outline-color':'#11151c','text-outline-width': presentMode ? 4 : 2.5,
        'text-max-width': presentMode ? '320px' : '220px','text-wrap':'wrap',
        'padding': presentMode ? '34px' : '24px',
    }},
    // 접힌 그룹(expand-collapse) — 단일 노드처럼 강조(여전히 모든 자식 대표 = 무손실)
    { selector:'node[?isGroup].cy-expand-collapse-collapsed-node', style:{
        'background-opacity':0.85,'shape':'round-rectangle','border-width':3,
    }},
    { selector:'node.non-public', style:{ 'opacity':0.25,'border-style':'dashed','border-color':'#9fcfff' }},
    { selector:'.dim', style:{ 'opacity':0.10 }},
    { selector:'node.focus-dim', style:{ 'opacity':0.10 }},
    { selector:'edge.focus-dim', style:{ 'opacity':0.08 }},
    { selector:'node.focus-neighbor', style:{ 'opacity':0.92,'border-width':3,'border-color':'#8bd3ff' }},
    { selector:'node.focus-main', style:{ 'opacity':1,'border-width':5,'border-color':'#63e6be','overlay-color':'#63e6be','overlay-opacity':0.18,'overlay-padding':8 }},
    { selector:'edge.focus-edge', style:{ 'opacity':0.92,'width':3.2,'line-color':'#8bd3ff','target-arrow-color':'#8bd3ff' }},
    { selector:'.hidden', style:{ 'display':'none' }},
  ];
}

function buildKindChips() {
  const present = {}; cy.nodes().forEach(n => present[n.data('kind')] = true);
  const palette = OntologyChrome.getPalette();
  const kf = document.getElementById('og-kind-filters'); kf.innerHTML = '';
  curFilter.kind = new Set(Object.keys(OntologyChrome.KIND_DEFAULT));
  Object.keys(OntologyChrome.KIND_DEFAULT).forEach(k => {
    if (!present[k]) { curFilter.kind.delete(k); return; }
    const c = document.createElement('span'); c.className = 'og-chip'; c.dataset.kind = k;
    c.innerHTML = `<span class="og-dot" style="background:${palette[k]}"></span>${OntologyChrome.KIND_KO[k] || k}`;
    c.onclick = () => {
      c.classList.toggle('off');
      if (curFilter.kind.has(k)) curFilter.kind.delete(k); else curFilter.kind.add(k);
      applyFilter();
    };
    kf.appendChild(c);
  });
}

function buildLegend() {
  const lang = OntologyChrome.getLang();
  const palette = OntologyChrome.getPalette();
  const el = document.getElementById('og-legend');
  const present = {};
  cy && cy.nodes().forEach(n => present[n.data('kind')] = true);
  el.innerHTML = Object.keys(OntologyChrome.KIND_DEFAULT).filter(k => present[k]).map(k =>
    `<span class="og-item"><span class="og-sw" style="background:${palette[k]}"></span>${lang === 'ko' ? (OntologyChrome.KIND_KO[k] || k) : k}</span>`
  ).join('') + `<span class="og-item"><span class="og-ln"></span>관계</span><span class="og-item"><span class="og-ln og-opp"></span>반대·우려</span>`;
}

function bindCyEvents() {
  cy.on('mouseover', 'node', (evt) => {
    if (fixedNodeId) return;
    const n = evt.target;
    if (n.data('isGroup')) return;
    hoverNodeId = n.id();
    const ctx = buildNodeContext(n.id());
    if (!ctx) return;
    showHoverSurface(ctx, evt.renderedPosition);
    applyFocus(n.id());
  });
  cy.on('mousemove', 'node', (evt) => {
    if (fixedNodeId) return;
    positionHoverCard(evt.renderedPosition);
  });
  cy.on('mouseout', 'node', () => {
    if (fixedNodeId) return;
    hoverHideTimer = setTimeout(hideHoverSurface, 90);
  });
  cy.on('tap', 'node', (evt) => {
    const n = evt.target;
    // 합성 그룹 부모 클릭 → 접기/펼치기(무손실). 상세 패널 대신.
    if (n.data('isGroup')) {
      if (ecApi) {
        try { if (ecApi.isCollapsible(n)) ecApi.collapse(n); else ecApi.expand(n); } catch {}
      }
      return;
    }
    fixedNodeId = n.id();
    const ctx = buildNodeContext(n.id());
    if (!ctx) return;
    renderNodeSurface(ctx, 'fixed');
    applyFocus(n.id(), true);
    document.getElementById('og-quick').classList.remove('show');
    positionHoverCard(null);
  });
  cy.on('tap', (evt) => {
    if (evt.target === cy) {
      fixedNodeId = null;
      document.getElementById('og-quick').classList.remove('show');
      positionHoverCard(null);
      document.getElementById('og-side').classList.add('collapsed');
      clearFocus();
    }
  });
}

function applyIsolated() {
  if (!cy) return;
  cy.batch(() => cy.nodes().forEach(n => {
    if (n.data('isGroup')) return;
    if (n.data('isolated')) { if (isoShown) n.removeClass('hidden'); else n.addClass('hidden'); }
  }));
}

function applyFilter() {
  if (!cy) return;
  cy.batch(() => {
    cy.nodes().forEach(n => {
      if (n.data('isGroup')) return;  // 합성 부모는 필터 대상 아님
      const k = n.data('kind');
      const visibleByKind = curFilter.kind.has(k);
      const visibleByIsolation = isoShown || !n.data('isolated');
      if (visibleByKind && visibleByIsolation) n.removeClass('hidden'); else n.addClass('hidden');
    });
    cy.edges().forEach(e => {
      if (e.source().hasClass('hidden') || e.target().hasClass('hidden')) e.addClass('hidden');
      else e.removeClass('hidden');
    });
  });
  const visN = cy.nodes(':visible').filter(n => !n.data('isGroup')).length, visE = cy.edges(':visible').length;
  OntologyChrome.updateMeta(`표시 ${visN}/${ALL_NODES.length} · 엣지 ${visE}/${ALL_EDGES.length}`);
}

function bindGlobalEvents() {
  const quick = document.getElementById('og-quick');
  quick.onmouseenter = () => {
    quickHover = true;
    if (hoverHideTimer) clearTimeout(hoverHideTimer);
  };
  quick.onmouseleave = () => {
    quickHover = false;
    hoverHideTimer = setTimeout(hideHoverSurface, 70);
  };
  document.getElementById('og-view-2d').onclick = () => applyView('2d');
  document.getElementById('og-view-3d').onclick = () => applyView('3d');
  document.getElementById('og-physics').onclick = togglePhysics;
  updatePhysicsBtn();
  document.getElementById('og-present').onclick = togglePresent;
  updatePresentBtn();
  document.querySelectorAll('#og-group-tog button').forEach(b => {
    b.onclick = () => setGroupMode(b.dataset.group);
  });
  updateGroupBtns();
  document.getElementById('og-toggle-iso').onclick = (e) => {
    isoShown = !isoShown;
    e.target.textContent = isoShown ? '고립 노드 숨기기' : '고립 노드 보이기';
    applyIsolated();
  };
  document.getElementById('og-zin').onclick = () => cy && cy.zoom({ level: cy.zoom() * 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
  document.getElementById('og-zout').onclick = () => cy && cy.zoom({ level: cy.zoom() / 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
  document.getElementById('og-zfit').onclick = () => cy && cy.fit(null, 30);
  document.getElementById('og-search').oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!cy) return;
    cy.batch(() => cy.nodes().forEach(n => {
      if (n.data('isGroup')) return;  // 합성 부모는 검색 dim 제외
      const m = !q || (n.data('label') || '').toLowerCase().includes(q) || (n.data('text') || '').toLowerCase().includes(q);
      if (m) n.removeClass('dim'); else n.addClass('dim');
    }));
  };
  document.getElementById('og-assets-btn').onclick = () => {
    if (currentMetaAssets) renderSourceAssets(currentMetaAssets);
  };
  document.getElementById('og-settings-btn').onclick = () => {
    OntologyChrome.openSettings(({ palette, lang }) => {
      if (cy) { cy.style(buildCyStyle(palette)).update(); }
      buildLegend();
      document.querySelectorAll('#og-kind-filters .og-chip').forEach(c => {
        const k = c.dataset.kind;
        c.querySelector('.og-dot').style.background = palette[k];
        c.lastChild.textContent = lang === 'ko' ? (OntologyChrome.KIND_KO[k] || k) : k;
      });
    });
  };
  document.getElementById('og-poll-now').onclick = () => loadSource(curSource);
  document.getElementById('og-poll-interval').onchange = () => {
    const meta = sources.sources.find(s => s.id === curSource);
    if (meta) setupPolling(meta);
  };
}

function setupPolling(meta) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const sec = parseInt(document.getElementById('og-poll-interval').value, 10) || 0;
  if (sec > 0) pollTimer = setInterval(() => loadSource(meta.id), sec * 1000);
  const stat = document.getElementById('og-poll-status');
  stat.textContent = `갱신 ${new Date().toLocaleTimeString('ko')}`;
  stat.classList.add('fresh');
  setTimeout(() => stat.classList.remove('fresh'), 1500);
}

if (['127.0.0.1', 'localhost'].includes(location.hostname)) {
  window.__ontologyGraphDebug = {
    getCy: () => cy,
    getGraph3d: () => graph3d,
    getGraph3dData: () => graph3dData,
    buildNodeContext,
    renderNodeSurface,
    applyFocus,
    clearFocus,
  };
}
