<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>숙의 온톨로지 — 통합 그래프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/_ontology-chrome/chrome.css?v=20260623-zoomctl">
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
<script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script src="https://unpkg.com/webcola@3.4.0/WebCola/cola.min.js"></script>
<script src="https://unpkg.com/cytoscape-cola@2.5.1/cytoscape-cola.js"></script>
<script src="https://unpkg.com/cytoscape-expand-collapse@4.1.1/cytoscape-expand-collapse.js"></script>
<script src="https://unpkg.com/3d-force-graph"></script>
<style>
  .og-source-sel{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#9aa7b8}
  .og-source-sel select{background:#222c3a;border:1px solid #2c3848;color:#e8edf4;border-radius:5px;padding:5px 10px;font-size:12px;font-family:inherit;min-width:200px}
  .og-view-tog{display:inline-flex;gap:3px;background:#222c3a;border:1px solid #2c3848;border-radius:5px;padding:2px}
  .og-view-tog button{background:transparent;border:0;color:#9aa7b8;padding:4px 10px;font-size:11px;cursor:pointer;border-radius:3px;font-family:inherit}
  .og-view-tog button.active{background:#1c7ed6;color:#fff}
  .og-poll-ctl{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#9aa7b8}
  .og-poll-ctl select{background:#222c3a;border:1px solid #2c3848;color:#e8edf4;border-radius:5px;padding:3px 7px;font-size:11px}
  .og-poll-status{font-size:11px;color:#9aa7b8}
  .og-poll-status.fresh{color:#51cf66}
  #og-physics{cursor:pointer;white-space:nowrap}
  #og-physics.on{background:#1c7ed6;color:#fff;border-color:#1c7ed6}
  #og-present{cursor:pointer;white-space:nowrap}
  #og-present.on{background:#7048e8;color:#fff;border-color:#7048e8}
  /* A-3 묶기(클러스터) 토글 — 기존 .og-view-tog 톤 일관 */
  .og-group-tog{display:inline-flex;align-items:center;gap:3px;background:#222c3a;border:1px solid #2c3848;border-radius:5px;padding:2px}
  .og-group-tog .og-grp-lbl{font-size:11px;color:#9aa7b8;padding:0 6px 0 4px;white-space:nowrap}
  .og-group-tog button{background:transparent;border:0;color:#9aa7b8;padding:4px 10px;font-size:11px;cursor:pointer;border-radius:3px;font-family:inherit;white-space:nowrap}
  .og-group-tog button.active{background:#12b886;color:#fff}
  .og-3d-only{display:none}
  body.view-3d .og-3d-only{display:inline-flex}
  body.view-3d .og-2d-only{display:none}
</style>
</head>
<body>
<div id="og-app">
  <div class="og-controls">
    <div class="og-source-sel">
      <span class="og-lbl">소스</span>
      <select id="og-source"></select>
    </div>
    <div class="og-view-tog">
      <button id="og-view-2d" class="active">📐 2D</button>
      <button id="og-view-3d">🌐 3D</button>
    </div>
    <button class="og-btn og-2d-only" id="og-physics" title="물리 시뮬레이션 — 노드를 끌면 연결 노드가 함께 움직입니다" aria-pressed="false">⚛ 물리 OFF</button>
    <button class="og-btn" id="og-present" title="발표 모드 — 큰 글씨(대형 스크린·청중용)" aria-pressed="false">🖥 발표</button>
    <div class="og-group-tog og-2d-only" id="og-group-tog" title="묶기 — 무손실 클러스터(노드/엣지 보존, 부모 안에 둥지). 그룹을 클릭하면 접기/펼치기">
      <span class="og-grp-lbl">묶기</span>
      <button data-group="none" class="active">없음</button>
      <button data-group="issue">쟁점</button>
      <button data-group="session">세션</button>
    </div>
    <input id="og-search" type="search" placeholder="검색…" autocomplete="off" style="width:160px">
    <button class="og-btn" id="og-assets-btn" style="display:none" title="합의·권고와 DQI 품질 지표를 읽기전용으로 봅니다">합의·DQI</button>
    <span class="og-spacer"></span>
    <div class="og-poll-ctl" id="og-poll-ui" style="display:none">
      <span>🔄</span>
      <select id="og-poll-interval">
        <option value="0">수동</option>
        <option value="15" selected>15s</option>
        <option value="30">30s</option>
        <option value="60">1m</option>
      </select>
      <button class="og-btn" id="og-poll-now">즉시</button>
      <span class="og-poll-status" id="og-poll-status">—</span>
    </div>
    <a class="og-icon-btn" id="og-guide-link" href="guide/" target="_blank" rel="noopener" title="사용설명서 — 이 그래프를 만든 이유·노드/관계 뜻·사용법" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">📖</a>
    <button class="og-icon-btn" id="og-settings-btn" title="설정">⚙</button>
  </div>
  <div class="og-controls og-2d-only" id="og-filter-bar" style="border-top:1px solid var(--og-line)">
    <span class="og-lbl">종류</span>
    <div class="og-filters" id="og-kind-filters"></div>
    <span class="og-spacer"></span>
    <button class="og-btn" id="og-toggle-iso">고립 노드 보이기</button>
  </div>
  <div class="og-body">
    <div class="og-canvas">
      <div id="cy" style="width:100%;height:100%"></div>
      <div id="cy3d" style="width:100%;height:100%;display:none;background:#0a0a0f"></div>
      <div class="og-zoomctl og-2d-only">
        <button id="og-zin">＋</button>
        <button id="og-zout">−</button>
        <button id="og-zfit">⊡</button>
      </div>
      <div class="og-quick" id="og-quick"></div>
    </div>
    <aside class="og-side collapsed" id="og-side">
      <div class="og-s-empty">노드를 클릭하면 상세가 표시됩니다.</div>
    </aside>
  </div>
  <div class="og-footer">
    <div class="og-leg" id="og-legend"></div>
    <span class="og-spacer"></span>
    <span style="font-size:11px;color:#5c6878" id="og-footer-note">LLM 추출 · 인간 검증 전</span>
  </div>
</div>

<script type="module">
import { OntologyChrome } from '/_ontology-chrome/chrome.js';

const PREFIX_META = {
  'A_t21':{day:'6/14',jo:'A'},'A_t22':{day:'6/14',jo:'A'},'A_t23':{day:'6/14',jo:'A'},
  'B_t1':{day:'6/13',jo:'B'},'B_t2':{day:'6/14',jo:'B'},'B_t3':{day:'6/14',jo:'B'},
  'OA_t1':{day:'6/13',jo:'A'},'OB_t1':{day:'6/13',jo:'B'},'OZ_t1':{day:'6/13',jo:'통합'},
  'DA_t2':{day:'6/14',jo:'A'},'DB_t2':{day:'6/14',jo:'B'},'DZ_t2':{day:'6/14',jo:'통합'},
};

let cy, graph3d, ALL_NODES = [], ALL_EDGES = [], curFilter = { kind:new Set(Object.keys(OntologyChrome.KIND_DEFAULT)) };
let isoShown = false;
let sources = null, curSource = null, curView = '2d', pollTimer = null;
let currentMetaAssets = null;
let physicsOn = localStorage.getItem('og-physics') === '1', colaLayout = null;
let presentMode = false;  // 발표(대형스크린) 모드 — 공유 가능 뷰 상태라 URL 파라미터
// A-3 묶기(클러스터): 'none' | 'issue' | 'session'. 공유 가능 뷰 상태라 URL 파라미터(?group=).
// 무손실 원칙 — 그룹은 합성 부모 노드로만 표현하고 실제 노드/엣지는 절대 삭제하지 않는다.
let groupMode = 'none', ecApi = null;

const params = new URLSearchParams(location.search);

(async function init() {
  sources = await fetch('sources.json').then(r => r.json());
  curSource = params.get('source') || sources.default;
  curView = params.get('view') || '2d';
  presentMode = params.get('mode') === 'present';
  groupMode = ['issue','session'].includes(params.get('group')) ? params.get('group') : 'none';
  buildSourceDropdown();
  OntologyChrome.init({ activeId: 'workshop', title: '숙의 온톨로지', meta: '로딩 중…' });
  bindGlobalEvents();
  if (curView === '3d') applyView('3d');
  loadSource(curSource);
})();

function buildSourceDropdown() {
  const sel = document.getElementById('og-source');
  const byCat = {};
  for (const s of sources.sources) (byCat[s.category] = byCat[s.category] || []).push(s);
  sel.innerHTML = '';
  for (const cat of Object.keys(sources.categories)) {
    const list = byCat[cat] || [];
    if (!list.length) continue;
    const og = document.createElement('optgroup');
    og.label = sources.categories[cat];
    for (const s of list) {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.label;
      if (s.id === curSource) o.selected = true;
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
  sel.onchange = () => {
    curSource = sel.value;
    updateUrl();
    loadSource(curSource);
  };
}

function updateUrl() {
  const p = new URLSearchParams();
  p.set('source', curSource);
  if (curView !== '2d') p.set('view', curView);
  if (presentMode) p.set('mode', 'present');
  if (groupMode !== 'none') p.set('group', groupMode);
  history.replaceState(null, '', '?' + p.toString());
}

async function loadSource(srcId) {
  const meta = sources.sources.find(s => s.id === srcId);
  if (!meta) return;
  // view 지원 여부
  const supportsView = meta.supportsView || ['2d'];
  document.getElementById('og-view-3d').disabled = !supportsView.includes('3d');
  if (curView === '3d' && !supportsView.includes('3d')) applyView('2d');

  // polling UI: live category만
  const isLive = meta.category === 'live';
  document.getElementById('og-poll-ui').style.display = isLive ? '' : 'none';

  const payload = await fetch(meta.data + '?_=' + Date.now()).then(r => r.json());
  const { elements, meta: mt } = payload;
  ALL_NODES = elements.nodes;
  ALL_EDGES = elements.edges;

  // A-6: 기존 자산(합의·DQI)이 데이터에 있으면 읽기전용으로만 노출 (없으면 무표시 — 방어적)
  const _extra = [];
  if (Array.isArray(mt.recommendations) && mt.recommendations.length) _extra.push(`합의·권고 ${mt.recommendations.length}건`);
  if (mt.quality) _extra.push('DQI 지표');
  OntologyChrome.updateMeta(`노드 ${mt.counts.nodes || ALL_NODES.length} · 엣지 ${mt.counts.edges || ALL_EDGES.length}${_extra.length ? ' · ' + _extra.join(' · ') : ''}`);
  OntologyChrome.updateAdvisory(mt.advisory_notice || (isLive ? '🔴 LIVE 미검증 초안 · 시민 비노출' : ''));
  updateAssetsButton(mt);

  // 헤더 pill 색 동기화 (LIVE면 빨강)
  const pill = document.querySelector('.og-pill');
  if (pill) {
    pill.classList.toggle('og-live', !!mt.live);
    pill.textContent = mt.live ? 'LIVE' : 'advisory · uid 역추적';
  }

  if (curView === '2d') renderCy();
  else render3d();

  if (isLive) setupPolling(meta);
  else { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
}

function fmtTime(sec) {
  if (sec == null || Number.isNaN(Number(sec))) return '—';
  const n = Math.max(0, Math.round(Number(sec)));
  const m = Math.floor(n / 60);
  const s = n % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function fmtSpan(span) {
  if (!span || (span.start == null && span.end == null)) return '시간 미상';
  return `${fmtTime(span.start)}~${fmtTime(span.end)}`;
}

function qualityLabel(q) {
  if (!q) return '';
  const label = q.validity_label || q.label || 'quality';
  if (label === 'official-5indicators') return 'DQI 공식 5지표';
  if (label === 'exploratory-text-metric') return 'DQI 탐색적 지표';
  return `DQI ${label}`;
}

function renderSourceAssets(mt) {
  const recs = Array.isArray(mt.recommendations) ? mt.recommendations : [];
  const quality = mt.quality || null;
  const side = document.getElementById('og-side');
  if (!side || (!recs.length && !quality)) {
    if (side && !side.querySelector('.og-s-label')) side.classList.add('collapsed');
    return;
  }
  const q = quality ? `
    <div class="og-s-sec">
      <h4>DQI 품질 지표</h4>
      <div class="og-s-text">
        <b>${qualityLabel(quality)}</b><br>
        ${quality.reliability ? `신뢰도 검토 있음<br>` : ''}
        ${quality.limitations_notice ? `${escapeHtml(quality.limitations_notice)}` : '읽기전용 메타데이터입니다. 공식 판단은 모더레이터 검토 후 확정됩니다.'}
      </div>
    </div>` : '';
  const r = recs.length ? `
    <div class="og-s-sec">
      <h4>권고안 추적</h4>
      <div class="og-s-rel">
        ${recs.map((rec, i) => `
          <div class="og-r">
            <b>${escapeHtml(rec.title || rec.rec_id || `권고안 ${i + 1}`)}</b><br>
            <span style="color:#9aa7b8">논의 시각 ${escapeHtml(fmtSpan(rec.time_span))}</span>
            ${Array.isArray(rec.minority) && rec.minority.length ? `<br><span style="color:#ffd43b">소수의견 ${rec.minority.length}건 별도 보존</span>` : ''}
            ${Array.isArray(rec.was_derived_from) ? `<br><span style="color:#9aa7b8">출처 ${rec.was_derived_from.length}건</span>` : ''}
          </div>`).join('')}
      </div>
    </div>` : '';
  side.innerHTML = `
    <button class="og-s-close" data-side-close>✕</button>
    <div>
      <span class="og-s-badge" style="background:#7048e8;color:#fff">읽기전용</span>
      <div class="og-s-label">합의·DQI 자산</div>
      ${q}${r}
    </div>`;
  side.classList.remove('collapsed');
  side.querySelector('[data-side-close]').onclick = () => side.classList.add('collapsed');
}

function updateAssetsButton(mt) {
  currentMetaAssets = mt || null;
  const btn = document.getElementById('og-assets-btn');
  if (!btn) return;
  const recs = Array.isArray(mt?.recommendations) ? mt.recommendations : [];
  const hasAssets = recs.length > 0 || !!mt?.quality;
  btn.style.display = hasAssets ? '' : 'none';
  btn.textContent = recs.length && mt?.quality ? `합의·DQI ${recs.length}` :
    recs.length ? `합의 ${recs.length}` : 'DQI';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderCy() {
  if (graph3d) try { graph3d._destructor && graph3d._destructor(); } catch {}
  document.getElementById('cy3d').style.display = 'none';
  document.getElementById('cy').style.display = '';
  if (cy) try { cy.destroy(); } catch {}
  ecApi = null;
  try { if (typeof cytoscapeFcose !== 'undefined') cytoscape.use(cytoscapeFcose); } catch {}
  try { if (typeof cytoscapeExpandCollapse !== 'undefined') cytoscape.use(cytoscapeExpandCollapse); } catch {}
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: { nodes: ALL_NODES, edges: ALL_EDGES },
    wheelSensitivity: 0.25, minZoom: 0.08, maxZoom: 3,
    style: buildCyStyle(OntologyChrome.getPalette()),
    layout: { name:'fcose', quality:'default', animate:false, randomize:true,
      nodeRepulsion:9000, idealEdgeLength:130, edgeElasticity:0.45,
      gravity:0.25, numIter:2500, packComponents:true, nodeSeparation:90 },
  });
  applyIsolated();
  buildKindChips();
  buildLegend();
  bindCyEvents();
  updateGroupBtns();
  cy.ready(() => setTimeout(() => {
    cy.fit(null, 40);
    if (groupMode !== 'none') applyGrouping(groupMode);  // URL ?group= 진입 시 즉시 묶기
    else if (physicsOn) applyPhysics();
  }, 300));
}

// 살아있는 드래그: cytoscape-cola 연속 물리엔진 (노드를 끌면 이웃 출렁)
function applyPhysics() {
  stopPhysics();
  if (!cy || !physicsOn) return;
  try { if (typeof cytoscapeCola !== 'undefined') cytoscape.use(cytoscapeCola); } catch {}
  try {
    colaLayout = cy.layout({ name:'cola', infinite:true, fit:false, animate:true,
      nodeSpacing: 6, edgeLength: 110, randomize:false, handleDisconnected:true,
      centerGraph:false });
    colaLayout.run();
  } catch (e) { colaLayout = null; }
}
function stopPhysics() {
  if (colaLayout) { try { colaLayout.stop(); } catch {} colaLayout = null; }
}
function togglePhysics() {
  physicsOn = !physicsOn;
  localStorage.setItem('og-physics', physicsOn ? '1' : '0');
  updatePhysicsBtn();
  if (physicsOn) applyPhysics(); else stopPhysics();
}
function updatePhysicsBtn() {
  const b = document.getElementById('og-physics');
  if (!b) return;
  b.textContent = physicsOn ? '⚛ 물리 ON' : '⚛ 물리 OFF';
  b.classList.toggle('on', physicsOn);
  b.setAttribute('aria-pressed', String(physicsOn));
}

// 발표 모드: 대형스크린·청중용 큰 글씨. 데이터 불변 — 스타일만(무손실).
function togglePresent() {
  presentMode = !presentMode;
  updatePresentBtn();
  updateUrl();
  if (cy) cy.style(buildCyStyle(OntologyChrome.getPalette())).update();
}
function updatePresentBtn() {
  const b = document.getElementById('og-present');
  if (!b) return;
  b.textContent = presentMode ? '🖥 발표 ON' : '🖥 발표';
  b.classList.toggle('on', presentMode);
  b.setAttribute('aria-pressed', String(presentMode));
}

// ─── A-3 완전성 보존 묶기(클러스터) ───────────────────────────────
// 무손실: 실제 노드/엣지는 절대 삭제하지 않는다. 합성 부모 노드(__grp_*)를 추가하고
// node.move({parent})로 실제 노드를 둥지에 넣을 뿐이다. 없음으로 돌아갈 때는
// 반드시 자식을 먼저 부모에서 빼낸 뒤(child.move({parent:null})) 합성 부모를 제거한다.
// (Cytoscape는 부모를 remove하면 자식까지 함께 삭제하므로 순서가 핵심)

// 그룹 키 산정 — 중립적 구조 기준만 사용(중요도 판단 금지)
function groupKeyOf(node, issueByNode) {
  if (groupMode === 'session') {
    const s = node.data('session');
    return s ? { key: 'sess__' + s, label: s } : { key: 'sess__기타', label: '기타/미분류' };
  }
  // issue 모드: raisesIssue 엣지로 연결된 Issue 아래에 둔다.
  //   규칙 — 자기 자신이 Issue면 자기 자신 그룹. 그 외엔 raisesIssue로 처음 연결된 Issue(node→Issue 또는 Issue→node).
  //   여러 Issue 연결 시 첫 번째만 사용. Issue 링크 없으면 '기타/미분류'.
  if (node.data('kind') === 'Issue') return { key: 'iss__' + node.id(), label: node.data('label') || node.id() };
  const iss = issueByNode[node.id()];
  if (iss) return { key: 'iss__' + iss.id, label: iss.label };
  return { key: 'iss__기타', label: '기타/미분류' };
}

// raisesIssue 엣지를 훑어 node.id → {연결된 첫 Issue} 매핑을 만든다(무손실 조회용, 그래프 변경 없음)
function buildIssueByNode() {
  const issueByNode = {};
  const kindOf = {}; const labelOf = {};
  ALL_NODES.forEach(n => { kindOf[n.data.id] = n.data.kind; labelOf[n.data.id] = n.data.label; });
  ALL_EDGES.forEach(e => {
    if (e.data.rel !== 'raisesIssue') return;
    const s = e.data.source, t = e.data.target;
    // Issue 쪽을 찾고, 반대편(비-Issue)을 그 Issue에 매핑(이미 있으면 첫 번째 유지)
    let issueId = null, otherId = null;
    if (kindOf[t] === 'Issue') { issueId = t; otherId = s; }
    else if (kindOf[s] === 'Issue') { issueId = s; otherId = t; }
    if (issueId && otherId && !issueByNode[otherId]) {
      issueByNode[otherId] = { id: issueId, label: labelOf[issueId] || issueId };
    }
  });
  return issueByNode;
}

function destroyEC() {
  if (ecApi) { try { ecApi.expandAll(); } catch {} ecApi = null; }
}

// 모든 자식을 부모에서 빼낸 뒤 합성 부모만 제거(실제 노드 손실 0 보장)
function clearGrouping() {
  if (!cy) return;
  destroyEC();
  cy.batch(() => {
    cy.nodes('[?isGroup]').forEach(p => {
      p.children().forEach(c => c.move({ parent: null }));
    });
    cy.remove(cy.nodes('[?isGroup]'));
  });
}

function applyGrouping(mode) {
  if (!cy) return;
  // 기존 그룹 해제(자식 보존) 후 재구성
  clearGrouping();
  if (mode === 'none') {
    // 무리 해제 → 정상 레이아웃 + 물리 복원(localStorage 선호 유지)
    runFcose(() => { if (physicsOn) applyPhysics(); });
    return;
  }
  // 묶기 모드에서는 물리 비활성(cola+compound 취약 — de-risk). 실행만 멈추고
  // physicsOn(=사용자 선호)은 보존 → 없음 복귀 시 자동 복원.
  stopPhysics();
  const issueByNode = mode === 'issue' ? buildIssueByNode() : null;
  cy.batch(() => {
    const seen = {};
    cy.nodes().forEach(n => {
      if (n.data('isGroup')) return;
      const { key, label } = groupKeyOf(n, issueByNode);
      const pid = '__grp_' + key;
      if (!seen[pid]) {
        seen[pid] = true;
        cy.add({ group: 'nodes', data: { id: pid, isGroup: true, label } });
      }
      n.move({ parent: pid });
    });
  });
  runFcose(() => registerEC());
}

function runFcose(done) {
  try {
    const lay = cy.layout({ name:'fcose', quality:'default', animate:false, randomize:true,
      nodeRepulsion:9000, idealEdgeLength:130, edgeElasticity:0.45,
      gravity:0.25, numIter:2500, packComponents:true, nodeSeparation:90 });
    lay.one('layoutstop', () => { cy.fit(null, 40); done && done(); });
    lay.run();
  } catch (e) { cy.fit(null, 40); done && done(); }
}

// expand-collapse: 그룹 부모 클릭 → 접기/펼치기(자식은 숨김 토글일 뿐 그래프에 잔존 → 무손실)
function registerEC() {
  if (!cy || typeof cy.expandCollapse !== 'function') return;
  try {
    ecApi = cy.expandCollapse({
      layoutBy: null, fisheye: false, animate: false, undoable: false,
      cueEnabled: true, expandCollapseCueSize: 14,
    });
  } catch (e) { ecApi = null; }
}

function setGroupMode(mode) {
  if (mode === groupMode) return;
  groupMode = mode;
  updateGroupBtns();
  updateUrl();
  applyGrouping(mode);
}

function updateGroupBtns() {
  document.querySelectorAll('#og-group-tog button').forEach(b => {
    b.classList.toggle('active', b.dataset.group === groupMode);
  });
  // 묶기 중에는 물리 버튼 비활성(cola+compound 취약)
  const pb = document.getElementById('og-physics');
  if (pb) {
    const grouped = groupMode !== 'none';
    pb.disabled = grouped;
    pb.style.opacity = grouped ? '0.4' : '';
    pb.style.pointerEvents = grouped ? 'none' : '';
    // 묶기 중 물리 실행만 멈춘다. physicsOn(저장된 선호)은 보존 → 버튼 표기·복원 일관.
    if (grouped) stopPhysics();
  }
}

function render3d() {
  stopPhysics();
  if (cy) try { cy.destroy(); } catch {}
  document.getElementById('cy').style.display = 'none';
  document.getElementById('cy3d').style.display = '';
  // 노드/엣지를 3d-force-graph 포맷으로
  const palette = OntologyChrome.getPalette();
  const data3d = {
    nodes: ALL_NODES.map(n => ({
      id: n.data.id, label: n.data.label, kind: n.data.kind, text: n.data.text,
      kindKo: n.data.kindKo, cited: n.data.cited, session: n.data.session,
      synthesized: n.data.synthesized, deg: n.data.deg || 0,
      color: palette[n.data.kind] || '#888',
    })),
    links: ALL_EDGES.map(e => ({ source: e.data.source, target: e.data.target, label: e.data.relKo || e.data.rel }))
  };
  if (graph3d) try { graph3d._destructor && graph3d._destructor(); } catch {}
  graph3d = ForceGraph3D()(document.getElementById('cy3d'))
    .backgroundColor('#0a0a0f')
    .nodeId('id').nodeLabel(n => n.label).nodeColor(n => n.color)
    .nodeVal(n => 3 + Math.min(8, (n.deg || 0)) * 0.8)
    .nodeRelSize(5).nodeResolution(12).nodeOpacity(0.95)
    .linkColor(() => 'rgba(189,197,205,0.62)').linkWidth(1.4)
    .linkDirectionalArrowLength(3).linkDirectionalArrowRelPos(1)
    .linkDirectionalArrowColor(() => '#56C2E4')
    .onNodeClick(n => OntologyChrome.showQuick(
      document.getElementById('og-quick'),
      document.getElementById('og-side'),
      n
    ))
    .onBackgroundClick(() => {
      OntologyChrome.hideQuick(document.getElementById('og-quick'));
      document.getElementById('og-side').classList.add('collapsed');
    })
    .graphData(data3d);
}

function applyView(view) {
  curView = view;
  document.body.classList.toggle('view-3d', view === '3d');
  document.getElementById('og-view-2d').classList.toggle('active', view === '2d');
  document.getElementById('og-view-3d').classList.toggle('active', view === '3d');
  updateUrl();
  if (ALL_NODES.length) { if (view === '2d') renderCy(); else render3d(); }
}

function buildCyStyle(palette) {
  return [
    { selector:'node', style:{
        'background-color': n => palette[n.data('kind')] || '#888',
        'label':'data(label)', 'color':'#eef3f9', 'font-size': presentMode ? '26px' : '12px',
        'min-zoomed-font-size': 7,  /* 시맨틱 줌: 줌아웃 시 라벨 자동 숨김(노드는 점으로 유지·무손실) */
        'font-family':"'Noto Sans KR','Malgun Gothic',sans-serif", 'font-weight': presentMode ? 700 : 500,
        'text-wrap':'wrap','text-max-width': presentMode ? '220px' : '140px','text-valign':'bottom','text-margin-y':4,
        'text-outline-color':'#11151c','text-outline-width': presentMode ? 4 : 2.5,
        'width': n => (presentMode?34:22) + Math.min(n.data('deg')||0,8)*(presentMode?6:4),
        'height': n => (presentMode?34:22) + Math.min(n.data('deg')||0,8)*(presentMode?6:4),
        'border-width':2,'border-color':'#0d1118','shape':'ellipse',
    }},
    { selector:'node[kind="Clause"]', style:{ 'shape':'round-rectangle','border-color':'#e9ecef','border-width':3 }},
    { selector:'node[kind="Decision"]', style:{ 'shape':'star','border-color':'#ffa94d','border-width':3 }},
    { selector:'node[?synthesized]', style:{ 'shape':'round-diamond','border-style':'dashed','border-color':'#ff8787' }},
    { selector:'edge', style:{
        'width':1.6, 'line-color':'#54637a', 'target-arrow-color':'#54637a',
        'target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':1,
        'label':'data(relKo)','font-size': presentMode ? '18px' : '10px','min-zoomed-font-size': 9,'color':'#aeb9c8',
        'font-family':"'Noto Sans KR','Malgun Gothic',sans-serif",
        'text-rotation':'autorotate','text-background-color':'#11151c',
        'text-background-opacity':0.85,'text-background-padding':2,
    }},
    { selector:'edge[?opposes]', style:{
        'line-color':'#ff6b6b','target-arrow-color':'#ff6b6b','width':2.6 }},
    // A-3 묶기 합성 부모(컨테이너) — 라벨 달린 둥근 사각, 반투명 배경, 자식이 안에 들도록 패딩
    { selector:'node[?isGroup]', style:{
        'shape':'round-rectangle','background-color':'#12b886','background-opacity':0.10,
        'border-width':2,'border-color':'#12b886','border-opacity':0.8,
        'label':'data(label)','color':'#63e6be','text-valign':'top','text-halign':'center',
        'text-margin-y':-4,'font-weight':700,'font-size': presentMode ? '30px' : '15px',
        'min-zoomed-font-size': 6,'text-outline-color':'#11151c','text-outline-width': presentMode ? 4 : 2.5,
        'text-max-width': presentMode ? '320px' : '220px','text-wrap':'wrap',
        'padding': presentMode ? '34px' : '24px',
    }},
    // 접힌 그룹(expand-collapse) — 단일 노드처럼 강조(여전히 모든 자식 대표 = 무손실)
    { selector:'node[?isGroup].cy-expand-collapse-collapsed-node', style:{
        'background-opacity':0.85,'shape':'round-rectangle','border-width':3,
    }},
    { selector:'.dim', style:{ 'opacity':0.10 }},
    { selector:'.hidden', style:{ 'display':'none' }},
    { selector:'node[!is_public]', style:{ 'opacity':0.25,'border-style':'dashed','border-color':'#9fcfff' }},
  ];
}

function buildKindChips() {
  const present = {}; cy.nodes().forEach(n => present[n.data('kind')] = true);
  const palette = OntologyChrome.getPalette();
  const kf = document.getElementById('og-kind-filters'); kf.innerHTML = '';
  curFilter.kind = new Set(Object.keys(OntologyChrome.KIND_DEFAULT));
  Object.keys(OntologyChrome.KIND_DEFAULT).forEach(k => {
    if (!present[k]) { curFilter.kind.delete(k); return; }
    const c = document.createElement('span'); c.className = 'og-chip'; c.dataset.kind = k;
    c.innerHTML = `<span class="og-dot" style="background:${palette[k]}"></span>${OntologyChrome.KIND_KO[k] || k}`;
    c.onclick = () => {
      c.classList.toggle('off');
      if (curFilter.kind.has(k)) curFilter.kind.delete(k); else curFilter.kind.add(k);
      applyFilter();
    };
    kf.appendChild(c);
  });
}

function buildLegend() {
  const lang = OntologyChrome.getLang();
  const palette = OntologyChrome.getPalette();
  const el = document.getElementById('og-legend');
  const present = {};
  cy && cy.nodes().forEach(n => present[n.data('kind')] = true);
  el.innerHTML = Object.keys(OntologyChrome.KIND_DEFAULT).filter(k => present[k]).map(k =>
    `<span class="og-item"><span class="og-sw" style="background:${palette[k]}"></span>${lang === 'ko' ? (OntologyChrome.KIND_KO[k] || k) : k}</span>`
  ).join('') + `<span class="og-item"><span class="og-ln"></span>관계</span><span class="og-item"><span class="og-ln og-opp"></span>반대·우려</span>`;
}

function bindCyEvents() {
  cy.on('tap', 'node', (evt) => {
    const n = evt.target;
    // 합성 그룹 부모 클릭 → 접기/펼치기(무손실). 상세 패널 대신.
    if (n.data('isGroup')) {
      if (ecApi) {
        try { if (ecApi.isCollapsible(n)) ecApi.collapse(n); else ecApi.expand(n); } catch {}
      }
      return;
    }
    OntologyChrome.showQuick(document.getElementById('og-quick'), document.getElementById('og-side'), n.data());
  });
  cy.on('tap', (evt) => {
    if (evt.target === cy) {
      OntologyChrome.hideQuick(document.getElementById('og-quick'));
      document.getElementById('og-side').classList.add('collapsed');
    }
  });
}

function applyIsolated() {
  if (!cy) return;
  cy.batch(() => cy.nodes().forEach(n => {
    if (n.data('isGroup')) return;
    if (n.data('isolated')) { if (isoShown) n.removeClass('hidden'); else n.addClass('hidden'); }
  }));
}

function applyFilter() {
  if (!cy) return;
  cy.batch(() => {
    cy.nodes().forEach(n => {
      if (n.data('isGroup')) return;  // 합성 부모는 필터 대상 아님
      const k = n.data('kind');
      if (curFilter.kind.has(k)) n.removeClass('hidden'); else n.addClass('hidden');
    });
    cy.edges().forEach(e => {
      if (e.source().hasClass('hidden') || e.target().hasClass('hidden')) e.addClass('hidden');
      else e.removeClass('hidden');
    });
  });
  const visN = cy.nodes(':visible').filter(n => !n.data('isGroup')).length, visE = cy.edges(':visible').length;
  OntologyChrome.updateMeta(`표시 ${visN}/${ALL_NODES.length} · 엣지 ${visE}/${ALL_EDGES.length}`);
}

function bindGlobalEvents() {
  document.getElementById('og-view-2d').onclick = () => applyView('2d');
  document.getElementById('og-view-3d').onclick = () => applyView('3d');
  document.getElementById('og-physics').onclick = togglePhysics;
  updatePhysicsBtn();
  document.getElementById('og-present').onclick = togglePresent;
  updatePresentBtn();
  document.querySelectorAll('#og-group-tog button').forEach(b => {
    b.onclick = () => setGroupMode(b.dataset.group);
  });
  updateGroupBtns();
  document.getElementById('og-toggle-iso').onclick = (e) => {
    isoShown = !isoShown;
    e.target.textContent = isoShown ? '고립 노드 숨기기' : '고립 노드 보이기';
    applyIsolated();
  };
  document.getElementById('og-zin').onclick = () => cy && cy.zoom({ level: cy.zoom() * 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
  document.getElementById('og-zout').onclick = () => cy && cy.zoom({ level: cy.zoom() / 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
  document.getElementById('og-zfit').onclick = () => cy && cy.fit(null, 30);
  document.getElementById('og-search').oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!cy) return;
    cy.batch(() => cy.nodes().forEach(n => {
      if (n.data('isGroup')) return;  // 합성 부모는 검색 dim 제외
      const m = !q || (n.data('label') || '').toLowerCase().includes(q) || (n.data('text') || '').toLowerCase().includes(q);
      if (m) n.removeClass('dim'); else n.addClass('dim');
    }));
  };
  document.getElementById('og-assets-btn').onclick = () => {
    if (currentMetaAssets) renderSourceAssets(currentMetaAssets);
  };
  document.getElementById('og-settings-btn').onclick = () => {
    OntologyChrome.openSettings(({ palette, lang }) => {
      if (cy) { cy.style(buildCyStyle(palette)).update(); }
      buildLegend();
      document.querySelectorAll('#og-kind-filters .og-chip').forEach(c => {
        const k = c.dataset.kind;
        c.querySelector('.og-dot').style.background = palette[k];
        c.lastChild.textContent = lang === 'ko' ? (OntologyChrome.KIND_KO[k] || k) : k;
      });
    });
  };
  document.getElementById('og-poll-now').onclick = () => loadSource(curSource);
  document.getElementById('og-poll-interval').onchange = () => {
    const meta = sources.sources.find(s => s.id === curSource);
    if (meta) setupPolling(meta);
  };
}

function setupPolling(meta) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const sec = parseInt(document.getElementById('og-poll-interval').value, 10) || 0;
  if (sec > 0) pollTimer = setInterval(() => loadSource(meta.id), sec * 1000);
  const stat = document.getElementById('og-poll-status');
  stat.textContent = `갱신 ${new Date().toLocaleTimeString('ko')}`;
  stat.classList.add('fresh');
  setTimeout(() => stat.classList.remove('fresh'), 1500);
}
</script>
