<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>0704 선정 의제 보드</title>
<style>
  :root{--bg:#f5f7fb;--ink:#0f172a;--muted:#667085;--line:#d9e2ee;--a:#2563eb;--b:#0f766e;--paper:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 12% 0%,rgba(37,99,235,.10),transparent 34%),linear-gradient(180deg,#f8fafc 0%,var(--bg) 100%);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 22px;background:rgba(255,255,255,.86);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
  h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:0}
  .meta{font-size:13px;color:var(--muted);font-weight:900}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  a,button{height:36px;border:1px solid #111827;border-radius:8px;background:#111827;color:#fff;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900;font-size:13px;font-family:inherit;cursor:pointer}
  button.secondary,a.secondary{background:#eef2f7;color:#111827;border-color:#d9e2ee}
  main{padding:18px;display:grid;gap:18px}
  .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .stat{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.82);padding:16px;box-shadow:0 12px 32px rgba(15,23,42,.07)}
  .stat b{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
  .stat span{font-size:42px;font-weight:950;line-height:1;color:#111827}
  .board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .lane{border:1px solid rgba(15,23,42,.10);border-radius:18px;background:rgba(255,255,255,.76);overflow:hidden;box-shadow:0 18px 52px rgba(15,23,42,.08)}
  .lane-head{padding:22px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(248,250,252,.70))}
  .lane-head .eyebrow{font-size:13px;font-weight:950;color:var(--lane);letter-spacing:.08em}
  .lane-head h2{margin:7px 0 0;font-size:44px;line-height:1}
  .cards{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
  .note{position:relative;min-height:182px;border:2px solid var(--lane);border-radius:12px;background:var(--note);box-shadow:0 14px 34px rgba(15,23,42,.12);padding:16px 16px 52px;transform:rotate(var(--rot));word-break:keep-all;overflow-wrap:break-word}
  .note:nth-child(3n+1){--rot:-.35deg}.note:nth-child(3n+2){--rot:.25deg}.note:nth-child(3n){--rot:-.12deg}
  .num{position:absolute;top:12px;right:14px;color:var(--lane);font-size:18px;font-weight:950}
  .text{font-size:29px;font-weight:950;line-height:1.17;padding-right:30px}
  .note-meta{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;min-height:25px;border-radius:999px;background:rgba(15,23,42,.08);padding:0 9px;color:#475467;font-size:12px;font-weight:900}
  .chip.group{background:var(--lane);color:#fff}
  .empty{padding:28px;color:var(--muted);font-weight:900}
  @media (max-width:900px){header{display:block}.actions{margin-top:12px}.summary,.board{grid-template-columns:1fr}main{padding:12px}.cards{padding:12px}.text{font-size:24px;line-height:1.18}.lane-head{padding:18px}.lane-head h2{font-size:38px}}
</style>
</head>
<body>
<header>
  <div>
    <div class="meta" id="meta">A/B 실시간 Sheet 의제 입력</div>
    <h1>투표 대상 선정 의제 4개</h1>
  </div>
  <div class="actions">
    <a href="/0704-admin/">관리자</a>
    <a class="secondary" href="/0704-admin/live-sheet-agendas-print.pdf">의제 PDF</a>
    <button class="secondary" type="button" onclick="location.reload()">새로고침</button>
  </div>
</header>
<main>
  <section class="summary">
    <div class="stat"><b>선정 의제</b><span id="total-count">0</span></div>
    <div class="stat"><b>A조 선정</b><span id="a-count">0</span></div>
    <div class="stat"><b>B조 선정</b><span id="b-count">0</span></div>
  </section>
  <section class="board" id="board"></section>
</main>
<script>
const DATA_URL = '/agenda-board-0704/data.json';
const SHEET_ID = '1aA0h2wUuKydj-RC7ZeD-bI-9C-7f1MQhe_78t7pA4JQ';
const SHEETS = ['A조 의제입력', 'B조 의제입력'];
const POLL_MS = 5000;
const SELECTED_NOTE_RE = /선정|1위|2위|1순위|2순위/;
const SHOW_ALL = new URLSearchParams(location.search).get('view') === 'all';
function esc(s){return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function parseCsv(text){
  const rows=[]; let row=[]; let cell=''; let quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(ch === '"' && quoted && next === '"'){ cell+='"'; i++; continue; }
    if(ch === '"'){ quoted=!quoted; continue; }
    if(ch === ',' && !quoted){ row.push(cell); cell=''; continue; }
    if((ch === '\n' || ch === '\r') && !quoted){
      if(ch === '\r' && next === '\n') i++;
      row.push(cell); if(row.some(v=>v!=='')) rows.push(row); row=[]; cell=''; continue;
    }
    cell+=ch;
  }
  row.push(cell); if(row.some(v=>v!=='')) rows.push(row);
  return rows;
}
async function fetchSheetRows(sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
  const csv = await fetch(url, {cache:'no-store'}).then(r => {
    if(!r.ok) throw new Error(`${sheetName} HTTP ${r.status}`);
    return r.text();
  });
  const rows = parseCsv(csv);
  const header = rows.shift() || [];
  const idx = name => header.indexOf(name);
  const speakerIdx = idx('발언자') >= 0 ? idx('발언자') : idx('입력자');
  const numberIdx = idx('번호'), groupIdx = idx('조'), textIdx = idx('의제 후보'), noteIdx = idx('비고');
  return rows.map(row => ({
    number: row[numberIdx] || '',
    group: row[groupIdx] || sheetName.slice(0, 2),
    text: row[textIdx] || '',
    note: row[noteIdx] || '',
    speaker: row[speakerIdx] || '',
    kind: 'agenda'
  })).filter(item => item.text.trim() && (SHOW_ALL || SELECTED_NOTE_RE.test(item.note)));
}
async function loadAgendas(){
  try {
    const rows = (await Promise.all(SHEETS.map(fetchSheetRows))).flat();
    return {agendas: rows, generatedAt: new Date().toISOString(), source: 'google_sheet'};
  } catch (err) {
    const data = await fetch(DATA_URL + '?_=' + Date.now(), {cache:'no-store'}).then(r => r.json());
    return {agendas: (data.agendas || []).filter(item => SHOW_ALL || SELECTED_NOTE_RE.test(item.note || '')), generatedAt: data.generatedAt, source: 'fallback_json', error: err.message};
  }
}
function renderNote(item){
  const note = item.note ? `<span class="chip">${esc(item.note)}</span>` : '';
  const speaker = item.speaker || item.writer;
  const speakerChip = speaker ? `<span class="chip">발언자 ${esc(speaker)}</span>` : '';
  return `<article class="note">
    <div class="num">${esc(item.number || '')}</div>
    <div class="text">${esc(item.text)}</div>
    <div class="note-meta"><span class="chip group">${esc(item.group)}</span>${note}${speakerChip}</div>
  </article>`;
}
function renderLane(group, rows){
  const isA = group === 'A조';
  return `<section class="lane" style="--lane:${isA ? '#2563eb' : '#0f766e'};--note:${isA ? '#eff6ff' : '#ecfdf5'}">
    <div class="lane-head">
      <div class="eyebrow">SELECTED AGENDA</div>
      <h2>${esc(group)}</h2>
    </div>
    <div class="cards">${rows.length ? rows.map(renderNote).join('') : '<div class="empty">선정된 의제가 없습니다.</div>'}</div>
  </section>`;
}
async function load(){
  const data = await loadAgendas();
  const agendas = data.agendas || [];
  const aRows = agendas.filter(item => item.group === 'A조');
  const bRows = agendas.filter(item => item.group === 'B조');
  document.title = SHOW_ALL ? '0704 조별 의제 후보 보드' : '0704 선정 의제 보드';
  document.querySelector('h1').textContent = SHOW_ALL ? '투표 전 조별 의제 후보 17개' : '투표 대상 선정 의제 4개';
  document.querySelector('#total-count').previousElementSibling.textContent = SHOW_ALL ? '전체 후보' : '선정 의제';
  document.querySelector('#a-count').previousElementSibling.textContent = SHOW_ALL ? 'A조 후보' : 'A조 선정';
  document.querySelector('#b-count').previousElementSibling.textContent = SHOW_ALL ? 'B조 후보' : 'B조 선정';
  document.getElementById('total-count').textContent = agendas.length;
  document.getElementById('a-count').textContent = aRows.length;
  document.getElementById('b-count').textContent = bRows.length;
  const source = data.source === 'google_sheet' ? 'Google Sheet 직접 연결' : 'JSON fallback';
  document.getElementById('meta').textContent = `마지막 Sheet 확인 ${new Date(data.generatedAt).toLocaleString('ko-KR')} · ${source} · 5초 자동 갱신`;
  document.getElementById('board').innerHTML = renderLane('A조', aRows) + renderLane('B조', bRows);
}
load().catch(err => {
  document.getElementById('board').innerHTML = `<div class="empty">의제 데이터를 불러오지 못했습니다: ${esc(err.message)}</div>`;
});
setInterval(load, POLL_MS);
</script>
</body>
</html>
