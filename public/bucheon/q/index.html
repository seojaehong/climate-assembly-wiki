<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>분임 질문 · 100인 공론장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../ui.css">
<style>
  /* 연구진·전문가용 — 휴대폰 세로, 인쇄 A4 */
  body { font-size: 19px; }
  header.band { position: sticky; top: 0; z-index: 1; }
  header.band .in { padding: 14px 16px 12px; }
  header.band h1 { font-size: 20px; margin: 0; }
  .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--band-ink-2); margin-top: 4px; }
  .meta .err { color: #ffb4a8; font-weight: 700; }
  main { padding: 14px 16px 40px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--paper); border-radius: var(--r-panel); padding: 16px 16px 18px; margin-bottom: 12px; box-shadow: 0 4px 0 var(--edge); }
  .card .no { font-size: 15px; font-weight: 800; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
  .card .no b { min-width: 1.4em; }
  .card .no .tag { font-size: 16px; }
  .card .q { margin: 8px 0 0; font-weight: 700; font-size: 20px; line-height: 1.5; letter-spacing: -.01em; }
  .card .also { margin: 10px 0 0; font-size: 16px; color: var(--ink-2); padding-left: 12px; box-shadow: inset 3px 0 0 var(--rule); }
  .empty { color: var(--ink-3); text-align: center; margin-top: 48px; }
  .tools { margin-top: 18px; }
  .tools .primary { font-size: 17px; }
  .printhead { display: none; }
  @media screen and (min-width: 1000px) {
    :root { --wrap: 1240px; }
    main { max-width: var(--wrap); padding: 20px 24px 40px; }
    header.band .in { padding-left: 24px; padding-right: 24px; }
    header.band h1 { font-size: 24px; }
    #list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
    #list .card { margin: 0; }
    #list .empty { grid-column: 1 / -1; }
    .card .q { font-size: 21px; }
    .tools { max-width: 360px; margin-left: auto; }
  }
  @media print {
    @page { size: A4; margin: 14mm 14mm 16mm; }
    header, .tools { display: none; }
    body { font-size: 15pt; color: #000; background: #fff; }
    main { max-width: none; padding: 0; }
    .printhead { display: block; font-size: 12pt; border-bottom: 1.5pt solid #000; padding-bottom: 4pt; margin-bottom: 10pt; }
    .card { background: none; border-bottom: 0.8pt solid #999; border-radius: 0; padding: 8pt 0; margin: 0; break-inside: avoid; padding: 6pt 0; }
    .card .no { color: #000; font-size: 13pt; }
    .card .no .tag { font-size: 13pt; background: none; border: 1.2pt solid #000; padding: 0 4pt; }
    .card .q { font-size: 14pt; font-weight: 600; }
    .card .also { font-size: 12.5pt; color: #333; box-shadow: none; padding-left: 0; }
  }
</style>
</head>
<body>
<header class="band"><div class="in">
  <h1>분임 질문</h1>
  <div class="meta"><span id="count"></span><span id="stamp"></span></div>
</div></header>
<main>
  <div class="printhead" id="printhead"></div>
  <div id="list"></div>
  <div class="tools"><button id="print" class="primary" type="button">A4로 인쇄</button></div>
</main>
<script src="../lib.js"></script>
<script>
(function () {
  var el = BF.el, list = document.getElementById('list'), failures = 0, last = '';

  function render(d) {
    var cards = BF.questionCards(d.questions, false);
    document.getElementById('count').textContent = '질문 ' + d.questions.length + '/' + d.teams + '개 조';
    document.getElementById('printhead').textContent = '일하는 시민 100인 공론장 · 분임 질문 (' + BF.hhmm(d.now) + ' 기준, ' + cards.length + '건)';
    var sig = JSON.stringify(cards.map(function (c) { return [c.label, c.lead.q1, c.lead.q2, c.members.map(function (m) { return m.q1; })]; }));
    if (sig === last) return;   // 바뀐 것이 없으면 다시 그리지 않는다(읽는 위치 유지)
    last = sig;
    list.innerHTML = '';
    if (!cards.length) { list.appendChild(el('p', { class: 'empty', text: '아직 들어온 질문이 없습니다. 잠시 뒤 자동으로 나타납니다.' })); return; }
    cards.forEach(function (c, i) {
      var box = el('div', { class: 'card' }, [
        el('div', { class: 'no' }, [el('b', { text: (i + 1) + '.' }), ' ', el('span', { class: 'tag', text: c.label })]),
        el('p', { class: 'q', text: c.lead.q1 })
      ]);
      if (c.lead.q2) box.appendChild(el('p', { class: 'also', text: c.lead.q2 }));
      c.members.forEach(function (m) { box.appendChild(el('p', { class: 'also', text: m.team_no + '조: ' + m.q1 })); });
      list.appendChild(box);
    });
  }

  function load() {
    BF.rpc('bucheon_questions_public', {}).then(function (d) {
      failures = 0;
      var s = document.getElementById('stamp'); s.textContent = '갱신 ' + BF.hhmm(d.now); s.className = '';
      render(d);
    }).catch(function () {
      failures++;
      var s = document.getElementById('stamp'); s.textContent = '연결 끊김 — 마지막 목록 표시 중'; s.className = 'err';
    });
  }

  document.getElementById('print').onclick = function () { window.print(); };
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
