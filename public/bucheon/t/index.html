<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>조별 입력 · 100인 공론장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../ui.css">
<style>
  /* 퍼실리테이터 입력 — 휴대폰 */
  main { width: 100%; max-width: 640px; margin: 0 auto; padding: 16px 16px 150px; }
  .band .team { font-size: 32px; padding: 2px 12px; }
  .band .row1 { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .band .row1 h1 { margin: 0; }
  .band .team:empty { display: none; }
  .tabs { display: flex; gap: 4px; margin: 0 0 16px; background: var(--paper); padding: 4px; border-radius: 12px; }
  .tabs button { flex: 1; min-width: 0; padding: 12px 8px; font-size: 16px; font-weight: 700; border-radius: 9px;
                 border: 0; background: transparent; color: var(--ink-3); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--cobalt); color: var(--on-cobalt); }
  .card { background: var(--paper); border-radius: var(--r-panel); padding: 16px; margin-bottom: 12px; }
  label.f { display: block; font-weight: 800; font-size: 17px; margin: 0 0 4px; }
  .help { color: var(--ink-2); font-size: 15px; margin: 0 0 10px; }
  textarea, input[type=text] { width: 100%; font-size: 17px; padding: 12px 14px; border-radius: var(--r-ctl);
             border: 2px solid var(--field-line); background: var(--paper); color: var(--ink); }
  textarea:focus, input[type=text]:focus { border-color: var(--cobalt); background: var(--paper); outline: none; }
  textarea { min-height: 110px; resize: vertical; }
  #code { font-size: 26px; font-weight: 800; letter-spacing: .2em; text-align: center; }
  .count { text-align: right; font-size: 13px; color: var(--ink-3); margin-top: 4px; }
  h2 { font-size: 18px; margin: 24px 0 10px; font-weight: 800; }
  .pt { font-weight: 700; margin-bottom: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button { min-width: 0; min-height: 46px; padding: 8px 6px; font-size: 15px; border-radius: 9px; border: 2px solid var(--rule);
                background: var(--paper); color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--cobalt); color: var(--on-cobalt); border-color: var(--cobalt); font-weight: 800; }
  .rank button.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px;
                margin-bottom: 6px; border-radius: 12px; border: 2px solid transparent; background: var(--paper); color: var(--ink); font-size: 16px; cursor: pointer; }
  .rank .badge { flex: 0 0 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800;
                 background: var(--ground); color: var(--ink-3); }
  .rank button.on .badge { background: var(--cobalt); color: var(--on-cobalt); }
  .rank button.on { border-color: var(--cobalt); }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .row .help { margin: 0; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         box-shadow: 0 -1px 0 var(--rule); }
  .bar .in { max-width: var(--wrap, 640px); margin: 0 auto; }
  /* 노트북·태블릿: 폭을 넓히고 칸을 나눈다 */
  @media (min-width: 900px) {
    :root { --wrap: 1180px; }
    main { max-width: var(--wrap); padding: 24px 24px 150px; }
    .band .in { padding-left: 24px; padding-right: 24px; }
    .tabs { max-width: 520px; }
    #gate { max-width: 480px; margin: 48px auto; }
    .split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .split textarea { min-height: 220px; }
    .terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
    .terms .card { margin: 0; }
    .rank { columns: 2; column-gap: 12px; }
    .rank button.item { break-inside: avoid; }
    .bar { padding-left: 24px; padding-right: 24px; }
    .bar .in { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: center; }
    .bar .msg { margin: 0; }
  }
  .hidden { display: none; }
</style>
</head>
<body>
<header class="band"><div class="in">
  <p class="what">일하는 시민 100인 공론장</p>
  <div class="row1"><span class="tag team" id="teamTitle"></span><h1>퍼실리테이터 입력</h1></div>
</div></header>
<main id="app">
  <div id="gate" class="card hidden">
    <label class="f" for="code">조 코드</label>
    <p class="help">받은 링크로 들어오면 자동으로 채워집니다.</p>
    <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="6" placeholder="6자리">
    <p class="msg err" id="gateMsg"></p>
    <button class="primary" id="enter">들어가기</button>
  </div>
  <div id="main" class="hidden">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab1" aria-selected="true">세션1 · 질문</button>
      <button role="tab" id="tab2" aria-selected="false">세션2 · 결과 사진</button>
    </div>
    <section id="s1"></section>
    <section id="s2" class="hidden"></section>
  </div>
</main>
<div class="bar hidden" id="bar"><div class="in">
  <p class="msg" id="msg"></p>
  <button class="primary" id="submit">제출</button>
</div></div>
<script src="../lib.js"></script>
<script>
(function () {
  var el = BF.el, st = BF.store;
  var params = new URLSearchParams(location.search);
  var code = (params.get('code') || st('bf_code') || '').toUpperCase().trim();
  var team = null, policies = [], tab = 1;
  var draft = { q1: '', q2: '', note: '', terms: {}, ranking: [], top: '', long: '', split: '' };

  function saveDraft() { st('bf_draft_' + code, draft); }
  function msg(t, kind) { var m = document.getElementById('msg'); m.textContent = t || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }

  function showGate(err) {
    document.getElementById('gate').classList.remove('hidden');
    document.getElementById('main').classList.add('hidden');
    document.getElementById('bar').classList.add('hidden');
    document.getElementById('code').value = code;
    document.getElementById('gateMsg').textContent = err || '';
  }

  function join() {
    if (!code) return showGate('');
    BF.rpc('bucheon_join', { p_code: code }).then(function (d) {
      team = d.team_no; policies = d.policies || [];
      st('bf_code', code);
      var saved = st('bf_draft_' + code);
      if (saved) draft = Object.assign(draft, saved);
      if (d.question && !saved) { draft.q1 = d.question.q1; draft.q2 = d.question.q2; draft.note = d.question.note || ''; }
      if (d.priority && !(saved && saved.ranking && saved.ranking.length)) {
        draft.terms = d.priority.terms || {}; draft.ranking = d.priority.ranking || [];
        draft.top = d.priority.reason_top || ''; draft.long = d.priority.reason_long || ''; draft.split = d.priority.split || '';
      }
      // 과제 목록이 바뀌었으면 사라진 과제는 걸러낸다
      var ids = policies.map(function (p) { return p.id; });
      draft.ranking = draft.ranking.filter(function (id) { return ids.indexOf(id) >= 0; });
      Object.keys(draft.terms).forEach(function (k) { if (ids.indexOf(+k) < 0) delete draft.terms[k]; });
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      document.getElementById('bar').classList.remove('hidden');
      document.getElementById('teamTitle').textContent = team + '조';
      document.title = team + '조 · 100인 공론장';
      var stamp = [];
      if (d.question) stamp.push('세션1 제출 ' + BF.hhmm(d.question.updated_at));
      msg(stamp.join(' · '), stamp.length ? 'ok' : '');
      render();
    }).catch(function (e) { showGate(e.message); });
  }

  function area(id, label, help, max, key, required) {
    var t = el('textarea', { id: id, maxlength: String(max) });
    t.value = draft[key] || '';
    var c = el('div', { class: 'count', text: t.value.length + ' / ' + max });
    t.addEventListener('input', function () { draft[key] = t.value; c.textContent = t.value.length + ' / ' + max; saveDraft(); });
    return el('div', { class: 'card' }, [
      el('label', { class: 'f', for: id, text: label + (required ? '' : ' (선택)') }),
      help ? el('p', { class: 'help', text: help }) : null, t, c
    ]);
  }

  function renderS1() {
    var s = document.getElementById('s1'); s.innerHTML = '';
    var g = el('div', { class: 'split' }); s.appendChild(g);
    g.appendChild(area('q1', '우리 조 질문', '스티커를 가장 많이 받은 질문 (카톡 단체방이 안 될 때 여기에)', 500, 'q1', true));
    g.appendChild(area('note', '참고', '질문 배경 등 연구진이 알면 좋을 내용', 1000, 'note', false));
  }

  // 세션2 결과는 여기서 입력하지 않는다(진행계획 4.0). 템플릿 사진을 단체방에 올리면 본부가 읽어 스크린에 낸다.
  function renderS2() {
    var s = document.getElementById('s2'); s.innerHTML = '';
    s.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: '세션2 결과는 사진으로 보내 주세요' }),
      el('p', { text: '① 단체방에 「' + team + '조결과」라고 먼저 적고' }),
      el('p', { text: '② 바로 이어서 템플릿 사진 두 장(우선순위 선정 · 아이디어)을 올립니다.' }),
      el('p', { class: 'help', text: '글씨가 화면을 꽉 채우게, 정면에서, 그림자 없이 찍어 주세요. 다시 찍어 올리면 새 사진으로 바뀝니다. 본부가 확인한 뒤 스크린에 나갑니다.' })
    ]));
  }

  function render() {
    document.getElementById('tab1').setAttribute('aria-selected', String(tab === 1));
    document.getElementById('tab2').setAttribute('aria-selected', String(tab === 2));
    document.getElementById('s1').classList.toggle('hidden', tab !== 1);
    document.getElementById('s2').classList.toggle('hidden', tab !== 2);
    document.getElementById('submit').textContent = '세션1 질문 제출';
    document.getElementById('bar').classList.toggle('hidden', tab !== 1);
    if (tab === 1) renderS1(); else renderS2();
  }

  function submit() {
    var b = document.getElementById('submit'); b.disabled = true; msg('저장 중…');
    var p = tab === 1
      ? BF.rpc('bucheon_submit_questions', { p_code: code, p_q1: draft.q1, p_q2: null, p_note: draft.note })
      : (function () {
          var terms = {}; policies.forEach(function (x) { if (draft.terms[x.id]) terms[x.id] = draft.terms[x.id]; });
          return BF.rpc('bucheon_submit_priority', { p_code: code, p_terms: terms, p_ranking: draft.ranking,
            p_reason_top: draft.top, p_reason_long: draft.long, p_split: draft.split });
        })();
    p.then(function (r) {
      msg((tab === 1 ? '세션1' : '세션2') + ' 제출 완료 ' + BF.hhmm(r.updated_at) + ' · 다시 제출하면 고쳐집니다', 'ok');
    }).catch(function (e) { msg(e.message, 'err'); })
      .then(function () { b.disabled = false; });
  }

  document.getElementById('tab1').onclick = function () { tab = 1; render(); };
  document.getElementById('tab2').onclick = function () { tab = 2; render(); };
  document.getElementById('submit').onclick = submit;
  document.getElementById('enter').onclick = function () {
    code = document.getElementById('code').value.toUpperCase().trim(); join();
  };
  join();
})();
</script>
</body>
</html>
