<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>운영규정 투표 라이브 — 2026 기후시민회의</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        #ffffff;
    --header:    #2E75B6;
    --header-2:  #1F4E79;
    --sky:       #56C2E4;
    --amber:     #F5A623;
    --amber-d:   #C77800;
    --teal:      #1F9E95;
    --purple:    #7C5AA6;
    --ink:       #14202b;
    --ink-2:     #5a6a7a;
    --rail:      #eef2f6;
    --good:      #2E9A57;
    --bad:       #C9444A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height: 100vh;
  }

  /* === 헤더 밴드 === */
  .header-band {
    background: linear-gradient(180deg, var(--header), var(--header-2));
    color: #fff;
    padding: 18px 56px 22px;
    box-shadow: 0 6px 28px rgba(46,117,182,0.25);
    display: flex; justify-content: space-between; align-items: center; gap: 32px;
  }
  .h-title { font-size: 56px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
  .h-title .amber { color: var(--amber); }
  .h-sub { font-size: 22px; font-weight: 500; opacity: 0.92; margin-top: 8px; }
  .h-meta { text-align: right; }
  .h-total { font-size: 88px; font-weight: 900; color: var(--amber); line-height: 1; font-variant-numeric: tabular-nums; }
  .h-total-lbl { font-size: 22px; font-weight: 700; opacity: 0.85; margin-top: 6px; }
  .h-status { font-size: 16px; font-weight: 500; opacity: 0.75; margin-top: 8px; }

  /* === 스테이지 === */
  .stage { padding: 32px 56px 56px; }

  .card {
    background: #fff;
    border: 2px solid var(--rail);
    border-radius: 18px;
    padding: 28px 36px 32px;
    margin-bottom: 28px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    border-bottom: 4px solid var(--rail); padding-bottom: 14px; margin-bottom: 22px;
  }
  .q-num {
    display: inline-block;
    background: var(--header); color: #fff;
    font-size: 24px; font-weight: 900;
    padding: 6px 16px; border-radius: 999px;
    margin-right: 14px; vertical-align: middle;
  }
  .q-title { font-size: 40px; font-weight: 900; color: var(--ink); display: inline; vertical-align: middle; }
  .q-sub { font-size: 20px; font-weight: 500; color: var(--ink-2); margin-top: 10px; line-height: 1.5; }
  .q-count { font-size: 28px; font-weight: 800; color: var(--header); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .q-count small { font-size: 18px; font-weight: 600; color: var(--ink-2); }

  /* === 막대 행 === */
  .row {
    display: grid; grid-template-columns: 1fr 80px;
    gap: 24px; align-items: center;
    margin: 14px 0;
  }
  .row .lbl-wrap { display: flex; align-items: center; gap: 20px; }
  .row .lbl {
    flex: 0 0 auto;
    font-size: 28px; font-weight: 800; color: var(--ink);
    min-width: 280px;
  }
  .row.compact .lbl { font-size: 24px; min-width: 200px; }
  .row .bar-wrap {
    flex: 1; position: relative;
    height: 60px; background: var(--rail);
    border-radius: 12px; overflow: hidden;
  }
  .row.big .bar-wrap { height: 88px; }
  .row .bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0%;
    border-radius: 12px;
    transition: width 1100ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .row .cnt {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    font-size: 24px; font-weight: 900; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    font-variant-numeric: tabular-nums;
  }
  .row .cnt.outside { color: var(--ink-2); text-shadow: none; right: -80px; }
  .row .pct {
    text-align: right;
    font-size: 40px; font-weight: 900; color: var(--header);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .row.big .pct { font-size: 52px; }

  /* === 색상 (옵션별) === */
  .bar.c-sky    { background: linear-gradient(90deg, var(--sky), #3FA8CC); }
  .bar.c-amber  { background: linear-gradient(90deg, var(--amber), var(--amber-d)); }
  .bar.c-teal   { background: linear-gradient(90deg, var(--teal), #16766F); }
  .bar.c-purple { background: linear-gradient(90deg, var(--purple), #5A3F87); }
  .bar.c-good   { background: linear-gradient(90deg, var(--good), #1F7A42); }
  .bar.c-bad    { background: linear-gradient(90deg, var(--bad), #9F353A); }
  .bar.c-gray   { background: linear-gradient(90deg, #B4BFCB, #8A97A6); }

  /* === 2열 그리드 (Q2-1,2,3,4) === */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .grid-2 .card { margin-bottom: 0; }
  @media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } }

  .err { color: var(--bad) !important; }
  .footer {
    text-align: center; padding: 32px 0 16px;
    color: var(--ink-2); font-size: 16px;
  }
  .footer a { color: var(--header); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>

<div class="header-band">
  <div>
    <div class="h-title">운영규정 <span class="amber">투표</span> 라이브</div>
    <div class="h-sub">분과 운영방식 · 의결정족수 · 의사정족수 통일</div>
  </div>
  <div class="h-meta">
    <div class="h-total" id="total">0</div>
    <div class="h-total-lbl">총 응답</div>
    <div class="h-status" id="status">집계 대기 중</div>
  </div>
</div>

<div class="stage">

  <!-- Q1: 분과 운영방식 (큰 카드) -->
  <div class="card">
    <div class="card-head">
      <div>
        <span class="q-num">Q1</span>
        <span class="q-title">분과 운영방식</span>
        <div class="q-sub">옵션 A: 분과별 다른 의제 분담 &nbsp;·&nbsp; 옵션 B: 전체가 같은 의제</div>
      </div>
      <div class="q-count" id="q1-count">0<small> 표</small></div>
    </div>
    <div id="q1"></div>
  </div>

  <!-- Q2-1 / Q2-2 / Q2-3 / Q2-4 (2x2 그리드) -->
  <div class="grid-2">
    <div class="card">
      <div class="card-head">
        <div>
          <span class="q-num">Q2-1</span>
          <span class="q-title">기획참여단</span>
          <div class="q-sub">의결정족수</div>
        </div>
        <div class="q-count" id="q21-count">0<small> 표</small></div>
      </div>
      <div id="q21"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <span class="q-num">Q2-2</span>
          <span class="q-title">숙의참여단 (분과별)</span>
          <div class="q-sub">의결정족수</div>
        </div>
        <div class="q-count" id="q22-count">0<small> 표</small></div>
      </div>
      <div id="q22"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <span class="q-num">Q2-3</span>
          <span class="q-title">숙의참여단 (전체)</span>
          <div class="q-sub">의결정족수</div>
        </div>
        <div class="q-count" id="q23-count">0<small> 표</small></div>
      </div>
      <div id="q23"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <span class="q-num">Q2-4</span>
          <span class="q-title">의사정족수 통일</span>
          <div class="q-sub">세 회의체 모두 "재적 과반수"로 통일</div>
        </div>
        <div class="q-count" id="q24-count">0<small> 표</small></div>
      </div>
      <div id="q24"></div>
    </div>
  </div>

  <div class="footer">
    30초 자동 갱신 · Google Sheets 직결 ·
    <a href="#" id="cfg">SHEET_ID 설정</a>
  </div>
</div>

<script>
const DEFAULT_SHEET_ID = "12x14DkYQHBtETCsXQ7zHz2oYRoTjGVa-J_34HW6A8cU";

// 옵션별 색상 매핑
const COLORS = {
  Q1: ['c-sky', 'c-amber', 'c-gray'],          // A / B / 보류
  Q2: ['c-sky', 'c-purple', 'c-amber', 'c-teal'],  // 출석과반/2-3/3-4/재적과반
  Q24: ['c-good', 'c-bad'],
};

const QMAP = {
  q1:  { key: 'Q1_분과운영',          colors: COLORS.Q1,  big: true,  countId: 'q1-count' },
  q21: { key: 'Q2-1_기획참여단',     colors: COLORS.Q2,  big: false, countId: 'q21-count', compact: true },
  q22: { key: 'Q2-2_분과별',          colors: COLORS.Q2,  big: false, countId: 'q22-count', compact: true },
  q23: { key: 'Q2-3_전체',            colors: COLORS.Q2,  big: false, countId: 'q23-count', compact: true },
  q24: { key: 'Q2-4_의사정족수통일', colors: COLORS.Q24, big: false, countId: 'q24-count' },
};

function getSheetId() {
  const q = new URL(location.href).searchParams.get('sheet');
  if (q) { localStorage.setItem('reg_vote_sheet', q); return q; }
  return DEFAULT_SHEET_ID || localStorage.getItem('reg_vote_sheet') || '';
}

document.getElementById('cfg').onclick = (e) => {
  e.preventDefault();
  const v = prompt('Google Sheet ID', getSheetId());
  if (v) { localStorage.setItem('reg_vote_sheet', v.trim()); location.reload(); }
};

function parseCSV(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch === '\r') {}
      else cur += ch;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function render(target, rows, cfg) {
  const total = rows.reduce((s, r) => s + r.count, 0);
  const el = document.getElementById(target);
  const bigCls = cfg.big ? 'big' : '';
  const compactCls = cfg.compact ? 'compact' : '';
  el.innerHTML = rows.map((r, i) => {
    const pct = total > 0 ? (r.count / total * 100) : 0;
    const col = cfg.colors[i % cfg.colors.length];
    const cntInside = pct >= 12;
    return `
      <div class="row ${bigCls} ${compactCls}">
        <div class="lbl-wrap">
          <div class="lbl">${r.opt}</div>
          <div class="bar-wrap">
            <div class="bar ${col}" style="width:${pct}%"></div>
            <div class="cnt ${cntInside ? '' : 'outside'}">${r.count}</div>
          </div>
        </div>
        <div class="pct">${pct.toFixed(0)}<span style="font-size:0.6em">%</span></div>
      </div>`;
  }).join('');
  document.getElementById(cfg.countId).innerHTML = `${total}<small> 표</small>`;
  return total;
}

async function tick() {
  const sheetId = getSheetId();
  const stat = document.getElementById('status');
  if (!sheetId) { stat.textContent = 'SHEET_ID 미설정'; stat.classList.add('err'); return; }
  try {
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Tally`;
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = parseCSV(await r.text());
    const grouped = {};
    rows.slice(1).forEach(r => {
      if (!r[0]) return;
      grouped[r[0]] = grouped[r[0]] || [];
      grouped[r[0]].push({ opt: r[1], count: parseInt(r[2] || '0', 10) || 0 });
    });
    let q1Total = 0;
    for (const [tgt, cfg] of Object.entries(QMAP)) {
      const data = grouped[cfg.key] || [];
      const t = render(tgt, data, cfg);
      if (tgt === 'q1') q1Total = t;
    }
    document.getElementById('total').textContent = q1Total;
    stat.textContent = '실시간 ' + new Date().toLocaleTimeString('ko-KR');
    stat.classList.remove('err');
  } catch (e) {
    stat.textContent = '오류: ' + e.message;
    stat.classList.add('err');
  }
}

tick();
setInterval(tick, 30000);
</script>
</body>
</html>
