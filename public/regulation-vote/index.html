<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운영규정 투표 라이브 — 2026 기후시민회의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1A2A;
    --ink-2: #4A5568;
    --ink-3: #8A95A3;
    --paper: #FAFBFC;
    --rule: #E2E6EC;
    --rule-soft: #F1F3F6;
    --header: #1F4E79;
    --header-2: #14334F;
    --amber: #F5A623;
    --amber-d: #C77800;
    --blue: #2E75B6;
    --blue-d: #1F4E79;
    --slate: #647281;
    --forest: #2E9A57;
    --brick: #B23F4A;
    --q-1: #C8DEEF;
    --q-2: #6BA8D8;
    --q-3: #2E75B6;
    --q-4: #1F4E79;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'tnum' 1, 'lnum' 1;
  }
  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: 'tnum' 1; }

  /* ============ HEADER ============ */
  .head {
    height: 88px;
    background:
      linear-gradient(180deg, var(--header) 0%, var(--header-2) 100%);
    color: #fff;
    padding: 14px 44px;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 32px;
    position: relative;
  }
  .head::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--amber) 0%, var(--amber) 38%, transparent 38.001%);
  }
  .head-left { display: flex; align-items: baseline; gap: 18px; }
  .head-title {
    font-size: 36px; font-weight: 900; letter-spacing: -0.025em; line-height: 1;
  }
  .head-title .amber { color: var(--amber); }
  .head-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; opacity: 0.72;
    border-left: 2px solid rgba(255,255,255,0.3);
    padding-left: 14px;
  }
  .head-center {
    text-align: center;
    font-size: 16px; font-weight: 500;
    letter-spacing: 0.04em;
    opacity: 0.85;
  }
  .head-right {
    display: flex; align-items: center; justify-content: flex-end; gap: 28px;
  }
  .head-clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.05em; opacity: 0.92;
    display: flex; align-items: center; gap: 10px;
  }
  .live-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 12px rgba(245,166,35,0.65);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.65); }
  }
  .head-total {
    display: flex; align-items: baseline; gap: 10px;
    border-left: 1px solid rgba(255,255,255,0.25);
    padding-left: 28px;
  }
  .head-total-n {
    font-size: 54px; font-weight: 900; color: var(--amber);
    line-height: 1; font-variant-numeric: tabular-nums;
    letter-spacing: -0.025em;
  }
  .head-total-l {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.18em;
    opacity: 0.78;
  }

  /* ============ STAGE ============ */
  .stage {
    height: calc(100vh - 88px);
    padding: 28px 36px 24px;
    display: grid;
    grid-template-rows: 1.18fr 1fr;
    gap: 22px;
  }
  .row-top { display: grid; grid-template-columns: 1.55fr 1fr; gap: 22px; }
  .row-bot { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; }

  /* ============ CARD ============ */
  .card {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 22px 26px 18px;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--header);
  }
  .card-head {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 14px; align-items: start;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule-soft);
    margin-bottom: 4px;
  }
  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.16em; color: var(--blue);
    padding: 4px 9px;
    border: 1.5px solid var(--blue);
    border-radius: 3px;
    margin-top: 2px;
    align-self: start;
  }
  .q-title {
    font-size: 26px; font-weight: 900;
    letter-spacing: -0.02em; color: var(--ink);
    line-height: 1.05;
  }
  .card.lg .q-title { font-size: 32px; }
  .q-sub {
    margin-top: 5px;
    font-size: 13px; font-weight: 500;
    color: var(--ink-2); line-height: 1.4;
    letter-spacing: -0.005em;
  }
  .card.lg .q-sub { font-size: 15px; }
  .q-meta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 600;
    color: var(--ink-3); letter-spacing: 0.14em;
    text-transform: uppercase;
    align-self: center;
    line-height: 1.3;
  }
  .q-meta .b {
    display: block;
    color: var(--ink); font-weight: 800; font-size: 24px;
    font-family: 'Pretendard', sans-serif;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 3px;
  }

  /* ============ VERTICAL BARS ============ */
  .bars {
    flex: 1;
    display: grid;
    gap: 16px;
    margin-top: 14px;
    min-height: 0;
  }
  .bars.n2 { grid-template-columns: 1fr 1fr; }
  .bars.n3 { grid-template-columns: 1fr 1fr 1fr; }
  .bars.n4 { grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }

  .vbar {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100%;
    position: relative;
    min-height: 0;
  }
  .vbar-top {
    display: flex; flex-direction: column; align-items: center;
    gap: 1px; padding: 0 2px;
    position: relative;
  }
  .vbar-pct {
    font-size: 38px; font-weight: 900; line-height: 1;
    color: var(--ink); letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .card.lg .vbar-pct { font-size: 46px; }
  .vbar-pct .pp {
    font-size: 0.48em; font-weight: 700;
    color: var(--ink-3); margin-left: 2px;
    letter-spacing: 0;
  }
  .vbar-cnt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
    color: var(--ink-3); letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .vbar-track {
    position: relative;
    background: var(--rule-soft);
    border-radius: 3px 3px 0 0;
    margin: 10px 4px 0;
    min-height: 40px;
    overflow: visible;
  }
  .vbar-track::before {
    content: ''; position: absolute;
    left: 0; right: 0; top: 50%;
    border-top: 1px dashed rgba(0,0,0,0.06);
  }
  .vbar-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    border-radius: 3px 3px 0 0;
    transition: height 850ms cubic-bezier(0.22, 0.61, 0.36, 1);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
  }
  .vbar-lbl {
    margin-top: 14px;
    text-align: center;
    font-size: 15px; font-weight: 800;
    color: var(--ink); line-height: 1.15;
    letter-spacing: -0.01em;
    padding: 0 2px;
  }
  .card.lg .vbar-lbl { font-size: 17px; }
  .vbar-lbl .sub {
    display: block;
    font-size: 0.78em; font-weight: 500;
    color: var(--ink-2); margin-top: 3px;
    letter-spacing: -0.005em;
  }

  /* Winner */
  .vbar.win .vbar-pct { color: var(--amber-d); }
  .vbar.win .vbar-top::before {
    content: '▼';
    position: absolute; top: -8px; left: 50%;
    transform: translateX(-50%);
    font-size: 14px; color: var(--amber);
    line-height: 1;
  }
  .vbar.win .vbar-lbl {
    border-top: 3px solid var(--amber);
    padding-top: 10px; margin-top: 11px;
  }
  .vbar.win .vbar-fill {
    box-shadow: inset 0 -3px 0 var(--amber-d);
  }

  /* Bar color tokens */
  .f-q1-a   { background: linear-gradient(180deg, #4A8FD0 0%, var(--blue-d) 100%); }
  .f-q1-b   { background: linear-gradient(180deg, #F8B845 0%, var(--amber-d) 100%); }
  .f-q1-h   { background: linear-gradient(180deg, #B4BFCB 0%, var(--slate) 100%); }
  .f-yes    { background: linear-gradient(180deg, #4FC080 0%, var(--forest) 100%); }
  .f-no     { background: linear-gradient(180deg, #CE5560 0%, var(--brick) 100%); }
  .f-quo-1  { background: linear-gradient(180deg, #D8E8F5 0%, var(--q-1) 100%); }
  .f-quo-2  { background: linear-gradient(180deg, #8FBFE0 0%, var(--q-2) 100%); }
  .f-quo-3  { background: linear-gradient(180deg, #4A8DC4 0%, var(--q-3) 100%); }
  .f-quo-4  { background: linear-gradient(180deg, #2E6492 0%, var(--q-4) 100%); }

  /* Footer */
  .footer {
    position: fixed; bottom: 10px; right: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-3);
    letter-spacing: 0.1em; text-transform: uppercase;
    background: rgba(255,255,255,0.7);
    padding: 4px 10px; border-radius: 3px;
    backdrop-filter: blur(4px);
  }
  .footer a { color: var(--blue); text-decoration: none; font-weight: 700; }

  .err-banner {
    position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
    background: var(--brick); color: #fff;
    padding: 10px 24px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    letter-spacing: 0.05em; display: none; z-index: 100;
    box-shadow: 0 4px 16px rgba(178,63,74,0.3);
  }
  .err-banner.show { display: block; }

  /* 큰 화면 미세 조정 */
  @media (min-width: 2400px) {
    .head { height: 110px; padding: 18px 60px; }
    .head-title { font-size: 48px; }
    .head-total-n { font-size: 72px; }
    .head-clock { font-size: 26px; }
    .stage { padding: 36px 48px 32px; }
    .q-title { font-size: 32px; }
    .card.lg .q-title { font-size: 40px; }
    .vbar-pct { font-size: 48px; }
    .card.lg .vbar-pct { font-size: 60px; }
    .vbar-lbl { font-size: 19px; }
    .card.lg .vbar-lbl { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="head">
  <div class="head-left">
    <div class="head-title">운영규정 <span class="amber">투표</span></div>
    <div class="head-sub">2026 KOREA CITIZENS' CLIMATE ASSEMBLY · 06 / 13</div>
  </div>
  <div class="head-center">분과 운영방식 · 의결정족수 · 의사정족수 통일</div>
  <div class="head-right">
    <div class="head-clock">
      <span class="live-dot"></span>
      <span id="clock">--:--:--</span>
    </div>
    <div class="head-total">
      <div class="head-total-n" id="total">0</div>
      <div class="head-total-l">총 응답</div>
    </div>
  </div>
</div>

<div class="err-banner" id="err"></div>

<div class="stage">

  <div class="row-top">
    <div class="card lg">
      <div class="card-head">
        <span class="q-num">Q1</span>
        <div>
          <div class="q-title">분과 운영방식</div>
          <div class="q-sub">숙의참여단을 어떻게 운영하는 것이 좋은가</div>
        </div>
        <div class="q-meta">
          <span class="b" id="q1-c">0</span>
          응답
        </div>
      </div>
      <div class="bars n3" id="q1"></div>
    </div>

    <div class="card lg">
      <div class="card-head">
        <span class="q-num">Q2-1</span>
        <div>
          <div class="q-title">의사정족수 통일</div>
          <div class="q-sub">세 회의체 모두 "재적 과반수"로 통일하는 안</div>
        </div>
        <div class="q-meta">
          <span class="b" id="q21-c">0</span>
          응답
        </div>
      </div>
      <div class="bars n2" id="q21"></div>
    </div>
  </div>

  <div class="row-bot">
    <div class="card">
      <div class="card-head">
        <span class="q-num">Q2-2</span>
        <div>
          <div class="q-title">기획참여단</div>
          <div class="q-sub">의결정족수</div>
        </div>
        <div class="q-meta">
          <span class="b" id="q22-c">0</span>
          응답
        </div>
      </div>
      <div class="bars n4" id="q22"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="q-num">Q2-3</span>
        <div>
          <div class="q-title">숙의참여단 분과별</div>
          <div class="q-sub">의결정족수</div>
        </div>
        <div class="q-meta">
          <span class="b" id="q23-c">0</span>
          응답
        </div>
      </div>
      <div class="bars n4" id="q23"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="q-num">Q2-4</span>
        <div>
          <div class="q-title">숙의참여단 전체</div>
          <div class="q-sub">의결정족수</div>
        </div>
        <div class="q-meta">
          <span class="b" id="q24-c">0</span>
          응답
        </div>
      </div>
      <div class="bars n4" id="q24"></div>
    </div>
  </div>

</div>

<div class="footer">
  POLL 3s · CACHE 15-30s · <a href="#" id="cfg">CONFIG</a>
</div>

<script>
const DEFAULT_SHEET_ID = "12x14DkYQHBtETCsXQ7zHz2oYRoTjGVa-J_34HW6A8cU";
const POLL_MS = 3000;

const C_Q1  = ['f-q1-a', 'f-q1-b', 'f-q1-h'];
const C_YN  = ['f-yes', 'f-no'];
const C_QUO = ['f-quo-1', 'f-quo-2', 'f-quo-3', 'f-quo-4'];

const QMAP = {
  q1:  { key: 'Q1_분과운영', colors: C_Q1, cnt: 'q1-c',
         labels: [['옵션 A', '분과 두기'], ['옵션 B', '분과 안 두기'], ['판단 보류', '추가 논의']] },
  q21: { key: 'Q2-1_의사정족수통일', colors: C_YN, cnt: 'q21-c',
         labels: [['동의', null], ['비동의', null]] },
  q22: { key: 'Q2-2_기획참여단', colors: C_QUO, cnt: 'q22-c',
         labels: [['출석 과반', null], ['출석 2/3', null], ['출석 3/4', null], ['재적 과반', null]] },
  q23: { key: 'Q2-3_분과별', colors: C_QUO, cnt: 'q23-c',
         labels: [['출석 과반', null], ['출석 2/3', null], ['출석 3/4', null], ['재적 과반', null]] },
  q24: { key: 'Q2-4_전체', colors: C_QUO, cnt: 'q24-c',
         labels: [['출석 과반', null], ['출석 2/3', null], ['출석 3/4', null], ['재적 과반', null]] },
};

function getSheetId() {
  const q = new URL(location.href).searchParams.get('sheet');
  if (q) { localStorage.setItem('reg_vote_sheet', q); return q; }
  return DEFAULT_SHEET_ID || localStorage.getItem('reg_vote_sheet') || '';
}

document.getElementById('cfg').onclick = (e) => {
  e.preventDefault();
  const v = prompt('Google Sheet ID', getSheetId());
  if (v) { localStorage.setItem('reg_vote_sheet', v.trim()); location.reload(); }
};

function parseCSV(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch === '\r') {}
      else cur += ch;
    }
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

function render(target, rows, cfg) {
  const total = rows.reduce((s, r) => s + r.count, 0);
  const maxN = Math.max(0, ...rows.map(r => r.count));
  const winners = total > 0 ? rows.map((r, i) => r.count === maxN ? i : -1).filter(i => i >= 0) : [];
  const el = document.getElementById(target);

  el.innerHTML = rows.map((r, i) => {
    const pct = total > 0 ? (r.count / total * 100) : 0;
    const cls = cfg.colors[i % cfg.colors.length];
    const isWin = winners.includes(i) && r.count > 0 && winners.length < rows.length;
    const [main, sub] = cfg.labels[i] || [r.opt, null];
    return `
      <div class="vbar ${isWin ? 'win' : ''}">
        <div class="vbar-top">
          <div class="vbar-pct">${pct.toFixed(0)}<span class="pp">%</span></div>
          <div class="vbar-cnt">${r.count}표</div>
        </div>
        <div class="vbar-track">
          <div class="vbar-fill ${cls}" style="height:${pct}%"></div>
        </div>
        <div class="vbar-lbl">${main}${sub ? `<span class="sub">${sub}</span>` : ''}</div>
      </div>`;
  }).join('');

  document.getElementById(cfg.cnt).textContent = total;
  return total;
}

async function tick() {
  const sheetId = getSheetId();
  const errEl = document.getElementById('err');
  if (!sheetId) { errEl.textContent = 'SHEET_ID 미설정'; errEl.classList.add('show'); return; }
  try {
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Tally&_=${Date.now()}`;
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = parseCSV(await r.text());
    const grouped = {};
    rows.slice(1).forEach(r => {
      if (!r[0]) return;
      grouped[r[0]] = grouped[r[0]] || [];
      grouped[r[0]].push({ opt: r[1], count: parseInt(r[2] || '0', 10) || 0 });
    });
    let q1Total = 0;
    for (const [tgt, cfg] of Object.entries(QMAP)) {
      const data = grouped[cfg.key] || [];
      const t = render(tgt, data, cfg);
      if (tgt === 'q1') q1Total = t;
    }
    document.getElementById('total').textContent = q1Total;
    errEl.classList.remove('show');
  } catch (e) {
    errEl.textContent = '연결 오류: ' + e.message;
    errEl.classList.add('show');
  }
}

function clockTick() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}

clockTick();
setInterval(clockTick, 1000);
tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
