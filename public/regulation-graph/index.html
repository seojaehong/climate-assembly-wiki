<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>운영규정 온톨로지 — 조항 중심</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/_ontology-chrome/chrome.css">
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
<script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
</head>
<body>
<div id="og-app">
  <div class="og-controls">
    <input id="og-search" type="search" placeholder="조항·발화 검색…" autocomplete="off">
    <span class="og-lbl">종류</span>
    <div class="og-filters" id="og-kind-filters"></div>
    <span class="og-spacer"></span>
    <button class="og-btn" id="og-toggle-iso">고립 노드 보이기</button>
    <button class="og-icon-btn" id="og-settings-btn" title="설정">⚙</button>
  </div>
  <div class="og-body">
    <div class="og-canvas">
      <div id="cy" style="width:100%;height:100%"></div>
      <div class="og-zoomctl">
        <button id="og-zin">＋</button>
        <button id="og-zout">−</button>
        <button id="og-zfit">⊡</button>
      </div>
      <div class="og-quick" id="og-quick"></div>
    </div>
    <aside class="og-side collapsed" id="og-side">
      <div class="og-s-empty">노드를 클릭하면 상세가 표시됩니다.</div>
    </aside>
  </div>
  <div class="og-footer">
    <div class="og-leg" id="og-legend"></div>
    <span class="og-spacer"></span>
    <span style="font-size:11px;color:#5c6878">6/13 운영규정 토론 · 조항 · 수정안 · 의결 추적</span>
  </div>
</div>

<script type="module">
import { OntologyChrome } from '/_ontology-chrome/chrome.js';

let cy, ALL_NODES = [], ALL_EDGES = [], curFilter = { kind:new Set(Object.keys(OntologyChrome.KIND_DEFAULT)) };
let isoShown = false;

fetch('data.json').then(r => r.json()).then(payload => {
  const { elements, meta } = payload;
  ALL_NODES = elements.nodes;
  ALL_EDGES = elements.edges;

  OntologyChrome.init({
    activeId: 'regulation',
    title: '운영규정 온톨로지 — 조항 중심',
    meta: `노드 ${meta.counts.nodes} · 엣지 ${meta.counts.edges}`,
    advisory: meta.advisory_notice || '6/13 워크숍의 운영규정 조항·수정안·우려·의결을 LLM이 조립한 초안입니다.',
    live: meta.live || false,
  });

  try { if (typeof cytoscapeFcose !== 'undefined') cytoscape.use(cytoscapeFcose); } catch (e) {}

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: { nodes: ALL_NODES, edges: ALL_EDGES },
    wheelSensitivity: 0.25, minZoom: 0.08, maxZoom: 3,
    style: buildStyle(OntologyChrome.getPalette()),
    layout: { name:'fcose', quality:'default', animate:false, randomize:true,
      nodeRepulsion:8000, idealEdgeLength:120, edgeElasticity:0.45,
      gravity:0.3, numIter:2500, packComponents:true, nodeSeparation:80 },
  });
  applyIsolated();

  const present = {};
  cy.nodes().forEach(n => present[n.data('kind')] = true);
  const palette = OntologyChrome.getPalette();
  const kf = document.getElementById('og-kind-filters');
  Object.keys(OntologyChrome.KIND_DEFAULT).forEach(k => {
    if (!present[k]) { curFilter.kind.delete(k); return; }
    const c = document.createElement('span');
    c.className = 'og-chip'; c.dataset.kind = k;
    c.innerHTML = `<span class="og-dot" style="background:${palette[k]}"></span>${OntologyChrome.KIND_KO[k] || k}`;
    c.onclick = () => {
      c.classList.toggle('off');
      if (curFilter.kind.has(k)) curFilter.kind.delete(k); else curFilter.kind.add(k);
      applyFilter();
    };
    kf.appendChild(c);
  });

  buildLegend();

  document.getElementById('og-zin').onclick = () => cy.zoom({ level: cy.zoom() * 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
  document.getElementById('og-zout').onclick = () => cy.zoom({ level: cy.zoom() / 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
  document.getElementById('og-zfit').onclick = () => cy.fit(null, 30);

  document.getElementById('og-toggle-iso').onclick = (e) => {
    isoShown = !isoShown;
    e.target.textContent = isoShown ? '고립 노드 숨기기' : '고립 노드 보이기';
    applyIsolated();
  };

  cy.on('tap', 'node', (evt) => OntologyChrome.showQuick(document.getElementById('og-quick'), document.getElementById('og-side'), evt.target.data()));
  cy.on('tap', (evt) => {
    if (evt.target === cy) {
      OntologyChrome.hideQuick(document.getElementById('og-quick'));
      document.getElementById('og-side').classList.add('collapsed');
    }
  });

  document.getElementById('og-search').oninput = (e) => {
    const q = e.target.value.trim().toLowerCase();
    cy.batch(() => {
      cy.nodes().forEach(n => {
        const match = !q || (n.data('label') || '').toLowerCase().includes(q) || (n.data('text') || '').toLowerCase().includes(q);
        if (match) n.removeClass('dim'); else n.addClass('dim');
      });
    });
  };

  document.getElementById('og-settings-btn').onclick = () => {
    OntologyChrome.openSettings(({ palette, lang }) => {
      cy.style(buildStyle(palette)).update();
      buildLegend();
      document.querySelectorAll('#og-kind-filters .og-chip').forEach(c => {
        const k = c.dataset.kind;
        c.querySelector('.og-dot').style.background = palette[k];
        c.lastChild.textContent = lang === 'ko' ? (OntologyChrome.KIND_KO[k] || k) : k;
      });
    });
  };

  cy.ready(() => setTimeout(() => cy.fit(null, 40), 300));
});

function buildStyle(palette) {
  return [
    { selector:'node', style:{
        'background-color': n => palette[n.data('kind')] || '#888',
        'label':'data(label)', 'color':'#eef3f9', 'font-size':'12px',
        'font-family':"'Noto Sans KR','Malgun Gothic',sans-serif", 'font-weight':500,
        'text-wrap':'wrap','text-max-width':'140px','text-valign':'bottom','text-margin-y':4,
        'text-outline-color':'#11151c','text-outline-width':2.5,
        'width': n => 24 + Math.min(n.data('deg')||0,8)*5,
        'height': n => 24 + Math.min(n.data('deg')||0,8)*5,
        'border-width':2,'border-color':'#0d1118','shape':'ellipse',
    }},
    { selector:'node[kind="Clause"]', style:{ 'shape':'round-rectangle','border-color':'#e9ecef','border-width':3 }},
    { selector:'node[kind="Decision"]', style:{ 'shape':'star','border-color':'#ffa94d','border-width':3 }},
    { selector:'edge', style:{
        'width':1.8, 'line-color':'#54637a', 'target-arrow-color':'#54637a',
        'target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':1.1,
        'label':'data(relKo)','font-size':'10px','color':'#aeb9c8',
        'font-family':"'Noto Sans KR','Malgun Gothic',sans-serif",
        'text-rotation':'autorotate','text-background-color':'#11151c',
        'text-background-opacity':0.85,'text-background-padding':2,
    }},
    { selector:'edge[?opposes]', style:{
        'line-color':'#ff6b6b','target-arrow-color':'#ff6b6b','width':2.8 }},
    { selector:'.dim', style:{ 'opacity':0.10 }},
    { selector:'.hidden', style:{ 'display':'none' }}
  ];
}

function buildLegend() {
  const lang = OntologyChrome.getLang();
  const palette = OntologyChrome.getPalette();
  const el = document.getElementById('og-legend');
  const present = {};
  cy && cy.nodes().forEach(n => present[n.data('kind')] = true);
  el.innerHTML = Object.keys(OntologyChrome.KIND_DEFAULT).filter(k => present[k]).map(k =>
    `<span class="og-item"><span class="og-sw" style="background:${palette[k]}"></span>${lang === 'ko' ? (OntologyChrome.KIND_KO[k] || k) : k}</span>`
  ).join('') + `<span class="og-item"><span class="og-ln"></span>관계</span><span class="og-item"><span class="og-ln og-opp"></span>반대·우려</span>`;
}

function applyIsolated() {
  if (!cy) return;
  cy.batch(() => {
    cy.nodes().forEach(n => {
      if (n.data('isolated')) {
        if (isoShown) n.removeClass('hidden'); else n.addClass('hidden');
      }
    });
  });
}

function applyFilter() {
  if (!cy) return;
  cy.batch(() => {
    cy.nodes().forEach(n => {
      const k = n.data('kind');
      if (curFilter.kind.has(k)) n.removeClass('hidden'); else n.addClass('hidden');
    });
    cy.edges().forEach(e => {
      if (e.source().hasClass('hidden') || e.target().hasClass('hidden')) e.addClass('hidden');
      else e.removeClass('hidden');
    });
  });
  const visN = cy.nodes(':visible').length;
  const visE = cy.edges(':visible').length;
  document.getElementById('og-stat').textContent = `표시 ${visN}/${ALL_NODES.length} · 엣지 ${visE}/${ALL_EDGES.length}`;
}
</script>
</body>
</html>
