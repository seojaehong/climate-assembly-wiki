<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>기후시민회의 참가자 투표</title>
  <style>
    :root { --ink:#0f1a2a; --muted:#4a5568; --rule:#e2e6ec; --navy:#1f4e79; --teal:#0d7490; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#fafbfc; color:var(--ink); font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif; }
    .header { padding:18px 20px 16px; background:linear-gradient(180deg,var(--navy),#14334f); color:#fff; }
    .header-title { font-size:22px; font-weight:900; }
    .header-sub { margin-top:4px; font-size:13px; opacity:.76; }
    .main { max-width:640px; margin:0 auto; padding:28px 20px 60px; }
    .screen { display:none; }
    .screen.active { display:block; }
    .loading-wrap,.error-wrap,.closed-wrap,.thankyou-wrap { padding:38px 24px; border:2px solid var(--rule); border-radius:12px; background:#fff; text-align:center; }
    .error-title,.closed-title,.thankyou-title { margin-bottom:10px; font-size:24px; font-weight:900; }
    .error-body,.closed-body,.thankyou-sub { color:var(--muted); line-height:1.6; }
    .round-badge { display:inline-block; margin-bottom:14px; padding:5px 12px; border-radius:6px; background:var(--teal); color:#fff; font-size:13px; font-weight:800; }
    .round-title { margin-bottom:8px; font-size:28px; font-weight:900; }
    .round-desc { margin-bottom:24px; color:var(--muted); line-height:1.6; }
    .options-list,.scale-list { display:flex; flex-direction:column; gap:12px; margin-bottom:24px; }
    .opt-label,.scale-row { position:relative; display:flex; align-items:center; gap:14px; min-height:64px; padding:14px 16px; border:2px solid var(--rule); border-radius:10px; background:#fff; font-size:18px; font-weight:700; cursor:pointer; }
    .opt-label.selected { border-color:var(--teal); background:#eff9fb; }
    .opt-custom { width:26px; height:26px; flex:none; border:3px solid var(--rule); border-radius:50%; }
    .checkbox .opt-custom { border-radius:6px; }
    .selected .opt-custom { border-color:var(--teal); background:var(--teal); }
    .scale-row { display:block; }
    .scale-label { margin-bottom:10px; }
    .scale-btns { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
    .scale-btn { min-height:46px; border:2px solid var(--rule); border-radius:8px; background:#fff; font-size:18px; font-weight:800; }
    .scale-btn.sel { border-color:var(--teal); background:var(--teal); color:#fff; }
    .scale-hint,.tally-bar-label { display:flex; justify-content:space-between; margin-top:6px; color:var(--muted); font-size:13px; }
    .text-area { width:100%; min-height:140px; padding:14px; border:2px solid var(--rule); border-radius:10px; font:inherit; }
    .text-label { display:block; margin-bottom:8px; font-size:17px; font-weight:800; }
    .text-help { margin:8px 0 20px; color:var(--muted); font-size:13px; line-height:1.5; }
    .submit-btn,.retry-btn { min-height:52px; padding:12px 22px; border:0; border-radius:10px; background:var(--teal); color:#fff; font-size:17px; font-weight:900; cursor:pointer; }
    .submit-btn { width:100%; }
    .submit-btn:disabled { opacity:.55; cursor:wait; }
    .tally-preview { display:none; margin-top:18px; padding:18px; border:1px solid var(--rule); border-radius:10px; background:#fff; }
    .tally-bar-row { margin-bottom:12px; }
    .tally-bar-track { height:16px; overflow:hidden; border-radius:4px; background:var(--rule); }
    .tally-bar-fill { height:100%; border-radius:4px; background:var(--teal); }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">2026 기후시민회의 의제선정</div>
    <div class="header-sub" id="headerRoundId">투표 참여</div>
  </header>
  <main class="main">
    <section class="screen active" id="screenLoading"><div class="loading-wrap">라운드 정보를 불러오는 중…</div></section>
    <section class="screen" id="screenError"><div class="error-wrap"><div class="error-title">오류가 발생했습니다</div><div class="error-body" id="errorMsg">다시 시도해 주세요.</div></div></section>
    <section class="screen" id="screenClosed"><div class="closed-wrap"><div class="closed-title">마감된 라운드입니다</div><div class="closed-body">아래에서 집계 결과를 확인할 수 있습니다.</div></div></section>
    <section class="screen" id="screenForm">
      <div class="round-badge" id="formRoundBadge">ROUND</div>
      <h1 class="round-title" id="formTitle"></h1>
      <p class="round-desc" id="formDesc"></p>
      <div id="radioSection" style="display:none"><div class="options-list" id="radioList"></div></div>
      <div id="checkboxSection" style="display:none"><div class="options-list" id="checkboxList"></div></div>
      <div id="scaleSection" style="display:none"><div class="scale-list" id="scaleList"></div></div>
      <div id="textSection" style="display:none">
        <label class="text-label" for="textInput">의견을 입력해 주세요</label>
        <textarea class="text-area" id="textInput" maxlength="2000" required aria-describedby="textInputHelp"></textarea>
        <p class="text-help" id="textInputHelp">공백만 입력한 의견은 제출할 수 없습니다. 최대 2,000자까지 입력할 수 있습니다.</p>
      </div>
      <p>이름 등 개인정보는 수집하지 않습니다.</p>
      <button class="submit-btn" id="submitBtn" type="button">제출</button>
    </section>
    <section class="screen" id="screenThanks"><div class="thankyou-wrap"><div class="thankyou-title">응답이 접수되었습니다</div><div class="thankyou-sub" id="thanksMsg"></div><button class="retry-btn" type="button">다시 응답하기</button></div></section>
    <section class="tally-preview" id="tallyPreview" aria-live="polite"><div id="tallyRows"></div></section>
  </main>
  <script>
    (() => {
      const roundId = new URLSearchParams(window.location.search).get('round');
      if (roundId) window.VOTE_ROUND_ID = roundId;
    })();
  </script>
  <script src="/v/vote-form.js"></script>
</body>
</html>
