<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>0704 Supabase 백업 투표</title>
<style>
  :root{--bg:#f6f8fb;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#d9e2ee;--green:#0f766e;--orange:#d97706;--blue:#2563eb;--dark:#0b1220}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#fff 0%,var(--bg) 100%);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .wrap{width:min(1120px,calc(100vw - 28px));margin:0 auto;padding:28px 0 54px}
  header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px;padding:20px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 18px 54px rgba(15,23,42,.08)}
  h1{margin:0 0 8px;font-size:35px;line-height:1.15;letter-spacing:-.03em}
  h2{margin:0 0 8px;font-size:22px}
  p{margin:0;color:var(--muted);font-weight:760;line-height:1.55}
  a.btn,button.btn{min-height:44px;border:0;border-radius:9px;background:var(--dark);color:#fff;font-weight:950;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;text-decoration:none;cursor:pointer;font-family:inherit}
  a.btn.green,button.btn.green{background:var(--green)}
  a.btn.orange,button.btn.orange{background:var(--orange)}
  a.btn.blue,button.btn.blue{background:var(--blue)}
  a.btn.light,button.btn.light{background:#eef2f7;color:#111827}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 12px 32px rgba(15,23,42,.06)}
  .slot{border-top:5px solid var(--orange)}
  .slot:nth-child(2){border-top-color:var(--green)}
  .slot:nth-child(3){border-top-color:var(--blue)}
  .slot-head{display:grid;grid-template-columns:1fr 132px;gap:14px;align-items:start}
  .qr{display:block;border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:9px;text-align:center;text-decoration:none}
  .qr img{display:block;width:110px;height:110px;margin:0 auto;border-radius:6px;image-rendering:pixelated}
  .qr span{display:block;margin-top:6px;color:#111827;font-size:12px;font-weight:950}
  .meta{display:grid;gap:9px;margin:13px 0}
  .row{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:11px;border:1px solid rgba(15,23,42,.08);border-radius:10px;background:#f8fafc}
  .row b{font-size:13px;color:#0f172a}
  .row span{font-size:14px;color:#475569;font-weight:850;line-height:1.45}
  .count-pill{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 11px;border-radius:999px;background:#ecfeff;color:#0e7490;font-size:14px;font-weight:950}
  .status{margin-top:12px;color:#334155;font-size:13px;font-weight:900}
  .result{margin-top:12px;display:grid;gap:9px}
  .bar-row{display:grid;grid-template-columns:96px 1fr 42px;gap:9px;align-items:center}
  .bar-label{font-size:14px;font-weight:950}
  .bar-track{height:18px;border-radius:999px;background:#e2e8f0;overflow:hidden}
  .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#0f766e,#22c55e);min-width:2px}
  .bar-count{text-align:right;font-weight:950}
  .modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(15,23,42,.68);padding:22px}
  .modal.show{display:grid}
  .modal-card{width:min(1040px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 90px rgba(15,23,42,.32);padding:24px}
  .modal-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
  .modal-title{margin:0;font-size:34px;line-height:1.15}
  .modal-close{width:46px;height:46px;border:0;border-radius:999px;background:#eef2f7;font-size:25px;font-weight:950;cursor:pointer}
  .feature{min-height:470px;padding:32px;border-radius:18px;background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);display:grid;align-content:center}
  .feature h3{font-size:38px;margin:0 0 18px}
  .total{font-size:112px;font-weight:1000;letter-spacing:-.07em;line-height:1}
  .total small{font-size:28px;color:#64748b;margin-left:8px}
  .feature .bar-row{grid-template-columns:170px 1fr 76px;gap:18px;margin-top:22px}
  .feature .bar-label{font-size:25px}
  .feature .bar-track{height:36px}
  .feature .bar-count{font-size:25px}
  .modal.presentation{padding:0;background:#f8fafc}
  .modal.presentation .modal-card{width:100vw;height:100vh;max-height:none;border:0;border-radius:0;box-shadow:none;padding:48px 58px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  .modal.presentation .modal-title{font-size:clamp(44px,4.2vw,78px)}
  .modal.presentation .feature{height:100%;min-height:0;border:2px solid #dbeafe;border-radius:30px;padding:clamp(34px,4vw,72px)}
  .modal.presentation .feature h3{font-size:clamp(42px,4.2vw,80px)}
  .modal.presentation .total{font-size:clamp(136px,17vw,280px)}
  .modal.presentation .feature .bar-label{font-size:clamp(30px,2.8vw,56px)}
  .modal.presentation .feature .bar-track{height:clamp(40px,4.4vh,70px)}
  .modal.presentation .feature .bar-count{font-size:clamp(34px,3vw,58px)}
  @media(max-width:900px){header{display:block}.grid{grid-template-columns:1fr}.bar-row{grid-template-columns:84px 1fr 38px}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>0704 Supabase 백업 투표</h1>
      <p>Google Form/Sheet 지연이 길 때 바로 전환할 수 있는 실시간 투표 백업입니다. 기존 예비 라운드 EX1~EX3를 7.4 추가 판단 투표와 동일한 구조로 사용합니다.</p>
      <div class="status" id="status">Supabase 결과를 불러오는 중입니다.</div>
    </div>
    <div class="actions">
      <a class="btn green" href="/0704-admin/vote-structure">Google 구조</a>
      <a class="btn" href="/0704-admin/">관리자</a>
      <button class="btn blue" type="button" data-results="all">전체 결과</button>
    </div>
  </header>
  <section class="grid" id="slotGrid"></section>
</main>
<section class="modal" id="resultModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 class="modal-title">Supabase 백업 투표 결과</h2>
        <p id="modalSub">2초마다 갱신됩니다.</p>
      </div>
      <div class="actions" style="margin-top:0">
        <button class="btn blue" type="button" data-fullscreen>발표 전체화면</button>
        <button class="modal-close" type="button" data-close>×</button>
      </div>
    </div>
    <div id="modalResult"></div>
  </div>
</section>
<script>
const SB_URL = 'https://pleyuknjnprsckssxvrh.supabase.co';
const SB_KEY = 'sb_publishable_OVwo9zs5i6xl5iFykM6zJQ_GWFcf5zn';
const SUPABASE_POLL_MS = 2000;
const SLOTS = [
  { code: 'D0704-V0', label: 'V0. 의제 통합 동의', question: '두 의제를 하나의 통합 의제로 다루는 데 동의하십니까?', options: ['동의', '동의하지 않음', '판단 유보'], url: '/v/D0704-V0/', qr: '/0704-supabase-vote/d0704-v0-qr.png' },
  { code: 'D0704-V1A', label: 'V1A. 감축분야 추가 찬반', question: '감축분야 추가 의제를 선정하는 데 동의하십니까?', options: ['찬성', '반대', '판단 유보'], url: '/v/D0704-V1A/', qr: '/0704-supabase-vote/d0704-v1a-qr.png' },
  { code: 'D0704-V1B', label: 'V1B. 적응 의제 배분 찬반', question: '기존 적응분야 의제 2개를 적응분과 내에서 구분해 다루는 데 동의하십니까?', options: ['찬성', '반대', '판단 유보'], url: '/v/D0704-V1B/', qr: '/0704-supabase-vote/d0704-v1b-qr.png' }
];
let latest = new Map();
let activeCode = null;

function headers() {
  return { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` };
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
}

function emptyCounts(slot) {
  return Object.fromEntries(slot.options.map((option) => [option, 0]));
}

async function fetchTally() {
  const ids = SLOTS.map((slot) => slot.code).join(',');
  const url = `${SB_URL}/rest/v1/cv_tally?select=round_id,choice_text,n&round_id=in.(${ids})`;
  const response = await fetch(url, { headers: headers(), cache: 'no-store' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const rows = await response.json();
  const next = new Map();
  for (const slot of SLOTS) {
    next.set(slot.code, { ...slot, counts: emptyCounts(slot), responseCount: 0 });
  }
  for (const row of rows || []) {
    const slot = next.get(row.round_id);
    if (!slot) continue;
    const count = Number(row.n) || 0;
    slot.counts[row.choice_text] = count;
    slot.responseCount += count;
  }
  latest = next;
}

function bars(slot, feature = false) {
  const entries = Object.entries(slot.counts || emptyCounts(slot));
  const max = Math.max(1, ...entries.map(([, count]) => Number(count) || 0));
  return entries.map(([label, count]) => {
    const safeCount = Number(count) || 0;
    const width = Math.max(2, Math.round((safeCount / max) * 100));
    return `<div class="bar-row"><div class="bar-label">${escapeHtml(label)}</div><div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div><div class="bar-count">${safeCount}</div></div>`;
  }).join('');
}

function renderGrid() {
  document.getElementById('slotGrid').innerHTML = SLOTS.map((base) => {
    const slot = latest.get(base.code) || { ...base, counts: emptyCounts(base), responseCount: 0 };
    return `<article class="card slot">
      <div class="slot-head">
        <div>
          <h2>${escapeHtml(slot.label)}</h2>
          <p>${escapeHtml(slot.question)}</p>
        </div>
        <a class="qr" href="${slot.url}" target="_blank" rel="noopener">
          <img src="${slot.qr}" alt="${escapeHtml(slot.label)} QR">
          <span>${escapeHtml(slot.code)} QR</span>
        </a>
      </div>
      <div class="meta">
        <div class="row"><b>라운드</b><span>${escapeHtml(slot.code)}</span></div>
        <div class="row"><b>선택</b><span>${slot.options.map(escapeHtml).join(' / ')}</span></div>
        <div class="row"><b>응답</b><span><span class="count-pill">${slot.responseCount}명</span></span></div>
      </div>
      <div class="result">${bars(slot)}</div>
      <div class="actions">
        <a class="btn orange" href="${slot.url}" target="_blank" rel="noopener">응답 화면</a>
        <button class="btn blue" type="button" data-result="${slot.code}">결과보기</button>
      </div>
    </article>`;
  }).join('');
  document.querySelectorAll('[data-result]').forEach((button) => {
    button.addEventListener('click', () => openResult(button.dataset.result));
  });
}

function renderModal() {
  const slots = activeCode ? [latest.get(activeCode)].filter(Boolean) : SLOTS.map((slot) => latest.get(slot.code)).filter(Boolean);
  document.getElementById('modalResult').innerHTML = slots.map((slot) => `<article class="feature">
    <h3>${escapeHtml(slot.code)} · ${escapeHtml(slot.label)}</h3>
    <div class="total">${slot.responseCount}<small>명 응답</small></div>
    ${bars(slot, true)}
  </article>`).join('');
}

function openResult(code = null) {
  activeCode = code;
  renderModal();
  const modal = document.getElementById('resultModal');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
}

function closeModal() {
  const modal = document.getElementById('resultModal');
  modal.classList.remove('show', 'presentation');
  modal.setAttribute('aria-hidden', 'true');
  if (document.fullscreenElement === modal) document.exitFullscreen().catch(() => {});
}

async function tick() {
  try {
    await fetchTally();
    renderGrid();
    if (document.getElementById('resultModal').classList.contains('show')) renderModal();
    document.getElementById('status').textContent = `마지막 갱신 ${new Date().toLocaleTimeString('ko-KR')} · Supabase 직접 집계`;
  } catch (error) {
    document.getElementById('status').textContent = `Supabase 연결 오류: ${error.message}`;
  }
}

document.querySelector('[data-results="all"]').addEventListener('click', () => openResult(null));
document.querySelector('[data-close]').addEventListener('click', closeModal);
document.querySelector('[data-fullscreen]').addEventListener('click', async () => {
  const modal = document.getElementById('resultModal');
  const nextMode = !modal.classList.contains('presentation');
  modal.classList.toggle('presentation', nextMode);
  if (nextMode && modal.requestFullscreen) await modal.requestFullscreen().catch(() => {});
  if (!nextMode && document.fullscreenElement === modal) await document.exitFullscreen().catch(() => {});
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeModal();
});
tick();
setInterval(tick, SUPABASE_POLL_MS);
</script>
</body>
</html>
