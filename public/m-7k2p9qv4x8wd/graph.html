<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>숙의 지도 · 관계 그래프</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* 밝기는 발표자가 정한다 — 보는 사람의 OS·앱 테마를 따르지 않는다(리서치 §1: 회의장 프로젝터 기준).
   밝은 판이 기본이고, 어두운 판은 D 키 또는 ?theme=dark 로 켠다. 속성 이름을 data-polarity 로 둔
   것은 아티팩트 뷰어가 찍는 data-theme 과 섞이지 않게 하기 위해서다. */
:root{
  --bg:#edeff3; --panel:#ffffff; --ink:#151b28; --mute:#455066; --line:#c5cbd6; --edge:#6b7686;
  --t1:#6b4600; --t2:#0a4d6e; --t3:#12523f;
  --ov:rgba(237,239,243,.94);
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
:root[data-polarity="dark"]{
  --bg:#0f1626; --panel:#182036; --ink:#eef2f7; --mute:#a3adc2; --line:#2a3550; --edge:#4a5878;
  --t1:#f5b942; --t2:#5bc0eb; --t3:#7ee2a8; --ov:rgba(15,22,38,.94);
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#net{position:fixed;left:0;top:190px;bottom:112px;width:63vw}
#net div,#net canvas{outline:none}   /* vis 기본 CSS 를 싣지 않으므로 캔버스 포커스 외곽선을 직접 끈다 */
.hud{position:fixed;left:40px;top:28px;right:37vw;pointer-events:none}
.hud .eyebrow{font-size:24px;color:var(--mute);letter-spacing:.06em;font-weight:700}
.hud h1{margin:4px 0 0;font-size:44px;line-height:1.15;font-weight:900;text-wrap:balance}
.hud .crumb{margin-top:8px;font-size:26px;color:var(--mute);font-weight:700}
.hud .crumb b{color:var(--ink)}
#side{position:fixed;right:0;top:190px;bottom:112px;width:37vw;background:var(--panel);
      border-left:3px solid var(--line);padding:28px 36px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#side .head{font-size:28px;font-weight:900;line-height:1.2}
/* 기대 효과 — 상태 문장이라 옛 표제(명사구)보다 3배 길다. 제목줄(crumb)은 한 줄이라 캔버스를 침범하므로
   여기로 옮겼다. 이 패널만 세로가 늘어도 되는 자리다 — 아래 목록(ol)이 flex:1 이라 그만큼 줄어든다. */
#side .want{font-size:24px;line-height:1.35;font-weight:700;color:var(--ink);
      border-left:8px solid var(--accent,var(--ink));padding-left:14px}
#side .want:empty{display:none}
#side .want .wl{display:block;font-size:20px;font-weight:700;color:var(--mute);letter-spacing:.04em;margin-bottom:2px}
#side .sub{font-size:22px;color:var(--mute);font-weight:700}
#side .slinks{display:flex;gap:10px;flex-wrap:wrap}
#side .slinks a{font-size:22px;font-weight:700;color:var(--panel);background:var(--accent,var(--ink));padding:6px 14px;border-radius:8px;text-decoration:none}
#side .big{font-size:88px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent,var(--ink))}
#side .big small{font-size:24px;color:var(--mute);margin-left:12px;font-weight:700}
#side ol{list-style:none;margin:6px 0 0;padding:0;overflow:auto;flex:1;min-height:0}
#side li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline;padding:5px 8px;
        font-size:22px;line-height:1.3;border-radius:6px;cursor:pointer}
#side li:hover,#side li:focus{background:var(--bg);outline:none}
#side li .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#side li .no{font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent,var(--ink))}
#side li .who{font-weight:700}
#side li .cut{color:var(--mute)}
#side li.sum{grid-template-columns:1fr auto;font-size:26px;padding:10px 8px;border-bottom:2px solid var(--line);border-radius:0}
#side li.sum .n{font-weight:900;font-variant-numeric:tabular-nums}
.foot{position:fixed;left:40px;right:40px;bottom:24px;display:flex;justify-content:space-between;
      align-items:flex-end;gap:32px;pointer-events:none}
.foot .note{font-size:20px;color:var(--mute);max-width:58vw;line-height:1.35}
.foot .keys{font-size:22px;color:var(--mute);font-weight:700;white-space:nowrap}
.foot .keys kbd{display:inline-block;background:var(--panel);border:2px solid var(--line);
      border-radius:8px;padding:2px 12px;color:var(--ink);font-family:inherit;margin:0 4px}
#ov{position:fixed;inset:0;background:var(--ov);display:none;align-items:center;
    justify-content:center;padding:6vh 8vw;cursor:pointer}
#ov.on{display:flex}
#ov .card{background:var(--panel);border-left:16px solid var(--accent,var(--ink));border-radius:6px;
    padding:48px 56px;max-width:1400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.18)}
#ov .who{font-size:40px;font-weight:900;margin:0 0 6px}
#ov .kind{font-size:24px;color:var(--mute);font-weight:700;margin:0 0 24px}
#ov .txt{font-size:32px;line-height:1.55;margin:0;white-space:pre-wrap;max-height:60vh;overflow:auto}
#ov .id{font-size:20px;color:var(--mute);margin:24px 0 0;font-variant-numeric:tabular-nums}
.fallback{display:none;padding:48px;font-size:28px;line-height:1.6}
/* 전체화면이 아닌 창(높이 820px 이하)에서는 제목·하단을 줄여 캔버스 높이를 되찾는다 */
@media (max-height:820px){
  .hud .eyebrow{display:none} .hud h1{font-size:36px} .hud .crumb{font-size:22px;margin-top:4px}
  #net,#side{top:130px;bottom:78px} .foot{bottom:14px} .foot .note{font-size:17px} .foot .keys{font-size:19px}
  #side{padding:18px 28px} #side .want{font-size:22px} #side .want .wl{font-size:19px}
}
</style>
</head>
<body>
<div id="net"></div>
<div class="hud">
  <div class="eyebrow">제5차 조별 산출물에서 뽑은 숙의 지도</div>
  <h1 id="title">세 의제 · 시민 발언 494건</h1>
  <div class="crumb" id="crumb">의제를 누르면 범주가, 범주를 누르면 발언이 터져 나온다</div>
</div>
<div id="side"><div class="head" id="s-head"></div><div class="want" id="s-want"></div><div class="sub" id="s-sub"></div><div class="slinks" id="s-links"></div><div class="big" id="s-big"></div><ol id="s-list"></ol></div>
<div class="foot">
  <div class="note"></div>
  <div class="keys"><kbd>Space</kbd> 다음 <kbd>←</kbd> 되돌리기 <kbd>R</kbd> 처음 <kbd>D</kbd> 밝기</div>
</div>
<div id="ov"><div class="card"><p class="who" id="ov-who"></p><p class="kind" id="ov-kind"></p>
  <p class="txt" id="ov-txt"></p><p class="id" id="ov-id"></p></div></div>

", "kind": "바라는 변화"}, {"id": "1-2-T2-028", "no": "10", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "순환경제청에서 모든 포장용품과 용기를 표준화하고 관리", "kind": "바라는 변화"}, {"id": "1-2-T2-029", "no": "11", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "생산, 사용, 배출 통제", "kind": "바라는 변화"}, {"id": "1-2-T2-030", "no": "12", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "소비자는 부담없이 배달음식, 상품 주문하고 사용하게 됨,", "kind": "바라는 변화"}, {"id": "1-3-T2-009", "no": "13", "who": "3조 1명", "who_parts": null, "team": "3조", "text": "예전에 포장을 안했던 90년대 시기처럼 포장 용기를 다회용기로 변경하기. 포장, 제작을 없애고 줄이기. 저탄소 인증제도를 확대하고 신소재를 개발해서 제품 제작시 탄소 배출을 줄임. 사람들이 트렌드에 예민한 부분을 마케팅화 하고 네일아트를 지양해 건강한 손톱을 보여주기식으로 하기. 수입 제품의 수입 기준을 높여 저탄소 제품을 수입할 수 있게 하길 바람. 무분별한 굿즈 제작을 최소화하고, 우주개발 프로젝트로 지구의 탄소를 포집해 탄소를 활용해 낮추기.", "kind": "바라는 변화"}, {"id": "1-4-T2-001", "no": "14", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "기업이 원자재 생산방식(기계)를 바꿈으로서 재활용쓰레기 상승 , 온실가스 감소", "kind": "바라는 변화"}, {"id": "1-4-T2-004", "no": "15", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "재사용 회수비용 제고", "kind": "바라는 변화"}, {"id": "1-4-T2-009", "no": "16", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "재생에너지 확대 예를들면 화장품통 재사용 방법강구", "kind": "바라는 변화"}, {"id": "1-4-T2-010", "no": "17", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "소비자가 물건을 오래쓰고 가계 가전제품 표준화 비용 절감", "kind": "바라는 변화"}, {"id": "1-4-T2-025", "no": "18", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "기업의 변화를 위해서는 산업변화를 위해서 온실가스 배출을 줄이는 방안을 재사 용을 늘리고 도로 연동제도가 필요하다.", "kind": "바라는 변화"}], "gist": "분리배출을 해도 시민에게 돌아오는 이득 없음, 가구 폐기 스티커 부담, 재활용품 제조 자체의 모순, 과대포장 문화, EU 포장재 규제와 아시아 공동 규제 필요, 패트병 포장지 제거의 번거로움, 지역별 배출 기준 상이, 복합소재·기업 미수거", "empty": false, "worry": false}, {"id": "EF-1-02", "name": "기업 책임의식과 브랜드 가치", "want": "친환경 제품을 만드는 기업이 욕먹지 않고 돈도 잘 벌어, 사회에 돌려주는 일이 당연해진다", "items": [{"id": "1-1-T1-004", "no": "01", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "기업이 온실가스를 감축하지 않으면 감축할 때보다 돈이 더 많이 든다는 문제가 받아들여져야 될 것 같다. 선순환 구조가 이루어져야 할 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-005", "no": "02", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "우리 경제와도 많이 맞물려있다고 생각이 든다. 재벌을 키우는 시대가 있었다. 그래서 그들이 매우 커진 것이다. 그걸 국가에서 제재를 하려고 하면 이윤이 줄어드니까 싫은 거다. 이런 선순환 구조로 가려고 하는 과도기인 것 같다. 기업에게 강제성을 띠면 반발이 나고 물가가 올라갈 것 같고, 왜 나라에서 우리 기업에 왜 태클을 거냐는 소리가 나올 수 있으니 마인드가 개선되어야 할 것 같다. 기업이 뭔가를 해야 하는데 국가가 뭘 해준다고 해서 기업이 받아들일지가 의문이다.", "kind": "문제 인식"}, {"id": "1-1-T1-018", "no": "03", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "자본주의 사회이다보니 기업은 최대 이윤을 추구하고 싶겠고 계속해서 성장을 하기를 기업도, 국가도 계속 성장을 추구하기 때문에 어쩔 수 없이 그렇게 되는 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-025", "no": "04", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "기업 입장에서는 비용도 많이 들겠지만 책임의 무게가 너무 가볍기 때문도 있는 것 같다. 책임의 무게를 더 느낄 수 있게 하는 것도 필요할 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-028", "no": "05", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "기업이 하려고 하고 정부에서 이것저것 해줘도 스스로 탄소배출을 줄여야 된다는 강한 인식이 덜한 것 같다. 그래서 그 인식을 심어줘야 될 것 같다.", "kind": "문제 인식"}, {"id": "1-2-T1-019", "no": "06", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "비용. 돈이다. 비용과 이윤이 남아야하기 때문임.", "kind": "문제 인식"}, {"id": "1-2-T1-038", "no": "07", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "국가에서 중소기업에 어느정도는 제공해줘야한다고 생각함. 기업의 수익이 사회적으로 환원될 수 있는 방안을 찾아야 함.", "kind": "문제 인식"}, {"id": "1-2-T1-044", "no": "08", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "(1) 에어컨 없이도 쾌적한 유럽 VS 덥고 습한 동남아시아: 환경과 경제가 양립할 수 없을것이라 생각이 됨. (2) 기업의 수익VS ESG활동 비용", "kind": "문제 인식"}, {"id": "1-4-T1-010", "no": "09", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "기업환경문제의식보다 이업익 경쟁이 먼저이어서 문제이다.", "kind": "문제 인식"}, {"id": "1-5-T1-002", "no": "10", "who": "5조 1명", "who_parts": null, "team": "5조", "text": "대기업은 협력업체에 ESG를 요구하면서 대기업은 시늉만 하는 경우가 아쉽다.", "kind": "문제 인식"}, {"id": "1-1-T2-004", "no": "11", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "탄소배출권에 대한 세부적인 유기적인 변화와 규제가 필요하다는 생각이 있고, 정책이 적용이 잘 됐을 때 기업입장에서는 이때까지 돈을 안 냈었기에 내라고 하면 부당하다고 생각될 수도 있지만, 이게 우리가 올바르게 져야 하는 책임이었구나 라는 의식이 어느정도 생길 것 같다. 그럼 앞으로 기업들이 디벨롭하는 과정에서 환경적 리스크를 져야 하는 거구나 라는 의식이 깊숙한 곳에서 생길 수 있지 않을까 싶다. 기업 스스로가 그런 걸 마련하는 미래가 올 수도 있지 않을까 하는 기대가 있다.", "kind": "바라는 변화"}, {"id": "1-1-T2-006", "no": "12", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "사회에 환원하는 거에 대해서 당연하다고 생각하는 세상이 되면 좋겠고 그렇게 되어야 한다고 생각한다.", "kind": "바라는 변화"}, {"id": "1-1-T2-009", "no": "13", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "이미 당연히 친환경적인 걸 하고 있으면서 욕 안 먹고 돈 잘 벌고 그게 짱인 것 같다.", "kind": "바라는 변화"}, {"id": "1-1-T2-010", "no": "14", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "기업에서는 친환경적인 제품을 만든다는 프라이드나 마인드도 중요한 것 같다.", "kind": "바라는 변화"}, {"id": "1-1-T2-011", "no": "15", "who": "1조 8명", "who_parts": null, "team": "1조", "text": "기부를 했을 때 기분이 좋아지듯이 기업 입장에서도 기부하는 기업, 기부하는 나라 이런 식으로. 좋은 일을 하니 나라도 발전이 될 것이고. 이런 것도 좋을 것 같다.", "kind": "바라는 변화"}, {"id": "1-2-T2-017", "no": "16", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "기업의 사회적 책임 의무 강화 > 친환경기업의 기업브랜드 가체 제고를 통한 경쟁력 제고 > 인센티브, 사회적 공감력 제고, 브랜드 이미지가 올라감으로써 소비자가 많이 사주어 결국 기업의 경쟁력 역시 올라갈 것이다.", "kind": "바라는 변화"}, {"id": "1-4-T2-014", "no": "17", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "기업들의 환경을 생각하는 인식이 높아져서 온실가스 줄이는 것에 적극 동참", "kind": "바라는 변화"}, {"id": "1-4-T2-026", "no": "18", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "탄소감축 성과가 인정받아 기업브렌드가치 상승으로 기업의 이윤이 발생하는 선순환 효과 발생", "kind": "바라는 변화"}], "gist": "감축 안 할 때 비용이 더 크다는 문제 미수용, 재벌 규제에 대한 반발과 마인드, 자본주의의 최대이윤 추구, 책임의 무게가 가벼움, 자발적 감축 인식 부족, 비용·이윤 우선, 수익의 사회 환원 요구, 수익 대 ESG 비용, 이윤 경쟁이 환경의식보다 앞섬, 대기업이 협력사엔 ESG를 요구하며 스스로는 시늉", "empty": false, "worry": false}, {"id": "EF-1-03", "name": "대기질 개선과 기후재해 완화", "want": "미세먼지가 걷혀 하늘의 별이 다시 보이고, 네 계절이 제자리를 찾는다", "items": [{"id": "1-1-T1-031", "no": "01", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "온실가스. 온실은 따뜻한 것. 이산화탄소가 쪼개져서 탄소가 돼서 문제가 되는 거다. 이산화탄소를 줄일 생각을 해야 한다.", "kind": "문제 인식"}, {"id": "1-1-T1-032", "no": "02", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "조림사업이 중요하다고 생각한다. 아마존의 엄청난 자원들을 우리가 썼지 않느냐.", "kind": "문제 인식"}, {"id": "1-1-T1-044", "no": "03", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "산업혁명 이후에 지금 지구 온도가 1.2도가 올라갔다고 한다. 열에너지가 땅덩어리에 다 있다는 것이다. 용머리해안에도 해수면이 올라가서 아예 못 들어가는 곳도 있다.", "kind": "문제 인식"}, {"id": "1-1-T2-016", "no": "04", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "하늘에서 별 본 적이 오래됐다. 저 어릴 적에는 별이 잘 보였다. 앞으로 기후변화가 좋은 방향으로 돼서 옛날처럼 별을 잘 볼 수 있었으면 좋겠다.", "kind": "바라는 변화"}, {"id": "1-1-T2-017", "no": "05", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "과거 월드컵 경기할 때 공기 맑아야 되니까 공장 돌리지 말라고 해서 공기가 맑았었다. 탈황화 설비를 의무화했다. 기술도 시원찮았고 계속 그런 설비들이 발전하는 와중에 초기의 제품은 단가가 비싸지만 이나라 저나라에서 하면 단가가 떨어진다. 마침 그때 축구도 하고 정부에서 하라고 하니까 깨끗해졌다. 자연환경이 좋아져서 하늘의 북두칠성도 볼 수 있으면 좋겠다. 도로 달릴 때 창문을 열고 차를 탈 수 있는 사회가 되면 좋겠다.", "kind": "바라는 변화"}, {"id": "1-1-T2-021", "no": "06", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "롯데타워 갔을 때 꼭대기에서 보니까 미세먼지가 깔려있었다. 미세먼지 없이 깨끗하게 보고 싶었다. 탄소 배출이 줄어들면 미세먼지가 줄어들 것 같다.", "kind": "바라는 변화"}, {"id": "1-1-T2-031", "no": "07", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "과거에 서울의 공기가 좋지 않았는데, 몇 년 후 개선이 되기도 했었다. 서울에 있는 기업이 탄소 배출이나 이런 게 적어지게 되면 대기질이 좋아져서 우리 국민 건강에 도움이 되지 않을까 싶다.", "kind": "바라는 변화"}, {"id": "1-2-T2-003", "no": "08", "who": "2조 1명", "who_parts": null, "team": "2조", "text": "분명한 계절(4계절) 정상적인 기후변화 (기후문제에가 없어서 폭염, 홍수, 가뭄이 사라짐)", "kind": "바라는 변화"}, {"id": "1-4-T2-002", "no": "09", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "점점 자연 복구, 온난화 해소가 될 것이다.", "kind": "바라는 변화"}, {"id": "1-4-T2-003", "no": "10", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "해결이 안된다면 기후온난화가스 상승, 지구가 요동치기 시작할 것이며, 지구가 멸망할 것이라고 생각한다.", "kind": "바라는 변화"}], "gist": "이산화탄소 감축 필요, 조림사업 필요, 산업혁명 이후 1.2도 상승과 해수면 상승", "empty": false, "worry": false}, {"id": "EF-1-04", "name": "저탄소 인증·정보공개와 신뢰", "want": "무엇이 친환경인지 소비자가 확인할 수 있어, 믿고 사는 사회가 된다", "items": [{"id": "1-1-T1-022", "no": "01", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "몸에 좋은 걸 위해 좀 더 비싸더라도 친환경 벽지를 샀는데, 이 벽지가 진짜 친환경 벽지인지 모르겠었다. 이게 과연 친환경적일까. 사후 검증이 진짜 필요하다고 생각한다. 만약 친환경 시멘트 생산했다 하면 어떤 과정으로 마크를 획득하고 어떻게 제작했는지 알 수 있도록 하는 과정이 필요한 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-038", "no": "02", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "내가 이걸 샀을 때 어떤 기여가 있는지에 대해 결과적으로 피부에 와닿을 수 있는 정보가 미흡한 게 문제인 것 같다. 비싼 친환경 제품을 산다고 해도 내 삶의 변화에 생기는 게 없다보니까 구매 욕구를 잘 못 일으키는 것도 있는 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-046", "no": "03", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "기업이 아무리 친환경 제품을 만들어도 소비자들이 차이를 알아차리지 못하는 게 문제라고 생각한다.", "kind": "문제 인식"}, {"id": "1-2-T1-020", "no": "04", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "강압이나 압박이 부족함. 지금도 정책을 보면 친환경 정책은 잘 되어있는 상태임. 친환경 인증마크 등도 잘 부여되고 있음. 일반 소비자는 그런걸 신경 안쓰게 됨. 비용적인 것을 신경쓰게 됨. 그러다보니 기업 입장에서는 그러한 투자를 할 동기가 생기지 않음. 친환경마크가 있는 기업의 것만 소비할 수 있게끔 하는 방안이 있지 않을까 하는 생각이 듬. (정책적 부분)", "kind": "문제 인식"}, {"id": "1-2-T1-022", "no": "05", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "대기업은 시스템이 있을 수 있는데 중소기업은 내가 얼마나 탄소배출을 하고 있는지에 대한 인지가 없을 수 있음. 따라서 어디서 어떻게 줄여야할지에 대한 생각도 없을 수 밖에 없음. 자기인식, 측정 등이 필요한 것으로 생각됨.", "kind": "문제 인식"}, {"id": "1-2-T1-023", "no": "06", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "그런것들을 측정할 수 있는 사이트가 있음. 홍보, 법적인 의무, 영세기업에도 적용이 되는지 여부 등을 파악해야함.", "kind": "문제 인식"}, {"id": "1-3-T1-002", "no": "07", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "탄소 감축에 있어 기업이 필요성은 알고 있지만 실천을 못하고 있음. 대가성 때문인 것 같음. 탄소 감축에 대한 정보 공시(큐알, 바코드 등)가 필요함. 탄소감축이 적정 수준으로 간다면 인센티브 제공, 가산제를 통해 기업의 투자에 대해서 보상이 필요함.", "kind": "문제 인식"}, {"id": "1-4-T1-006", "no": "08", "who": "4조 2명", "who_parts": null, "team": "4조", "text": "기업이 배출하는 탄소배출총량을 정확하게 알아야 한다. (정확한 측정)", "kind": "문제 인식"}, {"id": "1-5-T1-012", "no": "09", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "환경정보에 대한 국제적인 데이터의 공유가 되지 않는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-5-T1-013", "no": "10", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "유해성분에 대한 표시가 확실하게 이루어지지 않는 것이 문제다. 탄소저배출 제품을 촉진하지 않는 제도가 없는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-1-T2-007", "no": "11", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "이제 친환경적으로 믿고 살 수 있는 사회가 되는 거다. 언젠가는 그런 시대가 왔으면 하다. 이런 게 피부로 느껴질 수 있는 변화가 있으면 좋겠다.", "kind": "바라는 변화"}, {"id": "1-1-T2-008", "no": "12", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "소비자의 요구가 있다면, 기업은 소비자들의 요구를 무시할 수는 없으니까 이를 어느정도는 받아들여서 친환경적인 게 생산이 더 많이 될 수 있을 것 같다. 소비자의 입장에서는 항상 안전한 상태에서 믿고 살 수 있을 수 있을 것 같다.", "kind": "바라는 변화"}, {"id": "1-1-T2-015", "no": "13", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "믿고 거래하는 게 되는 사회가 이루어질 것 같다. 기업과 저도 신뢰하는 선순환이 될 것 같다. 허리케인 같은 것도 예전에도 있었지만 기후위기로 더 많아졌고, 경북 경산에도 40도까지 올라서 한증막에 사는 것 같다고 한다. 우리나라도 기후위기에 급박하게 처해있는 상황이다. 젊은 분들은 살아가야 하는 시대이니까 그분들이 어떻게 살아가야 할지에 대해서 이 의제가 중요하다고 생각한다. 더운 거에 그치지 않고, 생존에 필요한 모든 것들에 다 문제가 생기기 때문에 염려가 많이 된다. 굉장히 중요하다고 생각이 든다. 홍보도 필요한 것 같다.", "kind": "바라는 변화"}, {"id": "1-3-T2-002", "no": "14", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "개인용품에 사용 연한 기준이 있으면 좋겠음. 제품 정보를 QR로 만들어 주면 좋겠음. 기업에 인센티브를 주고, 기업의 세금이 순환 경제의 하나로 지역에 환원되길 바람. 예로 전기가 많이 생산되는 지역 내에서 기업이 활성화 될 경우 인근 지역에 (기업활성화로 지역에 재원이 늘어나면)환원.", "kind": "바라는 변화"}, {"id": "1-3-T2-010", "no": "15", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "저탄소를 하려면 모든 물건에 인증마크가 있으면 좋겠음. 포장도 줄이고, 기업이 많이 (탄소감축)노력하고, 탄소가 많이 줄어들기 바람.", "kind": "바라는 변화"}, {"id": "1-4-T2-015", "no": "16", "who": "4조 2명", "who_parts": null, "team": "4조", "text": "예를들면 소비자가 볼 수 있는 알수있도록 행동", "kind": "바라는 변화"}], "gist": "친환경 표시의 진위를 확인할 수 없음, 구매 기여가 피부에 안 와닿음, 소비자가 차이를 알아채지 못함, 친환경마크가 소비로 이어지지 않음, 중소기업의 배출량 자기인식·측정 부재, 측정·공시의 법적 의무와 영세기업 적용 미확인, 정보 공시(QR·바코드) 필요, 배출총량의 정확한 측정 필요, ESG 준수 기업 구분 제도 없음, 유해성분 표시 미비", "empty": false, "worry": false}, {"id": "EF-1-05", "name": "ESG·RE100 달성과 수출", "want": "우리 기업이 해외 ESG 기준을 갖춰 수출이 늘고, 친환경 기업에 투자가 몰린다", "items": [{"id": "1-1-T1-006", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "우리나라 내에서만 기업들에게 강제한다거나 권고하는 문제로 끝나면 이건 큰 문제는 아니겠지만 재생에너지를 쓰지 않는식으로 생산한 제품은 우리가 사지 않겠다. 수입을 하지 않는다. 관세를 많이 매긴다거나 등의 규제를 유럽에서는 이미 하고 있는데, 이게 일반화된다면 적극적으로 바뀔 수 있지 않을까 싶다.", "kind": "문제 인식"}, {"id": "1-2-T1-037", "no": "02", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "국내기업의 입장에서는 다소 억울할 것으로 생각됨. 이미 실천하고 있는 기업 입장에서는 이미 관심을 쏟고있음. 현재 한국은 제조업 국가로 수출을 해야 살아남는 회사인데, 환경적인 고민까지 같이 해야하라고 하면 두 개를 둘다 가져가기가 힘들 것으로 생각됨. 이제야 따라가가가 기업의 생존력에서는 어려운 문제라고 생각이 듬. 국내기업 입장에서는 룰의 결정권이 너무 없는 문제가 있을 수 있음.", "kind": "문제 인식"}, {"id": "1-1-T2-013", "no": "03", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "기술력 개발해서 인정받으면 지원도 해주고 수출 규제 완화시켜주고 세금 혜택도 주면 좋을 것 같다고 생각을 한다.", "kind": "바라는 변화"}, {"id": "1-2-T2-005", "no": "04", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "국내기업의 세계화 (경쟁력 강화)", "kind": "바라는 변화"}, {"id": "1-2-T2-019", "no": "05", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "온실가스 배출 감소로 인한 해외 esg re100 기준달성으로 인해 수출량 증가", "kind": "바라는 변화"}, {"id": "1-3-T2-001", "no": "06", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "주변 어디에서나 볼 수 있는 제로 웨이스트 매장, 탄소 저감 설비 및 저탄소 솔루션 기업의 해외 수출 및 기업 수 상승으로 (많은)세금 징수, 기업 및 공공기간 내 일회용품 사용을 안함, 탄소 저감으로 인한 제품 가격 상승으로 해외에서 경쟁력 하락(부정적), 소비자의 자연스러운 탄소 저감 제품 선택", "kind": "바라는 변화"}, {"id": "1-3-T2-005", "no": "07", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "상장된 회사들이 ESG를 활성화하면 ESG 추종 펀드로 투자가 확대되고 자본 확충으로 주가 상승되어 신기술에 투자가 가능.", "kind": "바라는 변화"}, {"id": "1-4-T2-021", "no": "08", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "기업의 RE100충족 및 실질적 탄소배출 절감 가능", "kind": "바라는 변화"}], "gist": "유럽의 수입 규제·관세 장벽, 제조업 수출국으로서의 이중 부담과 룰 결정권 부재, 수입·수출 간 친환경 기준 갭에 대한 제도 부재", "empty": false, "worry": false}, {"id": "EF-1-06", "name": "저탄소 기술개발과 공정 혁신", "want": "덜 오염시키고 덜 버리는 기술로 물건을 만들어, 사람과 환경을 살리는 산업이 된다", "items": [{"id": "1-1-T2-012", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "기술이 발전함에 따라서 적게 환경을 오염시키는 기술들이 생기고 부정적인 게 줄어들고 있다는 연구자료가 있다는 책을 읽은 적이 있다. 기업 입장에서도 긍정적으로 생각해보면, 기업이 더 나은 방법을 강구해냈을 때 더 높은 기술력과 효율성을 갖게 되는 게 아닐까. 장기적인 입장에서는 이런 기술과 힘이 생기는 거라고 생각을 한다.", "kind": "바라는 변화"}, {"id": "1-1-T2-014", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "기술 개발, 기술 연구 개발 활동이 활발해진다거나 그럼 기업 경쟁력이 높아지고 글로벌 기업으로 나아갈 수 있지 않을까 싶다.", "kind": "바라는 변화"}, {"id": "1-2-T2-009", "no": "03", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "한국만의 생산시설모델 환경+효율성.", "kind": "바라는 변화"}, {"id": "1-2-T2-020", "no": "04", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "이를 위한 방법: 설비 폐기물 원재료를 탄소배출 저감 고려해서 변경한다면, 이를 내부기준을 충족하는 신규 설비, 폐기물, 원재료 등등 협력업체를 찾아야 함. 이러한 플로우를 만들어내기 위한 노력을 해야 온실가스 감축 효과가 발생할 것. > 이러려면 체제 개선과 지원이 필요함.", "kind": "바라는 변화"}, {"id": "1-3-T2-003", "no": "05", "who": "3조 1명", "who_parts": null, "team": "3조", "text": "신기술이 사람과 환경을 살리고 더 나은 미래를 만드는데 사용되길 바람. 일자리를 빼앗기 보다 사람과 기술이 함께 발전하는 방향으로 사용되길 바람.", "kind": "바라는 변화"}, {"id": "1-4-T2-008", "no": "06", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "계속 만들고 사용하면서 새로운 것을 재생에너지 재생자원이 덜 버려지는 세상이 되어야 한다고 생각한다. 기술발전 혁신 (재생에너지 효율적 사용)", "kind": "바라는 변화"}], "gist": "", "empty": true, "worry": false}, {"id": "EF-1-07", "name": "친환경 산업 육성과 중소기업", "want": "재정이 약한 기업도 전환 비용을 감당할 수 있게 되고, 친환경 산업의 일자리가 늘어난다", "items": [{"id": "1-1-T1-002", "no": "01", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "기업은 이윤을 추구하는데, 재활용을 하는 건 비용이 많이 드니까 기업 이윤 추구에 문제가 생긴다는 점에 관심을 갖고 있었다. 온실가스를 감축하려면 돈이 많이 들어서 기업의 이윤 추구와 모순이 된다는 점에서 정부 차원의 지원이 필요하다. 일반 시민으로서 얼만큼의 지원을 어떻게 받을 수 있는지가 모호하고, 이 부분이 해결되어야 할 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-009", "no": "02", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "재정이 탄탄한 대기업이나 중견기업은 시키면 할 수 있는데, 재정이 취약한 업체들이 문제라고 생각한다. 예를 들어 도자기를 만드는 회사라면 대기업의 경우 탄소 배출 절감 시설을 설치할 수도 있겠으나 중소기업들은 힘들다. 대기업보다는 재정이 취약한 기업체를 대상으로 지원이나 홍보를 해서 끌어낼 수 있는 게 필요할 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-013", "no": "03", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "그게 장벽이기는 하지만 장기적으로 보면 재생에너지를 쓰는 것이 지구에 더 좋지 않을까요? 중소기업이 독자적으로 기업활동을 하는 경우도 있지만 협력사로 연결되어 있다. 대기업에게 책임을 지운다기보다는 대기업에게 보상을 주고 파트너십 형성, 교육을 한다거나 중소기업 파트너들과의 그런 관계 속에서 훈련, 학습될 수 있도록 하는 방안도 효과적일 것 같다. 중소기업은 탄소배출권에 대한 인식이 부족하다. 인식을 높이기 위해서는 노력이 필요하겠다. RE100은 재생에너지를 활용해서 생산하자는 취지인데, 뜬구름처럼 느껴진다. 재생에너지를 활용해서 한 걸 어떻게 수치화할 수 있는지 잘 모르겠다.", "kind": "문제 인식"}, {"id": "1-1-T1-014", "no": "04", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "재생에너지를 하려면 중소기업에서는 단가를 낮춰야 하는데 재생에너지를 활용하면 단가가 오르기 때문에 중소 업체에서는 더 힘든 거죠. 그래서 일부러 모르는척 하는 걸수도 있으니 국가에서 금액적으로 지원해줄 수 있는 게 필요하다고 생각한다.", "kind": "문제 인식"}, {"id": "1-1-T1-021", "no": "05", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "산업의 종류가 치우쳐 있어서 그런 것 같다. 온실가스가 많이 발생하는 기업이 많았던 거죠. 친환경 비즈니스 모델을 제시를 해서 친환경 시멘트를 만들 때 기존에 시멘트를 만들던 사람한테 친환경 시멘트를 만들 수 있는 교육이 들어가야 될 것 같다. 계속 똑같은 산업으로 돈을 벌게 될 테니 그 사람들을 유인하는 거다. 유인을 할 때 지원금을 주거나 세제혜택을 주거나, 구체적으로 교육을 제시할 수도 있는 건데, 해외의 좋은 사례를 수입할 수도 있는 거다. 이때 수입 비용을 지원해주거나 국가 차원에서 연결해주거나. 하는 게 좋을 것 같은데 하던 것만 계속 하기 때문에 우선 먹고 사는 일이기 때문에 쉽게 바꿀 수가 없었던 것 같다. 국가 차원에서 친환경적이면서도 지속가능한 선진화된 것들을 정부 차원에서 교육적, 재료적 수입을 지원해서 물꼬를 터주면 좋을 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-023", "no": "06", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "친환경적으로 노력하는 기업에게 비용을 지원해주는 접근이 어떨까 싶다.", "kind": "문제 인식"}, {"id": "1-2-T1-016", "no": "07", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "탄소감축의 현실. 친환경 고열설비나 재생에너지로 해야하는데 초기 투자 비용이 너무 부담이 됨. 비용적 여력이 없음. 초기 투자의비용의 문제를 어떻게 해야할지가 문제된다고 생각함.", "kind": "문제 인식"}, {"id": "1-2-T1-017", "no": "08", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "제일 중요한 점은 기업의 관심이라고 생각. 기업운영의 목적은 경제적 문제. 중요한 것은 본인의 마음. 정부에서 관심을 가지고 기업을 지원해줄 방안을 찾아야 할 것. 관심을 가지는게 중요함. 네팔문제도 그렇고 많이 느꼈을것이라 생각함. 정부에서 깨우칠 수 있도록 지원해야함.", "kind": "문제 인식"}, {"id": "1-2-T1-027", "no": "09", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "홍보가 영세한 기업에 대해서는 잘 안될 수 밖에 없음. 영세한 기업에 많이 신경을 써줘야 함. 폐기물 소각장의 경우 정부에서 기준치가 표시가 되어있는데 기준치가 넘어가는 것에 대한 통제가 잘 되어있음. 그러나 플라스틱 제조업 등 중쇼기업에서 처리하는 과정에서도 재활용의 과정에서 탄소배출과 오염 등에 대해 발생하는 것에도 신경을 써야할 것으로 생각이 됨. 이런걸 정부에서 연구해서 업체에 잘 알려주면 탄소배출을 많이 줄일 수 있지 않을까 하는 생각이 듬. 플라스틱을 예로 들자면 종류가 굉장히 많은데 종류에 다라서 독가스나 이런것들이 배출되는 수도 굉장히 큼.", "kind": "문제 인식"}, {"id": "1-3-T1-001", "no": "10", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "기업의 규모에 따라서 탄소 감축에 따른 예산이 다르고, 기술력·인프라가 다양하고 부족한 것 같고, 국내 제도의 한계로 인해 탄소 감축에 대해서 중요성·필요성을 느끼는 것이 다름. 유럽은 탄소감축을 하고 있는데, 우리나라가 수출하려면 탄소감축이 필요하기 때문에 대기업에서 하청에도 요구하고 있어서 수출에 문제가 됨. 소비자의 인식 부족이 문제임. 해썹의 경우 해썹마크가 없으면 안 사는 것처럼 (소비자가 탄소 감축)인식을 못하는게 문제. 그러나 가격이 올라가면 소비자 부담으로 기업은 생산 안하게 됨(소량 제작, 추가 공정). 중소기업의 경우 기술력이나 인프라가 없어서 감축을 못하고 있음.", "kind": "문제 인식"}, {"id": "1-3-T1-008", "no": "11", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "탄소 배출에 대한 절실한 문제점을 소극적으로 인지하고 있는 것 같음. 기업의 원료가 탄소가 배출되는 원료를 대체하면 좋을 것 같음. 기업의 재정.입장이 다른데 교육, 정부정책, 인텐시브를 일률적으로 하는 것이 기업에 어려움을 준다.", "kind": "문제 인식"}, {"id": "1-4-T1-001", "no": "12", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "업효율성 (비용으로 간주) 주주가치제고 (눈치) - 중소기업의 인력 및 자원부족 - (대기업은 탄소감축을 위한 인적 및 시스템을 가추고 있기에 협력업체와 공급망 업체에 관련 지식과 인프라를 제공하는 원바운드 체계구축", "kind": "문제 인식"}, {"id": "1-4-T1-003", "no": "13", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "각 기업이 무슨 상품을 어떻게 생산하는지 정부의 환경대책전문가에게 시장조사, 수집해서 각 업체가 할 수 있는 제안과 정보보조금 지원해서 전국업체가 온실화 정책실천하게 만들자 (환경정책 연구원이 대기업 중소기업순으로 조사 및 아이디어 제시 및 조사 및 실천하기(정부보조금으로), 정부의 적극적 참여필요 (생산수단의 대한 비용)", "kind": "문제 인식"}, {"id": "1-4-T1-005", "no": "14", "who": "4조", "who_parts": null, "team": "4조", "text": "기업이 움직이지 못하는 이유는 돈이 많이 들어가기 때문이라고 생각함.", "kind": "문제 인식"}, {"id": "1-4-T1-008", "no": "15", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "제조업이 발달한 우리나라 구조상 자금부족, 기술부족 - 중소, 중견 기업이 많음. - 가격이 비싸면 소비자가 사지 않는다는 인식 - 규제가 약함.", "kind": "문제 인식"}, {"id": "1-5-T1-017", "no": "16", "who": "5조 1명", "who_parts": null, "team": "5조", "text": "탄소저감 제품 생산을 위한 기계설비 등의 도입 등에 관한 정보가 부족한 것이 문제다.", "kind": "문제 인식"}, {"id": "1-2-T2-007", "no": "17", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "기후변화 및 탄소절감 관련 산업 부흥 (탄소경감 기술 및 환경 컨설팅) > 산업계의 패러다임 변화", "kind": "바라는 변화"}, {"id": "1-2-T2-011", "no": "18", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "k-데이터센터", "kind": "바라는 변화"}, {"id": "1-4-T2-016", "no": "19", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "친환경에 기업이 아이디어를 국가나 공공기관에서 개입하여 지분 참여하는 정책이 이루어지면 빠르게 이루어지고 국가 예산확보에 도움이 될 것이다.", "kind": "바라는 변화"}, {"id": "1-4-T2-017", "no": "20", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "친환경연구에 참여하는 기업이 늘어날 것이다", "kind": "바라는 변화"}, {"id": "1-4-T2-018", "no": "21", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "친환경기업 육성해야 할 것이다.", "kind": "바라는 변화"}], "gist": "지원의 규모·경로가 모호함, 재정 취약 업체의 설비 설치 불가, 대·중소 파트너십과 학습 체계 필요, 재생에너지 전환 시 단가 상승, 친환경 비즈니스 모델·교육·해외사례 수입 지원, 노력 기업에 대한 비용 지원, 초기 투자비 부담, 기업의 관심과 정부 지원 방안, 영세기업 홍보·연구 전달 미흡, 규모별 예산·기술력 격차, 재정이 다른데 일률적 지원, 공급망 지식·인프라 제공 체계 부재, 업체별 조사·제안·보조금 필요, 자금·기술 부족, 설비 도입 정보 부족", "empty": false, "worry": false}, {"id": "EF-1-08", "name": "재생에너지 발전·저장 인프라", "want": "재생에너지 발전소와 저장 설비가 곳곳에 늘어, 기업이 그 전기를 가져다 쓰게 된다", "items": [{"id": "1-1-T1-019", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "우리는 아파트 공화국이다. 애초에 처음부터 옥상에다가 패널을 설치한다든가 큰 창에다가 전기를 발생하는 필름을 붙여서 아파트를 하나 지으면 거기에서 에너지를 쓸 수 있는 게 법안화되면 좋을 것 같다. 우리의 급박한 건 태양광 패널 해야되고 풍력도 발전시켜야 되고 그렇지만, 우리가 아파트를 지을 때 이런 식으로 법안화가 되면 좋을 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-034", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "친환경에너지를 쓴다는 게 쉬운 게 아니다.", "kind": "문제 인식"}, {"id": "1-3-T1-003", "no": "03", "who": "3조 1명", "who_parts": null, "team": "3조", "text": "기업이 탄소 배출 감축이 활성화 되어야 함. 태양광 발전을 확대해서 석탄 가스 감축, CO2 감축, 온실가스 감축, 건물에서 사용하는 에너지 일부를 전환, 전기차 확대가 필요함.", "kind": "문제 인식"}, {"id": "1-4-T1-009", "no": "04", "who": "4조", "who_parts": null, "team": "4조", "text": "인프라 가 문제인것 같다", "kind": "문제 인식"}, {"id": "1-1-T2-028", "no": "05", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "재생에너지든 뭐든 에너지를 모아둘 데가 필요하다. 전기를 모아둔 데는 없다. 에너지 저장장치가 없다. 태양열을 계속 받아서 가둬놓을 수만 있다면 좋다. 그런데 그런 에너지 저장장치가 없다. 저장장치가 있다면 관리비 등도 다 풍요로워 지는 거다. 모든 게 만족스러워지는 거다. *정책 제안* 국가 정책에서 입안해서 그런 조건을 걸면 된다. 기업 입장에서도 이익이 남으면 하게 되어 있다. 녹색 인증을 받아서 층수 올릴 생각만 하지, 시민들에게 풍요로움을 줄 생각은 안 하는 거다. _parts": null, "team": "1조", "text": "바라보는 관점으로는 기대수명이 늘어날 것 같다. 그럼 굉장히 기쁠 것 같다.", "kind": "바라는 변화"}, {"id": "1-1-T2-018", "no": "03", "who": "1조 3명", "who_parts": null, "team": "1조", "text": "사람들의 건강도 좋아질 것 같다.", "kind": "바라는 변화"}, {"id": "1-1-T2-024", "no": "04", "who": "1조 3명", "who_parts": null, "team": "1조", "text": "기업이 탄소배출을 줄여서 사회를 건강하게 했을 때 첫째 인간이 건강해질 것 같다. 건강보험료를 적게 낼 수 있을 것 같다.", "kind": "바라는 변화"}, {"id": "1-1-T2-025", "no": "05", "who": "1조 3명", "who_parts": null, "team": "1조", "text": "의료비 지출이 줄어드는 거다.", "kind": "바라는 변화"}, {"id": "1-2-T2-026", "no": "06", "who": "2조 1명", "who_parts": null, "team": "2조", "text": "친환경 제품의 생산으로 각종 질병 노출이 줄어들게 됨.", "kind": "바라는 변화"}], "gist": "친환경보다 건강으로 직결시키면 소비가 움직임", "empty": false, "worry": false}, {"id": "EF-1-12", "name": "정책 일관성과 전담 거버넌스", "want": "정권이 바뀌어도 환경정책이 이어져, 기업이 투자 시점을 스스로 정할 수 있게 된다", "items": [{"id": "1-1-T1-016", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "기업의 입장에서는 본인들의 이윤을 포기해 가면서 재생에너지를 사용하고 비용 올려야 하는 부담이 있는 건 맞다. 유럽은 가장 환경적인 정책들을 우선시하다보니까 지금 우리 입장에서는 부담을 느낄 수 있다. 우리가 한번에 그 지점까지 도약하자는 것까진 아니지만, 천천히 바꿔줄 필요가 있다. 원료같은 측면에서 시멘트도 우리나라는 친환경시멘트도 사용 안 하고 있다. 정확한 규제를 만들어서 친환경시멘트 사용 비율을 정한다든지 천천히 받아들일 수 있도록 하는 제반이 만들어지면 좋겠다. 정부 차원의 지원이 금전적인 지원뿐만이 아니라 촘촘한 규제를 만들어서 천천히 적용하게 지원해주는 것도 좋을 것 같다. RE100은 국제적 차원에서 이루어지는 거라 우리 입장에서는 극단적으로 느껴질 수도 있을 것 같다. 탄소중립을 향해 가는 중장기적인 단계를 구체적으로 어떻게 할 수 있을지. 어떤 재생에너지를 활용할 수 있게끔 정부 차원에서 기업에도 많이 알려주고, 해양풍력은 시간 제한 없이 발전량을 활용할 수 있고, 대한민국도 해양 풍력에 유효한 환경을 갖고 있다. 실제적으로 가이드라인을 촘촘하게 제시를 해주면 앞으로 지속적으로 기업들이 적응할 수 있지 않을까 싶다.", "kind": "문제 인식"}, {"id": "1-1-T1-026", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "법이 바뀌는 데 시간이 오래 걸린다. 3년 후 완성이 되고 이러니까... 구체화가 된 것에 대해서는 좀 빠르게 이루어질 수 있게 하는 것도 방법인 것 같다. 그런 것들을 시대에 맞게 해야 하는데, 이 시대에는 이게 맞는데 다음 세대에는 더 빨리 가야 하는데 법적으로 너무 오래 걸린다. 그러니까 법이 좀 더 빨리 이루어질 수 있도록 선제적인 게 필요하다.", "kind": "문제 인식"}, {"id": "1-1-T1-036", "no": "03", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "이미 기업들이 있는 규제에 한해서는 지키려고 하는 것 같다. 분명 지금도 규제에 따르고는 있을 테지만, 탄소배출권 같은 경우 2015년도에 아시아권 최초로 생겼다고 들었다. 그럼 선진적이었던 것 같은데, 규제로 얻을 수 있는 부가이익이 있음에도, 생겼을 당시에는 탄소배출권의 구조가 맞았을 수도 있을 것 같은데, 시간이 지나면서 변화가 있었어야 하는데 중장기적인 관심이 정부에서 부족했던 것 같다. 정권 등에 따라 섣불리 국민의 삶에 영향을 미칠 수 있기 때문에 정부 차원에서 적극적으로 개입이 어려운 부분이 있는 것 같다. 기업 입장에서는 가이드라인이 생기면 따라는 갈 텐데, 15년도에 생겼음에도 정부의 관심이 부족하지 않았나 싶다. 지속적으로 목표를 잡아놓고 정권이 바뀌더라도 계속 갈 수 있는 게 마련되어야 할 텐데 그게 좀 부재한 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-048", "no": "04", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "문제가 없기는 어려울 것이다. 짧은 시간 내에 많은 발전을 이룩하다 보니까 사이사이에 빈 공백이 있었고 시민들의 인식이 정착하기도 어려웠다. 시민들의 의식이 향상되고 정부에서도 이런 가이드가 잘 전달이 되고 정책에도 반영이 되어서 정책에 반영하면 나아질 수 있지 않을까 싶다.", "kind": "문제 인식"}, {"id": "1-2-T1-021", "no": "05", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "주제 자체의 주어가 기업임. 기업은 태생적으로 정부의 눈치를 보게됨. 어느 정권이든 변함없이 중심을 잡고 참여할 수 있는 계기를 만들어줘야함. 두 번째로 인식은 지금도 가지고 있으나, 내가 먼저 해야하나? 라는 생각(비용이 들기때문)이 별도로 들지않게됨. 인센티브가 있으면 못할 이유가 없을 것이라 생각함. 이 인센티브는 대기업과 중소기업에는 차이를 두어야 함. (둘의 여력이 부족하기 때문). 정확한 책임, 사회적 공감, 인센티브 차등 지급 등의 생각을 해야함.", "kind": "문제 인식"}, {"id": "1-2-T1-031", "no": "06", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "정권이 바뀔때마다 전에 하던 사업을 이어서 잘 안함.", "kind": "문제 인식"}, {"id": "1-2-T1-032", "no": "07", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "", "kind": "문제 인식"}, {"id": "1-2-T1-042", "no": "08", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "(1) 정책의 일관성이 없음. (2) 친중소, 중견기업 정책이 따로 없는 것에 대한 문제가 있음.", "kind": "문제 인식"}, {"id": "1-3-T1-004", "no": "09", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "기업의 설비투자 기간이 있는데 정부의 정책 불확실성에 따라 투자가 바뀌어 어려움. 경영진은 재무재표 등이 중요한데, 당장 투자에 비용은 들어가나 실효성이 늦게 나타나는 것은 부담사항임. 시멘트처럼 만드는 과정에서 탄소가 발생하는 분야는 감축하는 관련 기술이 필요함.", "kind": "문제 인식"}, {"id": "1-3-T1-006", "no": "10", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "정부에서 기업에게 명확한 가이드라인을 제시해야 함. 기업은 순수하게 이윤을 추구하는데 환경 정책은 패널티가 있어서 하는 것이니 인증마크를 도입해서 소비자가 알고 구입할 수 있도록 인증제도가 필요하다고 보여짐. 가이드 라인을 제공하고 단기간이 아닌 10년, 20년, 30년을 내다보는 정책을 주면 좋을 것 같음. 개발할 고급인력의 문제가 있음. 배출권을 되팔기를 하고 있는거 보니 정부의 기준, 가이드라인이 모호함.", "kind": "문제 인식"}, {"id": "1-5-T1-011", "no": "11", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "환경에 관한 정부정책에 관한 예측가능성이 보장되지 않는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-5-T1-014", "no": "12", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "정부의 공익적인 개입이 적은 것이 문제댜.", "kind": "문제 인식"}, {"id": "1-2-T2-012", "no": "13", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "대한민국 정부의 환경정책을 일관적으로 펴고 국제기준에 맞게 정해놓는다면", "kind": "바라는 변화"}, {"id": "1-2-T2-013", "no": "14", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "기업은 국제기준에 맞춰 일관되게 제품 생산 필요", "kind": "바라는 변화"}, {"id": "1-2-T2-014", "no": "15", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "환경 기준에 맞췄기 때문에 온실가스 감축에 효과적임", "kind": "바라는 변화"}], "gist": "촘촘한 규제·가이드라인 부재, 법 개정 지연, 정권 교체 시 목표 단절, 시민 의식과 정책 반영의 연결 부재, 정권 무관 중심축과 인센티브 차등, 정권 교체 시 사업 단절, CVID급 고정 정책 요구, 정책 일관성과 중소·중견 맞춤 정책 부재, 정책 불확실성이 설비투자를 흔듦, 가이드라인·배출권 기준 모호, 정책 예측가능성 미보장, 정부의 공익적 개입 부족과 법률 부재", "empty": false, "worry": false}, {"id": "EF-1-13", "name": "친환경 건자재와 주거환경", "want": "시멘트를 비롯한 건축 자재가 바뀌어, 새로 지은 집에 들어가도 아토피를 걱정하지 않게 된다", "items": [{"id": "1-1-T1-017", "no": "01", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "친환경 시멘트의 현실을 알아보자면, 대한민국 시멘트는 친환경과 상관이 없다. 산업폐기물을 태워서 만드는 게 시멘트다. 저의 제안은 우리나라도 담수화 설비를 해서 물부족국가를 해결하고 탄소 배출을 적게 해야 한다. 담수화 설비를 가동하고 여러 군데에 활성화하자는 것이 주장이다.", "kind": "문제 인식"}, {"id": "1-1-T1-033", "no": "02", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "아파트 짓는 기업에서는 주변에 나무를 심도록 하는 등..", "kind": "문제 인식"}, {"id": "1-1-T2-019", "no": "03", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "*정책 제안* 아토피 피부염을 없애야 한다. 산업폐기물 채워서 시멘트 만드니까 아토피 피부염이 걸린다. 폐기물 쓰지 말고 순수 석회석만 가지고 제대로 산업폐기물 혼합해서 태우지 않고 순수한 친환경적인 시멘트를 만들도록 건설에 적용해서 국민 건강에 새집증후군을 없애서 피부 건강에도 도움이 되는 세상이 될 것이다.", "kind": "바라는 변화"}, {"id": "1-1-T2-020", "no": "04", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "시멘트만이 아닌 다른 건축 자재도 봐야 한다. 도배의 경우에도 본드를 뭐를 쓰느냐에 따라서도 달라질 수 있다.", "kind": "바라는 변화"}, {"id": "1-1-T2-022", "no": "05", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "친환경 아파트를 건설을 했는데 시공 문제로 인해서 아토피가 걸렸다고 하면 손해배상이 국가한테도 할 수 있을까 싶다.", "kind": "바라는 변화"}, {"id": "1-1-T2-027", "no": "06", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "계속해서 우리는 건물을 짓는다. 비용적인 측면에서 건물을 지어 올리는데 시멘트가 탄소배출에 영향을 준다고 한다면 많은 건물을 짓는 게 어려울 수 있고, 주거환경을 개선하려고 건물을 짓는 게 결국 우리의 또다른 주거환경인 지구에 좋지 않다는 생각이 든다. 친환경 소재나 공법들이 활용이 된다면 지금 생기는 문제들을 극복한 상태에서 우리가 주거환경을 개선하는 데 더 큰 동력이 될 수 있을 것 같다. 재생에너지 같은 것들도 시간대, 효율등을 생각할 수 있지만 태양광도 특정 시간이 피크라고 하더라도 오히려 낮시간대에 많은 그때라도 차등적으로 더 저렴한 전기를 쓸 수 있지 않을까 싶다. 결과적으로는 전력 효율을 높이고 우리도 전기요금 측면에서 혜택을 볼 수 있을 수 있을 것 같다.", "kind": "바라는 변화"}], "gist": "국내 시멘트가 산업폐기물 소각으로 제조됨, 아파트 건설 시 식재 요구", "empty": false, "worry": false}, {"id": "EF-1-14", "name": "시민 인식 전환과 생활 실천", "want": "값이 조금 올라도 소비자가 등을 돌리지 않고, 직원도 회사의 탄소 감축에 자연스럽게 함께하게 된다", "items": [{"id": "1-1-T1-030", "no": "01", "who": "1조 6명", "who_parts": null, "team": "1조", "text": "기업과 소비자는 다 연결고리에 있다고 생각한다. 기업이 탄소를 많이 배출하는 상품이면 우리가 구매를 하지 않는 보이콧을 해버린다면 어떨까. 규제를 한다 해도 소비자가 계속 찾으면 어떻게 될까. 같은 선상에서 움직여줘야 될 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-035", "no": "02", "who": "1조 6명", "who_parts": null, "team": "1조", "text": "기업이 이윤을 추구하다보니까 규제에 강하게 저항하는 경우도 많고, 국가의 지원이 모자라다고 생각하지 않나 싶다. 소비자의 인식도 바뀌어야 하고, 소비자의 인식이 바뀌는 데에 국가도 일조를 해야 한다. 마냥 지원과 규제 뿐만 아니라 소비자의 인식도 중요한 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-040", "no": "03", "who": "1조 6명", "who_parts": null, "team": "1조", "text": "이런 이유로 소비자들이 경각심을 갖지 않다보니 기업도 매출에 직격을 받으면 그렇게 할텐데 소비자들이 크게 반응하지 않는다는 생각이 어느 정도 있는 것 같다. 기업들이 탄소 배출을 줄이기 위한 동력을 소비자들이 아직 제공하지 못하는 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-041", "no": "04", "who": "1조 6명", "who_parts": null, "team": "1조", "text": "텀블러 이용하면 직접적으로 할인해주던지 하는 게 필요하지 않을까 싶다.", "kind": "문제 인식"}, {"id": "1-1-T1-043", "no": "05", "who": "1조 6명", "who_parts": null, "team": "1조", "text": "기업의 피부에 와닿지 않으니까... 소비자의 의식이 부족해서 소비자들이 계속 쓰니까 그 제품을 기업도 계속 만드는 거다.", "kind": "문제 인식"}, {"id": "1-1-T1-047", "no": "06", "who": "1조 6명", "who_parts": null, "team": "1조", "text": "기업들이 인식을 못한다면 빙하가 다 녹을 것이다. 서로서로 인지를 하고, 쓰면서도 죄책감 느끼고 만들면서도 죄책감을 느껴야 할 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-049", "no": "07", "who": "1조 6명", "who_parts": null, "team": "1조", "text": "기업의 관점, 소비자의 관점에서 동상이몽이기 때문에 문제가 생기는 것 같다.", "kind": "문제 인식"}, {"id": "1-2-T1-026", "no": "08", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "악세사리 상가가 있었는데 폐기물 등등에 대한 규제가 들어가고 있고 그런 것에 대한 기초도 다 되어있음. 홍보가 되고는 있으나 홍보가 충분하지는 않고, 개개인의 실천이나 정기적 점검, 교육 등이 더 중요하다고 생각이 됨. 왜 홍보가 잘 되지않는다에 대한 생각도 필요.", "kind": "문제 인식"}, {"id": "1-2-T1-030", "no": "09", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "", "kind": "문제 인식"}, {"id": "1-2-T1-035", "no": "10", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "그래서 왜 못하고 있는가를 생각했을 때 연속적, 인식개선적 부분이 부족한 이유는 본인의 피부에 와닿는게 없어서 그러함. (일하는 분야, 나이 등에 대해서 세분화되어서 인식개선이나 홍보 등이 이루어지지 않음) 일하는 분야에서 자살분야에 대해 크게 신경안썼으나 지금은 엄청 중요해진 것처럼, 전국민에 대한 의무교육화시키는 것이 매우 중요하다고 함. 너무 큰 범위 혹은 너무 작은 범위(재활용 등)에서만 강조하지 잘 이루어지지 않는 부분이 있다고 생각함.", "kind": "문제 인식"}, {"id": "1-2-T1-041", "no": "11", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "기업이 재생에너지 사용 늘릴때의 이익이 있는가? 분명하게. / 범용의 교육말고 각 기업/단체/사람들에게 와닿는 교육/홍보가 이루어지고 있는지? / 반대로 재생에너지 사용량 적을때의 불이익이 있는가? (할 수 밖에 없는) / 실제로 재생에너지 늘릴 의지가 있다면 쉽게 늘릴 수 있도록 환경적 정리가 되어있는가?", "kind": "문제 인식"}, {"id": "1-3-T1-007", "no": "12", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "기업이 탄소 감축을 해야 하는지 알지만 교육이 없음. 대기업은 알고 있지만 중소기업, 일반 사원들이 기후에 대한 인지가 그냥 ‘너무 더워.’ 정도임. 정확히 기업교육(사내 교육)서비스를 통해 오리엔테이션 교육뿐만 아니라 환경 교육의 추가가 필요함. 건강상의 이유가 있으면 아침에 모여서 체조하듯이 (탄소감축)인지될 수 있는 교육이 필요하다고 보임.", "kind": "문제 인식"}, {"id": "1-3-T1-010", "no": "13", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "기업, 소비자 교육이 필요함. 기업은 인식이 부족해서 정책때문에 어쩔 수 없이 하는게 아니라 해야 한다는 생각으로 적극적 투자를 하지 않음. 기업 내부 모든 분야에서 인식이 없음. 소비자는 비록 저탄소 물품이 비싸더라도 탄소를 줄이는 비용이 크기 때문에 비싼 가격을 지불하는 대신 눈에 보이는 값싼 제품을 구매하고 있음. 탄소를 줄이는데 세금이 쓰이는 것을 안다면 기업이 만든 저탄소 제품을 사용할 것임. 물품 가격과 가치에 대한 교육이 필요함.", "kind": "문제 인식"}, {"id": "1-4-T1-011", "no": "14", "who": "4조", "who_parts": null, "team": "4조", "text": "전략적인 홍보가 부족한 것이 문제라고 생각한다.", "kind": "문제 인식"}, {"id": "1-5-T1-003", "no": "15", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "시작할 때 강의를 들으면서 느낀 것은 집에서 쓰레기 분리수거가 쉽지 않았다. 너무 귀찮다는 생각이 들었다. 그리고 제가 쓰레기 분리수거를 함으로써 어떤 도움이 얼마나 되는지 알 수 없었다. 오전에 강의를 들으면서 마치 우리의 노력이 어떤 도움이 되고 얼마나 되는지에 대한 설명이 없어서 아쉬웠다. 진행 측에서도 감을 잘 잡고 가이드를 조금 더 구체적으로 제시하는 게 필요할 것 같다.", "kind": "문제 인식"}, {"id": "1-5-T1-005", "no": "16", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "환경에 대한 교육을 받아 본 결과, 사람들은 알아도 실천하지 않더라. 실천하게 하기 위해서 조금 더 철저하고 면밀한 교육이 필요할 것 같다. 또한 친환경 제품과 관련한 가격책정의 배경에 대한 인식이 알려지면 조금 환경보호에 도움이 될 것다.", "kind": "문제 인식"}, {"id": "1-2-T2-015", "no": "17", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "소비자들도 그러면 자연스럽게 환경활동에 동참하게 되는 효과", "kind": "바라는 변화"}, {"id": "1-2-T2-016", "no": "18", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "다만 제품의 가격이 조금 상승할 수 있다 > 자연스럽게 소비자들도 익숙해질 것.", "kind": "바라는 변화"}, {"id": "1-5-T2-001", "no": "19", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "기업이 탄소저감 정책을 수행하기 어려운 이유 중 하나는 직원들의 반발도 있다. 새로운 공정을 배워야 하는 문제, 일회용품 문제 등이 있다. 홍보를 열심히 하지만 홍보에 그친 경우가 많다. 인식개선이 필요하다.", "kind": "바라는 변화"}], "gist": "소비자 보이콧과 동조 필요, 소비자 인식 개선에 국가의 역할, 소비자가 반응하지 않아 기업 동력 부재, 텀블러 직접 할인, 소비자 의식 부족이 생산을 지속시킴, 죄책감·상호 인지, 기업·소비자의 동상이몽, 홍보 부족과 개개인 실천·정기 점검, 조기 교육과 기업인 교육, 세분화된 인식개선·의무교육화, 와닿는 교육·홍보 여부, 소비자 혜택 부족, 사내 환경교육 부재, 기업·소비자 교육과 가격·가치 교육, 전략적 홍보 부족, 분리수거의 번거로움과 기여 불가시성, 알아도 실천하지 않음", "empty": false, "worry": false}, {"id": "EF-1-15", "name": "규제·탄소가격", "want": "배출에 값이 매겨져, 친환경 제품으로 가는 기업이 저절로 많아진다", "items": [{"id": "1-1-T1-003", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "온실가스가 만원 정도라 치면 기업에게는 천원에 줘서 그걸 이용해서 판다는 이야기를 들었다. 아까 교육 때 들은 바에 의하면, 국가가 싸게 주니까 기업들이 이걸 아껴서 쓸 생각을 안 하고, 어차피 남는 것. 그래서 기업들은 아낄 줄을 모르는 것 같다. 이런 논의도 필요한 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-024", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "우리가 인도보다 기술력은 좋지만 규제를 안 하는 거다. 감리하다보면 친환경 인증을 다 본다. 그래서 녹색 인증이라는 걸 준다. 다 지키면 용적률을 준다. 20층을 지을 수 있는데 25층까지 지을 수 있게 해준다.", "kind": "문제 인식"}, {"id": "1-2-T1-034", "no": "03", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "돈이 안되어서. 현재 다니는 기업도 그런 탄소배출에 대한 이야기를 하고있는데 경제적인 이익이 없으니 실질적으로 이루어지지 않음. 경제적인 유인이 부족함.", "kind": "문제 인식"}, {"id": "1-2-T1-046", "no": "04", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "(1) 기업이 온실가스 배제에 소극적인 이유- 배출권을 구매하면 할 수 있는 것. 실제 배출량을 줄이려면 생산절차를 전부 뜯어고쳐야하는데 그런 것들에 대해서 배출권에 대한 제도 활성화를 마련해야하지 않을까 라는 생각이 듬. 소방안전, 보건 등이 법률화가 되어있는데 현재는 그런게 없음 (>정책적 제안)", "kind": "문제 인식"}, {"id": "1-2-T1-047", "no": "05", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "(1) 돈이 안되니까, 돈이 많이 들어서. 자본주의 사회에서 제일 중요한건 돈이라고 생각하기 때문에 세제지원을 해주는 것이 필요함. 결론적으로 유인책이 부족함.", "kind": "문제 인식"}, {"id": "1-3-T1-009", "no": "06", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "여러 환경에서 ESG에 대해서 중요한 것은 인식하고 있으나 정확한 가이드가 없는 것 같음. 기업에서 ESG가 필요한지는 아는데 ESG에 대해 정작 설명하지 못하는 경우가 있어 교육이 필요하다고 보여짐. 기업이 (탄소감축에 대해)개인에게 떠넘기는 것 같음. 기업의 모든 구성원들이 본인이 재직중인 회사가 어떤 노력을 하고 있는지 알고 있다면 직원이 해야할 개인의 노력을 할 수 있는데, 모르면 그 문제에 대해서 안일해질 것 같음. 의도적으로 기술 개발을 안하는 것은 문제임. 예로 제너시스는 연비(10KM미만)를 굳이 낮추지 않는데, 돈 있는 사람만 타기 바라기 때문임. 감당되는 사람만 타라는 기업의 의도가 문제임(기업의 이익에 영향을 미치지 않는 것이 문제). 그래서 인센티브 보다 과태료를 부과하는 것이 효과적이라는 생각임. 기술개발을 해도 손익분기점까지 시간이 오래 걸림. 소비자들이 비싼 가격에 메리트를 느끼는 것이 문제임.", "kind": "문제 인식"}, {"id": "1-4-T1-004", "no": "07", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "규제체제가 잘 잡혀있지 않음. 성장이 급속히 발전한 이유로 규제에 대한 생각을 미쳐하지 못한 것이 있음 규제화를 의무화하는 것이 좋음", "kind": "문제 인식"}, {"id": "1-4-T1-007", "no": "08", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "기업이 배출권 거래제 참여가 적음 - 정부가 산업 부분에 덜 할당함 - 무료로 줌 - 남은 에너지 저장, 이용할 발전소 부족 - 지역별 차등요금제를 실시하지 않음 - 전기료등 재생도 발전소 투자비용 막대함 - 탄소세가 너무 낮음 - 탄소배출에 산업부분에 적응하지 않아 기업이실천하지 않음.", "kind": "문제 인식"}, {"id": "1-5-T1-001", "no": "09", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "우리 탄소배출거래 금액에 대해 몰랐는데 생각보다 많이 가격이 낮다는 생각을 했다.", "kind": "문제 인식"}, {"id": "1-5-T1-008", "no": "10", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "기업과 개인이 기후위기를 체감하지 못하는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-5-T1-010", "no": "11", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "○○○○(○○○) : 탄소배출건 가격은 시장이 정하고 정부가 공급을 줄이면 자연스럽게 단소배출건 가격은 올라간다.", "kind": "문제 인식"}, {"id": "1-5-T1-015", "no": "12", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "탄소배출건 참여 기업수가 적은 것이 문제다.", "kind": "문제 인식"}, {"id": "1-5-T1-016", "no": "13", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "상벌이 없는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-3-T2-008", "no": "14", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "정책 방향성, 기업 가산세 등 기업 과태료적인 부분이 확실해지고 정책의 일관성이 유지되면 기업의 아이디어는 풍부해지고, 가격은 착해져 친환경 제품으로 가는 기업들이 자동으로 많아질 것 같음. 친환경 제품을 만드는 기업이 많아질 것이고, 소비자도 교육 참여가 많아질 것임.", "kind": "바라는 변화"}, {"id": "1-4-T2-013", "no": "15", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "참여기업이 높아질것이라고 생각한다.", "kind": "바라는 변화"}, {"id": "1-4-T2-019", "no": "16", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "탄소배출많은 기업들의 전략요금상향, 자체 전력생산시설부족", "kind": "바라는 변화"}], "gist": "배출권 헐값 공급으로 아낄 유인 없음, 규제 미시행(인증·용적률 인센티브 사례), 경제적 유인 부족, 배출권 구매로 감축을 갈음·법률화 부재, 세제지원과 유인책 부족, 인센티브보다 과태료가 효과적, 규제체계 미비와 의무화 요구, 산업부문 과소 할당·무상 배분·낮은 탄소세, 배출거래 가격이 낮음, 메리트·리스크 부재, 총량 과다, 참여 기업수 부족, 상벌 부재", "empty": false, "worry": false}, {"id": "EF-1-16", "name": "저탄소 제품의 가격 경쟁력", "want": "친환경 제품 값이 일반 제품만큼 내려가, 값을 보고 골라도 저탄소 제품을 사게 된다", "items": [{"id": "1-1-T1-037", "no": "01", "who": "1조 1명", "who_parts": null, "team": "1조", "text": "친환경적이라는 게 나오면 보편적으로 가격이 비싸다. 좋은 제품을 사는 것도 중요하지만 가격도 중요하다. 가격을 낮출 수 있는 걸 찾아야 할 것 같다. 눈에 보이는 게 가격이니.", "kind": "문제 인식"}, {"id": "1-2-T1-043", "no": "02", "who": "2조 1명", "who_parts": null, "team": "2조", "text": "탄소감축을 위한 설비교체 투자 등은 제품 가격의 인상으로 이어져 가격 경쟁력이 약해지고 기업 경쟁력이 감소된다.", "kind": "문제 인식"}, {"id": "1-3-T2-004", "no": "03", "who": "3조 3명", "who_parts": null, "team": "3조", "text": "신기술 개발이나 기술.규모경제를 통해서 친환경 제품의 4조", "text": "일회용품을 사용하지 않아도 불편하지 않은 사회 - 카페, 배달 음식에서 다회용기가 기본 - 제품들도 처음부터 오래 쓸 수 있는 리유저블 형태로 개발, 생산 - 최소화 된 포장", "kind": "바라는 변화"}, {"id": "2-4-T2-012", "no": "18", "who": "4조 6명", "who_parts": null, "team": "4조", "text": "리필이 누구나 어디서나 가능한 세상", "kind": "바라는 변화"}], "gist": "배달·매장 일회용품의 편리함과 낮은 가격, 1인가구 증가, 다회용기 지참·재생용기 선택폭과 공유 텀블러 정책의 부재.", "empty": false, "worry": false}, {"id": "EF-2-03", "name": "시민 인식과 교육의 정착", "want": "배우고 이야기 나누는 일이 일상이 되어, 작은 불편을 기꺼이 감수하는 실천이 몸에 밴다", "items": [{"id": "2-1-T1-004", "no": "01", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "사람들이 일회용품을 줄이기에 별로 관심을 갖지 않는다. 줄어야 한다는건 알지만 왜 굳이 줄어-u야 하는지 사태의 심각성을 잘모르는 경우가 많은 것 같다.", "kind": "문제 인식"}, {"id": "2-1-T1-005", "no": "02", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "편리하다는 이유로 일회용품을 자주 이용함. 사람들이 기후위기의 심각성을 아직 잘 인지하지 못해서 그런 것 같다.", "kind": "문제 인식"}, {"id": "2-1-T1-006", "no": "03", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "사람들이 한번 사용하면 쓰레기라고 생각하고 다시 쓸 생각을 안한다.", "kind": "문제 인식"}, {"id": "2-1-T1-007", "no": "04", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "재활용되지 않은 쓰레기가 많은 것 같다.", "kind": "문제 인식"}, {"id": "2-1-T1-009", "no": "05", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "대부분의 플라스틱 재활용을 하지 못한다 분리수거를 하지 않아 재활용을 하지 못한다.", "kind": "문제 인식"}, {"id": "2-1-T1-016", "no": "06", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "기후및 환경 교육내용이 어려움, 교육의 부족함. 소비자가 계속해서 소비하게 만드는 시스템의 문제", "kind": "문제 인식"}, {"id": "2-2-T1-004", "no": "07", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "일회용품, 음식물 쓰레기, 일상생활 쓰레기뿐만 아니라 빠르게 버려지는 의류 쓰레기 문제에 대해 사회 전반이 그 심각성을 제대로 인지하지 못하고 가볍게 여기고 있다.", "kind": "문제 인식"}, {"id": "2-2-T1-013", "no": "08", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "시민이 집에서 열심히 세척하고 분리 배출해도 실제로 어떻게 처리되고 얼마나 재활용되는지 투명한 정보 공개와 홍보가 턱없이 부족하다.", "kind": "문제 인식"}, {"id": "2-3-T1-004", "no": "09", "who": "3조 4명", "who_parts": null, "team": "3조", "text": "플라스틱 감축 및 다회용기 전환 지원의 필요성과 함께, 기업에 대한 탄소배출 규제 미흡 및 시민들의 심층적·체험형 환경 교육 부족을 확인하였다.", "kind": "문제 인식"}, {"id": "2-3-T1-008", "no": "10", "who": "3조 4명", "who_parts": null, "team": "3조", "text": "쓰레기와 낭비가 비용이라는 인식이 부족한 소비 행태와, 기업의 이윤 추구를 제어할 정부의 강력한 법적 규제 및 환경 관련 체계적인 조기 교육이 부족함을 확인하였다.", "kind": "문제 인식"}, {"id": "2-4-T1-004", "no": "11", "who": "4조 4명", "who_parts": null, "team": "4조", "text": "재인식 필요 : 모든 제품을 사용하는 본인들의 인식이 중요. 그래서 아주 귀한 기후 시민회의를 하고 있음. 정신교육이 중요한 마음. 우리의 마음 가짐을 한 번 더 강화해야 함.", "kind": "문제 인식"}, {"id": "2-4-T1-005", "no": "12", "who": "4조 4명", "who_parts": null, "team": "4조", "text": "물질만능의 사회적 분위기, 마인드 (사회적 인식 감성 교육)", "kind": "문제 인식"}, {"id": "2-4-T1-007", "no": "13", "who": "4조 4명", "who_parts": null, "team": "4조", "text": "일회품이나 재활용 불가인 제품을 구매하는 소비자 의식 문제임", "kind": "문제 인식"}, {"id": "2-4-T1-010", "no": "14", "who": "4조 4명", "who_parts": null, "team": "4조", "text": "공장이나 기업의 대량 재활용품 배출 순환을 위주로 하고 개인은 일회용품 줄이는 의식 개선이 시급함. 일회용품의 단점, 피해를 예시로 많은 의식 개선", "kind": "문제 인식"}, {"id": "2-4-T1-016", "no": "15", "who": "4조 4명", "who_parts": null, "team": "4조", "text": "교육 부재 (초등 교육에서부터 재미를 통해 인지)", "kind": "문제 인식"}, {"id": "2-4-T1-017", "no": "16", "who": "4조", "who_parts": null, "team": "4조", "text": "문제 인식 : 개인주의를 넘어선 이기주의", "kind": "문제 인식"}, {"id": "2-4-T1-018", "no": "17", "who": "4조 4명", "who_parts": null, "team": "4조", "text": "우리의 교육이 시급한 실정. 매스컴에서도 아주 심각한 뉴스를 내고 있음. 우리의 실생활에 중요한 부분을 차지하고 있음.", "kind": "문제 인식"}, {"id": "2-5-T1-002", "no": "18", "who": "5조 8명", "who_parts": null, "team": "5조", "text": "비닐봉투도 그렇고, 이마트 같은 경우도 시장 바구니 같은 게 홍보가 잘 안되는 점이 문제인 것 같다.", "kind": "문제 인식"}, {"id": "2-5-T1-005", "no": "19", "who": "5조 8명", "who_parts": null, "team": "5조", "text": "당연하게 마트에서 과일이나 야채를 담을 때 비닐봉지를 자연스럽게 뜯는 등 개인의 인식이 문제인 것 같다.", "kind": "문제 인식"}, {"id": "2-5-T1-006", "no": "20", "who": "5조 8명", "who_parts": null, "team": "5조", "text": "개인이 이에 대한 문제 인식이 개인의 인식이 문제인 것 같다. 이런 논의를 하고나서 나도 고민을 시작했다. 아마 관심, 인식이 없는 것이 문제일 수 있을 것 같다.", "kind": "문제 인식"}, {"id": "2-5-T1-007", "no": "21", "who": "5조 8명", "who_parts": null, parts": null, "team": "2조", "text": "일회용품을 쓰지 않거나 친환경 소재(빨대, 식기 등)를 도입하려는 소상공인과 기업의 비용 부담을 덜어줄 보조금 제도가 부족하다.", "kind": "문제 인식"}, {"id": "2-3-T1-007", "no": "03", "who": "3조 1명", "who_parts": null, "team": "3조", "text": "저렴하고 편리한 일회용품의 경제성이 환경적 선택을 가로막고 있으며, 개인의 노력만으로는 한계가 있어 가격 정책 및 기업 생산 규제가 미비함을 확인하였다.", "kind": "문제 인식"}, {"id": "2-5-T1-001", "no": "04", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "오늘 이해관계자 두 명의 생각이 매우 다른 것 같았다. 한 분은 규제에 대해서 ‘이런 점이 문제이고 이런 점이 지원되었으면 좋겠어’라는 주장이었고 한 분은 ‘당장 이렇게 바껴야돼’라는 내용이었던 것 같다. 일회용품의 가격이 너무 싸서 접근성이 너무 쉬운 것이 문제인 것 같다. 3~5년 전에 비닐봉투를 그냥 주다가 법 규제로 이제는 50원을 지불하는 것이 당연하게 바뀌었지 않냐.", "kind": "문제 인식"}, {"id": "2-5-T1-019", "no": "05", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "1인가구나 소규모 각의 증가로 인한 , 일회용품 가격의 경쟁성이 문제이다.", "kind": "문제 인식"}, {"id": "2-5-T1-021", "no": "06", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "너무 물품을 쉽게 구할 수 있는 것이 문제이고 이것에 대한 정부 규제가 없는 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-5-T1-022", "no": "07", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "일회용품의 싼 조달 비용에 따른 과도한 일회용품(포장재) 사용량이 문제이다. 기업에 대한 포장재 규제의 부재가 문제이다. (당연히 기업은 싼 것을 선택하게 되어 있기 때문에 일회용품 사용에 대한 과세가 필요할 것이다)", "kind": "문제 인식"}, {"id": "2-5-T1-024", "no": "08", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "무분별한 소비 조장 마케팅이 문제이다. 시민들에게 기후 문제가 직관적으로 인식되지 않는 것이 문제이다. 재활용품을 사용하는 것이 개인에게 이득이 아닌 것이 문제이다(비싸고 불편하면 실천하지 않는다). 탄소중립이 아닌 대체재가 더 싸고 쉬운 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-5-T1-033", "no": "09", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "일회용품을 많이 쓸 수 밖에 없는 경제구조로 온 것 같다. 문제는 정부 규제의 부재이다.", "kind": "문제 인식"}, {"id": "2-2-T2-005", "no": "10", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "환경 정책에 드는 비용에 대해 우호적이고 잘 수용할 수 있는 문화가 형성된다. 탄소를 줄여야 되니 그 정도는 쓰겠다.", "kind": "바라는 변화"}, {"id": "2-2-T2-006", "no": "11", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "환경 관리와 쓰레기 처리 비용이 제품 가격에 정상적으로 반영되어, 모두가 정당한 비용을 공정하게 분담하는 사회가 된다.", "kind": "바라는 변화"}, {"id": "2-2-T2-019", "no": "1 {"id": "2-2-T2-025", "no": "04", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "텀블러 페이백, 투명 페트병 모바일 포인트 환급 등 시민의 절약과 실천에 대해 실질적인 경제적 보상이 이루어지는 사회가 된다.", "kind": "바라는 변화"}], "gist": "불편을 감수하게 할 인센티브·포인트 제도의 부족, 개인에 대한 혜택·보상의 부재.", "empty": false, "worry": false}, {"id": "EF-2-18", "name": "국제 기후정의와 국가 위상", "want": "쓰레기 줄이는 방법을 나라들이 서로 나눠 지구가 덜 더러워지고, 우리는 그 일에 앞선 나라가 된다", "items": [{"id": "2-4-T1-001", "no": "01", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "한 철 장사하는 옷팔이들과 하울을 즐기는 소비자들 (패스트 패션)이 빈민국의 생태계를 위협하고 있다.", "kind": "문제 인식"}, {"id": "2-1-T2-004", "no": "02", "who": "1조 1명", "who_parts": null, "team": "1조", "text": "국제사회 및 세계의 변화는 어떻게 달라질까요? ■ 국제사회나 세계사회가 어떻게 달라질까? ○○○국제사회에서도 소각되거나 매립되는 폐기물을 최소화해서하나의 프로젝트로만들수도 있을 것이다.", "kind": "바라는 변화"}, {"id": "2-5-T2-013", "no": "03", "who": "5조 1명", "who_parts": null, "team": "5조", "text": "과대포장 억제 시 포장에 쓰이는 자원을 다방면 활용 가능하게 될 것이다. 국제사회에서의 입지 분야 확보가 가능하게 될 것이다. 친환경 분야 관련 최초 전문 국가가 될 경우 국제사회에서의 입지 분야 확보가 가능하게 될 것이다. 친환경 분야 관련 일자리 창출로 실업률이 낮아질 것이 기대된다.", "kind": "바라는 변화"}], "gist": "패스트패션 소비가 빈민국 생태계를 위협하고 있다는 인식.", "empty": false, "worry": false}, {"id": "EF-2-19", "name": "자원순환 분야 일자리", "want": "환경을 돌보는 일이 하나의 직업이 되어, 기업마다 그 일을 맡은 사람이 늘어난다", "items": [{"id": "2-3-T2-004", "no": "01", "who": "3조 1명", "who_parts": null, "team": "3조", "text": "개인의 효율적인 분리배출·재사용과 환경 관심도가 일상화되고, 수자원 보전과 환경공학 일자리 창출을 통해 환경오염이 대폭 줄어든 상태가 된다.", "kind": "바라는 변화"}, {"id": "2-5-T2-012", "no": "02", "who": "5조 1명", "who_parts": null, "team": "5조", "text": "환경 우선 정책이 정착될 경우 각 기업에 환경 전문가가 상주하게 될 것이다.", "kind": "바라는 변화"}], "gist": "대응 배경 없음. 일자리는 두 조가 기대효과 쪽에서만 제기했다.", "empty": true, "worry": false}, {"id": "EF-2-20", "name": "해양 생태계와 미세플라스틱", "want": "생활 쓰레기와 미세플라스틱이 크게 줄고, 그 피해를 다른 나라가 대신 떠안는 일도 사라진다", "items": [{"id": "2-1-T1-014", "no": "01", "who": "1조 1명", "who_parts": null, "team": "1조", "text": "사람들이 버리는 옷들로 인해 의류폐기물이 발생하고 그 의류폐기물이 소각 매립되어 환경오염을 일으킨다.", "kind": "문제 인식"}, {"id": "2-3-T1-003", "no": "02", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "저가 합성섬유 의류의 무분별한 소비 및 폐기 행태와 탄소 배출 과정 및 환경 영향에 대한 시민들의 상세한 인식 부족을 확인하였다.", "kind": "문제 인식"}, {"id": "2-5-T1-041", "no": "03", "who": "5조 1명", "who_parts": null, "team": "5조", "text": "의류용품의 재활용 및 재사용이 불가한 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-3-T2-008", "no": "04", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "생활 쓰레기와 미세플라스틱 배출이 획기적으로 감축되고, 친환경 포장 기준 정착과 글로벌 기후 불평등이 완화된 상태가 된다.", "kind": "바라는 변화"}], "gist": "의류폐기물의 소각·매립에 따른 환경오염, 저가 합성섬유 의류의 무분별한 소비와 재활용 불가.", "empty": false, "worry": false}], "count": 177}, {"id": "T3", "name": "의제3 교육 및 참여", "short": "교육 및 참여", "color": {"deep": "#125235", "tint": "#cdebd9", "bright": "#7ee2a8"}, "groups": [{"id": "EF-3-01", "name": "인식 개선의 실천 연결", "want": "인식이 실천으로 이어져, 시민 인식이 제고되면 정책도 따라 바뀐다", "items": [{"id": "3-1-T1-008", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "환경문제를 알지만 실천하고 있지 않아 실천이 필요하다.", "kind": "문제 인식"}, {"id": "3-1-T1-009", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "일회용품 사용을 줄여야 하지만 편리함때문에 잘 해결하지 못하는 것 같다.", "kind": "문제 인식"}, {"id": "3-1-T1-017", "no": "03", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "학교에서 활동지를 쓰고 바로 버려요. 교육을 해도 기후의 심각성을 잘 모르는 것 같아요. 어떻게 해야 심각성을 깨닫게 할지는 더 생각해봐야할 것 같아요.", "kind": "문제 인식"}, {"id": "3-5-T1-006", "no": "04", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "교재에 나와 있는 해결인식에 대한 인식이 낮다고 함. 어떻게 해야 할 것인지 고민해 볼 필요가 있음. 해결 방안에 대한 문제를 인식해야 함. 해결 방안에 대한 교육적 접근이 필요함.", "kind": "문제 인식"}, {"id": "3-5-T1-013", "no": "05", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "교육해도 실제 행동으로 나타나기는 차이가 있음. 환경에 대한 행동은 내가 불편함을 감수해야 하는 것들이 많음. 내 편리함을 포기하라고 한다면 잘 이행되기 쉽지 않음. 편리함을 포기해야 함을 자연스럽게 받아드릴 수 있도록 하거나 인센티브와 같은 보상도 좋음. 다만 지금은 현재 빠른 변화가 필요하기에 편리함을 포기해야 하는 것 같기에 이를 받아드리게 하는 방법에 대한 고민이 필요함.", "kind": "문제 인식"}, {"id": "3-5-T1-028", "no": "06", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "그래서 환경에 대한 활동이 신뢰가 없음.", "kind": "문제 인식"}, {"id": "3-5-T1-033", "no": "07", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경에 대한 실제적인 체감은 되지 않는데 계속 규제만 늘어나고 있어서 환경에 대한 관심도가 낮은 듯함. 환경에 대한 규제가 반발심을 만들기도 함.", "kind": "문제 인식"}, {"id": "3-5-T1-034", "no": "08", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "체감되는 문제가 아니기에 그동안 제대로 교육이 진행되지 않았던 것 같음. 북극곰의 문제를 보면서도 에어컨을 켜는 듯이 직접적인 내 문제로 다가오지 않아서 교육의 효과성이 낮음.", "kind": "문제 인식"}, {"id": "3-5-T1-036", "no": "09", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경교육에 대한 결과물이 보이지 않아서 참여율이 떨어지는 듯함. 효용감을 잘 느끼지 못함.", "kind": "문제 인식"}, {"id": "3-1-T2-002", "no": "10", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "사람 대부분이 많이 알아서 기후에 대한 관심(인식)이 늘어날 거 같다.", "kind": "바라는 변화"}, {"id": "3-4-T2-002", "no": "11", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "기대효과: 기후시민 양성이 되고, 변화를 가속화될 수 있을 것이다. 탄소중립으로 가는 길이 더 빨라 질 것이다. 탄소중립으로 가기 위한 산업 발전으로 순환적 경제에 더움이 될 것이다.", "kind": "바라는 변화"}, {"id": "3-5-T2-003", "no": "12", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경문제에 대한 인지 개선. 다양한 환경에 대한 실질적인 인식 개선이 직접적인 실천으로 연결됨.", "kind": "바라는 변화"}, {"id": "3-5-T2-004", "no": "13", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경적 활동 실천에 대한 불신이 감소할 수 있으리라 생각함.", "kind": "바라는 변화"}, {"id": "3-5-T2-008", "no": "14", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "인식 개선과 실천이 가능한 동기가 기대됨. 인식 개선은 나 하나가 뭘 바꿀 수 있을까에서 나 하나라도 바뀌는 것으로 변화할 것임. 실천 가능성도 지속 가능한 교육을 통해 환경 활동에 대한 동기 향상이 될 것임. 교육을 통해 다양한 방안을 이끌어낼 수 있고 정책을 변화할 수 있을 것 같음. 시민 인식이 제고되면 정책도 자연스럽게 변화할 수 있음.", "kind": "바라는 변화"}, {"id": "3-5-T2-009", "no": "15", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "인식 개선, 문제의식을 할 수 있으며 효율적인 환경보호 운동으로 연결되리라 기대됨. ‘환경’ 하면 북극곰을 생각하게 되는데 먼 이야기가 아닌 현실에 맞는 문제 인식을 통해 인식 개선할 수 있음.", "kind": "바라는 변화"}, {"id": "3-5-T2-013", "no": "16", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "개인적으로 환경교육에 대한 부담감이 줄어들 수 있을 것 같음.", "kind": "바라는 변화"}], "gist": "알지만 실천하지 않고, 체감되지 않아 교육 효과가 낮으며, 결과가 보이지 않아 환경 활동에 신뢰가 없다", "empty": false, "worry": false}, {"id": "EF-3-02", "name": "체험·시각 중심 교육 전환", "want": "듣기만 하던 교육이 몸으로 해보고 눈으로 확인하는 자리가 되어, 아이도 어른도 스스로 찾아간다", "items": [{"id": "3-1-T1-001", "no": "01", "who": "1조 3명", "who_parts": null, "team": "1조", "text": "환경교육 방식이 너무 지루하다. 앉아서 얘기하는 것", "kind": "문제 인식"}, {"id": "3-1-T1-015", "no": "02", "who": "1조 3명", "who_parts": null, "team": "1조", "text": "학교에서 교육을 한다고 하지만 교육에서 만들기나 잘 안쓰는 것을 만드는 것 같아서 일회용성으로 끝나는 경향이 있어서 그것들이 쓰레기가 되는 경우가 많아서 그것이 정말 안타까운 것 같다.", "kind": "문제 인식"}, {"id": "3-5-T1-012", "no": "03", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "주민센터에서 취미와 환경을 결합한 교육이 있으면 좋을 것 같음. 쉽게 참여하면 의식을 제고할 수 있음.", "kind": "문제 인식"}, {"id": "3-5-T1-022", "no": "04", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "학생 때 환경은 도덕 수업 같았음. 실제 행동이 어떤 영향이 있는지 배우기는 하지만 직접적 와닿지는 않음. 실질적인 효과에 대한 교육이 필요할 것 같음.", "kind": "문제 인식"}, {"id": "3-5-T1-032", "no": "05", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경교육이 재미가 있을 수 있으리라 의구심이 들었다고 생각함. 시대별 인식 차이도 있어서 아이들은 이해관계자(교사)가 했던 것처럼 지렁이를 활용하여 수업하면 재미를 느낄 수 있겠지만 성인을 대상으로 그 수업은 어려움.", "kind": "문제 인식"}, {"id": "3-5-T1-037", "no": "06", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "잘 되는 시범단지를 만들어서, 모델링을 할 수 있게 하는 것도 좋을 것 같음. 직접적으로 와닿는 프로그램, 기회가 필요함. 장점이 강조되어야 참여율을 높일 수 있을 것 같음.", "kind": "문제 인식"}, {"id": "3-1-T2-024", "no": "07", "who": "1조 3명", "who_parts": null, "team": "1조", "text": "듣기만 하는 것이 지루하니 체험활동을 한다.", "kind": "바라는 변화"}, {"id": "3-5-T2-011", "no": "08", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "체험형 교육이 있으면 좋을 것 같음. 몸으로 체험하는 교육이 효과가 높을 것 같음. 쓰레기 처리장에 가면 쓰레기의 많은 양을 느낄 수 있음.", "kind": "바라는 변화"}, {"id": "3-5-T2-014", "no": "09", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "", "kind": "바라는 변화"}, {"id": "3-5-T2-015", "no": "10", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "마트에 가면 벽면에 우리 마트는 몇톤을 줄였고, 나무를 몇그루 심었다. 등으로 홍보하고 있는데 와닿지 않음. 단순하게 재미로 끝나는 것이 아니라 와닿는 체험형 교육이 필요함.", "kind": "바라는 변화"}, {"id": "3-5-T2-018", "no": "11", "who": "5조 6명", "who_parts": null, "team": "5조", : "02", "who": "5조 1명", "who_parts": null, "team": "5조", "text": "", "kind": "문제 인식"}, {"id": "3-5-T1-046", "no": "03", "who": "5조 1명", "who_parts": null, "team": "5조", "text": "열심히 보여지는 운동이 아닌 실질적인 운동을 지원할 수 있는 인프라가 필요함.", "kind": "문제 인식"}, {"id": "3-1-T2-005", "no": "04", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "사람들이 기후 위기에 대해 대처할 수 있는 물건들이 많이 개발될 수 있을 것 같다", "kind": "바라는 변화"}], "gist": "폐플라스틱 재활용 기업이 사라졌고 실질적 운동을 지원할 인프라가 없다", "empty": false, "worry": false}], "count": 120}], "disclaimer": "범주는 제5차 조별 산출물을 원자료 항목 단위로 묶은 것으로, 모더레이터 참고용이며 확정된 분류가 아니다. 조가 다르게 묶으면 그것이 맞다. 숙의참여단 배부용 자료로는 제작하지 않는다. 아카이브·연구용 화면이다.", "links": {"prezi": "prezi.html", "deck": "deck.html"}}</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STAGGER = reduced ? 0 : 40;      // 발언 하나마다 이만큼 늦게 보낸다 — 「쫙 올라오는」 간격
  var FLY = reduced ? 0 : 1100;        // 한 노드가 자리까지 가는 시간 (리서치 §3.2 1~1.25초)
  var CAM = reduced ? 0 : 1000;        // 카메라 이동 시간
  var ROOT_TITLE = "세 의제 · 시민 발언 494건";

  if (!window.vis) {                    // 라이브러리가 없으면 목록으로 읽힌다
    var fb = document.getElementById('fb'); fb.style.display='block';
    D.topics.forEach(function(t){ var h=document.createElement('h2'); h.textContent=t.name+' · '+t.count+'건'; fb.appendChild(h);
      t.groups.forEach(function(g){ var p=document.createElement('p'); p.textContent='· '+g.name+' ('+g.items.length+'건) · 기대 효과 '+g.want; fb.appendChild(p); }); });
    document.getElementById('net').remove(); document.getElementById('side').remove(); return;
  }

  // ── 밝기 판 ──────────────────────────────────────────────────────────────
  var rootEl = document.documentElement;
  var q = new URLSearchParams(location.search).get('theme'); rootEl.setAttribute('data-polarity', q==='dark' ? 'dark' : 'light');
  function isDark(){ return rootEl.getAttribute('data-polarity')==='dark'; }
  var PAL = {
    light:{ ground:'#edeff3', panel:'#ffffff', ink:'#151b28', edge:'#6b7686',
            topic:function(t){ return {fill:t.color.deep, border:t.color.deep, text:'#ffffff', tint:t.color.tint, deep:t.color.deep}; } },
    dark: { ground:'#0f1626', panel:'#182036', ink:'#eef2f7', edge:'#4a5878',
            topic:function(t){ return {fill:t.color.bright, border:t.color.bright, text:'#0f1626', tint:'#182036', deep:t.color.bright}; } }
  };
  function pal(){ return isDark() ? PAL.dark : PAL.light; }

  var nodes = new vis.DataSet(), edges = new vis.DataSet();
  var byId = {}; D.topics.forEach(function(t){ byId[t.id]=t; t.groups.forEach(function(g){ byId[g.id]=g; g.topic=t; g.items.forEach(function(i){ byId[i.id]=i; i.group=g; }); }); });

  // 노드에는 이름과 번호만 싣는다. 본문은 오른쪽 목록과 원문 창이 맡는다(리서치 §2·§5).
  function topicNode(t){ var P=pal(), c=P.topic(t); return {id:t.id, label:t.name, level:0, shape:'box', margin:22, shapeProperties:{borderRadius:8},
    color:{background:c.fill, border:c.border}, font:{color:c.text, size:40, face:'Noto Sans KR', bold:{size:40, color:c.text}}, borderWidth:4}; }
  function groupNode(g){ var P=pal(), c=P.topic(g.topic); return {id:g.id, label:g.name+'\n'+g.items.length+'건', level:1, shape:'box', margin:16, shapeProperties:{borderRadius:8},
    color:{background:c.tint, border:c.deep}, font:{color:P.ink, size:30, face:'Noto Sans KR', bold:{size:30, color:P.ink}}, borderWidth:5}; }
  // 이름 뒤 괄호(출처 표시 — 〔수작업 대조 B〕·(기록보고서) 등)는 상자에서 뺀다. 목록과 원문 창에는 남는다.
  var namesOff = new URLSearchParams(location.search).get('names')==='off';   // N 키 — 이름을 감추고 조만 남긴다(위원장 검토용)
  function team(w){ var m=w.match(/^\d+조/); return m ? m[0] : w; }
  function whoShow(w){ return namesOff ? team(w) : w; }
  function whoShort(w){ if (namesOff) return team(w);
    var m = w.match(/^(\d+조\s*[^·\s]+)·\S*/); if (m) w = w.replace(m[0], m[1]);   // 「이름·이름」처럼 이름이 둘이면 첫 이름만 — 상자 폭을 일정하게
    if (w.length > 12) w = w.slice(0, 11) + '…';
    return w; }
  function itemNode(i){ var P=pal(), c=P.topic(i.group.topic); return {id:i.id, label:i.no+'\n'+whoShort(i.who), level:2, shape:'box', margin:{top:8,bottom:8,left:14,right:14}, shapeProperties:{borderRadius:8},
    color:{background:P.panel, border:c.deep}, font:{color:P.ink, size:26, face:'Noto Sans KR', bold:{size:26, color:P.ink}}, borderWidth:3}; }
  function rebuild(id){ var o=byId[id]; return o.groups ? topicNode(o) : (o.items ? groupNode(o) : itemNode(o)); }

  // 의제 3개 자리 — 캔버스 크기에서 잡아 매번 같은 자리
  var S0=(function(){ var el=document.getElementById('net'); return {W:el.clientWidth, H:el.clientHeight}; })();
  var TRI = [[-S0.W*0.3,-S0.H*0.24],[S0.W*0.3,-S0.H*0.24],[0,S0.H*0.3]];
  D.topics.forEach(function(t,k){ var n=topicNode(t); n.x=TRI[k][0]; n.y=TRI[k][1]; n.fixed=true; nodes.add(n); });

  var net = new vis.Network(document.getElementById('net'), {nodes:nodes, edges:edges}, {
    physics:{ enabled:false },
    interaction:{hover:false, dragNodes:true, zoomView:true, tooltipDelay:1e9},
    edges:{ color:{color:pal().edge}, width:3, smooth:{type:'continuous'} },
    layout:{improvedLayout:false}
  });

  window.__net = net;                          // 측정용 — 배율·좌표를 밖에서 읽는다(__go·__dbg 도 아래에서 붙인다)
  var open = {};                               // 펼친 노드 → 자식 id 목록
  var hiddenBy = {};                           // 펼치며 감춘 노드들
  var gen = {};                                // 노드 id 별 세대 — 되돌아가는 중에 다시 펴도 옛 타이머가 새 노드를 건드리지 않게
  var fadeSeq = 0, fadeTok = {};
  var FADE = reduced ? 0 : 350, BACK = reduced ? 0 : 520;
  var dest = {};                               // 날아가는 중인 노드의 목표 자리 — 링 중심은 현재 위치가 아니라 목표로 잡는다
  function at(parent){ if (dest[parent] && nodes.get(parent)) return dest[parent]; return net.getPositions([parent])[parent] || {x:0,y:0}; }

  // 자식 자리 — 부모 둘레 타원. 좌표 단위 = 배율 1 의 화면 픽셀.
  // 범주(4개)는 캔버스를 채우는 타원. 발언은 「이웃 간격 170px」에서 반지름을 거꾸로 계산해 상자가
  // 서로 닿지 않게 하고, 카메라가 그 타원을 캔버스에 맞춘다(1080p 에서 배율 0.95~1.5 → 글자 24px 이상).
  // 11개까지 한 겹, 그 위는 안쪽 1/3·바깥 2/3 두 겹. 상자가 가로로 넓어 가로 반지름을 더 준다.
  var PAD = 50, GAP = 160;
  function canvas(){ var el=document.getElementById('net'); return {W:el.clientWidth, H:el.clientHeight}; }
  function ring(n, level){
    var S=canvas(), rx, ry;
    if (level===1) { rx=Math.max(S.W/2-PAD-170, 430); ry=Math.max(S.H/2-PAD-50, 180); }   // 낮은 창에서도 의제 상자(반폭 230)를 벗어난다
    else { var two = n>11, m = two ? n-Math.floor(n/3) : n;
      // 두 겹이면 안쪽 링이 범주 상자(반폭 ≤140)와 카드(반폭 ≤90)를 비켜야 하므로 반지름 하한 360 (안쪽 = 0.55배 → 가로 257)
      var r = Math.max(m*GAP/(2*Math.PI), two ? 360 : 200); rx=r*1.3; ry=r*0.8; }
    function arc(m, f, off){ var o=[]; for (var k=0;k<m;k++){ var a=-Math.PI/2 + (k+off)*2*Math.PI/m; o.push([Math.cos(a)*rx*f, Math.sin(a)*ry*f]); } return o; }
    if (level===1 || n<=11) return arc(n, 1, 0);
    var inner=Math.max(1, Math.floor(n/3));
    return arc(inner, 0.55, 0).concat(arc(n-inner, 1, 0.5));
  }
  // 상자 반폭·반높이(배율 1 기준 어림) — 카메라 여백에 더해 상자가 캔버스 밖으로 잘리지 않게 한다
  function half(id){ var o=byId[id]; return o.groups ? [230,40] : (o.items ? [140,45] : [90,50]); }
  function frame(ids, extra, instant){          // 노드들의 경계 상자로 카메라를 옮긴다. extra = 아직 날아가는 중인 목표 좌표(id 포함)
    var P = net.getPositions(ids), xs=[], ys=[], hw=0, hh=0;
    ids.forEach(function(i){ if(P[i]){ xs.push(P[i].x); ys.push(P[i].y); var h=half(i); hw=Math.max(hw,h[0]); hh=Math.max(hh,h[1]); } });
    (extra||[]).forEach(function(q){ xs.push(q.x); ys.push(q.y); var h=half(q.id); hw=Math.max(hw,h[0]); hh=Math.max(hh,h[1]); });
    if (!xs.length) return;
    var px=PAD+hw, py=PAD+hh, x0=Math.min.apply(null,xs)-px, x1=Math.max.apply(null,xs)+px,
        y0=Math.min.apply(null,ys)-py, y1=Math.max.apply(null,ys)+py;
    var S=canvas(), W=S.W, H=S.H;
    var sc=Math.min(W/(x1-x0), H/(y1-y0), 1.3), c={x:(x0+x1)/2, y:(y0+y1)/2};
    if (!(sc>0)) return;                        // 캔버스가 0 크기(최소화된 창)면 카메라를 건드리지 않는다 — vis 가 예외를 던져 상태 갱신을 끊는다
    var my = ++frameSeq;
    if (instant) { net.moveTo({position:c, scale:sc, animation:false}); return; }
    net.moveTo({position:c, scale:sc, animation:{duration:CAM, easingFunction:'easeInOutQuad'}});
    // 화면이 가려져 애니메이션이 멈췄어도 카메라는 도착한다 — 그 사이 새 이동이 있었으면 옛 도착은 버린다
    setTimeout(function(){ if (my===frameSeq) net.moveTo({position:c, scale:sc, animation:false}); }, CAM+120);
  }
  var frameSeq = 0;
  var ease = function(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; };   // easeInOutQuad
  function fly(id, from, to, ms, delay){       // 부모 자리에서 목표 자리로 날린다
    dest[id] = to;
    if (!ms) { nodes.update({id:id, x:to.x, y:to.y}); return; }
    var t0=null, done=false, g=gen[id];
    // 날아가는 도중 노드가 지워졌거나 새 세대로 바뀌었으면 멈춘다 — DataSet.update 는 없는 id 를 새로 넣어 버리므로
    function alive(){ if (done) return false; if (!nodes.get(id) || gen[id]!==g) { done=true; return false; } return true; }
    function step(ts){ if(!alive()) return; if(t0===null) t0=ts; var t=Math.min(1,(ts-t0)/ms), e=ease(t);
      nodes.update({id:id, x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e});
      if (t<1) requestAnimationFrame(step); else done=true; }
    setTimeout(function(){ requestAnimationFrame(step); }, delay);
    // 화면이 가려져 rAF 가 멈춰도 제자리에는 간다 — 발표 중 창 전환 뒤 돌아왔을 때 쌓여 있지 않게
    setTimeout(function(){ if(alive()){ done=true; nodes.update({id:id, x:to.x, y:to.y}); } }, delay+ms+80);
  }
  function visibleIds(){ return nodes.get({filter:function(n){ return !n.hidden; }}).map(function(n){ return n.id; }); }
  // 서서히 감추고 서서히 되살린다 — 순간 사라짐이 끊겨 보이는 것을 막는다. 같은 노드에 새 페이드가 걸리면 옛 것은 멈춘다.
  function fade(ids, from, to, ms, then){
    ids = ids.filter(function(id){ return nodes.get(id); });
    if (!ids.length) { if (then) then([]); return; }
    var tok = ++fadeSeq, gs = {}; ids.forEach(function(id){ fadeTok[id]=tok; gs[id]=gen[id]; });
    // 살아 있는 것 = 같은 페이드 토큰 · 아직 존재 · 같은 세대(그 사이 지웠다 새로 낸 노드는 건드리지 않는다)
    function live(){ return ids.filter(function(id){ return fadeTok[id]===tok && nodes.get(id) && gen[id]===gs[id]; }); }
    if (!ms) { nodes.update(live().map(function(id){ return {id:id, opacity:to}; })); if (then) then(live()); return; }
    var t0=null, finished=false;
    function finish(){ if (finished) return; finished=true; var L=live(); nodes.update(L.map(function(id){ return {id:id, opacity:to}; })); if (then) then(L); }
    function step(ts){ if (finished) return; if(t0===null) t0=ts; var t=Math.min(1,(ts-t0)/ms);
      nodes.update(live().map(function(id){ return {id:id, opacity:from+(to-from)*t}; }));
      if (t<1) requestAnimationFrame(step); else finish(); }
    requestAnimationFrame(step);
    setTimeout(finish, ms+100);                 // 화면이 가려져 rAF 가 멈춰도 끝은 낸다
  }
  function burst(parentId){
    if (open[parentId]) return;
    var o = byId[parentId], children = o.groups || o.items, mk = o.groups ? groupNode : itemNode;
    if (!children) return;
    open[parentId] = children.map(function(c){ return c.id; });
    var p = at(parentId), level = o.groups ? 1 : 2, spots = ring(children.length, level);
    var edgeColor = pal().topic(o.groups ? o : o.topic).deep;
    // 한 번에 하나 — 펴는 노드만 남기고 나머지(다른 의제·다른 범주)는 서서히 감춘다. 이름은 위 제목줄이 말한다.
    var mine = {}; children.forEach(function(c){ mine[c.id]=true; });   // 되돌아가던 자식은 이웃이 아니다 — 곧 새로 낸다
    var sib = nodes.get({filter:function(n){ return !n.hidden && n.id!==parentId && !mine[n.id]; }}).map(function(n){ return n.id; });
    hiddenBy[parentId] = sib;
    fade(sib, 1, 0, FADE, function(L){ if (hiddenBy[parentId]!==sib) return;      // 그 사이 되돌렸으면 감추지 않는다
      nodes.update(L.map(function(id){ return {id:id, hidden:true, opacity:1}; })); });
    var targets = children.map(function(c, k){
      if (nodes.get(c.id)) nodes.remove(c.id);  // 되돌아가는 중이던 것은 바로 치우고 새로 낸다
      gen[c.id] = (gen[c.id]||0) + 1;
      var n = mk(c); n.x = p.x; n.y = p.y; n.fixed = true;
      nodes.add(n); edges.add({id:parentId+'>'+c.id, from:parentId, to:c.id, color:{color:edgeColor}});
      var to = {x:p.x+spots[k][0], y:p.y+spots[k][1]};
      fly(c.id, p, to, FLY, k*STAGGER);
      return {id:c.id, x:to.x, y:to.y};
    });
    frame([parentId], targets);                 // 카메라는 목표 좌표 기준으로 지금 바로 움직인다 — 터짐과 같이 간다
  }
  function collapse(parentId){
    var kids = open[parentId]; if (!kids) return;
    var p = at(parentId);
    kids.forEach(function(k, i){ collapse(k); edges.remove(parentId+'>'+k);
      if (!BACK || !nodes.get(k)) { if (nodes.get(k)) nodes.remove(k); return; }
      var g = gen[k];                           // 부모 자리로 되돌아간 뒤 지운다 — 터짐의 역재생
      fly(k, at(k), p, BACK, i*12);
      setTimeout(function(){ if (gen[k]===g && nodes.get(k)) nodes.remove(k); }, BACK + i*12 + 40);
    });
    delete open[parentId];
    // 감췄던 것을 서서히 되살린다 — 그 사이 지워진 id 는 뺀다(DataSet.update 는 없는 id 를 유령 노드로 새로 넣는다)
    var back = (hiddenBy[parentId]||[]).filter(function(id){ return nodes.get(id) && kids.indexOf(id)<0; }); delete hiddenBy[parentId];
    nodes.update(back.map(function(id){ return {id:id, hidden:false, opacity:FADE?0:1}; }));
    fade(back, 0, 1, FADE);
    frame(visibleIds().filter(function(id){ return kids.indexOf(id)<0; }));
  }

  // ── 글 영역: 제목(왼쪽 위)·목록(오른쪽) ──────────────────────────────────
  var title=document.getElementById('title'), crumb=document.getElementById('crumb');
  var sHead=document.getElementById('s-head'), sSub=document.getElementById('s-sub'), sBig=document.getElementById('s-big'), sList=document.getElementById('s-list');
  var sWant=document.getElementById('s-want');
  function accent(t){ rootEl.style.setProperty('--accent', t ? pal().topic(t).deep : ''); }
  function li(cls, html, onclick){ var el=document.createElement('li'); if(cls) el.className=cls; el.innerHTML=html; el.tabIndex=0;
    if(onclick){ el.addEventListener('click', onclick); el.addEventListener('keydown', function(e){ if(e.key==='Enter') onclick(); }); } return el; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var sLinks=document.getElementById('s-links');
  function links(pg){ var h=''; if (D.links.prezi) h+='<a href="'+D.links.prezi+(pg?'#/'+pg:'')+'" target="_blank" rel="noopener">프레지판 ↗</a>';
    if (D.links.deck) { var d=D.links.deck; if (pg){ var s=pg.split('-'); d=d.replace(/\.html$/, '-'+s[1]+'.html')+'#/pg-'+s[1]+'-'+s[2]; } h+='<a href="'+d+'" target="_blank" rel="noopener">발표 장표 ↗</a>'; }
    sLinks.innerHTML=h; }
  function hud(id){
    var o = byId[id]; sList.innerHTML=''; sWant.innerHTML=''; links(o && o.items ? id : null);
    if (!o) { accent(null); title.textContent=ROOT_TITLE; crumb.innerHTML='의제를 누르면 범주가, 범주를 누르면 발언이 터져 나온다';
      sHead.textContent='의제별 시민 발언'; sSub.textContent='제5차 회의 · 15개 조'; sBig.innerHTML=D.topics.reduce(function(a,t){return a+t.count;},0)+'<small>건</small>';
      D.topics.forEach(function(t){ sList.appendChild(li('sum', '<span>'+esc(t.name)+'</span><span class="n">'+t.count+'</span>', function(){ go(t.id); })); });
      return; }
    if (o.groups){ accent(o); title.textContent=o.name; crumb.innerHTML='<b>범주 '+o.groups.length+'</b> · 시민 발언 '+o.count+'건';
      sHead.textContent=o.short; sSub.textContent='범주 '+o.groups.length+'개 — 누르면 발언이 터져 나온다'; sBig.innerHTML=o.count+'<small>건</small>';
      o.groups.forEach(function(g){ sList.appendChild(li('sum', '<span>'+esc(g.name)+'</span><span class="n">'+g.items.length+'</span>', function(){ go(g.id); })); });
      return; }
    // 상태 문장은 제목줄에 싣지 않는다 — 두 줄이 되면 아래 그래프 캔버스를 덮는다. 문장은 오른쪽 패널이 맡는다.
    if (o.items){ accent(o.topic); title.textContent=o.name; crumb.innerHTML=esc(o.topic.short)+' · <b>'+esc(o.name)+'</b> · 기대 효과';
      sHead.textContent=o.name; sWant.innerHTML='<span class="wl">기대 효과</span>'+esc(o.want);
      sSub.textContent='이 범주에 붙은 시민 발언 · 번호가 그래프의 번호다'; sBig.innerHTML=o.items.length+'<small>건</small>';
      o.items.forEach(function(i){ sList.appendChild(li('', '<span class="no">'+i.no+'</span><span class="row"><span class="who">'+esc(whoShow(i.who))+'</span> <span class="cut">'+esc(i.text)+'</span></span>', function(){ show(i); })); });
    }
  }

  var ov=document.getElementById('ov');
  function show(i){ accent(i.group.topic);
    document.getElementById('ov-who').textContent=whoShow(i.who); document.getElementById('ov-kind').textContent=i.group.name+' · '+i.kind;
    document.getElementById('ov-txt').textContent=i.text; document.getElementById('ov-id').textContent=i.id; ov.classList.add('on'); }
  ov.addEventListener('click', function(){ ov.classList.remove('on'); });

  // 목록에서 누른 것도 같은 길로 간다 — 범주를 누르면 그 의제부터 편다
  function go(id){ var o=byId[id];
    if (o.groups){ if (open[id]) return; Object.keys(open).forEach(collapse); burst(id); hud(id); return; }
    if (o.items){ if (open[id]) return; Object.keys(open).forEach(function(k){ if (byId[k].items) collapse(k); });
      if (!open[o.topic.id]) { Object.keys(open).forEach(collapse); burst(o.topic.id);
        setTimeout(function(){ if (open[o.topic.id] && !open[id]) { burst(id); hud(id); } }, FLY + 4*STAGGER + 60);   // 범주가 제자리에 앉은 뒤 편다
        hud(o.topic.id); return; }
      burst(id); hud(id); } }

  net.on('click', function(ev){
    var id = ev.nodes[0]; if (!id) return;
    var o = byId[id];
    if (o.groups)      { if (open[id]) { collapse(id); hud(null); } else { burst(id); hud(id); } }
    else if (o.items)  { if (open[id]) { collapse(id); hud(o.topic.id); } else { burst(id); hud(id); } }
    else               { show(o); }
  });

  // 안내 순서 — Space 로 차례대로 터뜨린다: 의제1 → 범주1 → 발언 → 되돌아와 → 범주2 …
  var tour = []; D.topics.forEach(function(t){ tour.push({open:t.id}); t.groups.forEach(function(g){ tour.push({open:g.id}); tour.push({close:g.id}); }); tour.push({close:t.id}); });
  var step = 0;
  function next(){ if (step>=tour.length) return; var s=tour[step++]; var o=byId[s.open||s.close];
    if (s.open){ burst(s.open); hud(s.open); }
    else { collapse(s.close); hud(o.groups ? null : o.topic.id); } }
  function back(){ var ids=Object.keys(open); if(!ids.length) return; var last=ids[ids.length-1]; collapse(last); var o=byId[last]; hud(o.groups?null:o.topic.id); step=Math.max(0,step-1); }
  function reset(){ Object.keys(open).forEach(collapse); hiddenBy={};
    nodes.update(nodes.getIds().map(function(id){ return {id:id, hidden:false}; }));   // 처음 = 의제 3개 전부 보임
    step=0; hud(null); frame(visibleIds()); }
  function toggleTheme(){ rootEl.setAttribute('data-polarity', isDark() ? 'light' : 'dark');
    nodes.update(nodes.getIds().map(rebuild)); net.setOptions({edges:{color:{color:pal().edge}}});
    edges.update(edges.get().map(function(e){ var o=byId[e.from]; return {id:e.id, color:{color:pal().topic(o.groups?o:o.topic).deep}}; }));
    var cur = Object.keys(open).filter(function(k){ return byId[k].items; })[0] || Object.keys(open)[0] || null; hud(cur); }
  document.addEventListener('keydown', function(e){
    if (ov.classList.contains('on')) { if (e.key==='Escape') ov.classList.remove('on'); return; }
    if (e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); next(); }
    else if (e.key==='ArrowLeft'||e.key==='Backspace'){ e.preventDefault(); back(); }
    else if (e.key==='r'||e.key==='R'){ reset(); }
    else if (e.key==='d'||e.key==='D'){ toggleTheme(); }
    else if (e.key==='n'||e.key==='N'){ namesOff=!namesOff; nodes.update(nodes.getIds().map(rebuild));
      var cur2 = Object.keys(open).filter(function(k){ return byId[k].items; })[0] || Object.keys(open)[0] || null; hud(cur2); }
  });
  net.once('afterDrawing', function(){ if (Object.keys(open).length) return; frame(visibleIds()); });   // 첫 그리기가 늦어도 이미 펼친 화면을 덮지 않는다
  hud(null);                                                                   // 글 영역은 그리기와 무관하게 바로 채운다
  var op=new URLSearchParams(location.search).get('open');                     // 다른 판에서 ?open=PG-1-2 로 건너오면 그 범주를 바로 편다
  if (op && byId[op]) setTimeout(function(){ if (!Object.keys(open).length) go(op); }, 700);
  window.__dbg = function(){ return {open:Object.keys(open), hiddenBy:hiddenBy, gen:gen}; };   // 측정용
  window.__go = go; window.__reset = reset; window.__visible = visibleIds;
  window.__snap = function(){ frame(visibleIds(), null, true); net.redraw(); };   // 측정용 — 카메라를 즉시 도착시킨다
  window.__settle = function(){ Object.keys(dest).forEach(function(id){ if (nodes.get(id)) nodes.update({id:id, x:dest[id].x, y:dest[id].y}); }); };   // 측정용 — 날아가는 노드를 제자리에 놓는다
  net.on('dragEnd', function(ev){ if (ev.nodes.length) nodes.update(ev.nodes.map(function(id){ return {id:id, fixed:true}; })); });
  window.addEventListener('resize', function(){ frame(visibleIds()); });
})();
</script>
</body>
