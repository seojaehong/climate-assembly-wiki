<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>숙의 지도 · 관계 그래프</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* 밝기는 발표자가 정한다 — 보는 사람의 OS·앱 테마를 따르지 않는다(리서치 §1: 회의장 프로젝터 기준).
   밝은 판이 기본이고, 어두운 판은 D 키 또는 ?theme=dark 로 켠다. 속성 이름을 data-polarity 로 둔
   것은 아티팩트 뷰어가 찍는 data-theme 과 섞이지 않게 하기 위해서다. */
:root{
  --bg:#edeff3; --panel:#ffffff; --ink:#151b28; --mute:#455066; --line:#c5cbd6; --edge:#6b7686;
  --t1:#6b4600; --t2:#0a4d6e; --t3:#12523f;
  --ov:rgba(237,239,243,.94);
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
:root[data-polarity="dark"]{
  --bg:#0f1626; --panel:#182036; --ink:#eef2f7; --mute:#a3adc2; --line:#2a3550; --edge:#4a5878;
  --t1:#f5b942; --t2:#5bc0eb; --t3:#7ee2a8; --ov:rgba(15,22,38,.94);
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
#net{position:fixed;left:0;top:190px;bottom:112px;width:63vw}
#net div,#net canvas{outline:none}   /* vis 기본 CSS 를 싣지 않으므로 캔버스 포커스 외곽선을 직접 끈다 */
.hud{position:fixed;left:40px;top:28px;right:37vw;pointer-events:none}
.hud .eyebrow{font-size:24px;color:var(--mute);letter-spacing:.06em;font-weight:700}
.hud h1{margin:4px 0 0;font-size:44px;line-height:1.15;font-weight:900;text-wrap:balance}
.hud .crumb{margin-top:8px;font-size:26px;color:var(--mute);font-weight:700}
.hud .crumb b{color:var(--ink)}
#side{position:fixed;right:0;top:190px;bottom:112px;width:37vw;background:var(--panel);
      border-left:3px solid var(--line);padding:28px 36px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
#side .head{font-size:28px;font-weight:900;line-height:1.2}
#side .sub{font-size:22px;color:var(--mute);font-weight:700}
#side .slinks{display:flex;gap:10px;flex-wrap:wrap}
#side .slinks a{font-size:22px;font-weight:700;color:var(--panel);background:var(--accent,var(--ink));padding:6px 14px;border-radius:8px;text-decoration:none}
#side .big{font-size:88px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent,var(--ink))}
#side .big small{font-size:24px;color:var(--mute);margin-left:12px;font-weight:700}
#side ol{list-style:none;margin:6px 0 0;padding:0;overflow:auto;flex:1;min-height:0}
#side li{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:baseline;padding:5px 8px;
        font-size:22px;line-height:1.3;border-radius:6px;cursor:pointer}
#side li:hover,#side li:focus{background:var(--bg);outline:none}
#side li .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#side li .no{font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent,var(--ink))}
#side li .who{font-weight:700}
#side li .cut{color:var(--mute)}
#side li.sum{grid-template-columns:1fr auto;font-size:26px;padding:10px 8px;border-bottom:2px solid var(--line);border-radius:0}
#side li.sum .n{font-weight:900;font-variant-numeric:tabular-nums}
.foot{position:fixed;left:40px;right:40px;bottom:24px;display:flex;justify-content:space-between;
      align-items:flex-end;gap:32px;pointer-events:none}
.foot .note{font-size:20px;color:var(--mute);max-width:58vw;line-height:1.35}
.foot .keys{font-size:22px;color:var(--mute);font-weight:700;white-space:nowrap}
.foot .keys kbd{display:inline-block;background:var(--panel);border:2px solid var(--line);
      border-radius:8px;padding:2px 12px;color:var(--ink);font-family:inherit;margin:0 4px}
#ov{position:fixed;inset:0;background:var(--ov);display:none;align-items:center;
    justify-content:center;padding:6vh 8vw;cursor:pointer}
#ov.on{display:flex}
#ov .card{background:var(--panel);border-left:16px solid var(--accent,var(--ink));border-radius:6px;
    padding:48px 56px;max-width:1400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.18)}
#ov .who{font-size:40px;font-weight:900;margin:0 0 6px}
#ov .kind{font-size:24px;color:var(--mute);font-weight:700;margin:0 0 24px}
#ov .txt{font-size:32px;line-height:1.55;margin:0;white-space:pre-wrap;max-height:60vh;overflow:auto}
#ov .id{font-size:20px;color:var(--mute);margin:24px 0 0;font-variant-numeric:tabular-nums}
.fallback{display:none;padding:48px;font-size:28px;line-height:1.6}
/* 전체화면이 아닌 창(높이 820px 이하)에서는 제목·하단을 줄여 캔버스 높이를 되찾는다 */
@media (max-height:820px){
  .hud .eyebrow{display:none} .hud h1{font-size:36px} .hud .crumb{font-size:22px;margin-top:4px}
  #net,#side{top:130px;bottom:78px} .foot{bottom:14px} .foot .note{font-size:17px} .foot .keys{font-size:19px}
}
</style>
</head>

<div id="net"></div>
<div class="hud">

  <h1 id="title">세 의제 · 시민 발언 158건</h1>
  <div class="crumb" id="crumb">의제를 누르면 범주가, 범주를 누르면 발언이 터져 나온다</div>
</div>
<div id="side"><div class="head" id="s-head"></div><div class="sub" id="s-sub"></div><div class="slinks" id="s-links"></div><div class="big" id="s-big"></div><ol id="s-list"></ol></div>
<div class="foot">
  <div class="note"></div>
  <div class="keys"><kbd>Space</kbd> 다음 <kbd>←</kbd> 되돌리기 <kbd>R</kbd> 처음 <kbd>D</kbd> 밝기</div>
</div>
<div id="ov"><div class="card"><p class="who" id="ov-who"></p><p class="kind" id="ov-kind"></p>
  <p class="txt" id="ov-txt"></p><p class="id" id="ov-id"></p></div></div>

<script id="data" type="application/json">{"topics": [{"id": "T1", "name": "의제1 기업 온실가스 감축", "short": "기업 온실가스 감축", "color": {"deep": "#6b4600", "tint": "#fbe4b0", "bright": "#f5b942"}, "groups": [{"id": "PG-1-1", "name": "정책 일관성", "want": "정책 일관성과 전담 거버넌스", "items": [{"id": "1-1-T1-016", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "기업의 입장에서는 본인들의 이윤을 포기해 가면서 재생에너지를 사용하고 비용 올려야 하는 부담이 있는 건 맞다. 유럽은 가장 환경적인 정책들을 우선시하다보니까 지금 우리 입장에서는 부담을 느낄 수 있다. 우리가 한번에 그 지점까지 도약하자는 것까진 아니지만, 천천히 바꿔줄 필요가 있다. 원료같은 측면에서 시멘트도 우리나라는 친환경시멘트도 사용 안 하고 있다. 정확한 규제를 만들어서 친환경시멘트 사용 비율을 정한다든지 천천히 받아들일 수 있도록 하는 제반이 만들어지면 좋겠다. 정부 차원의 지원이 금전적인 지원뿐만이 아니라 촘촘한 규제를 만들어서 천천히 적용하게 지원해주는 것도 좋을 것 같다. RE100은 국제적 차원에서 이루어지는 거라 우리 입장에서는 극단적으로 느껴질 수도 있을 것 같다. 탄소중립을 향해 가는 중장기적인 단계를 구체적으로 어떻게 할 수 있을지. 어떤 재생에너지를 활용할 수 있게끔 정부 차원에서 기업에도 많이 알려주고, 해양풍력은 시간 제한 없이 발전량을 활용할 수 있고, 대한민국도 해양 풍력에 유효한 환경을 갖고 있다. 실제적으로 가이드라인을 촘촘하게 제시를 해주면 앞으로 지속적으로 기업들이 적응할 수 있지 않을까 싶다.", "kind": "문제 인식"}, {"id": "1-1-T1-026", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "법이 바뀌는 데 시간이 오래 걸린다. 3년 후 완성이 되고 이러니까... 구체화가 된 것에 대해서는 좀 빠르게 이루어질 수 있게 하는 것도 방법인 것 같다. 그런 것들을 시대에 맞게 해야 하는데, 이 시대에는 이게 맞는데 다음 세대에는 더 빨리 가야 하는데 법적으로 너무 오래 걸린다. 그러니까 법이 좀 더 빨리 이루어질 수 있도록 선제적인 게 필요하다.", "kind": "문제 인식"}, {"id": "1-1-T1-036", "no": "03", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "이미 기업들이 있는 규제에 한해서는 지키려고 하는 것 같다. 분명 지금도 규제에 따르고는 있을 테지만, 탄소배출권 같은 경우 2015년도에 아시아권 최초로 생겼다고 들었다. 그럼 선진적이었던 것 같은데, 규제로 얻을 수 있는 부가이익이 있음에도, 생겼을 당시에는 탄소배출권의 구조가 맞았을 수도 있을 것 같은데, 시간이 지나면서 변화가 있었어야 하는데 중장기적인 관심이 정부에서 부족했던 것 같다. 정권 등에 따라 섣불리 국민의 삶에 영향을 미칠 수 있기 때문에 정부 차원에서 적극적으로 개입이 어려운 부분이 있는 것 같다. 기업 입장에서는 가이드라인이 생기면 따라는 갈 텐데, 15년도에 생겼음에도 정부의 관심이 부족하지 않았나 싶다. 지속적으로 목표를 잡아놓고 정권이 바뀌더라도 계속 갈 수 있는 게 마련되어야 할 텐데 그게 좀 부재한 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-048", "no": "04", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "문제가 없기는 어려울 것이다. 짧은 시간 내에 많은 발전을 이룩하다 보니까 사이사이에 빈 공백이 있었고 시민들의 인식이 정착하기도 어려웠다. 시민들의 의식이 향상되고 정부에서도 이런 가이드가 잘 전달이 되고 정책에도 반영이 되어서 정책에 반영하면 나아질 수 있지 않을까 싶다.", "kind": "문제 인식"}, {"id": "1-2-T1-021", "no": "05", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "주제 자체의 주어가 기업임. 기업은 태생적으로 정부의 눈치를 보게됨. 어느 정권이든 변함없이 중심을 잡고 참여할 수 있는 계기를 만들어줘야함. 두 번째로 인식은 지금도 가지고 있으나, 내가 먼저 해야하나? 라는 생각(비용이 들기때문)이 별도로 들지않게됨. 인센티브가 있으면 못할 이유가 없을 것이라 생각함. 이 인센티브는 대기업과 중소기업에는 차이를 두어야 함. (둘의 여력이 부족하기 때문). 정확한 책임, 사회적 공감, 인센티브 차등 지급 등의 생각을 해야함.", "kind": "문제 인식"}, {"id": "1-2-T1-031", "no": "06", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "정권이 바뀔때마다 전에 하던 사업을 이어서 잘 안함.", "kind": "문제 인식"}, {"id": "1-2-T1-032", "no": "07", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "김호분: 과거 cvid 비핵화정책을 만든 것처럼 (미국이) 기후정책도 정부 정권을 잡던지간에 완벽한 정책을 만들어야한다. 라는 생각이 듬. 환경도 CVID처럼 해야함.", "kind": "문제 인식"}, {"id": "1-2-T1-042", "no": "08", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "(1) 정책의 일관성이 없음. (2) 친중소, 중견기업 정책이 따로 없는 것에 대한 문제가 있음.", "kind": "문제 인식"}, {"id": "1-3-T1-004", "no": "09", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "기업의 설비투자 기간이 있는데 정부의 정책 불확실성에 따라 투자가 바뀌어 어려움. 경영진은 재무재표 등이 중요한데, 당장 투자에 비용은 들어가나 실효성이 늦게 나타나는 것은 부담사항임. 시멘트처럼 만드는 과정에서 탄소가 발생하는 분야는 감축하는 관련 기술이 필요함.", "kind": "문제 인식"}, {"id": "1-3-T1-006", "no": "10", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "정부에서 기업에게 명확한 가이드라인을 제시해야 함. 기업은 순수하게 이윤을 추구하는데 환경 정책은 패널티가 있어서 하는 것이니 인증마크를 도입해서 소비자가 알고 구입할 수 있도록 인증제도가 필요하다고 보여짐. 가이드 라인을 제공하고 단기간이 아닌 10년, 20년, 30년을 내다보는 정책을 주면 좋을 것 같음. 개발할 고급인력의 문제가 있음. 배출권을 되팔기를 하고 있는거 보니 정부의 기준, 가이드라인이 모호함.", "kind": "문제 인식"}, {"id": "1-5-T1-011", "no": "11", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "환경에 관한 정부정책에 관한 예측가능성이 보장되지 않는 것이 문제다. ○○○ : 기업의 소극적 대응과 환경을 고려하지 않는 제품에 대한 판매량 증가가 문제다. 또한 탄소 배출량 줄이기 위해 환경 생산시설에 투자하지 않는 것이 문제다. ○○○ : 데이터를 기반으로 한 설득력 있는 목표를 제시하지 못하는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-5-T1-014", "no": "12", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "정부의 공익적인 개입이 적은 것이 문제댜. ○○○ : 기업이 기후위기를 체감할 수 있는 법률이 없는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-2-T2-012", "no": "13", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "대한민국 정부의 환경정책을 일관적으로 펴고 국제기준에 맞게 정해놓는다면", "kind": "바라는 변화"}, {"id": "1-2-T2-013", "no": "14", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "기업은 국제기준에 맞춰 일관되게 제품 생산 필요", "kind": "바라는 변화"}, {"id": "1-2-T2-014", "no": "15", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "환경 기준에 맞췄기 때문에 온실가스 감축에 효과적임", "kind": "바라는 변화"}]}, {"id": "PG-1-2", "name": "중소기업·공급망", "want": "친환경 산업 육성과 중소기업 지원", "items": [{"id": "1-1-T1-002", "no": "01", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "기업은 이윤을 추구하는데, 재활용을 하는 건 비용이 많이 드니까 기업 이윤 추구에 문제가 생긴다는 점에 관심을 갖고 있었다. 온실가스를 감축하려면 돈이 많이 들어서 기업의 이윤 추구와 모순이 된다는 점에서 정부 차원의 지원이 필요하다. 일반 시민으로서 얼만큼의 지원을 어떻게 받을 수 있는지가 모호하고, 이 부분이 해결되어야 할 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-009", "no": "02", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "재정이 탄탄한 대기업이나 중견기업은 시키면 할 수 있는데, 재정이 취약한 업체들이 문제라고 생각한다. 예를 들어 도자기를 만드는 회사라면 대기업의 경우 탄소 배출 절감 시설을 설치할 수도 있겠으나 중소기업들은 힘들다. 대기업보다는 재정이 취약한 기업체를 대상으로 지원이나 홍보를 해서 끌어낼 수 있는 게 필요할 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-013", "no": "03", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "그게 장벽이기는 하지만 장기적으로 보면 재생에너지를 쓰는 것이 지구에 더 좋지 않을까요? 중소기업이 독자적으로 기업활동을 하는 경우도 있지만 협력사로 연결되어 있다. 대기업에게 책임을 지운다기보다는 대기업에게 보상을 주고 파트너십 형성, 교육을 한다거나 중소기업 파트너들과의 그런 관계 속에서 훈련, 학습될 수 있도록 하는 방안도 효과적일 것 같다. 중소기업은 탄소배출권에 대한 인식이 부족하다. 인식을 높이기 위해서는 노력이 필요하겠다. RE100은 재생에너지를 활용해서 생산하자는 취지인데, 뜬구름처럼 느껴진다. 재생에너지를 활용해서 한 걸 어떻게 수치화할 수 있는지 잘 모르겠다.", "kind": "문제 인식"}, {"id": "1-1-T1-014", "no": "04", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "재생에너지를 하려면 중소기업에서는 단가를 낮춰야 하는데 재생에너지를 활용하면 단가가 오르기 때문에 중소 업체에서는 더 힘든 거죠. 그래서 일부러 모르는척 하는 걸수도 있으니 국가에서 금액적으로 지원해줄 수 있는 게 필요하다고 생각한다.", "kind": "문제 인식"}, {"id": "1-1-T1-021", "no": "05", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "산업의 종류가 치우쳐 있어서 그런 것 같다. 온실가스가 많이 발생하는 기업이 많았던 거죠. 친환경 비즈니스 모델을 제시를 해서 친환경 시멘트를 만들 때 기존에 시멘트를 만들던 사람한테 친환경 시멘트를 만들 수 있는 교육이 들어가야 될 것 같다. 계속 똑같은 산업으로 돈을 벌게 될 테니 그 사람들을 유인하는 거다. 유인을 할 때 지원금을 주거나 세제혜택을 주거나, 구체적으로 교육을 제시할 수도 있는 건데, 해외의 좋은 사례를 수입할 수도 있는 거다. 이때 수입 비용을 지원해주거나 국가 차원에서 연결해주거나. 하는 게 좋을 것 같은데 하던 것만 계속 하기 때문에 우선 먹고 사는 일이기 때문에 쉽게 바꿀 수가 없었던 것 같다. 국가 차원에서 친환경적이면서도 지속가능한 선진화된 것들을 정부 차원에서 교육적, 재료적 수입을 지원해서 물꼬를 터주면 좋을 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-023", "no": "06", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "친환경적으로 노력하는 기업에게 비용을 지원해주는 접근이 어떨까 싶다.", "kind": "문제 인식"}, {"id": "1-2-T1-016", "no": "07", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "탄소감축의 현실. 친환경 고열설비나 재생에너지로 해야하는데 초기 투자 비용이 너무 부담이 됨. 비용적 여력이 없음. 초기 투자의비용의 문제를 어떻게 해야할지가 문제된다고 생각함.", "kind": "문제 인식"}, {"id": "1-2-T1-017", "no": "08", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "제일 중요한 점은 기업의 관심이라고 생각. 기업운영의 목적은 경제적 문제. 중요한 것은 본인의 마음. 정부에서 관심을 가지고 기업을 지원해줄 방안을 찾아야 할 것. 관심을 가지는게 중요함. 네팔문제도 그렇고 많이 느꼈을것이라 생각함. 정부에서 깨우칠 수 있도록 지원해야함.", "kind": "문제 인식"}, {"id": "1-2-T1-027", "no": "09", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "홍보가 영세한 기업에 대해서는 잘 안될 수 밖에 없음. 영세한 기업에 많이 신경을 써줘야 함. 폐기물 소각장의 경우 정부에서 기준치가 표시가 되어있는데 기준치가 넘어가는 것에 대한 통제가 잘 되어있음. 그러나 플라스틱 제조업 등 중쇼기업에서 처리하는 과정에서도 재활용의 과정에서 탄소배출과 오염 등에 대해 발생하는 것에도 신경을 써야할 것으로 생각이 됨. 이런걸 정부에서 연구해서 업체에 잘 알려주면 탄소배출을 많이 줄일 수 있지 않을까 하는 생각이 듬. 플라스틱을 예로 들자면 종류가 굉장히 많은데 종류에 다라서 독가스나 이런것들이 배출되는 수도 굉장히 큼.", "kind": "문제 인식"}, {"id": "1-3-T1-001", "no": "10", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "기업의 규모에 따라서 탄소 감축에 따른 예산이 다르고, 기술력·인프라가 다양하고 부족한 것 같고, 국내 제도의 한계로 인해 탄소 감축에 대해서 중요성·필요성을 느끼는 것이 다름. 유럽은 탄소감축을 하고 있는데, 우리나라가 수출하려면 탄소감축이 필요하기 때문에 대기업에서 하청에도 요구하고 있어서 수출에 문제가 됨. 소비자의 인식 부족이 문제임. 해썹의 경우 해썹마크가 없으면 안 사는 것처럼 (소비자가 탄소 감축)인식을 못하는게 문제. 그러나 가격이 올라가면 소비자 부담으로 기업은 생산 안하게 됨(소량 제작, 추가 공정). 중소기업의 경우 기술력이나 인프라가 없어서 감축을 못하고 있음.", "kind": "문제 인식"}, {"id": "1-3-T1-008", "no": "11", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "탄소 배출에 대한 절실한 문제점을 소극적으로 인지하고 있는 것 같음. 기업의 원료가 탄소가 배출되는 원료를 대체하면 좋을 것 같음. 기업의 재정.입장이 다른데 교육, 정부정책, 인텐시브를 일률적으로 하는 것이 기업에 어려움을 준다.", "kind": "문제 인식"}, {"id": "1-4-T1-001", "no": "12", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "업효율성 (비용으로 간주) 주주가치제고 (눈치) - 중소기업의 인력 및 자원부족 - (대기업은 탄소감축을 위한 인적 및 시스템을 가추고 있기에 협력업체와 공급망 업체에 관련 지식과 인프라를 제공하는 원바운드 체계구축", "kind": "문제 인식"}, {"id": "1-4-T1-003", "no": "13", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "각 기업이 무슨 상품을 어떻게 생산하는지 정부의 환경대책전문가에게 시장조사, 수집해서 각 업체가 할 수 있는 제안과 정보보조금 지원해서 전국업체가 온실화 정책실천하게 만들자 (환경정책 연구원이 대기업 중소기업순으로 조사 및 아이디어 제시 및 조사 및 실천하기(정부보조금으로), 정부의 적극적 참여필요 (생산수단의 대한 비용)", "kind": "문제 인식"}, {"id": "1-4-T1-005", "no": "14", "who": "4조", "who_parts": null, "team": "4조", "text": "기업이 움직이지 못하는 이유는 돈이 많이 들어가기 때문이라고 생각함.", "kind": "문제 인식"}, {"id": "1-4-T1-008", "no": "15", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "제조업이 발달한 우리나라 구조상 자금부족, 기술부족 - 중소, 중견 기업이 많음. - 가격이 비싸면 소비자가 사지 않는다는 인식 - 규제가 약함.", "kind": "문제 인식"}, {"id": "1-5-T1-017", "no": "16", "who": "5조 1명", "who_parts": null, "team": "5조", "text": "탄소저감 제품 생산을 위한 기계설비 등의 도입 등에 관한 정보가 부족한 것이 문제다. ○○○ : 탄소저감을 위해 비용이 많이 들어가는게 문제다. ○○○ : 기업이 탄소저감을 위한 노력을 한다고 해도 소비자들이 알지 못하는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-2-T2-007", "no": "17", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "기후변화 및 탄소절감 관련 산업 부흥 (탄소경감 기술 및 환경 컨설팅) > 산업계의 패러다임 변화", "kind": "바라는 변화"}, {"id": "1-2-T2-011", "no": "18", "who": "2조 4명", "who_parts": null, "team": "2조", "text": "k-데이터센터", "kind": "바라는 변화"}, {"id": "1-4-T2-016", "no": "19", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "친환경에 기업이 아이디어를 국가나 공공기관에서 개입하여 지분 참여하는 정책이 이루어지면 빠르게 이루어지고 국가 예산확보에 도움이 될 것이다.", "kind": "바라는 변화"}, {"id": "1-4-T2-017", "no": "20", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "친환경연구에 참여하는 기업이 늘어날 것이다", "kind": "바라는 변화"}, {"id": "1-4-T2-018", "no": "21", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "친환경기업 육성해야 할 것이다.", "kind": "바라는 변화"}]}, {"id": "PG-1-3", "name": "탄소가격·배출권", "want": "규제·탄소가격 강화", "items": [{"id": "1-1-T1-003", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "온실가스가 만원 정도라 치면 기업에게는 천원에 줘서 그걸 이용해서 판다는 이야기를 들었다. 아까 교육 때 들은 바에 의하면, 국가가 싸게 주니까 기업들이 이걸 아껴서 쓸 생각을 안 하고, 어차피 남는 것. 그래서 기업들은 아낄 줄을 모르는 것 같다. 이런 논의도 필요한 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-024", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "우리가 인도보다 기술력은 좋지만 규제를 안 하는 거다. 감리하다보면 친환경 인증을 다 본다. 그래서 녹색 인증이라는 걸 준다. 다 지키면 용적률을 준다. 20층을 지을 수 있는데 25층까지 지을 수 있게 해준다.", "kind": "문제 인식"}, {"id": "1-2-T1-034", "no": "03", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "돈이 안되어서. 현재 다니는 기업도 그런 탄소배출에 대한 이야기를 하고있는데 경제적인 이익이 없으니 실질적으로 이루어지지 않음. 경제적인 유인이 부족함.", "kind": "문제 인식"}, {"id": "1-2-T1-046", "no": "04", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "(1) 기업이 온실가스 배제에 소극적인 이유- 배출권을 구매하면 할 수 있는 것. 실제 배출량을 줄이려면 생산절차를 전부 뜯어고쳐야하는데 그런 것들에 대해서 배출권에 대한 제도 활성화를 마련해야하지 않을까 라는 생각이 듬. 소방안전, 보건 등이 법률화가 되어있는데 현재는 그런게 없음 (>정책적 제안)", "kind": "문제 인식"}, {"id": "1-2-T1-047", "no": "05", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "(1) 돈이 안되니까, 돈이 많이 들어서. 자본주의 사회에서 제일 중요한건 돈이라고 생각하기 때문에 세제지원을 해주는 것이 필요함. 결론적으로 유인책이 부족함.", "kind": "문제 인식"}, {"id": "1-3-T1-009", "no": "06", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "여러 환경에서 ESG에 대해서 중요한 것은 인식하고 있으나 정확한 가이드가 없는 것 같음. 기업에서 ESG가 필요한지는 아는데 ESG에 대해 정작 설명하지 못하는 경우가 있어 교육이 필요하다고 보여짐. 기업이 (탄소감축에 대해)개인에게 떠넘기는 것 같음. 기업의 모든 구성원들이 본인이 재직중인 회사가 어떤 노력을 하고 있는지 알고 있다면 직원이 해야할 개인의 노력을 할 수 있는데, 모르면 그 문제에 대해서 안일해질 것 같음. 의도적으로 기술 개발을 안하는 것은 문제임. 예로 제너시스는 연비(10KM미만)를 굳이 낮추지 않는데, 돈 있는 사람만 타기 바라기 때문임. 감당되는 사람만 타라는 기업의 의도가 문제임(기업의 이익에 영향을 미치지 않는 것이 문제). 그래서 인센티브 보다 과태료를 부과하는 것이 효과적이라는 생각임. 기술개발을 해도 손익분기점까지 시간이 오래 걸림. 소비자들이 비싼 가격에 메리트를 느끼는 것이 문제임.", "kind": "문제 인식"}, {"id": "1-4-T1-004", "no": "07", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "규제체제가 잘 잡혀있지 않음. 성장이 급속히 발전한 이유로 규제에 대한 생각을 미쳐하지 못한 것이 있음 규제화를 의무화하는 것이 좋음", "kind": "문제 인식"}, {"id": "1-4-T1-007", "no": "08", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "기업이 배출권 거래제 참여가 적음 - 정부가 산업 부분에 덜 할당함 - 무료로 줌 - 남은 에너지 저장, 이용할 발전소 부족 - 지역별 차등요금제를 실시하지 않음 - 전기료등 재생도 발전소 투자비용 막대함 - 탄소세가 너무 낮음 - 탄소배출에 산업부분에 적응하지 않아 기업이실천하지 않음.", "kind": "문제 인식"}, {"id": "1-5-T1-001", "no": "09", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "우리 탄소배출거래 금액에 대해 몰랐는데 생각보다 많이 가격이 낮다는 생각을 했다. ○○○ : 내가 사는 동네에서는 쓰레기 재활용이 잘 되고 있지 않다. 실제로 쓰레기 분리수거가 잘 되고 있지 않다. 이 부분에 대한 연구가 필요할 것 같다.", "kind": "문제 인식"}, {"id": "1-5-T1-008", "no": "10", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "기업과 개인이 기후위기를 체감하지 못하는 것이 문제다. ○○○ : 기업이 탄소배출 감소로 얻는 메리트나 탄소배출 증가로 얻는 리스크가 적은게 문제다. ○○○ : 탄소배출 종량제 가격이 낮은 게 문제다.", "kind": "문제 인식"}, {"id": "1-5-T1-010", "no": "11", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "○○○○(○○○) : 탄소배출건 가격은 시장이 정하고 정부가 공급을 줄이면 자연스럽게 단소배출건 가격은 올라간다. ○○○ : 탄소배출건 총량이 너무 많은 것이 문제다. ○○○○(○○○) : 유럽은 탄소배출건ETF를 통해 일반개인이 탄소배출건을 구매할 수 있게 하여 가격 형성이 합리적으로 이루어지고 있다.", "kind": "문제 인식"}, {"id": "1-5-T1-015", "no": "12", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "탄소배출건 참여 기업수가 적은 것이 문제다.", "kind": "문제 인식"}, {"id": "1-5-T1-016", "no": "13", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "상벌이 없는 것이 문제다. ○○○ : 정책을 신중하게 만들지 못하는게 문제다.", "kind": "문제 인식"}, {"id": "1-3-T2-008", "no": "14", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "정책 방향성, 기업 가산세 등 기업 과태료적인 부분이 확실해지고 정책의 일관성이 유지되면 기업의 아이디어는 풍부해지고, 가격은 착해져 친환경 제품으로 가는 기업들이 자동으로 많아질 것 같음. 친환경 제품을 만드는 기업이 많아질 것이고, 소비자도 교육 참여가 많아질 것임.", "kind": "바라는 변화"}, {"id": "1-4-T2-013", "no": "15", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "참여기업이 높아질것이라고 생각한다.", "kind": "바라는 변화"}, {"id": "1-4-T2-019", "no": "16", "who": "4조 3명", "who_parts": null, "team": "4조", "text": "탄소배출많은 기업들의 전략요금상향, 자체 전력생산시설부족", "kind": "바라는 변화"}]}, {"id": "PG-1-4", "name": "성과의 가시화", "want": "저탄소 인증·정보공개와 신뢰", "items": [{"id": "1-1-T1-022", "no": "01", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "몸에 좋은 걸 위해 좀 더 비싸더라도 친환경 벽지를 샀는데, 이 벽지가 진짜 친환경 벽지인지 모르겠었다. 이게 과연 친환경적일까. 사후 검증이 진짜 필요하다고 생각한다. 만약 친환경 시멘트 생산했다 하면 어떤 과정으로 마크를 획득하고 어떻게 제작했는지 알 수 있도록 하는 과정이 필요한 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-038", "no": "02", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "내가 이걸 샀을 때 어떤 기여가 있는지에 대해 결과적으로 피부에 와닿을 수 있는 정보가 미흡한 게 문제인 것 같다. 비싼 친환경 제품을 산다고 해도 내 삶의 변화에 생기는 게 없다보니까 구매 욕구를 잘 못 일으키는 것도 있는 것 같다.", "kind": "문제 인식"}, {"id": "1-1-T1-046", "no": "03", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "기업이 아무리 친환경 제품을 만들어도 소비자들이 차이를 알아차리지 못하는 게 문제라고 생각한다.", "kind": "문제 인식"}, {"id": "1-2-T1-020", "no": "04", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "강압이나 압박이 부족함. 지금도 정책을 보면 친환경 정책은 잘 되어있는 상태임. 친환경 인증마크 등도 잘 부여되고 있음. 일반 소비자는 그런걸 신경 안쓰게 됨. 비용적인 것을 신경쓰게 됨. 그러다보니 기업 입장에서는 그러한 투자를 할 동기가 생기지 않음. 친환경마크가 있는 기업의 것만 소비할 수 있게끔 하는 방안이 있지 않을까 하는 생각이 듬. (정책적 부분)", "kind": "문제 인식"}, {"id": "1-2-T1-022", "no": "05", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "대기업은 시스템이 있을 수 있는데 중소기업은 내가 얼마나 탄소배출을 하고 있는지에 대한 인지가 없을 수 있음. 따라서 어디서 어떻게 줄여야할지에 대한 생각도 없을 수 밖에 없음. 자기인식, 측정 등이 필요한 것으로 생각됨.", "kind": "문제 인식"}, {"id": "1-2-T1-023", "no": "06", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "그런것들을 측정할 수 있는 사이트가 있음. 홍보, 법적인 의무, 영세기업에도 적용이 되는지 여부 등을 파악해야함.", "kind": "문제 인식"}, {"id": "1-3-T1-002", "no": "07", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "탄소 감축에 있어 기업이 필요성은 알고 있지만 실천을 못하고 있음. 대가성 때문인 것 같음. 탄소 감축에 대한 정보 공시(큐알, 바코드 등)가 필요함. 탄소감축이 적정 수준으로 간다면 인센티브 제공, 가산제를 통해 기업의 투자에 대해서 보상이 필요함.", "kind": "문제 인식"}, {"id": "1-4-T1-006", "no": "08", "who": "4조 2명", "who_parts": null, "team": "4조", "text": "기업이 배출하는 탄소배출총량을 정확하게 알아야 한다. (정확한 측정)", "kind": "문제 인식"}, {"id": "1-5-T1-012", "no": "09", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "환경정보에 대한 국제적인 데이터의 공유가 되지 않는 것이 문제다. ○○○ : 현실적인 위기감 결여가 문제다. ○○○ : 소비자들이 ESG를 준수하는 회사와 준수하지 않는 회사를 구분하는 제도가 없는 것이 문제다.", "kind": "문제 인식"}, {"id": "1-5-T1-013", "no": "10", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "유해성분에 대한 표시가 확실하게 이루어지지 않는 것이 문제다. 탄소저배출 제품을 촉진하지 않는 제도가 없는 것이 문제다. ○○○ : 기업별 탄소배출량 뿐만 아니라 기업의 이익을 고려하지 않는 것이 문제다. ○○○ : 일반소비자의 탄소배출량 감소에 대한 노력에 대한 혜택이 없는게 문제다.", "kind": "문제 인식"}, {"id": "1-1-T2-007", "no": "11", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "이제 친환경적으로 믿고 살 수 있는 사회가 되는 거다. 언젠가는 그런 시대가 왔으면 하다. 이런 게 피부로 느껴질 수 있는 변화가 있으면 좋겠다.", "kind": "바라는 변화"}, {"id": "1-1-T2-008", "no": "12", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "소비자의 요구가 있다면, 기업은 소비자들의 요구를 무시할 수는 없으니까 이를 어느정도는 받아들여서 친환경적인 게 생산이 더 많이 될 수 있을 것 같다. 소비자의 입장에서는 항상 안전한 상태에서 믿고 살 수 있을 수 있을 것 같다.", "kind": "바라는 변화"}, {"id": "1-1-T2-015", "no": "13", "who": "1조 4명", "who_parts": null, "team": "1조", "text": "믿고 거래하는 게 되는 사회가 이루어질 것 같다. 기업과 저도 신뢰하는 선순환이 될 것 같다. 허리케인 같은 것도 예전에도 있었지만 기후위기로 더 많아졌고, 경북 경산에도 40도까지 올라서 한증막에 사는 것 같다고 한다. 우리나라도 기후위기에 급박하게 처해있는 상황이다. 젊은 분들은 살아가야 하는 시대이니까 그분들이 어떻게 살아가야 할지에 대해서 이 의제가 중요하다고 생각한다. 더운 거에 그치지 않고, 생존에 필요한 모든 것들에 다 문제가 생기기 때문에 염려가 많이 된다. 굉장히 중요하다고 생각이 든다. 홍보도 필요한 것 같다.", "kind": "바라는 변화"}, {"id": "1-3-T2-002", "no": "14", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "개인용품에 사용 연한 기준이 있으면 좋겠음. 제품 정보를 QR로 만들어 주면 좋겠음. 기업에 인센티브를 주고, 기업의 세금이 순환 경제의 하나로 지역에 환원되길 바람. 예로 전기가 많이 생산되는 지역 내에서 기업이 활성화 될 경우 인근 지역에 (기업활성화로 지역에 재원이 늘어나면)환원.", "kind": "바라는 변화"}, {"id": "1-3-T2-010", "no": "15", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "저탄소를 하려면 모든 물건에 인증마크가 있으면 좋겠음. 포장도 줄이고, 기업이 많이 (탄소감축)노력하고, 탄소가 많이 줄어들기 바람.", "kind": "바라는 변화"}, {"id": "1-4-T2-015", "no": "16", "who": "4조 2명", "who_parts": null, "team": "4조", "text": "예를들면 소비자가 볼 수 있는 알수있도록 행동", "kind": "바라는 변화"}]}], "count": 68}, {"id": "T2", "name": "의제2 자원순환", "short": "자원순환", "color": {"deep": "#0a4d6e", "tint": "#cfe6f3", "bright": "#5bc0eb"}, "groups": [{"id": "PG-2-1", "name": "제품 설계", "want": "생산·유통의 순환 설계", "items": [{"id": "2-1-T1-013", "no": "01", "who": "1조 1명", "who_parts": null, "team": "1조", "text": "포장재가 과도하게 사용되고 분리배출하기 어려운 경우가 많다.", "kind": "문제 인식"}, {"id": "2-2-T1-001", "no": "02", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "이온 음료수병이나 화장품 등 일회용기의 형태와 무늬가 회사마다 제각각이라, 씻어서 버릴 때 포개지지 않고 부피만 차지하여 수거가 불편하다. 우리는 생산 단계부터 재활용과 재사용을 쉽게 만드는 '공용 규격(유니버설 디자인)'과 표준 기준이 없다.", "kind": "문제 인식"}, {"id": "2-2-T1-005", "no": "03", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "EU에서는 명품 업체에 과잉 재고의 소각, 매립을 규제한다고 한다. 우리나라는 제품 생산 업체에 환경오염과 과생산 부분에 대해 규제하는 법률이나 제도가 없다.", "kind": "문제 인식"}, {"id": "2-2-T1-012", "no": "04", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "재활용이 쉬운 플라스틱과 재활용이 안 되는 플라스틱이 혼용 생산되어 재활용률을 떨어뜨리고 있다.", "kind": "문제 인식"}, {"id": "2-2-T1-014", "no": "05", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "플라스틱 용기의 디자인과 재질이 통일되지 않아 재사용과 재활용이 가로막혀 있다.", "kind": "문제 인식"}, {"id": "2-5-T1-004", "no": "06", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "일회용품 가격이 너무 싸다는 것에 공감한다. 생산자 측에 대한 제재가 더 필요한 것 같다. 즉, 생산자 측에 대한 제재가 없는 것이 문제인 것 같다.", "kind": "문제 인식"}, {"id": "2-5-T1-028", "no": "07", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "기업이 자율적으로 참여하는 것은 불가능하다. 자본주의 시스템 및 이윤 추구를 바탕으로하는 기업에서는 그럴 수 없다.", "kind": "문제 인식"}, {"id": "2-2-T2-002", "no": "08", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "정책적 지원을 통해 기술 혁신으로 기존 일회용품의 편리함과 친환경이라는 두 가지 가치를 모두 만족하는 대체재가 널리 공급된다.", "kind": "바라는 변화"}, {"id": "2-2-T2-020", "no": "09", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "유통 매장 허가나 입점 기준에 친환경 제품 취급이 자연스럽게 반영된다.", "kind": "바라는 변화"}, {"id": "2-4-T2-011", "no": "10", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "완벽화된 에코디자인 (100% 분해, 재활용)이 의무화된 세상", "kind": "바라는 변화"}]}, {"id": "PG-2-2", "name": "분리배출 신뢰", "want": "분리배출 부담 없는 수거", "items": [{"id": "2-2-T1-007", "no": "01", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "아이스박스나 비닐류 등 재활용품 분리배출· 선별 기준이 지자체마다 제각각 달라 현장의 혼란과 선별 비용을 가중시키고 있다. 국가 차원의 표준화된 기준이 필요하다.", "kind": "문제 인식"}, {"id": "2-2-T1-011", "no": "02", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "생수병, 음료수병, 간장병 뚜껑, 우유팩 등 제품마다 재질이 제각각이고 복잡해 시민이 일일이 씻고 떼어내는 분리 배출 부담이 지나치게 크다.", "kind": "문제 인식"}, {"id": "2-3-T1-002", "no": "03", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "음식물 오염 및 복합 소재로 인한 분리배출의 한계와 일회용품의 경제적 편리함, 그리고 개인의 노력에 대한 무력감과 규제·혜택 부족이 문제임을 확인하였다.", "kind": "문제 인식"}, {"id": "2-3-T1-010", "no": "04", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "복합 재질 혼합으로 인한 분리수거의 높은 난이도와 모호한 분류 체계, 그리고 편의성과 이윤 추구 속에서 지속적인 장기 정책과 정부 개입이 부족함을 확인하였다.", "kind": "문제 인식"}, {"id": "2-4-T1-006", "no": "05", "who": "4조 2명", "who_parts": null, "team": "4조", "text": "쓰레기 수거 시스템 : 분리배출 기준 어려움/ 분리해놓은 쓰레기를 수거차량에 한꺼번엥 수집 폐기 / 재활용 폐기 분리 안 됨/ 분리 배출 기준 어려움_절차 / 일관성 필요함)", "kind": "문제 인식"}, {"id": "2-5-T1-010", "no": "06", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "자원 회수의 측면에서 명확한 재활용 가이드라인이 자주 변경되어있고 홍보가 잘 되어있지 않다. 소형가전 회수율이 낮다.", "kind": "문제 인식"}, {"id": "2-5-T1-014", "no": "07", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "그래서 재활용이 더 편해야 된다고 생각한다. 그래서 개인보다 정책적으로 변화가 있어야 될 것 같다.", "kind": "문제 인식"}, {"id": "2-5-T1-044", "no": "08", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "주택의 경우 개인이 재활용품을 하더라도 수거업체가 다 섞어버리기 때문에 수거업체가 제대로 하지 않는 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-5-T1-046", "no": "09", "who": "5조 4명", "who_parts": null, "team": "5조", "text": "각 자치구마다 관련 법이 다 다른 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-3-T2-010", "no": "10", "who": "3조 2명", "who_parts": null, "team": "3조", "text": "알기 쉬운 분리배출 체계가 정착되어 시민 편의가 증진되고, 대한민국이 글로벌 기후환경 대응 문화를 선도하는 상태가 된다.", "kind": "바라는 변화"}, {"id": "2-4-T2-007", "no": "11", "who": "4조 2명", "who_parts": null, "team": "4조", "text": "분리수거라는 노동과 고민이 사라진 삶 (재사용 용기와 유기물 폐기물로만 분류된 쓰레기통) 재사용 용기 : 스마트 분류함에서 용기의 재질분석을 통한 자동 분류", "kind": "바라는 변화"}]}, {"id": "PG-2-3", "name": "다회용 전환", "want": "일회용 없이도 불편 없는 일상", "items": [{"id": "2-1-T1-001", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "배달음식을 먹을때 일회 용품을 사용해 일회용품 사용이 늘어난다.", "kind": "문제 인식"}, {"id": "2-1-T1-002", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "음식매점내에서 음식을 먹을 때에는 일회용품을 필요하지 않은 데도 많이 사용하고 있음. 예를 들어 햄버거 포장지는 매장 외에선 필요할수 있기만 매장내에서는 굳이 필요하지 않다고 생각한다", "kind": "문제 인식"}, {"id": "2-2-T1-010", "no": "03", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "재생 용기를 사용할 수 있는 선택의 폭이 좁다. 공유 텀블러 사용 같은 정책이 부족하다.", "kind": "문제 인식"}, {"id": "2-2-T1-019", "no": "04", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "음식점에서 다회 용기로 음식을 직접 가져갈 수 있는 시스템이 없다.", "kind": "문제 인식"}, {"id": "2-4-T1-008", "no": "05", "who": "4조 6명", "who_parts": null, "team": "4조", "text": "기업의 이윤 추구로 인한 일회용품 사용량 증대 (과거 : 중국집 자체 배달_용기 회수 / 현재 : 배달원 감소, 일회용품 사용)", "kind": "문제 인식"}, {"id": "2-4-T1-011", "no": "06", "who": "4조 6명", "who_parts": null, "team": "4조", "text": "지속적으로 사용하는 일회용품 : 오로지 편하다는 이유로 과도한 환경오염 초래 / 제재중심규제의 부재 / 생애 전반에 걸쳐 항구적으로 사용되는 물건들을 리유저블 측면으로 접근해야 함 (편리함 포기 하지 못하는 실태)", "kind": "문제 인식"}, {"id": "2-4-T1-013", "no": "07", "who": "4조 6명", "who_parts": null, "team": "4조", "text": "배달중독된 지친 현대인들", "kind": "문제 인식"}, {"id": "2-5-T1-009", "no": "08", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "일회용품이 주는 편리함과 1인 가구 증가 등 사회 구조와 연관되어 있다고 생각, 개인이 불편함을 감수하는 것.", "kind": "문제 인식"}, {"id": "2-5-T1-018", "no": "09", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "일회용품의 접근성과 편리성이 너무 높은 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-5-T1-026", "no": "10", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "한 번 쓰고 버리는 것이 여러번 쓰는 것보다 편한 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-1-T2-003", "no": "11", "who": "1조 3명", "who_parts": null, "team": "1조", "text": "3차내용: 바라는 변화(기대 효과) 생각 묶기 기업의 친환경적 제품을 생산할 것이다. ○○○ 고부가가치 자원을 활용한 기술이나 사업들이 많아질 것이다. 수소 전기차 자연에서 이용하는 기술이 많아 질 것이다. 기업 입장에서도 이윤을 많이 생길 수 있는 것이 더 생길 것이다. ○○○ 사람들의 인식 개선을 통해 기업 또한 제품 출시할 때 환경을 중요시 여겨 친환경상품이 많이 출시될 것이다. 다회용품 사용이 늘어날 것이다 ○○○ 택배를 받을 때 다회용 포장재로 주문을 하고 배달음식을 먹을때도 다회용기로선택하는 등 일회용품 말고 다회용품을 많이 사용할 것 같다. ○○○ 다회용품 사용이 의무화가 되고 다회용기가 순환되는 시스템과 샴푸나 세제 등과 같은 상품을 리필해서 사용할수 있는 사회가 될 것이다. ○○○ 재사용되거나 재활용할수 있는 포장재 사용을 할 것이다. ○○○ 다회용품이 상품화 되면 도금 불편하더라도 환경에 좋은 쪽으로 점점 발전할 것 같다. 인식개선이 될 것이다 ○○○ 기후위기에 대한 사람들의 인식이 강해져 물건을 버리는 대신 AS를 사용하거나옷을 버리는 대신 중고거래 플랫폼을 통해 팔고사는 경향이 늘어날 것이다. ○○○ 각종 스포츠경기에서 다회용컵과 다회용기사용을 의무화 하고 일회용품을 금지하는 것으로 발전할 것이다. ○○○ 필요한 물품만 구매하여 과소비를 막는다.", "kind": "바라는 변화"}, {"id": "2-2-T2-022", "no": "12", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "플라스틱 대신 종이 등 친환경 대체재를 사용하는 것이 당연하고 자연스러운 일상이 된다.", "kind": "바라는 변화"}, {"id": "2-2-T2-027", "no": "13", "who": "2조 3명", "who_parts": null, "team": "2조", "text": "집 근처 어디서든 개인 용기를 가져가 필요한 만큼만 세제를 소분·구매할 수 있는 리필 문화가 일상화된다.", "kind": "바라는 변화"}, {"id": "2-3-T2-007", "no": "14", "who": "3조 1명", "who_parts": null, "team": "3조", "text": "다회용기 순환 체계 구축으로 개인이 별도의 불편을 감수하지 않고도 재사용과 재활용이 자연스럽게 실천되며, 친환경 신산업과 일자리가 형성된 상태가 된다.", "kind": "바라는 변화"}, {"id": "2-4-T2-001", "no": "15", "who": "4조 6명", "who_parts": null, "team": "4조", "text": "쿠팡제품구매박스 : 인터넷 제품 구매에 포장박스가 재사용 박스가 도착한 것을 봄. 배송기사가 회수해가는데 활성화되면 좋을 것", "kind": "바라는 변화"}, {"id": "2-4-T2-003", "no": "16", "who": "4조 6명", "who_parts": null, "team": "4조", "text": "담아 쓸 수 있는 텀블러 자판기가 많아진 것", "kind": "바라는 변화"}, {"id": "2-4-T2-008", "no": "17", "who": "4조 6명", "who_parts": null, "team": "4조", "text": "일회용품을 사용하지 않아도 불편하지 않은 사회 - 카페, 배달 음식에서 다회용기가 기본 - 제품들도 처음부터 오래 쓸 수 있는 리유저블 형태로 개발, 생산 - 최소화 된 포장", "kind": "바라는 변화"}, {"id": "2-4-T2-012", "no": "18", "who": "4조 6명", "who_parts": null, "team": "4조", "text": "리필이 누구나 어디서나 가능한 세상", "kind": "바라는 변화"}]}, {"id": "PG-2-4", "name": "생산자 책임·비용", "want": "친환경이 가장 싼 선택", "items": [{"id": "2-2-T1-006", "no": "01", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "나프타 산업의 경제적 비중이 크다는 이유로 생산 감축이나 강력한 정부 규제가 미루어지고 있다. 화석연료에 환경세나 환경 관리 비용이 제대로 반영되지 않아 가격이 저렴하고, 이로 인해 소비자가 과소비하고 쉽게 버리는 악순환이 이어진다.", "kind": "문제 인식"}, {"id": "2-2-T1-008", "no": "02", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "일회용품을 쓰지 않거나 친환경 소재(빨대, 식기 등)를 도입하려는 소상공인과 기업의 비용 부담을 덜어줄 보조금 제도가 부족하다.", "kind": "문제 인식"}, {"id": "2-3-T1-007", "no": "03", "who": "3조 1명", "who_parts": null, "team": "3조", "text": "저렴하고 편리한 일회용품의 경제성이 환경적 선택을 가로막고 있으며, 개인의 노력만으로는 한계가 있어 가격 정책 및 기업 생산 규제가 미비함을 확인하였다.", "kind": "문제 인식"}, {"id": "2-5-T1-001", "no": "04", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "오늘 이해관계자 두 명의 생각이 매우 다른 것 같았다. 한 분은 규제에 대해서 ‘이런 점이 문제이고 이런 점이 지원되었으면 좋겠어’라는 주장이었고 한 분은 ‘당장 이렇게 바껴야돼’라는 내용이었던 것 같다. 일회용품의 가격이 너무 싸서 접근성이 너무 쉬운 것이 문제인 것 같다. 3~5년 전에 비닐봉투를 그냥 주다가 법 규제로 이제는 50원을 지불하는 것이 당연하게 바뀌었지 않냐.", "kind": "문제 인식"}, {"id": "2-5-T1-019", "no": "05", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "1인가구나 소규모 각의 증가로 인한 , 일회용품 가격의 경쟁성이 문제이다.", "kind": "문제 인식"}, {"id": "2-5-T1-021", "no": "06", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "너무 물품을 쉽게 구할 수 있는 것이 문제이고 이것에 대한 정부 규제가 없는 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-5-T1-022", "no": "07", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "일회용품의 싼 조달 비용에 따른 과도한 일회용품(포장재) 사용량이 문제이다. 기업에 대한 포장재 규제의 부재가 문제이다. (당연히 기업은 싼 것을 선택하게 되어 있기 때문에 일회용품 사용에 대한 과세가 필요할 것이다)", "kind": "문제 인식"}, {"id": "2-5-T1-024", "no": "08", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "무분별한 소비 조장 마케팅이 문제이다. 시민들에게 기후 문제가 직관적으로 인식되지 않는 것이 문제이다. 재활용품을 사용하는 것이 개인에게 이득이 아닌 것이 문제이다(비싸고 불편하면 실천하지 않는다). 탄소중립이 아닌 대체재가 더 싸고 쉬운 것이 문제이다.", "kind": "문제 인식"}, {"id": "2-5-T1-033", "no": "09", "who": "5조 5명", "who_parts": null, "team": "5조", "text": "일회용품을 많이 쓸 수 밖에 없는 경제구조로 온 것 같다. 문제는 정부 규제의 부재이다.", "kind": "문제 인식"}, {"id": "2-2-T2-005", "no": "10", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "환경 정책에 드는 비용에 대해 우호적이고 잘 수용할 수 있는 문화가 형성된다. 탄소를 줄여야 되니 그 정도는 쓰겠다.", "kind": "바라는 변화"}, {"id": "2-2-T2-006", "no": "11", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "환경 관리와 쓰레기 처리 비용이 제품 가격에 정상적으로 반영되어, 모두가 정당한 비용을 공정하게 분담하는 사회가 된다.", "kind": "바라는 변화"}, {"id": "2-2-T2-019", "no": "12", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "다이소나 무인점포 등 누구나 쉽게 찾는 생활 매장 어디서나 친환경 제품을 손쉽게 만나고 살 수 있는 접근성이 보장된 시스템이 된다.", "kind": "바라는 변화"}, {"id": "2-2-T2-029", "no": "13", "who": "2조 5명", "who_parts": null, "team": "2조", "text": "친환경 저탄소 제품을 쉽고 편리하게 합리적인 가격으로 접근할 수 있는 사회가 된다.", "kind": "바라는 변화"}, {"id": "2-4-T2-004", "no": "14", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "환경을 위해 개인이 참고 희생해야 하는게 아니라 환경에 좋은 선택이 가장 편하고 싼 선택이 된 사회 (대중교통_리필매장 등 친환경 선택지가 생활권 안에 충분히 갖춰짐 / 환경을 지키는 선택이 착한 소비가 아니라 가장 합리적이고 경제적인 소비가 됨)", "kind": "바라는 변화"}]}], "count": 53}, {"id": "T3", "name": "의제3 교육 및 참여", "short": "교육 및 참여", "color": {"deep": "#125235", "tint": "#cdebd9", "bright": "#7ee2a8"}, "groups": [{"id": "PG-3-1", "name": "학교 교육 기반", "want": "전문인력·예산 확충", "items": [{"id": "3-5-T1-017", "no": "01", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "이해관계자 교사분의 발제에서 예산이 가장 기억에 남음. 환경교육에 대한 예산이 부족한 것이 기억에 남고 문제라고 생각함,", "kind": "문제 인식"}, {"id": "3-5-T1-018", "no": "02", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "인력 또한 필요할 것으로 보임. 다양한 문제가 있으리라 보였음. 하지만 현재 명확한 답이 보이지 않음.", "kind": "문제 인식"}, {"id": "3-5-T1-019", "no": "03", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "학교 환경에 관한 교과서 만들고 이에 전문 교사를 배치하면 좋을 것 같음.", "kind": "문제 인식"}, {"id": "3-5-T1-020", "no": "04", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "고등학교에서 환경과학은 생명과학 선생님이 맡아서 하시다 보니 생명과학 중심으로 이루어졌음. 그래서 환경과학은 별도의 전문 선생님이 배치되면 좋을 것 같음.", "kind": "문제 인식"}, {"id": "3-5-T1-021", "no": "05", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "그래서 강사료를 지원받아서 박사님을 모셔야 해서 예산이 더 필요하다고 했던 것 같음.", "kind": "문제 인식"}, {"id": "3-1-T2-021", "no": "06", "who": "1조 1명", "who_parts": null, "team": "1조", "text": "환경 관련AI와 전문가가 더 늘어날 것 같다.", "kind": "바라는 변화"}, {"id": "3-4-T2-007", "no": "07", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "기대효과: 실질적으로 환경에 대한 실천방안이 만들어 질것이다. 예산이 편성이 되면 창의적인 아이디어가 생성되는 등 관심도가 높아지고 기업에 대한 책임도 높아질 것이다.", "kind": "바라는 변화"}, {"id": "3-5-T2-012", "no": "08", "who": "5조 3명", "who_parts": null, "team": "5조", "text": "예산이 늘어나면 다양하고 풍부한 환경적 경험을 할 수 있음.", "kind": "바라는 변화"}]}, {"id": "PG-3-2", "name": "생애주기 사각지대", "want": "기후교육 법정 의무화", "items": [{"id": "3-2-T1-001", "no": "01", "who": "2조 2명", "who_parts": null, "team": "2조", "text": "현재 우리 생활에서는 어떤 문제가 있는가? (현재 해결해야 할 문제는?) -○○○ : 기후위기 주제 자체가 관심있는 주제가 아니다. 당장 먹고 사는데 도움되는 것도 아니고, 자기 계발과 연결된 것도 아니기 때문임 (교육과 참여는 동시에 이루어지는 것이 바람직. 가정->유치원->초등학교->20~30대는 온라인-> 50대 이상은 주민센터 등 인센티브를 주면서 활성화 시키는 게 좋겠다). 초등학교 때 조기교육이 매우 중요. 몸에 배면 그 다음부터는 교육이 필요없다고 생각함. 기후 시민 참여단이 관심이 없는 사람을 불러 관심을 불러일으키는 것이 나을지, 관심 많은 사람에게 기회를 주는 것이 좋을지에 대해서 교육 효과성에 대해 확인해 볼 필요는 있음. -○○○ : 관련 교육 자체를 찾기 힘들다. 기업 등에 기후 포인트제 제공을 통해 많은 참여 유도 필요, 초중고에서는 교육 시도 많이 하는 것 같은데, 성인들은 환경에 대한 교육은 없지만 화재나 안전에 대한 교육은 하고 있음. 법정 의무교육으로 만들어서 생애 주기 교육이 이루어질 수 있도록 해야 함 -○○○ : 단발성 교육으로 그침. 교육 접할 기회 적음 -박선영 : 단발성 교육의 문제. 일회성 계획보다 지속적 교육 필요 -심수정 : 교육의 필요성을 느낄 수 있어야 하는데 홍보 채널이 부족함. 교육을 하면 달라질 수 있을 거라는 확신을 주면 좋겠음. 페트병 분리수거 해도 자원 활용 잘 되지 않는다는 얘기 들으니까 힘들기만 하고 효과가 없는 것 같음. 필요성을 느끼지 못하니 정보를 통해 확신을 주는 것이 필요함. -장성만 : 기후 교육이 재미없는 것은 전문 강사가 부족하기 때문임. 상시 운영 안 되는 것 같음. 지속적으로 운영할 수 있는 강사와 프로그램이 많았으면 좋겠음. -장성만 : 확산되는 느낌은 드는데 이런 협의체가 너무 부족함. 지역별로 참여단을 만들었으면 함. -권영숙 : 유아 교육이 이루어진다고는 하지만 체계적인 교육이 이루어지고 있지는 않음. 아동기의 경우 학교 내 재활용이 잘 이루어지지 않고 있음(학기 말 소모품 정리 방안을 모색하는 것이 필요), 보여주기식, 실적주의식 환경교육이 이루어지고 있음(하고 있는 것을 더 구체화, 실천할 수 있는 교육 필요). 분리수거 방법이 너무 복잡하기 때문에 단순명료하게 정해주는 것이 필요함. -○○○ : 분리수거 방식이 통일되지 않음. 지역마다 다르고 동네마다 다름. 분리수거 해도 재활용하는 비율이 높지 않다는 뉴스 보면 굳이 힘들게 할 필요가 있는지 의욕이 떨어짐(분리배출 수거 기준을 체계화 하고, 이후 분리배출 기준에 대한 교육 필요), 통일된 기준을 가지고 실제 실천하게 됐을 때 보상이 되었음 좋겠음. 보상은 내가 배출한 리사이클 제품이나 휴지 등 실제 배출한 사람에게 물품으로 교환해 주면 분리배출이 의미가 있음을 느낄 수 있도록 해야 함. / 국민 개인에게만 책임을 너무 주려고 하는 것 같음. 기업이나 공공기관의 책임도 있는데 개인에게 책임을 전가하는 느낌이 있음. 기업이나 공공기관이 솔선수범하는 모습을 보여주는 것 필요(공공기관 법적 제재 필요) -○○○ : 인식이 부족함. 시니어 활동 하고 있는데 시니어들도 교육 하지 않음. 공무원들의 기후 환경에 대해 어떤 인식을 가지고 어떤 정책을 내고 지키고 있는 지 전수조사가 필요함. (공무인들이 기후위기에 대한 인식이 아예 없음)", "kind": "문제 인식"}, {"id": "3-5-T1-030", "no": "02", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "성인교육에 관한 이야기도 했는데 기업체 교육도 필요하다고 생각함. 기업에서 환경 활동을 하고는 있으나 직원을 대한 교육이 제도화해야 함. 기업이 일정 규격이 되면 소방 교육 등 의무교육은 진행되고 있으나 환경 관련 교육은 의무가 아니기 때문에 하지 않는 것 같음. 기업에서 ESG 교육을 하면 보상하는 것은 있으나 직원에 대한 교육이 진행되고 있지 않는 듯함.", "kind": "문제 인식"}, {"id": "3-5-T1-042", "no": "03", "who": "5조 2명", "who_parts": null, "team": "5조", "text": "교육이 체계적이지 않기에 모든 사람의 일치된 행동을 이끌어내기 어려움. 체계적인 교육이 필요함.", "kind": "문제 인식"}, {"id": "3-2-T2-001", "no": "04", "who": "2조 1명", "who_parts": null, "team": "2조", "text": "스텐빨대 같은 플라스틱 빨대 대용 사용하자, 모든 공공기관에서 기후환경 안내 책자를 비치한 생태가 된다. -심수정 : 유투브 같은 매체에서 기후위기에 대한 무제한 광고 배너가 뜨는 상태가 된다(현재 쿠팡 광고 뜨는 것처럼). 기후위기 전국체전을 하게 된다. 삼성에 칩으로 된 에어컨 개발 상용화를 재촉한다 (실외기 없는 에어컨 상용화) -○○○ : 분리배출에 대한 재미(즐거움)을 갖게 한다. (농구골대 활용, 휴대폰 게임 중 피카추 찾으러 다니는 것처럼 우리 동네 페트병 찾기 등 게임화) -권영숙 :시민참여확대 (나 스스로 돌아보기->가족권유->동료 1:1 매칭->조직확대, 사회기반 정착), 조직 비품담당자 의식화 교육하기(일회용품 구입 자제) 등을 한다. -○○○ : 캐시워크처럼 실생활에 참여하면 포인트를 주는 제도 개발 (탄소중립 포인트 제도 전국민화). 우리가족 기후시민의 날처럼 특정한 날에 탄소중립 활동 인증하면 지역 상품권 등이 지급된다. -장성만 : 기후교육 전문 교육 기관 설립한다. 전문강사가 교육을 하면 인증서를 받게 하며, 그 인증서가 있으면 취업 시 가점 줄 수 있도록 한다. -○○○ : 기후 용어 변경, 기후 라고 하면 벌써 재미 없고 관심없어 하기 때문에, 호기심을 주면서 관심을 줄 수 있는 대체 용어를 찾게 된다 (즐거운 상상 떠올리기) -○○○ : 기후환경 체험할 수 있게 한다. 우리는 더운 것 말고는 인식을 잘 못하기 때문에 얼음 위에서 체험하는 것과 같은 체험관 같은 것이 있어야 한다) -장성만 : 기후교육을 법정 교육화하여 제도화 된다. -○○○ : 유명연예인 tv 홍보프로그램 섭외해서 홍보대사로 활용한다. bts 등 유명인의 기후위기 굿즈를 제작한다. -장성만 : 모범사례 공유를 활성화해서 자자체별 평가 및 인센티브를 지급한다. -○○○ : 기업에서 일회용품 사용하지 않도록 하며, 위반 시 기업에 벌금 부과한다. 대기업 경우 점심시간에 자동적으로 전기가 꺼지며, 에어컨도 중앙에서 컨트롤 해서 온도를 올리게 된다. 따라서 일정 규모 이상(300인 이상 기업) 기업의 경우 온도, 전기, 전등 등 에너지 차단 등 의무화하도록 함(중앙조작시스템 구축) -○○○ : 10인 이상 기후활동을 매월 하고 있다는 것을 당근 커뮤니티 등을 통해 인증하면 활동비 등을 지급하는 제도가 도입된다 (당근 등 지역 모임(기후위기 활동)) -○○○ :기후위기 상징 애칭 공모전 등을 통해 국민 관심 끔 (기후에 대한 용어 환기), 기후모임 표어(명칭짓기 대회), 기후위기 로고송 등이 만들어진다. -심수정 :저탄소 미인미남대회, 기후위기가요대전 등(랩, 힙합, 트롯, 팝 등) 개최된다 -심수정 : 공무원 담당자 활성화 제안이 요구된다. -○○○ : 생활에서 실천할 수 있는 사례 (등산 시 도시락, 텀블러 소지 등) 스스로 홍보하게 된다.", "kind": "바라는 변화"}, {"id": "3-3-T2-001", "no": "05", "who": "3조 1명", "who_parts": null, "team": "3조", "text": "교통이 적거나 불편한 지방에는 셔틀버스 운영 확대하여 탄소 배출 감소하게 된다. 분리수거가 잘 된 상태가 되었으면 좋겠다. 시골 내에서도 환경 교육이 주기적으로 되어 어르신들이 분리수거에 대한 인식 개선이 되었으면 좋겠다. 대학생들 또한 의무교육으로 환경에 대한 교육을 커리큘럼으로 편입하여 환경에 대한 인식을 재고하였으면 좋겠다. 모든 배달 음식은 다회용기로 바꾸어 사용한다. (2) 이은재 : 직장 내 기후 의무교육이 실행된다. (3) 송유진 : 지자체에서 버스 노선 통합을 비용 절감 관점에서 하게 되는데, 환경의 관점에서 지원금을 활용하여 버스 노선을 확대해야 한다고 생각함. 탄소 중립에 대한 인식이 중요하다고 생각한다. 학생들에게 탄소중립에 대한 교육은 지금도 조금 있으나, 성인들의 탄소중립 교육은 접하기 어렵기 때문에 5인 이상 사업장 직장 내에서 의무교육으로 기후 교육을 실시하게 된다. (4) 최형규 : 자동차 사용 줄이기를 하게 되면 배기가스 감소에 따른 탄소 배출 감소, 소음 저감, 교통체증 감소 등이 실현된다. (5) 고재욱 : 도서 지역 배달은 드론이 담당하고 있다. (6) 윤희섭 : 다회용기를 일정하게 균일화하여 반납하게 되면 지하철 보증금 다시 받듯이 보증금을 받게 되는 개념을 활용하여 회수 비율을 높게 한다. 배달을 하게 될 때, 일회용기를 사용하는 것이 아니라 소비자 개인의 그릇을 사용하여 음식을 받게 되면 값싼 가격으로 음식 구매를 할 수 있게 된다. 탄소포집 기술이 활성화 된어 탄소 감축에 기여한다. 차량 번호제를 강제화시켜 탄소 감축에 기여한다. 전기 자동차를 소유제가 아닌 공유제화 실시한다. (7) 이장구 : 직장 필수 교육으로 기후 위기 교육이 활성화가 된다. 기후 위기 때문에 산불이 많이 나는데, 국립공원은 나무가 많고 빈틈이 없어 불이 나지 않는다. 산불 예방을 위해 국립공원외에 작은 산들도 나무를 많이 심고 벌목을 금지하여 산불을 방지한다. 기후 위기 때문에 아스팔트가 녹을 정도로 더운데, 이를 해결하기 위해 왕복 4차선 되는 도로에 중앙 분리대에 가로수 설치하는 것을 법제화하게 된다. (8) 유정규 : 분리수거가 잘되면 자원 재생 효율이 높아질 것이고, 쓰레기 처리장의 사용 연한이 길어질 가능성이 높아진다. (9) 이선희 : 친환경 비닐 등을 만들어 농사를 지으면 정부에서 기업과 농업인에게 인센티브를 주어 친환경 비닐을 제작하여 농사를 짓게 된다. 배달음식 용기 친환경으로 만들고, 모양을 변형시켜 가정에서 사용할 수 있게끔 만든다. 공무원들도 기후 교육에 대해 필수적으로 정기적 교육받게 한다.", "kind": "바라는 변화"}, {"id": "3-4-T2-004", "no": "06", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "기대효과: 정부가 현실적인 매뉴얼, 교육의 의무화 및 점검 등으로 현장에 교육 보급되고 환경에 대한 국민의식이 고취가 될 것이다. 우려점: 사교육에 대한 부담. 환경 교육에 중점으로 타교육의 부실함이 우려된다.", "kind": "바라는 변화"}]}, {"id": "PG-3-3", "name": "효능감", "want": "인식 개선의 실천 연결", "items": [{"id": "3-1-T1-008", "no": "01", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "환경문제를 알지만 실천하고 있지 않아 실천이 필요하다.", "kind": "문제 인식"}, {"id": "3-1-T1-009", "no": "02", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "일회용품 사용을 줄여야 하지만 편리함때문에 잘 해결하지 못하는 것 같다.", "kind": "문제 인식"}, {"id": "3-1-T1-017", "no": "03", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "학교에서 활동지를 쓰고 바로 버려요. 교육을 해도 기후의 심각성을 잘 모르는 것 같아요. 어떻게 해야 심각성을 깨닫게 할지는 더 생각해봐야할 것 같아요.", "kind": "문제 인식"}, {"id": "3-5-T1-006", "no": "04", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "교재에 나와 있는 해결인식에 대한 인식이 낮다고 함. 어떻게 해야 할 것인지 고민해 볼 필요가 있음. 해결 방안에 대한 문제를 인식해야 함. 해결 방안에 대한 교육적 접근이 필요함.", "kind": "문제 인식"}, {"id": "3-5-T1-013", "no": "05", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "교육해도 실제 행동으로 나타나기는 차이가 있음. 환경에 대한 행동은 내가 불편함을 감수해야 하는 것들이 많음. 내 편리함을 포기하라고 한다면 잘 이행되기 쉽지 않음. 편리함을 포기해야 함을 자연스럽게 받아드릴 수 있도록 하거나 인센티브와 같은 보상도 좋음. 다만 지금은 현재 빠른 변화가 필요하기에 편리함을 포기해야 하는 것 같기에 이를 받아드리게 하는 방법에 대한 고민이 필요함.", "kind": "문제 인식"}, {"id": "3-5-T1-028", "no": "06", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "그래서 환경에 대한 활동이 신뢰가 없음.", "kind": "문제 인식"}, {"id": "3-5-T1-033", "no": "07", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경에 대한 실제적인 체감은 되지 않는데 계속 규제만 늘어나고 있어서 환경에 대한 관심도가 낮은 듯함. 환경에 대한 규제가 반발심을 만들기도 함.", "kind": "문제 인식"}, {"id": "3-5-T1-034", "no": "08", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "체감되는 문제가 아니기에 그동안 제대로 교육이 진행되지 않았던 것 같음. 북극곰의 문제를 보면서도 에어컨을 켜는 듯이 직접적인 내 문제로 다가오지 않아서 교육의 효과성이 낮음.", "kind": "문제 인식"}, {"id": "3-5-T1-036", "no": "09", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경교육에 대한 결과물이 보이지 않아서 참여율이 떨어지는 듯함. 효용감을 잘 느끼지 못함.", "kind": "문제 인식"}, {"id": "3-1-T2-002", "no": "10", "who": "1조 2명", "who_parts": null, "team": "1조", "text": "사람 대부분이 많이 알아서 기후에 대한 관심(인식)이 늘어날 거 같다.", "kind": "바라는 변화"}, {"id": "3-4-T2-002", "no": "11", "who": "4조 1명", "who_parts": null, "team": "4조", "text": "기대효과: 기후시민 양성이 되고, 변화를 가속화될 수 있을 것이다. 탄소중립으로 가는 길이 더 빨라 질 것이다. 탄소중립으로 가기 위한 산업 발전으로 순환적 경제에 더움이 될 것이다.", "kind": "바라는 변화"}, {"id": "3-5-T2-003", "no": "12", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경문제에 대한 인지 개선. 다양한 환경에 대한 실질적인 인식 개선이 직접적인 실천으로 연결됨.", "kind": "바라는 변화"}, {"id": "3-5-T2-004", "no": "13", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "환경적 활동 실천에 대한 불신이 감소할 수 있으리라 생각함.", "kind": "바라는 변화"}, {"id": "3-5-T2-008", "no": "14", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "인식 개선과 실천이 가능한 동기가 기대됨. 인식 개선은 나 하나가 뭘 바꿀 수 있을까에서 나 하나라도 바뀌는 것으로 변화할 것임. 실천 가능성도 지속 가능한 교육을 통해 환경 활동에 대한 동기 향상이 될 것임. 교육을 통해 다양한 방안을 이끌어낼 수 있고 정책을 변화할 수 있을 것 같음. 시민 인식이 제고되면 정책도 자연스럽게 변화할 수 있음.", "kind": "바라는 변화"}, {"id": "3-5-T2-009", "no": "15", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "인식 개선, 문제의식을 할 수 있으며 효율적인 환경보호 운동으로 연결되리라 기대됨. ‘환경’ 하면 북극곰을 생각하게 되는데 먼 이야기가 아닌 현실에 맞는 문제 인식을 통해 인식 개선할 수 있음.", "kind": "바라는 변화"}, {"id": "3-5-T2-013", "no": "16", "who": "5조 6명", "who_parts": null, "team": "5조", "text": "개인적으로 환경교육에 대한 부담감이 줄어들 수 있을 것 같음.", "kind": "바라는 변화"}]}, {"id": "PG-3-4", "name": "정보 접근·참여", "want": "상시 정보 채널과 접근성", "items": [{"id": "3-1-T1-004", "no": "01", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "사람들이 기후 위기 교육을 쉽게 접할 수가 없다.", "kind": "문제 인식"}, {"id": "3-1-T1-005", "no": "02", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "저는 모두가 즉시 원할 때 기후 관련 정보를 볼 수 있는 포털이 필요한 것 같다. 로그인이 필요할 수 없이 간편하게 접속할 수 있는 게 필요하다.", "kind": "문제 인식"}, {"id": "3-2-T1-003", "no": "03", "who": "2조 1명", "who_parts": null, "team": "2조", "text": "참여에 대해서는 어떤 어려움이 있을까? -○○○ : 참여도 보상이나 포인트 제도적용해 주었으면 함 -박선영 : 환경 교육을 접할 기회가 너무 부족함 -심수정: 적극적인 사람에게는 정보가 전달되지만, 소극적인 사람에게는 정보가 전달될 통로가 없기 때문에 모든 시민도 접할 수 있게 통로를 많이 만들어야 함. (정보전달 채널의 부족). 주민센터 등 시민이 쉽게 접할 수 있는 곳을 활용해야 함 -○○○ : 아예 관심이 없는 사람들은 애초에 기후위기를 접할 수 있는 기회가 없음. 학교 활동 등을 통해 접할 수 있고, 기업에서도 환경 교육 이수 하는 사람이 기회를 접할 수 있도록 혜택을 주면 관심을 더 가질 수 있음. 아이들이 자주 접하는 만화 등에서도 에너지 절약에 대한 내용 넣어줘서 아이들이 체득할 수 있도록 해야 함. 문화 예술인 분야에서 웹툰, 웹소설등 공모전 기회를 늘리는 것이 필요함. (홍보를 늘려서 시민 참여를 올려야 함) -○○○ : 꼭 보상이 없더라도 내가 기여를 했다거나보람이 잇다는 느낌을 주면 참여를 늘릴 수 있음. 기후 위기 극복 기여할 수 있는 아이디어 활용(계단 오르면 칼로리 감소. 처럼 조금만 투자해도 기여할 수 있다는 보람을 느낄 수 있는 기회 부여 필요) -장성만 : 홍보 부족. -심수정: 홍보부족. 날씨처럼 기후위기 지수도 올리자(핸드폰 등 활용) 필요없다고생각하는 인식을 어떻게 개선할 것인가?에 대한 고민이 필요함. 필요없다고생각하는 사람은 절대 보려고 하지 않음. 기후가 익숙해 질 수 있도록 공영방송 등에서 공익광고 형식으로 계속 홍보하는 것이 필요함. -○○○ : 사람들이 기후위기에 절실함이 부족함. 강력하게 절심함을 느낄 수 있도록 자료 등 활용 (네팔 홍수 등) -장성만 : 기후 파괴자들에 대한 패널티필요. 일회용 물건 등 사용 시에 스스로 사회적 부끄러움 느낄 수 있을 만한 환경, 인식 만들어져야 함. -권영숙 : 편리함에 대한 추구가 너무 강함. 지속하려고 해도 불만이 많아지기 때문에 포기하게 됨. 처음에는 기후위기 강압적 제재 필요함", "kind": "문제 인식"}, {"id": "3-1-T2-006", "no": "04", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "사람들이 더 빠르고 편하게 정보를 얻을 수 있어서 기후에 대해 더 잘알게 된다.", "kind": "바라는 변화"}, {"id": "3-1-T2-007", "no": "05", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "학교교육에 대해서도 유용하게 이용될 수 있을 것 같다.", "kind": "바라는 변화"}, {"id": "3-1-T2-008", "no": "06", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "핸드폰을 사면 기본적으로 깔아져있는 앱 같이 모두가 다 기본적으로 바로 사용할 수 있으면 좋을 것 같다.", "kind": "바라는 변화"}, {"id": "3-1-T2-009", "no": "07", "who": "1조 5명", "who_parts": null, "team": "1조", "text": "사이트가 구글이나 네이버처럼 바로 볼 수 있는 자료가 필요한 거 같습니다.", "kind": "바라는 변화"}]}], "count": 37}], "disclaimer": "범주는 분과 통합 참고자료의 것으로, 모더레이터 참고용이며 확정된 분류가 아니다. 숙의참여단 배부용 자료로는 제작하지 않는다. 아카이브·연구용 화면이다.", "links": {"prezi": "prezi.html", "deck": "deck.html"}}</script>

    dark: { ground:'#0f1626', panel:'#182036', ink:'#eef2f7', edge:'#4a5878',

  var nodes = new vis.DataSet(), edges = new vis.DataSet();
  var byId = {}; D.topics.forEach(function(t){ byId[t.id]=t; t.groups.forEach(function(g){ byId[g.id]=g; g.topic=t; g.items.forEach(function(i){ byId[i.id]=i; i.group=g; }); }); });

  // 노드에는 이름과 번호만 싣는다. 본문은 오른쪽 목록과 원문 창이 맡는다(리서치 §2·§5).
  function topicNode(t){ var P=pal(), c=P.topic(t); return {id:t.id, label:t.name, level:0, shape:'box', margin:22, shapeProperties:{borderRadius:8},
    color:{background:c.fill, border:c.border}, font:{color:c.text, size:40, face:'Noto Sans KR', bold:{size:40, color:c.text}}, borderWidth:4}; }
  function groupNode(g){ var P=pal(), c=P.topic(g.topic); return {id:g.id, label:g.name+'\n'+g.items.length+'건', level:1, shape:'box', margin:16, shapeProperties:{borderRadius:8},
    color:{background:c.tint, border:c.deep}, font:{color:P.ink, size:30, face:'Noto Sans KR', bold:{size:30, color:P.ink}}, borderWidth:5}; }
  // 이름 뒤 괄호(출처 표시 — 〔수작업 대조 B〕·(기록보고서) 등)는 상자에서 뺀다. 목록과 원문 창에는 남는다.
  var namesOff = new URLSearchParams(location.search).get('names')==='off';   // N 키 — 이름을 감추고 조만 남긴다(위원장 검토용)
  function team(w){ var m=w.match(/^\d+조/); return m ? m[0] : w; }

  function whoShort(w){ if (namesOff) return team(w);
    var m = w.match(/^(\d+조\s*[^·\s]+)·\S*/); if (m) w = w.replace(m[0], m[1]);   // 「이름·이름」처럼 이름이 둘이면 첫 이름만 — 상자 폭을 일정하게
    if (w.length > 12) w = w.slice(0, 11) + '…';

  function itemNode(i){ var P=pal(), c=P.topic(i.group.topic); return {id:i.id, label:i.no+'\n'+whoShort(i.who), level:2, shape:'box', margin:{top:8,bottom:8,left:14,right:14}, shapeProperties:{borderRadius:8},
    color:{background:P.panel, border:c.deep}, font:{color:P.ink, size:26, face:'Noto Sans KR', bold:{size:26, color:P.ink}}, borderWidth:3}; }
  function rebuild(id){ var o=byId[id]; return o.groups ? topicNode(o) : (o.items ? groupNode(o) : itemNode(o)); }

  // 의제 3개 자리 — 캔버스 크기에서 잡아 매번 같은 자리
  var S0=(function(){ var el=document.getElementById('net'); return {W:el.clientWidth, H:el.clientHeight}; })();
  var TRI = [[-S0.W*0.3,-S0.H*0.24],[S0.W*0.3,-S0.H*0.24],[0,S0.H*0.3]];
  D.topics.forEach(function(t,k){ var n=topicNode(t); n.x=TRI[k][0]; n.y=TRI[k][1]; n.fixed=true; nodes.add(n); });

  var net = new vis.Network(document.getElementById('net'), {nodes:nodes, edges:edges}, {
    physics:{ enabled:false },
    interaction:{hover:false, dragNodes:true, zoomView:true, tooltipDelay:1e9},
    edges:{ color:{color:pal().edge}, width:3, smooth:{type:'continuous'} },
    layout:{improvedLayout:false}
  });

  window.__net = net;                          // 측정용 — 배율·좌표를 밖에서 읽는다(__go·__dbg 도 아래에서 붙인다)
  var open = {};                               // 펼친 노드 → 자식 id 목록
  var hiddenBy = {};                           // 펼치며 감춘 노드들
  var gen = {};                                // 노드 id 별 세대 — 되돌아가는 중에 다시 펴도 옛 타이머가 새 노드를 건드리지 않게
  var fadeSeq = 0, fadeTok = {};
  var FADE = reduced ? 0 : 350, BACK = reduced ? 0 : 520;
  var dest = {};                               // 날아가는 중인 노드의 목표 자리 — 링 중심은 현재 위치가 아니라 목표로 잡는다
  function at(parent){ if (dest[parent] && nodes.get(parent)) return dest[parent]; return net.getPositions([parent])[parent] || {x:0,y:0}; }

  // 자식 자리 — 부모 둘레 타원. 좌표 단위 = 배율 1 의 화면 픽셀.
  // 범주(4개)는 캔버스를 채우는 타원. 발언은 「이웃 간격 170px」에서 반지름을 거꾸로 계산해 상자가
  // 서로 닿지 않게 하고, 카메라가 그 타원을 캔버스에 맞춘다(1080p 에서 배율 0.95~1.5 → 글자 24px 이상).
  // 11개까지 한 겹, 그 위는 안쪽 1/3·바깥 2/3 두 겹. 상자가 가로로 넓어 가로 반지름을 더 준다.
  var PAD = 50, GAP = 160;
  function canvas(){ var el=document.getElementById('net'); return {W:el.clientWidth, H:el.clientHeight}; }
  function ring(n, level){
    var S=canvas(), rx, ry;
    if (level===1) { rx=Math.max(S.W/2-PAD-170, 430); ry=Math.max(S.H/2-PAD-50, 180); }   // 낮은 창에서도 의제 상자(반폭 230)를 벗어난다
    else { var two = n>11, m = two ? n-Math.floor(n/3) : n;
      // 두 겹이면 안쪽 링이 범주 상자(반폭 ≤140)와 카드(반폭 ≤90)를 비켜야 하므로 반지름 하한 360 (안쪽 = 0.55배 → 가로 257)
      var r = Math.max(m*GAP/(2*Math.PI), two ? 360 : 200); rx=r*1.3; ry=r*0.8; }
    function arc(m, f, off){ var o=[]; for (var k=0;k<m;k++){ var a=-Math.PI/2 + (k+off)*2*Math.PI/m; o.push([Math.cos(a)*rx*f, Math.sin(a)*ry*f]); } return o; }
    if (level===1 || n<=11) return arc(n, 1, 0);

  }
  // 상자 반폭·반높이(배율 1 기준 어림) — 카메라 여백에 더해 상자가 캔버스 밖으로 잘리지 않게 한다
  function half(id){ var o=byId[id]; return o.groups ? [230,40] : (o.items ? [140,45] : [90,50]); }
  function frame(ids, extra, instant){          // 노드들의 경계 상자로 카메라를 옮긴다. extra = 아직 날아가는 중인 목표 좌표(id 포함)
    var P = net.getPositions(ids), xs=[], ys=[], hw=0, hh=0;
    ids.forEach(function(i){ if(P[i]){ xs.push(P[i].x); ys.push(P[i].y); var h=half(i); hw=Math.max(hw,h[0]); hh=Math.max(hh,h[1]); } });
    (extra||[]).forEach(function(q){ xs.push(q.x); ys.push(q.y); var h=half(q.id); hw=Math.max(hw,h[0]); hh=Math.max(hh,h[1]); });
    if (!xs.length) return;
    var px=PAD+hw, py=PAD+hh, x0=Math.min.apply(null,xs)-px, x1=Math.max.apply(null,xs)+px,
        y0=Math.min.apply(null,ys)-py, y1=Math.max.apply(null,ys)+py;
    var S=canvas(), W=S.W, H=S.H;
    var sc=Math.min(W/(x1-x0), H/(y1-y0), 1.3), c={x:(x0+x1)/2, y:(y0+y1)/2};
    if (!(sc>0)) return;                        // 캔버스가 0 크기(최소화된 창)면 카메라를 건드리지 않는다 — vis 가 예외를 던져 상태 갱신을 끊는다
    var my = ++frameSeq;
    if (instant) { net.moveTo({position:c, scale:sc, animation:false}); return; }
    net.moveTo({position:c, scale:sc, animation:{duration:CAM, easingFunction:'easeInOutQuad'}});
    // 화면이 가려져 애니메이션이 멈췄어도 카메라는 도착한다 — 그 사이 새 이동이 있었으면 옛 도착은 버린다
    setTimeout(function(){ if (my===frameSeq) net.moveTo({position:c, scale:sc, animation:false}); }, CAM+120);
  }
  var frameSeq = 0;
  var ease = function(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; };   // easeInOutQuad
  function fly(id, from, to, ms, delay){       // 부모 자리에서 목표 자리로 날린다
    dest[id] = to;
    if (!ms) { nodes.update({id:id, x:to.x, y:to.y}); return; }
    var t0=null, done=false, g=gen[id];
    // 날아가는 도중 노드가 지워졌거나 새 세대로 바뀌었으면 멈춘다 — DataSet.update 는 없는 id 를 새로 넣어 버리므로
    function alive(){ if (done) return false; if (!nodes.get(id) || gen[id]!==g) { done=true; return false; } return true; }
    function step(ts){ if(!alive()) return; if(t0===null) t0=ts; var t=Math.min(1,(ts-t0)/ms), e=ease(t);
      nodes.update({id:id, x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e});
      if (t<1) requestAnimationFrame(step); else done=true; }
    setTimeout(function(){ requestAnimationFrame(step); }, delay);
    // 화면이 가려져 rAF 가 멈춰도 제자리에는 간다 — 발표 중 창 전환 뒤 돌아왔을 때 쌓여 있지 않게
    setTimeout(function(){ if(alive()){ done=true; nodes.update({id:id, x:to.x, y:to.y}); } }, delay+ms+80);
  }
  function visibleIds(){ return nodes.get({filter:function(n){ return !n.hidden; }}).map(function(n){ return n.id; }); }
  // 서서히 감추고 서서히 되살린다 — 순간 사라짐이 끊겨 보이는 것을 막는다. 같은 노드에 새 페이드가 걸리면 옛 것은 멈춘다.
  function fade(ids, from, to, ms, then){
    ids = ids.filter(function(id){ return nodes.get(id); });
    if (!ids.length) { if (then) then([]); return; }
    var tok = ++fadeSeq, gs = {}; ids.forEach(function(id){ fadeTok[id]=tok; gs[id]=gen[id]; });
    // 살아 있는 것 = 같은 페이드 토큰 · 아직 존재 · 같은 세대(그 사이 지웠다 새로 낸 노드는 건드리지 않는다)
    function live(){ return ids.filter(function(id){ return fadeTok[id]===tok && nodes.get(id) && gen[id]===gs[id]; }); }
    if (!ms) { nodes.update(live().map(function(id){ return {id:id, opacity:to}; })); if (then) then(live()); return; }
    var t0=null, finished=false;
    function finish(){ if (finished) return; finished=true; var L=live(); nodes.update(L.map(function(id){ return {id:id, opacity:to}; })); if (then) then(L); }
    function step(ts){ if (finished) return; if(t0===null) t0=ts; var t=Math.min(1,(ts-t0)/ms);

  }
  function burst(parentId){
    if (open[parentId]) return;
    var o = byId[parentId], children = o.groups || o.items, mk = o.groups ? groupNode : itemNode;
    if (!children) return;
    open[parentId] = children.map(function(c){ return c.id; });
    var p = at(parentId), level = o.groups ? 1 : 2, spots = ring(children.length, level);
    var edgeColor = pal().topic(o.groups ? o : o.topic).deep;
    // 한 번에 하나 — 펴는 노드만 남기고 나머지(다른 의제·다른 범주)는 서서히 감춘다. 이름은 위 제목줄이 말한다.
    var mine = {}; children.forEach(function(c){ mine[c.id]=true; });   // 되돌아가던 자식은 이웃이 아니다 — 곧 새로 낸다

      gen[c.id] = (gen[c.id]||0) + 1;
      var n = mk(c); n.x = p.x; n.y = p.y; n.fixed = true;
      nodes.add(n); edges.add({id:parentId+'>'+c.id, from:parentId, to:c.id, color:{color:edgeColor}});
      var to = {x:p.x+spots[k][0], y:p.y+spots[k][1]};

  }

  }

  // ── 글 영역: 제목(왼쪽 위)·목록(오른쪽) ──────────────────────────────────
  var title=document.getElementById('title'), crumb=document.getElementById('crumb');
  var sHead=document.getElementById('s-head'), sSub=document.getElementById('s-sub'), sBig=document.getElementById('s-big'), sList=document.getElementById('s-list');
  function accent(t){ rootEl.style.setProperty('--accent', t ? pal().topic(t).deep : ''); }
  function li(cls, html, onclick){ var el=document.createElement('li'); if(cls) el.className=cls; el.innerHTML=html; el.tabIndex=0;
    if(onclick){ el.addEventListener('click', onclick); el.addEventListener('keydown', function(e){ if(e.key==='Enter') onclick(); }); } return el; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var sLinks=document.getElementById('s-links');
  function links(pg){ var h=''; if (D.links.prezi) h+='<a href="'+D.links.prezi+(pg?'#/'+pg:'')+'" target="_blank" rel="noopener">프레지판 ↗</a>';
    if (D.links.deck) { var d=D.links.deck; if (pg){ var s=pg.split('-'); d=d.replace(/\.html$/, '-'+s[1]+'.html')+'#/pg-'+s[1]+'-'+s[2]; } h+='<a href="'+d+'" target="_blank" rel="noopener">발표 장표 ↗</a>'; }
    sLinks.innerHTML=h; }
  function hud(id){
    var o = byId[id]; sList.innerHTML=''; links(o && o.items ? id : null);
    if (!o) { accent(null); title.textContent=ROOT_TITLE; crumb.innerHTML='의제를 누르면 범주가, 범주를 누르면 발언이 터져 나온다';
      sHead.textContent='의제별 시민 발언'; sSub.textContent='제5차 회의 · 15개 조'; sBig.innerHTML=D.topics.reduce(function(a,t){return a+t.count;},0)+'<small>건</small>';
      D.topics.forEach(function(t){ sList.appendChild(li('sum', '<span>'+esc(t.name)+'</span><span class="n">'+t.count+'</span>', function(){ go(t.id); })); });
      return; }
    if (o.groups){ accent(o); title.textContent=o.name; crumb.innerHTML='<b>범주 '+o.groups.length+'</b> · 시민 발언 '+o.count+'건';
      sHead.textContent=o.short; sSub.textContent='범주 '+o.groups.length+'개 — 누르면 발언이 터져 나온다'; sBig.innerHTML=o.count+'<small>건</small>';
      o.groups.forEach(function(g){ sList.appendChild(li('sum', '<span>'+esc(g.name)+'</span><span class="n">'+g.items.length+'</span>', function(){ go(g.id); })); });
      return; }
    if (o.items){ accent(o.topic); title.textContent=o.name; crumb.innerHTML=o.topic.short+' · 기대 효과 <b>'+esc(o.want)+'</b>';
      sHead.textContent=o.name; sSub.textContent='이 범주에 붙은 시민 발언 · 번호가 그래프의 번호다'; sBig.innerHTML=o.items.length+'<small>건</small>';
      o.items.forEach(function(i){ sList.appendChild(li('', '<span class="no">'+i.no+'</span><span class="row"><span class="who">'+esc(whoShow(i.who))+'</span> <span class="cut">'+esc(i.text)+'</span></span>', function(){ show(i); })); });
    }
  }

  var ov=document.getElementById('ov');
  function show(i){ accent(i.group.topic);
    document.getElementById('ov-who').textContent=whoShow(i.who); document.getElementById('ov-kind').textContent=i.group.name+' · '+i.kind;
    document.getElementById('ov-txt').textContent=i.text; document.getElementById('ov-id').textContent=i.id; ov.classList.add('on'); }
  ov.addEventListener('click', function(){ ov.classList.remove('on'); });

  // 목록에서 누른 것도 같은 길로 간다 — 범주를 누르면 그 의제부터 편다
  function go(id){ var o=byId[id];
    if (o.groups){ if (open[id]) return; Object.keys(open).forEach(collapse); burst(id); hud(id); return; }
    if (o.items){ if (open[id]) return; Object.keys(open).forEach(function(k){ if (byId[k].items) collapse(k); });
      if (!open[o.topic.id]) { Object.keys(open).forEach(collapse); burst(o.topic.id);
        setTimeout(function(){ if (open[o.topic.id] && !open[id]) { burst(id); hud(id); } }, FLY + 4*STAGGER + 60);   // 범주가 제자리에 앉은 뒤 편다
        hud(o.topic.id); return; }
      burst(id); hud(id); } }

  net.on('click', function(ev){
    var id = ev.nodes[0]; if (!id) return;
    var o = byId[id];
    if (o.groups)      { if (open[id]) { collapse(id); hud(null); } else { burst(id); hud(id); } }
    else if (o.items)  { if (open[id]) { collapse(id); hud(o.topic.id); } else { burst(id); hud(id); } }

  });

  // 안내 순서 — Space 로 차례대로 터뜨린다: 의제1 → 범주1 → 발언 → 되돌아와 → 범주2 …
  var tour = []; D.topics.forEach(function(t){ tour.push({open:t.id}); t.groups.forEach(function(g){ tour.push({open:g.id}); tour.push({close:g.id}); }); tour.push({close:t.id}); });
  var step = 0;

  function toggleTheme(){ rootEl.setAttribute('data-polarity', isDark() ? 'light' : 'dark');
    nodes.update(nodes.getIds().map(rebuild)); net.setOptions({edges:{color:{color:pal().edge}}});
    edges.update(edges.get().map(function(e){ var o=byId[e.from]; return {id:e.id, color:{color:pal().topic(o.groups?o:o.topic).deep}}; }));
    var cur = Object.keys(open).filter(function(k){ return byId[k].items; })[0] || Object.keys(open)[0] || null; hud(cur); }
  document.addEventListener('keydown', function(e){
    if (ov.classList.contains('on')) { if (e.key==='Escape') ov.classList.remove('on'); return; }
    if (e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); next(); }
    else if (e.key==='ArrowLeft'||e.key==='Backspace'){ e.preventDefault(); back(); }
    else if (e.key==='r'||e.key==='R'){ reset(); }
    else if (e.key==='d'||e.key==='D'){ toggleTheme(); }
    else if (e.key==='n'||e.key==='N'){ namesOff=!namesOff; nodes.update(nodes.getIds().map(rebuild));
      var cur2 = Object.keys(open).filter(function(k){ return byId[k].items; })[0] || Object.keys(open)[0] || null; hud(cur2); }
  });
  net.once('afterDrawing', function(){ if (Object.keys(open).length) return; frame(visibleIds()); });   // 첫 그리기가 늦어도 이미 펼친 화면을 덮지 않는다
  hud(null);                                                                   // 글 영역은 그리기와 무관하게 바로 채운다
  var op=new URLSearchParams(location.search).get('open');                     // 다른 판에서 ?open=PG-1-2 로 건너오면 그 범주를 바로 편다
  if (op && byId[op]) setTimeout(function(){ if (!Object.keys(open).length) go(op); }, 700);
  window.__dbg = function(){ return {open:Object.keys(open), hiddenBy:hiddenBy, gen:gen}; };   // 측정용
  window.__go = go; window.__reset = reset; window.__visible = visibleIds;
  window.__snap = function(){ frame(visibleIds(), null, true); net.redraw(); };   // 측정용 — 카메라를 즉시 도착시킨다
  window.__settle = function(){ Object.keys(dest).forEach(function(id){ if (nodes.get(id)) nodes.update({id:id, x:dest[id].x, y:dest[id].y}); }); };   // 측정용 — 날아가는 노드를 제자리에 놓는다
  net.on('dragEnd', function(ev){ if (ev.nodes.length) nodes.update(ev.nodes.map(function(id){ return {id:id, fixed:true}; })); });
  window.addEventListener('resize', function(){ frame(visibleIds()); });
})();
</script>
