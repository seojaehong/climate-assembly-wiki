<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>숙의 온톨로지 3D — 6/13-14 워크숍</title>
<script src="https://unpkg.com/3d-force-graph"></script>
<script src="https://unpkg.com/three-spritetext"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;font-family:'Malgun Gothic','Pretendard',sans-serif;background:#0a0a0f;color:#e0e0e0;overflow:hidden}
  #h{padding:10px 16px;background:#1e1e24;color:#fff;border-bottom:1px solid #333;display:flex;align-items:center;gap:14px;font-size:14px}
  #h b{font-size:16px}
  #h .meta{font-size:12px;color:#adb5bd}
  #h a.toggle{margin-left:auto;color:#56C2E4;text-decoration:none;font-size:12px;font-weight:700;padding:5px 12px;border:1px solid #56C2E4;border-radius:4px}
  #h a.toggle:hover{background:#56C2E4;color:#0a0a0f}
  #legend{padding:8px 16px;background:#1a1a20;font-size:12px;border-bottom:1px solid #333}
  #legend span{display:inline-block;margin-right:8px;padding:2px 8px;border-radius:4px;color:#fff;font-weight:600}
  #filters{padding:8px 16px;background:#16161c;border-bottom:1px solid #333;font-size:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #filters .lbl{font-weight:700;color:#adb5bd;margin-left:8px}
  #filters .lbl:first-child{margin-left:0}
  #filters button{background:#2c2c34;border:1px solid #444;color:#adb5bd;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit}
  #filters button:hover{border-color:#56C2E4;color:#56C2E4}
  #filters button.active{background:#1c7ed6;color:#fff;border-color:#1c7ed6}
  #net{position:fixed;top:130px;left:0;right:0;bottom:0}
  #side-panel{position:fixed;top:0;right:0;width:280px;height:100vh;background:#1e1e24;border-left:1px solid #333;color:#e0e0e0;font-size:13px;z-index:100;overflow-y:auto;transform:translateX(280px);transition:transform .25s;box-shadow:-4px 0 16px rgba(0,0,0,.3)}
  #side-panel.open{transform:translateX(0)}
  #side-toggle{position:fixed;top:12px;right:12px;width:40px;height:40px;background:#1c7ed6;color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:18px;z-index:101;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #side-toggle:hover{background:#1971c2}
  #side-panel .sec{padding:14px 16px;border-bottom:1px solid #333}
  #side-panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#868e96;margin-bottom:10px;font-weight:800}
  #side-panel .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #side-panel .row label{flex:1;font-size:12px;color:#ced4da}
  #side-panel .row input[type=color]{width:32px;height:24px;border:1px solid #555;border-radius:3px;cursor:pointer;background:transparent;padding:0}
  #side-panel .row input[type=range]{flex:2;accent-color:#1c7ed6}
  #side-panel button{background:#2c2c34;border:1px solid #444;color:#e0e0e0;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;width:100%;margin-top:6px}
  #side-panel button:hover{background:#1c7ed6;border-color:#1c7ed6;color:#fff}
  #side-panel .style-tog{display:flex;gap:6px;margin-bottom:8px}
  #side-panel .style-tog button{margin:0;flex:1}
  #side-panel .style-tog button.active{background:#1c7ed6;border-color:#1c7ed6;color:#fff}
  #side-panel .preset{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  #side-panel .preset button{margin:0;font-size:11px;padding:6px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,15,.95);color:#56C2E4;font-size:14px;z-index:200}
  #info{position:fixed;bottom:12px;left:12px;background:rgba(30,30,36,.92);border:1px solid #333;border-radius:6px;padding:10px 14px;color:#ced4da;font-size:11px;max-width:340px;line-height:1.6;z-index:50;display:none}
  #info.show{display:block}
  #info b{color:#56C2E4}
</style>
</head>
<body>
<div id="h">
  <b>숙의 온톨로지 3D — 6/13-14 워크숍</b>
  <span class="meta" id="caption">노드 — · 엣지 —</span>
  <span class="meta">조립 초안(advisory)·uid 역추적</span>
  <a class="toggle" href="../workshop-graph/">📐 2D 뷰</a>
  <a class="toggle" href="../workshop-graph/inputs/">📄 원문</a>
</div>
<div id="legend">
  <span style="background:#e8590c" data-raw="Issue">Issue</span>
  <span style="background:#1c7ed6" data-raw="Claim">Claim</span>
  <span style="background:#2f9e44" data-raw="Proposal">Proposal</span>
  <span style="background:#9c36b5" data-raw="Concern">Concern</span>
  <span style="background:#f08c00" data-raw="Condition">Condition</span>
  <span style="background:#0c8599" data-raw="Value">Value</span>
  <span style="background:#868e96" data-raw="Evidence">Evidence</span>
</div>
<div id="filters">
  <span class="lbl">날짜</span>
  <button class="f-day active" data-day="all">전체</button>
  <button class="f-day" data-day="6/13">6/13</button>
  <button class="f-day" data-day="6/14">6/14</button>
  <span class="lbl">조</span>
  <button class="f-jo active" data-jo="all">전체</button>
  <button class="f-jo" data-jo="A">A조</button>
  <button class="f-jo" data-jo="B">B조</button>
  <button class="f-jo" data-jo="통합">통합</button>
  <span class="lbl">세션</span>
  <button class="f-sess active" data-sess="all">전체</button>
  <button class="f-sess" data-sess="B_t1">B 토론1·운영규정</button>
  <button class="f-sess" data-sess="OA_t1">운영규정 A조</button>
  <button class="f-sess" data-sess="OB_t1">운영규정 B조</button>
  <button class="f-sess" data-sess="OZ_t1">운영규정 통합</button>
  <button class="f-sess" data-sess="A_t21">A 토론2-1</button>
  <button class="f-sess" data-sess="A_t22">A 토론2-2</button>
  <button class="f-sess" data-sess="A_t23">A 토론2-3</button>
  <button class="f-sess" data-sess="B_t2">B 토론2</button>
  <button class="f-sess" data-sess="B_t3">B 토론3</button>
  <button class="f-sess" data-sess="DA_t2">조숙의 A조</button>
  <button class="f-sess" data-sess="DB_t2">조숙의 B조</button>
  <button class="f-sess" data-sess="DZ_t2">조숙의 통합</button>
</div>
<div id="net"></div>
<button id="side-toggle" title="설정 패널">⚙</button>
<div id="side-panel">
  <div class="sec">
    <h3>🌐 언어 (라벨)</h3>
    <div class="style-tog">
      <button id="lang-en" class="active">English</button>
      <button id="lang-ko">한국어</button>
    </div>
  </div>
  <div class="sec">
    <h3>🎨 노드 크기 · 라벨</h3>
    <div class="row"><label>노드 크기</label><input type="range" id="node-size" min="2" max="20" value="6"></div>
    <div class="row"><label>라벨 크기</label><input type="range" id="label-size" min="2" max="14" value="5"></div>
    <div class="row"><label>링크 두께</label><input type="range" id="link-width" min="1" max="6" value="1"></div>
    <button id="zoom-fit">전체 보기 (zoomToFit)</button>
  </div>
  <div class="sec">
    <h3>🌈 종류별 색상</h3>
    <div class="row"><label>Issue</label><input type="color" data-kind="Issue" value="#e8590c"></div>
    <div class="row"><label>Claim</label><input type="color" data-kind="Claim" value="#1c7ed6"></div>
    <div class="row"><label>Proposal</label><input type="color" data-kind="Proposal" value="#2f9e44"></div>
    <div class="row"><label>Concern</label><input type="color" data-kind="Concern" value="#9c36b5"></div>
    <div class="row"><label>Condition</label><input type="color" data-kind="Condition" value="#f08c00"></div>
    <div class="row"><label>Value</label><input type="color" data-kind="Value" value="#0c8599"></div>
    <div class="row"><label>Evidence</label><input type="color" data-kind="Evidence" value="#868e96"></div>
    <div class="preset">
      <button data-preset="default">기본</button>
      <button data-preset="vivid">선명</button>
      <button data-preset="pastel">파스텔</button>
      <button data-preset="mono">단색</button>
    </div>
    <button id="color-reset">전체 리셋</button>
  </div>
</div>
<div id="info"></div>
<div id="loading">데이터 로딩 중…</div>

<script>
const KIND_DEFAULT = {Issue:'#e8590c',Claim:'#1c7ed6',Proposal:'#2f9e44',Concern:'#9c36b5',Condition:'#f08c00',Value:'#0c8599',Evidence:'#868e96'};
const PRESETS = {
  default: KIND_DEFAULT,
  vivid:   {Issue:'#ff4444',Claim:'#0066ff',Proposal:'#00cc44',Concern:'#cc00cc',Condition:'#ffaa00',Value:'#00aacc',Evidence:'#aaaaaa'},
  pastel:  {Issue:'#ffb3a7',Claim:'#a8c7fa',Proposal:'#aee3b8',Concern:'#d4b3ff',Condition:'#ffd699',Value:'#a8d8e3',Evidence:'#cccccc'},
  mono:    {Issue:'#444',Claim:'#666',Proposal:'#888',Concern:'#555',Condition:'#777',Value:'#999',Evidence:'#aaa'}
};
const KIND_KO = {Issue:'쟁점',Claim:'주장',Proposal:'제안',Concern:'우려',Condition:'조건',Value:'가치',Evidence:'증거'};
const REL_KO  = {supports:'지지',raisesIssue:'쟁점제기',hasEvidence:'증거제시',hasConcern:'우려표명',reflectsValue:'가치반영',opposes:'반대',modifies:'수정',requiresCondition:'조건요구',affectsGroup:'집단영향'};
const PREFIX_META = {
  'A_t21':{day:'6/14',jo:'A'},'A_t22':{day:'6/14',jo:'A'},'A_t23':{day:'6/14',jo:'A'},
  'B_t1':{day:'6/13',jo:'B'},'B_t2':{day:'6/14',jo:'B'},'B_t3':{day:'6/14',jo:'B'},
  'OA_t1':{day:'6/13',jo:'A'},'OB_t1':{day:'6/13',jo:'B'},'OZ_t1':{day:'6/13',jo:'통합'},
  'DA_t2':{day:'6/14',jo:'A'},'DB_t2':{day:'6/14',jo:'B'},'DZ_t2':{day:'6/14',jo:'통합'}
};
let palette = JSON.parse(localStorage.getItem('wg3d-colors') || 'null') || Object.assign({}, KIND_DEFAULT);
let curLang = localStorage.getItem('wg3d-lang') || 'en';
let curFilter = {day:'all', jo:'all', sess:'all'};
let Graph, ALL_NODES = [], ALL_LINKS = [], KIND_OF = {};

fetch('data.json').then(r => r.json()).then(data => {
  ALL_NODES = data.nodes;
  ALL_LINKS = data.links;
  // kind 매핑 (color 역추적)
  ALL_NODES.forEach(n => {
    const hex = (n.color || '').toLowerCase();
    Object.keys(KIND_DEFAULT).forEach(k => {
      if (KIND_DEFAULT[k].toLowerCase() === hex) KIND_OF[n.id] = k;
    });
    // 원본 title 보존 (한/영 토글용)
    n._origTitle = n.title;
  });
  ALL_LINKS.forEach(l => { l._origLabel = l.label; });

  Graph = ForceGraph3D()(document.getElementById('net'))
    .backgroundColor('#0a0a0f')
    .nodeId('id')
    .nodeLabel(n => `<div style="background:rgba(30,30,36,.95);padding:8px 12px;border:1px solid #444;border-radius:4px;color:#e0e0e0;max-width:400px;font-size:12px;line-height:1.5">${escapeHtml(n.title || n.label || n.id)}</div>`)
    .nodeColor(n => palette[KIND_OF[n.id]] || n.color)
    .nodeVal(6)
    .nodeThreeObject(n => {
      const sprite = new SpriteText(n.label || '');
      sprite.color = '#fff';
      sprite.textHeight = 5;
      sprite.backgroundColor = palette[KIND_OF[n.id]] || n.color;
      sprite.padding = 2;
      sprite.borderRadius = 3;
      sprite.fontFace = 'Malgun Gothic, sans-serif';
      return sprite;
    })
    .nodeThreeObjectExtend(false)
    .linkLabel(l => curLang === 'ko' ? (REL_KO[l._origLabel] || l._origLabel) : l._origLabel)
    .linkColor(() => 'rgba(173,181,189,0.4)')
    .linkWidth(1)
    .linkDirectionalArrowLength(3)
    .linkDirectionalArrowRelPos(1)
    .linkDirectionalArrowColor(() => '#56C2E4')
    .graphData({nodes: ALL_NODES, links: ALL_LINKS})
    .onNodeClick(n => {
      const dist = 80;
      const r = Math.hypot(n.x, n.y, n.z);
      if (r === 0) return;
      Graph.cameraPosition({x:n.x*(1+dist/r), y:n.y*(1+dist/r), z:n.z*(1+dist/r)}, n, 1500);
      const kind = KIND_OF[n.id] || '?';
      const kindL = curLang === 'ko' ? (KIND_KO[kind] || kind) : kind;
      document.getElementById('info').classList.add('show');
      document.getElementById('info').innerHTML = `<b>[${kindL}]</b> ${escapeHtml(n.label || '')}<br><br>${escapeHtml(n.title || '')}`;
    })
    .onBackgroundClick(() => document.getElementById('info').classList.remove('show'));

  document.getElementById('caption').textContent = `노드 ${ALL_NODES.length} · 엣지 ${ALL_LINKS.length}`;
  document.getElementById('loading').style.display = 'none';
  applyLang(curLang);
});

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function applyFilter(){
  const f = curFilter;
  const visIds = new Set();
  ALL_NODES.forEach(n => {
    const pfx = (n.id || '').split('__')[0];
    const meta = PREFIX_META[pfx] || {};
    let ok = true;
    if (f.day !== 'all' && meta.day !== f.day) ok = false;
    if (f.jo !== 'all' && meta.jo !== f.jo) ok = false;
    if (f.sess !== 'all' && pfx !== f.sess) ok = false;
    if (ok) visIds.add(n.id);
  });
  const newNodes = ALL_NODES.filter(n => visIds.has(n.id));
  const newLinks = ALL_LINKS.filter(l => visIds.has(typeof l.source === 'object' ? l.source.id : l.source) && visIds.has(typeof l.target === 'object' ? l.target.id : l.target));
  Graph.graphData({nodes: newNodes, links: newLinks});
  document.getElementById('caption').textContent = `노드 ${newNodes.length}/${ALL_NODES.length} · 엣지 ${newLinks.length}/${ALL_LINKS.length}`;
}
function bindFilter(cls, key){
  document.querySelectorAll(cls).forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(cls).forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      curFilter[key] = b.dataset[key];
      applyFilter();
    };
  });
}
bindFilter('.f-day','day'); bindFilter('.f-jo','jo'); bindFilter('.f-sess','sess');

document.getElementById('side-toggle').onclick = () => document.getElementById('side-panel').classList.toggle('open');

function applyColors(p){
  palette = p;
  if (Graph) Graph.nodeColor(n => palette[KIND_OF[n.id]] || n.color).refresh();
  document.querySelectorAll('#legend span').forEach(sp => {
    const raw = sp.dataset.raw;
    if (palette[raw]) sp.style.background = palette[raw];
  });
  document.querySelectorAll('#side-panel input[type=color]').forEach(inp => {
    inp.value = palette[inp.dataset.kind] || KIND_DEFAULT[inp.dataset.kind];
  });
  localStorage.setItem('wg3d-colors', JSON.stringify(palette));
}
document.querySelectorAll('#side-panel input[type=color]').forEach(inp => {
  inp.oninput = () => { palette[inp.dataset.kind] = inp.value; applyColors(palette); };
});
document.querySelectorAll('#side-panel [data-preset]').forEach(btn => {
  btn.onclick = () => applyColors(Object.assign({}, PRESETS[btn.dataset.preset]));
});
document.getElementById('color-reset').onclick = () => { localStorage.removeItem('wg3d-colors'); applyColors(Object.assign({}, KIND_DEFAULT)); };

function applyLang(lang){
  curLang = lang;
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('lang-ko').classList.toggle('active', lang === 'ko');
  document.querySelectorAll('#legend span').forEach(sp => {
    const raw = sp.dataset.raw;
    sp.textContent = lang === 'ko' ? (KIND_KO[raw] || raw) : raw;
  });
  if (Graph) Graph.refresh();
  localStorage.setItem('wg3d-lang', lang);
}
document.getElementById('lang-en').onclick = () => applyLang('en');
document.getElementById('lang-ko').onclick = () => applyLang('ko');

document.getElementById('node-size').oninput = e => { if (Graph) Graph.nodeVal(+e.target.value); };
document.getElementById('label-size').oninput = e => {
  const sz = +e.target.value;
  if (!Graph) return;
  Graph.nodeThreeObject(n => {
    const sprite = new SpriteText(n.label || '');
    sprite.color = '#fff'; sprite.textHeight = sz;
    sprite.backgroundColor = palette[KIND_OF[n.id]] || n.color;
    sprite.padding = 2; sprite.borderRadius = 3;
    sprite.fontFace = 'Malgun Gothic, sans-serif';
    return sprite;
  }).refresh();
};
document.getElementById('link-width').oninput = e => { if (Graph) Graph.linkWidth(+e.target.value); };
document.getElementById('zoom-fit').onclick = () => { if (Graph) Graph.zoomToFit(800, 50); };
</script>
</body>
</html>
