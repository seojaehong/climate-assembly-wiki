<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>의제 보드 (속장/주의제) — 2026 기후시민회의</title>
<!--
  /public/board/  —  의제 보드 (속장/주의제)
  -------------------------------------------------------
  스펙 변경(2026-06-07): 슬롯 20→10 (감축 5 + 적응 5)
  레이아웃: 좌우 교차 토글(탭) — 한 화면에 5개 큰 포스트잇만
  이 해석으로 진행 (탭/토글) — 다른 해석(좌우 5+5 동시) 원하면 알려달라.

  데이터 소스 (우선순위):
    1) ?sheet=<CSV URL> 쿼리스트링 또는 window.SHEET_CSV → LIVE (5초 폴)
    2) ./data.json → LOCAL
    3) 둘 다 실패 → ERROR

  Sheets 컬럼 (1행 헤더):
    slot | category | citizen | moderator_num | moderator_priority | moderator_note

  단축키:
    Tab / 1 / 2  카테고리 전환 (감축↔적응)
    M            모더레이터 포스트잇 강조 토글
    C            시민 포스트잇 강조 토글
    R            새로고침
-->
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:         #f0ece4;
    --ink:        #14202b;
    --citizen:    #fef3c7;
    --citizen-2:  #fde68a;
    --moderator:  #d1fae5;
    --moderator-2:#a7f3d0;
    --reduce:     #2E75B6;
    --adapt:      #F5A623;
    --line:       #44403c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height: 100vh; width: 100vw; overflow-x: hidden;
  }

  .privacy {
    background: #7c2d12; color: #fed7aa;
    padding: 6px 18px; font-size: 14px; font-weight: 700;
    letter-spacing: 0.06em; text-align: center;
  }

  .topbar {
    background: linear-gradient(180deg, #1F4E79, #28679F);
    color: #fff;
    padding: 16px 48px 18px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    box-shadow: 0 6px 28px rgba(31,78,121,0.45);
  }
  .h-title {
    font-size: 40px; font-weight: 900;
    letter-spacing: -0.02em; line-height: 1;
  }
  .h-sub {
    margin-top: 8px; font-size: 17px; font-weight: 600;
    opacity: 0.9;
  }
  .status-row {
    margin-left: auto;
    display: flex; align-items: center; gap: 14px;
  }
  .status-pill {
    padding: 8px 18px; border-radius: 9999px;
    font-size: 18px; font-weight: 800;
    background: #6b7280; color: #fff;
  }
  .status-pill.live  { background: #059669; }
  .status-pill.local { background: #d97706; }
  .status-pill.error { background: #b91c1c; }
  .updated { font-size: 16px; opacity: 0.85; font-weight: 500; }

  /* TABS — 좌우 교차 토글 */
  .tabs {
    display: flex; gap: 16px;
    padding: 20px 48px 6px;
    align-items: stretch;
  }
  .tab {
    flex: 1;
    border: 4px solid transparent;
    background: #fff;
    color: var(--ink);
    padding: 20px 28px;
    font-size: 34px; font-weight: 900;
    letter-spacing: -0.02em;
    border-radius: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
  }
  .tab .icon { font-size: 42px; line-height: 1; }
  .tab .key  {
    font-size: 16px; font-weight: 700; opacity: 0.55;
    border: 2px solid currentColor; border-radius: 8px;
    padding: 2px 10px; margin-left: 8px;
  }
  .tab[data-cat="감축"].active { border-color: var(--reduce); color: var(--reduce); transform: translateY(-3px); box-shadow: 0 10px 28px rgba(46,117,182,0.32); }
  .tab[data-cat="적응"].active { border-color: var(--adapt);  color: #b45309;       transform: translateY(-3px); box-shadow: 0 10px 28px rgba(245,166,35,0.32); }
  .tab:not(.active) { opacity: 0.55; }

  .hint {
    padding: 6px 48px 0;
    font-size: 15px; color: #57534e;
    display: flex; gap: 22px; flex-wrap: wrap;
  }
  .hint kbd {
    background: #fff; border: 1.5px solid #a8a29e;
    border-bottom-width: 3px; border-radius: 6px;
    padding: 2px 8px; font-family: inherit; font-weight: 700;
    font-size: 13px;
  }

  .stage { padding: 20px 48px 48px; }
  .slots { display: flex; flex-direction: column; gap: 20px; }

  .slot {
    display: grid;
    grid-template-columns: 110px 1fr 80px 1fr;
    gap: 22px;
    align-items: stretch;
    animation: slot-in 0.4s ease both;
  }
  @keyframes slot-in {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .slot-num {
    display: flex; align-items: center; justify-content: center;
    font-size: 96px; font-weight: 900; line-height: 1;
    color: #d6d3d1;
    font-variant-numeric: tabular-nums;
  }
  .slot.active-cat-감축 .slot-num { color: rgba(46,117,182,0.30); }
  .slot.active-cat-적응 .slot-num { color: rgba(245,166,35,0.35); }

  .postit {
    border-radius: 6px;
    padding: 22px 26px;
    min-height: 168px;
    box-shadow: 3px 6px 18px rgba(0,0,0,0.18);
    position: relative;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
  }
  .postit.citizen   { background: var(--citizen);   transform: rotate(-0.7deg); }
  .postit.moderator { background: var(--moderator); transform: rotate( 0.6deg); }
  .postit-label {
    font-size: 15px; font-weight: 800; letter-spacing: 0.04em;
    color: #57534e; text-transform: uppercase;
  }
  .postit.moderator .postit-label { color: #065f46; }
  .postit-body {
    font-size: 30px; font-weight: 700; line-height: 1.35;
    color: var(--ink); word-break: keep-all;
  }
  .postit.empty .postit-body {
    color: #a8a29e; font-weight: 600; font-style: italic;
    font-size: 24px;
  }
  .postit-meta {
    margin-top: auto;
    display: flex; gap: 10px; flex-wrap: wrap;
    font-size: 16px; font-weight: 700; color: #44403c;
  }
  .chip {
    background: rgba(0,0,0,0.08); color: #1c1917;
    padding: 4px 12px; border-radius: 9999px;
  }
  .chip.priority { background: #fbbf24; color: #1c1917; }
  .chip.num      { background: #1c1917; color: #fff; }

  body.emph-mod .postit.moderator { transform: rotate(0.6deg) scale(1.035); box-shadow: 0 0 0 3px #059669, 4px 8px 24px rgba(5,150,105,0.35); }
  body.emph-mod .postit.citizen   { filter: saturate(0.7) brightness(0.95); }
  body.emph-cit .postit.citizen   { transform: rotate(-0.7deg) scale(1.035); box-shadow: 0 0 0 3px #d97706, 4px 8px 24px rgba(217,119,6,0.35); }
  body.emph-cit .postit.moderator { filter: saturate(0.7) brightness(0.95); }

  .link {
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .link::before {
    content: '';
    position: absolute; left: 0; right: 0; top: 50%;
    height: 4px; background: var(--line); opacity: 0.45;
    transform: translateY(-50%);
  }
  .link .arrow {
    position: relative; z-index: 2;
    background: var(--bg);
    padding: 0 12px;
    font-size: 32px; font-weight: 900; color: var(--line);
    line-height: 1;
  }
  .slot.active-cat-감축 .link::before { background: var(--reduce); opacity: 0.5; }
  .slot.active-cat-적응 .link::before { background: var(--adapt);  opacity: 0.55; }

  .stage.switching .slots { opacity: 0; transform: translateY(-10px); transition: opacity 0.18s, transform 0.18s; }

  @media (max-width: 1100px) {
    .slot { grid-template-columns: 70px 1fr 50px 1fr; gap: 12px; }
    .slot-num { font-size: 64px; }
    .postit-body { font-size: 24px; }
    .topbar, .tabs, .hint, .stage { padding-left: 24px; padding-right: 24px; }
  }
</style>
</head>
<body>
  <div class="privacy">모더레이터 운영 페이지 · 외부 공개 금지</div>

  <header class="topbar">
    <div>
      <div class="h-title">의제 보드 <span style="opacity:0.7;font-weight:700">· 속장/주의제</span></div>
      <div class="h-sub">5×2 슬롯 (감축 5 + 적응 5) — 카테고리 토글</div>
    </div>
    <div class="status-row">
      <span class="status-pill" id="status">연결 중…</span>
      <span class="updated" id="updated"></span>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="카테고리 전환">
    <button class="tab active" data-cat="감축" type="button" aria-pressed="true">
      <span class="icon">🌱</span><span>감축</span><span class="key">1</span>
    </button>
    <button class="tab" data-cat="적응" type="button" aria-pressed="false">
      <span class="icon">🌧️</span><span>적응</span><span class="key">2</span>
    </button>
  </nav>

  <div class="hint">
    <span><kbd>Tab</kbd> / <kbd>1</kbd> <kbd>2</kbd> 카테고리 전환</span>
    <span><kbd>M</kbd> 모더레이터 강조</span>
    <span><kbd>C</kbd> 시민 강조</span>
    <span><kbd>R</kbd> 새로고침</span>
  </div>

  <main class="stage" id="stage">
    <div class="slots" id="slots" aria-live="polite"></div>
  </main>

<script>
(() => {
  'use strict';

  const POLL_MS = 5000;
  const params = new URLSearchParams(location.search);
  const SHEET_CSV =
    params.get('sheet') ||
    window.SHEET_CSV ||
    '';

  const statusEl  = document.getElementById('status');
  const updatedEl = document.getElementById('updated');
  const tabsEl    = document.getElementById('tabs');
  const stageEl   = document.getElementById('stage');
  const slotsEl   = document.getElementById('slots');

  let activeCat = '감축';
  let data = { meta: {}, slots: [] };

  // ── CSV parser ──────────────────────────────────────────
  function parseCSV(text) {
    const rows = [];
    let col = '', row = [], inQuote = false;
    const flush = () => { row.push(col); col = ''; };
    const pushRow = () => { if (row.length) rows.push(row); row = []; };
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (inQuote) {
        if (ch === '"' && next === '"') { col += '"'; i++; }
        else if (ch === '"') { inQuote = false; }
        else { col += ch; }
      } else {
        if (ch === '"') { inQuote = true; }
        else if (ch === ',') { flush(); }
        else if (ch === '\r' && next === '\n') { flush(); pushRow(); i++; }
        else if (ch === '\n' || ch === '\r') { flush(); pushRow(); }
        else { col += ch; }
      }
    }
    if (col || row.length) { flush(); pushRow(); }
    return rows;
  }
  function csvToSlots(text) {
    const parsed = parseCSV(text.trim());
    if (parsed.length < 2) return [];
    const headers = parsed[0].map(h => h.trim());
    const out = [];
    for (let r = 1; r < parsed.length; r++) {
      const cells = parsed[r];
      if (cells.every(c => !c.trim())) continue;
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (cells[i] || '').trim(); });
      out.push({
        slot: obj.slot || '',
        category: obj.category || '',
        citizen: obj.citizen || '',
        moderator_num: obj.moderator_num || '',
        moderator_priority: obj.moderator_priority || '',
        moderator_note: obj.moderator_note || '',
      });
    }
    return out;
  }

  function setStatus(kind, msg) {
    statusEl.className = 'status-pill ' + kind;
    statusEl.textContent = msg;
  }
  function setUpdated() {
    const now = new Date();
    updatedEl.textContent = '갱신 ' + now.toLocaleTimeString('ko-KR', { hour12: false });
  }

  async function fetchLive() {
    const res = await fetch(SHEET_CSV, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return { slots: csvToSlots(await res.text()), meta: { source: 'sheets' } };
  }
  async function fetchLocal() {
    const res = await fetch('./data.json?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }
  async function loadOnce() {
    try {
      if (SHEET_CSV) {
        data = await fetchLive();
        setStatus('live', '● LIVE');
      } else {
        data = await fetchLocal();
        setStatus('local', '● LOCAL');
      }
      setUpdated();
      render();
    } catch (err) {
      console.warn('[board] primary failed, falling back', err);
      try {
        data = await fetchLocal();
        setStatus('local', '● LOCAL (live 실패)');
        setUpdated();
        render();
      } catch (e2) {
        setStatus('error', '● ERROR');
        console.error('[board] both sources failed', e2);
      }
    }
  }

  function render() {
    const list = (data.slots || []).filter(s => s.category === activeCat).slice(0, 5);
    while (list.length < 5) {
      list.push({
        slot: activeCat + (list.length + 1),
        category: activeCat,
        citizen: '', moderator_num: '', moderator_priority: '', moderator_note: '',
      });
    }
    slotsEl.innerHTML = '';
    list.forEach((s, idx) => {
      const row = document.createElement('div');
      row.className = 'slot active-cat-' + activeCat;

      const num = document.createElement('div');
      num.className = 'slot-num';
      num.textContent = String(idx + 1);
      row.appendChild(num);

      const cit = document.createElement('div');
      const citEmpty = !s.citizen || /^\(.*\)$/.test(s.citizen);
      cit.className = 'postit citizen' + (citEmpty ? ' empty' : '');
      cit.innerHTML =
        '<div class="postit-label">시민 의견</div>' +
        '<div class="postit-body">' + escapeHtml(s.citizen || '(시민 입력 대기)') + '</div>';
      row.appendChild(cit);

      const link = document.createElement('div');
      link.className = 'link';
      link.innerHTML = '<span class="arrow">→</span>';
      row.appendChild(link);

      const hasMod = s.moderator_num || s.moderator_priority || s.moderator_note;
      const mod = document.createElement('div');
      mod.className = 'postit moderator' + (hasMod ? '' : ' empty');
      const chips = [];
      if (s.moderator_num)      chips.push('<span class="chip num">#' + escapeHtml(s.moderator_num) + '</span>');
      if (s.moderator_priority) chips.push('<span class="chip priority">' + escapeHtml(s.moderator_priority) + '</span>');
      mod.innerHTML =
        '<div class="postit-label">모더레이터</div>' +
        '<div class="postit-body">' + escapeHtml(s.moderator_note || '(모더레이터 메모 대기)') + '</div>' +
        '<div class="postit-meta">' + chips.join('') + '</div>';
      row.appendChild(mod);

      slotsEl.appendChild(row);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function setCategory(cat) {
    if (cat === activeCat) return;
    activeCat = cat;
    tabsEl.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.cat === cat;
      t.classList.toggle('active', on);
      t.setAttribute('aria-pressed', String(on));
    });
    stageEl.classList.add('switching');
    setTimeout(() => {
      render();
      stageEl.classList.remove('switching');
    }, 180);
  }
  tabsEl.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (btn) setCategory(btn.dataset.cat);
  });

  document.addEventListener('keydown', e => {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'Tab') {
      e.preventDefault();
      setCategory(activeCat === '감축' ? '적응' : '감축');
    } else if (e.key === '1') {
      setCategory('감축');
    } else if (e.key === '2') {
      setCategory('적응');
    } else if (e.key === 'm' || e.key === 'M') {
      document.body.classList.toggle('emph-mod');
      document.body.classList.remove('emph-cit');
    } else if (e.key === 'c' || e.key === 'C') {
      document.body.classList.toggle('emph-cit');
      document.body.classList.remove('emph-mod');
    } else if (e.key === 'r' || e.key === 'R') {
      loadOnce();
    }
  });

  loadOnce();
  setInterval(loadOnce, POLL_MS);
})();
</script>
</body>
</html>
