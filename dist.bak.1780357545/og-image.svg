<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a6b4e"/>
      <stop offset="100%" stop-color="#063d2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>
  
  <!-- Top label -->
  <text x="80" y="100" font-family="-apple-system, 'Segoe UI', Pretendard, sans-serif" font-size="22" font-weight="600" fill="#fbbf24" letter-spacing="0.1em">CLIMATE-ASSEMBLY.ORG</text>
  
  <!-- Main title KO -->
  <text x="80" y="200" font-family="-apple-system, Pretendard, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">2026 기후시민회의</text>
  <text x="80" y="280" font-family="-apple-system, Pretendard, sans-serif" font-size="40" font-weight="500" fill="#e5e7eb">모더레이터 활동 아카이브</text>
  
  <!-- EN subtitle -->
  <text x="80" y="335" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="500" fill="#9ca3af" letter-spacing="0.02em">Korea Climate Citizens' Assembly · Multilingual Wiki</text>
  
  <!-- Stats -->
  <g transform="translate(80, 420)">
    <text x="0" y="0" font-family="-apple-system, Pretendard, sans-serif" font-size="56" font-weight="800" fill="#34d399">200명</text>
    <text x="0" y="40" font-family="-apple-system, Pretendard, sans-serif" font-size="18" font-weight="500" fill="#9ca3af">시민참여단</text>
  </g>
  <g transform="translate(280, 420)">
    <text x="0" y="0" font-family="-apple-system, Pretendard, sans-serif" font-size="56" font-weight="800" fill="#34d399">9차</text>
    <text x="0" y="40" font-family="-apple-system, Pretendard, sans-serif" font-size="18" font-weight="500" fill="#9ca3af">회의 (5월~11월)</text>
  </g>
  <g transform="translate(460, 420)">
    <text x="0" y="0" font-family="-apple-system, Pretendard, sans-serif" font-size="56" font-weight="800" fill="#34d399">15</text>
    <text x="0" y="40" font-family="-apple-system, Pretendard, sans-serif" font-size="18" font-weight="500" fill="#9ca3af">의제 (한·영)</text>
  </g>
  
  <!-- Bottom strip -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(0,0,0,0.3)"/>
  <text x="80" y="613" font-family="-apple-system, Pretendard, sans-serif" font-size="16" font-weight="500" fill="#e5e7eb">CC BY-SA 4.0 · 국민이 대한민국의 기후정책을 바꿉니다</text>
  <text x="1120" y="613" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="500" fill="#9ca3af" text-anchor="end">climate-assembly.org</text>
</svg>
